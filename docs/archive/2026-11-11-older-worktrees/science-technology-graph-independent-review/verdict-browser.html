window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==state.view&&document.querySelector(`nav [data-view="${h}"]`)){ state.view=h; show(); } });
const tip=$('#tip');
document.addEventListener('pointermove',ev=>{ const t=ev.target.closest&&ev.target.closest('[data-tip]'); if(!t){tip.hidden=true;return;} tip.textContent=t.dataset.tip; tip.hidden=false; const w=tip.offsetWidth; tip.style.left=Math.min(ev.clientX+12,innerWidth-w-8)+'px'; tip.style.top=(ev.clientY+14)+'px'; });
$('#commit').textContent=sum.reviewed_commit;
const h=location.hash.slice(1); if(h&&document.querySelector(`nav [data-view="${h}"]`)) state.view=h;
show();
</script>
