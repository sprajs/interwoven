t context rather than duplicating Trench 3.","verdict":"accept"},{"id":"plocnik-tin-bronze-foil","name":"Pločnik tin-bronze foil","date":"by c. 4650 BCE","frozen_date":"by c. 4650 BCE","lane":"minerals","region":"europe","domain":"materials","outcome":"deferred","finding":"Retained the foil's find-horizon chronology and ore inference. The ordinary-copper comparisons inform material circulation. Evidence that knowledge of Belovode smelting reached the makers of tin-bronze foil sample 63 remains insufficient.","next":"Seek independently dated workshop evidence for technical practices shared between Belovode and the makers of sample 63, with archaeological evidence identifying the direction and a plausible means of learning.","sources":[{"url":"https://doi.org/10.1017/S0003598X0004984X","locator":"p. 1032, find context; pp. 1035–1039, sample 63 and Fig. 5","note":"Original analysis of tin-bronze foil sample 63 separately from other Balkan artefacts with weaker chronologies."},{"url":"https://discovery.ucl.ac.uk/id/eprint/10134137/","locator":"Ch. 41, pp. 488–491, Table 3, Group 3 and Figs. 2–3; Group 3 comparison, Fig. 7 and Table 6; Fig. 15","note":"C_P2/13 shares a dispersed lead-isotope group with B47/12/3 and B23/12. Chisel HDM1586 closely matches B47/12/3. Trace-element comparisons concern high-purity copper foil P10/13. These distinct objects leave the knowledge-transfer question for tin-bronze foil sample 63 unresolved."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"belovode-copper-smelting","to":"plocnik-tin-bronze-foil","type":"transmitted_from","decision":"deferred","edges":[{"from":"belovode-copper-smelting","to":"plocnik-tin-bronze-foil","type":"transmitted_from","from_event":"","to_event":"","before":"insufficient","after":"insufficient","statement":"Did knowledge of copper smelting at Belovode reach the makers of the Pločnik tin-bronze foil, sample 63?","caveats":"The sites share a Vinča setting. The carriers, route and direction of any knowledge transfer remain unresolved.","evidence":[{"source":"radivojevic-2013-tainted-ores-rise","locator":"p. 1032, find context; pp. 1035–1039, sample 63 analysis","supports":"Sample 63 is the worked tin-bronze foil. The authors infer a complex copper–tin ore."},{"source":"radivojevic-2021-vinca-copper-supply-networks","locator":"Table 3, Group 3 and Fig. 7; Fig. 15, trace-element comparison","supports":"The geochemical comparisons concern the ordinary-copper ring C_P2/13, chisel HDM1586 and foil P10/13. The comparisons give no evidence that Belovode smelting knowledge reached the makers of sample 63."}]}]}],"incident_causal_edges":[{"from":"belovode-copper-smelting","to":"plocnik-tin-bronze-foil","type":"transmitted_from","from_event":"","to_event":"","before":"insufficient","after":"insufficient","statement":"Did knowledge of copper smelting at Belovode reach the makers of the Pločnik tin-bronze foil, sample 63?","caveats":"The sites share a Vinča setting. The carriers, route and direction of any knowledge transfer remain unresolved.","evidence":[{"source":"radivojevic-2013-tainted-ores-rise","locator":"p. 1032, find context; pp. 1035–1039, sample 63 analysis","supports":"Sample 63 is the worked tin-bronze foil. The authors infer a complex copper–tin ore."},{"source":"radivojevic-2021-vinca-copper-supply-networks","locator":"Table 3, Group 3 and Fig. 7; Fig. 15, trace-element comparison","supports":"The geochemical comparisons concern the ordinary-copper ring C_P2/13, chisel HDM1586 and foil P10/13. The comparisons give no evidence that Belovode smelting knowledge reached the makers of sample 63."}]}],"rationale":"Repaired question explicitly asks whether knowledge of Belovode smelting reached the foil makers, and correctly retains insufficient status.","verdict":"accept"},{"id":"great-lakes-copper-tools","name":"Great Lakes copper tools","date":"c. 5570–4230 BCE, modeled onset (68% credible interval)","frozen_date":"c. 5570–4230 BCE, modeled onset (68% credible interval)","lane":"minerals","region":"north_america","domain":"materials","outcome":"deferred","finding":"Retained modeled onset boundaries and removed the assertion that only ornament traditions followed. Comparison of regional working traditions, sediment proxies and Georgia copper supports several later paths while leaving the original source, supplier and continuity of Old Copper practice unresolved.","next":"Pair directly associated dates for worked pieces with independent geochemical source discriminants, then compare against excavated extraction contexts and multiple regional groups.","sources":[{"url":"https://doi.org/10.1371/journal.pone.0266908","locator":"Tables 1–3 and Discussion, Burnt Rollways","note":"Different modeled assemblage classes can overlap. Burnt Rollways includes habitation and tool working, and its relationship to Old Copper is uncertain."},{"url":"https://doi.org/10.1177/0959683614557574","locator":"Abstract and results, McCargoe Cove cores","note":"Distinct sediment observations estimate an interval of activity near mining pits. They cannot identify the makers of individual tools."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6099914/","locator":"Fig. 4 and Table 2; Elemental Study of Copper Objects","note":"Separate Georgia find most consistent with northern Lake Superior samples including Minong. Same artefact assemblage for multiple measurements."},{"url":"https://doi.org/10.1111/arcm.12962","locator":"Discussion, geological isotope variation","note":"Independent source samples reveal overlap among Lake Superior native copper deposits, limiting mine-level attribution."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Later materials and regional use do not demonstrate specific successors; supplier is deferred.","verdict":"accept"},{"id":"san-ramon-15-iron-oxide-mining","name":"San Ramón 15 iron-oxide mining","date":"10,494–10,146 cal BCE, unit 2 layer 5 shell","frozen_date":"8717–8472 cal BCE, dated charcoal in excavation unit 1","lane":"minerals","region":"south_america","domain":"materials","outcome":"established","finding":"Added the excavators' earlier unit 2 shell-dated mining association and later charcoal-dated return separated by colluvium. Retained the previously catalogued unit 1 occurrence. Deferred supply links to pigment users.","next":"Test same-site earliest mining with a short-lived terrestrial sample, then compare measured ore and dated pigment residues for an independently matched consumption site.","sources":[{"url":"https://doi.org/10.1086/659426","locator":"pp. 466–470, Figs. 3 and 6, Table 1, Beta-280992 and UGAMS 5443","note":"Original context distinguishes early and late mineral extraction horizons. Earliest shell required local reservoir correction and dates its excavated context."},{"url":"https://orbi.uliege.be/handle/2268/142814","locator":"Abstract, site and residue sampling","note":"Later team with overlapping excavators reports comparing new mineralogical samples from mine and regional contexts. The accessible summary does not establish artefact-level provenancing."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Two separately dated strata add early and later excavation witnesses to the existing unit 1 event.","verdict":"accept"},{"id":"domesticated-maize","name":"Domesticated maize","date":"By approximately 6750 BCE","frozen_date":"By approximately 6750 BCE","lane":"andes","region":"north_america","domain":"food","outcome":"candidate","finding":"Added a transmission event documenting that cultivated maize of Mesoamerican ancestry had reached the Peruvian coast by the dated Paredones specimen. That evidence leaves the Xihuatoxtla donor and its connection to either Nahua nixtamalization or Wari brewing unresolved. Neither a common crop name nor a shared region documents grain supply.","next":"Seek ancient DNA connecting particular Mesoamerican source populations to dated recipient grains and evidence for processing or supply into named historical settings.","sources":[{"url":"https://elifesciences.org/articles/83149.pdf","locator":"Table 1, Fig. 3 and Discussion","note":"Par_N1 has directly dated attached husk and shank, and the genetic comparison tests the cob itself. The age is also reported by the earlier excavators and is one specimen determination."},{"url":"https://eprints.whiterose.ac.uk/140081/1/aav0207_ArticleContent_resub2_compiled.pdf","locator":"Abstract, Figs. 1–3 and Results","note":"Accepted manuscript. Independent archaeological and landrace genome set supports movement out of Mexico. Interpretations differ on whether traits were already fixed."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3277113/","locator":"Fig. 3A and dating table","note":"Grobman et al. report the same Paredones specimen, so this is not another date."},{"url":"https://florentinecodex.getty.edu/en/book/4/folio/69r","locator":"Nahuatl account and embedded Anderson–Dibble English translation","note":"The existing Nahua candidate concerns the supply in a particular later setting."}],"graph_status_before":"candidate","graph_status":"candidate","after":{},"connections":[{"from":"domesticated-maize","to":"alkaline-cooking-of-maize","type":"requires","decision":"existing-candidate","edges":[{"from":"domesticated-maize","to":"alkaline-cooking-of-maize","type":"requires","from_event":"practical-use-6750bce","to_event":"practical-deployment-1577","before":"candidate","after":"candidate","statement":"Can a documented crop lineage or route link the early Xihuatoxtla maize use to the maize processed by the Nahua?","scope":"Cultivated maize is the material required by the recorded Nahua practice. This candidate asks whether the earlier Xihuatoxtla witness can be connected to that particular material history.","caveats":"Modern genetic comparisons are regional in scope. The local grain lineage, supply route and transmission of the cooking practice remain unresolved.","evidence":[{"source":"piperno-2009-piperno-al-central","locator":"Abstract, Xihuatoxtla maize by 8,700 cal BP","supports":"The Central Balsas site documents early use of the domesticated crop."},{"source":"matsuoka-2002-maize-domestication","locator":"Figs. 1–2 and Cradle of Maize Domestication, pp. 6081–6083","supports":"Independent genetic analysis of modern samples supports a shared crop ancestry within Balsas teosinte for sampled maize landraces, including samples from central Mexico."},{"source":"de-sahagun-1577-historia-general-cosas","locator":"Digital Florentine Codex, Book 4 folio 69r, Nahuatl transcription and Anderson–Dibble English translation","supports":"The folio describes maize previously cooked with lime being washed as part of food preparation; the manuscript is dated 1577."},{"source":"johnson-2020-experimental-identification-nixtamalized","locator":"§3 and §§7–8, including control trials","supports":"Experiments treat whole maize kernels as the raw material and compare lime-treated maize with non-alkaline cooking controls."}]}]},{"from":"domesticated-maize","to":"wari-state-brewing-of-chicha-at-cerro-baul","type":"requires","decision":"deferred","edges":[]}],"incident_causal_edges":[{"from":"domesticated-maize","to":"alkaline-cooking-of-maize","type":"requires","from_event":"practical-use-6750bce","to_event":"practical-deployment-1577","before":"candidate","after":"candidate","statement":"Can a documented crop lineage or route link the early Xihuatoxtla maize use to the maize processed by the Nahua?","scope":"Cultivated maize is the material required by the recorded Nahua practice. This candidate asks whether the earlier Xihuatoxtla witness can be connected to that particular material history.","caveats":"Modern genetic comparisons are regional in scope. The local grain lineage, supply route and transmission of the cooking practice remain unresolved.","evidence":[{"source":"piperno-2009-piperno-al-central","locator":"Abstract, Xihuatoxtla maize by 8,700 cal BP","supports":"The Central Balsas site documents early use of the domesticated crop."},{"source":"matsuoka-2002-maize-domestication","locator":"Figs. 1–2 and Cradle of Maize Domestication, pp. 6081–6083","supports":"Independent genetic analysis of modern samples supports a shared crop ancestry within Balsas teosinte for sampled maize landraces, including samples from central Mexico."},{"source":"de-sahagun-1577-historia-general-cosas","locator":"Digital Florentine Codex, Book 4 folio 69r, Nahuatl transcription and Anderson–Dibble English translation","supports":"The folio describes maize previously cooked with lime being washed as part of food preparation; the manuscript is dated 1577."},{"source":"johnson-2020-experimental-identification-nixtamalized","locator":"§3 and §§7–8, including control trials","supports":"Experiments treat whole maize kernels as the raw material and compare lime-treated maize with non-alkaline cooking controls."}]}],"rationale":"The new Paredones transmission event is an attestation bound, not a date or route for the journey. Vallebueno-Estrada 2023 Table 1 dates husk/shank attached to Par_N1 to 6775–6504 cal BP and analyzes the same cob; independent Kistler genomes support general southward crop history, not a particular Xihuatoxtla donor. The separate Nahua and Wari supplies remain unresolved.","verdict":"accept"},{"id":"adobe-brick-building-on-the-north-coast-of-peru","name":"Adobe brick building on the north coast of Peru","date":"5,500 to 5,100 cal BP (c. 3550 to 3150 BCE)","frozen_date":"5,500 to 5,100 cal BP (c. 3550 to 3150 BCE)","lane":"andes","region":"south_america","domain":"construction","outcome":"deferred","finding":"Refined Phase II-2 use and material evidence: laminated natural clay distinguishes the blocks from later tempered adobe. Earlier clay building practice, including reported Ñanchoc hut-foundation blocks, offers comparison only. The catalogued coastal platform-and-plaza tradition is broader and differs from the local room.","next":"Identify and characterize the early Ñanchoc blocks and other dated clay masonry between them and Los Morteros. Seek direct evidence of a common production method.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8640935/","locator":"The Adobes of Los Morteros, Table 1, Figs. 1–4 and Conclusion","note":"Original chronology and experimental comparison of archaeological bricks and recent flood sediment. A composition match does not prove the exact clay source."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8640935/","locator":"Review of adobes, p. 2, Las Pircas CA-09-27 and Sechín Bajo examples","note":"Comparative reports summarized by the excavators. No characterized material sequence links the examples."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"adobe-brick-building-on-the-north-coast-of-peru","to":"platform-mounds-with-sunken-circular-plazas-on-the-peruvian-coast","type":"builds_on","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Mauricio et al. place room use at 5500–5100 cal BP by stratigraphy and closure offerings; laminated bricks and flood deposits suggest cut natural clay, without proving source. Earlier clay surfaces are not proven ancestral. Existing unsupported statements on Old World contact and global precedence are baseline and should be separately reconsidered.","verdict":"accept"},{"id":"cacao-use-at-santa-ana-la-florida-upper-amazon","name":"Cacao use at Santa Ana-La Florida, upper Amazon","date":"5440–5310 cal BP (c. 3490–3360 BCE)","frozen_date":"c. 3350 BCE","lane":"andes","region":"south_america","domain":"food","outcome":"deferred","finding":"Distinguished the directly dated 5440–5310 cal BP residue PLD-005 from the much later cacao-positive funerary bottles. Retained the broader priority question and deferred regional transmission because the evidence does not isolate the transfer of a particular crop or preparation technique.","next":"Seek cacao-positive vessels with secure specimen-level dates and comparable ancient genetic markers across intervening sites. Distinguish movement of planting stock from exchange of beverages or preparation knowledge.","sources":[{"url":"https://www.tonylutz.net/images/ebooks/Yajnavalkya/pdf/chapter-16/Theobroma-cacao.pdf","locator":"Fig. 2, Table 1 and DNA capture discussion","note":"Version-of-record copy read after independent review. PLD-005 is directly dated. PLD-001 and PLD-002 are contextual dates from separate later tombs."},{"url":"https://horizon.documentation.ird.fr/exl-doc/pleins_textes/divers17-07/010067276.pdf","locator":"§8.2.5 and Fig. 213","note":"Primary excavator account for vessel and funerary context. Investigators and materials overlap with Zarrillo. Fermentation is an interpretation."},{"url":"https://www.academia.edu/116011418/A_revisited_history_of_cacao_domestication_in_pre_Columbian_times_revealed_by_archaeogenomic_approaches","locator":"Table 1 and Discussion","note":"Other vessel assemblages and some overlapping investigators. Published cultural group ranges are not individual positive sample ages."},{"url":"https://pubmed.ncbi.nlm.nih.gov/18024588/","locator":"Henderson et al. abstract","note":"Chemical support for local Puerto Escondido use. No ancestry connection to this Ecuadorian site."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Zarrillo Table 1 and note a report 5440–5310 cal BP on charred residue PLD-005, with Theobroma starch, theobromine and a T. cacao DNA capture signal. The repaired wording separates the early sample from cacao-positive funerary bottles at around 4000 cal BP; genetic and priority uncertainty remains. The Valdez original remains unavailable to this reviewer, but Zarrillo independently describes mortuary contexts.","verdict":"accept"},{"id":"gravity-canals-upper-zana-valley-northern-peru","name":"Gravity canals, upper Zaña valley, northern Peru","date":"c. 4360-3990 BCE","frozen_date":"c. 4360-3990 BCE","lane":"andes","region":"south_america","domain":"food","outcome":"candidate","finding":"The Canal 3 candidate asks whether the buried lower-bench field depended on its water-delivery function. Hydraulic calculations use a probable common destination. Earlier probable garden furrows are on a different fan, and the outlet to the lower bench remains untraced.","next":"Obtain an excavation section that links Canal 3 to an independently dated lower-bench field surface or outlet.","sources":[{"url":"https://www.academia.edu/27205762/Preceramic_irrigation_canals_in_the_Peruvian_Andes_By_Tom_D_Dillehay_Herbert_H_Eling_Jr_and_Jack_Rossen","locator":"pp. 17242–17244, Figs. 1–3","note":"Version-of-record rendering. The common field destination informs the model. An excavated canal-to-field outlet and lower-bench date are unavailable."},{"url":"https://www.cambridge.org/core/books/abs/from-foraging-to-farming-in-the-andes/preceramic-mounds-and-hillside-villages/98947A9F80888045CBE011BBEE2FC887","locator":"Chapter summary, Cementerio de Ñanchoc","note":"Same research project and nearby phase context. The chapter summary is not evidence of connection to an individual field."}],"graph_status_before":"candidate","graph_status":"candidate","after":{},"connections":[{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"requires","decision":"existing-candidate","predicate_correction":{"before":{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"uses_process","from_event":"archaeological-evidence-3990bce","to_event":"tierra-blanca-field-cultivation","status":"candidate","statement":"Did Canal 3 supply water to fields on the lower bench during Tierra Blanca cultivation?","scope":"Canal 3 and the buried lower-bench field at Qu e falls in a domesticated range, while the authors leave local domestication versus adoption open. Anthropogenic island deposition and garden location are separate claims. Similar early manioc exploitation at Real Alto or later cassava pressing does not identify planting stock from this particular site.","next":"Find an early planting surface or a diagnostic larger assemblage at Isla Manechi. Trace dated and independently sampled populations between this site and later manioc-processing localities.","sources":[{"url":"https://core.ac.uk/download/pdf/322701628.pdf","locator":"Evidence of early plant cultivation, Figs. 2–3, Extended Data Table 2 and Implication for biodiversity","note":"Bern repository accepted manuscript. Early manioc identification is one heart-shaped phytolith. The possible gardens are inferred."},{"url":"https://doi.org/10.1371/journal.pone.0072746","locator":"Results and Discussion, Isla del Tesoro shell midden","note":"Overlapping investigators provide site sediment and shell evidence. The principal site differs from the earliest Isla Manechi crop locality."},{"url":"https://pubmed.ncbi.nlm.nih.gov/10318928/","locator":"Abstract, single-copy nuclear gene comparison","note":"Independent modern genetic evidence favours domestication along the southern Amazon margin. The sampled genealogy cannot identify an ancient Isla Manechi donor."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"manioc-and-squash-cultivation-in-the-llanos-de-moxos","to":"real-alto-manioc-processing","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Lombardo manuscript identifies one Manihot phytolith and squash-rind phytoliths in dated Isla Manechi layers; authors infer cultivation and island gardens and allow either local or imported domesticated squash. Local origin and contacts remain open.","verdict":"accept"},{"id":"nanchoc-early-crop-system","name":"Ñanchoc mixed crop food production","date":"By approximately 8600 cal BP (6650 BCE)","frozen_date":"By approximately 8600 cal BP (6650 BCE)","lane":"andes","region":"south_america","domain":"food","outcome":"candidate","finding":"The candidate asks whether cultivation of the specific lower-bench field depended on water delivered by Canal 3. The Las Pircas dental samples are earlier, and the Tierra Blanca botanical remains from sites such as CA-09-71 do not locate a crop in that field. The field remains undated.","next":"Locate the outlet and dated field horizon. Sample it for crop indicators independent of the earlier dental or household materials.","sources":[{"url":"https://www.academia.edu/27205762/Preceramic_irrigation_canals_in_the_Peruvian_Andes_By_Tom_D_Dillehay_Herbert_H_Eling_Jr_and_Jack_Rossen","locator":"pp. 17242–17244, Figs. 1–3","note":"Version-of-record rendering. The common field destination informs the model. An excavated canal-to-field outlet and lower-bench date are unavailable."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2604935/","locator":"pp. 19622–19623, site context and Table 1","note":"Teeth document Las Pircas consumption. Later cultivation context is synthesis by the same project."},{"url":"https://doi.org/10.1126/science.1141395","locator":"pp. 1890–1892 and Table 1, CA-09-71","note":"Dated cotton is from a house floor. This is not independent proof of irrigation or crop identity in the field."}],"graph_status_before":"candidate","graph_status":"candidate","after":{},"connections":[{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"requires","decision":"existing-candidate","predicate_correction":{"before":{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"uses_process","from_event":"archaeological-evidence-3990bce","to_event":"tierra-blanca-field-cultivation","status":"candidate","statement":"Did Canal 3 supply water to fields on the lower bench during Tierra Blanca cultivation?","scope":"Canal 3 and the buried lower-bench field at Quebrada sin Nombre-1.","timing":"The Canal 3 fill age falls within the 2011 Tierra Blanca phase interval. The lower-bench field's age remains open.","finding":"The excavators inferred that the canals watered the bench from local topography and sediment. Independent evidence for the field's connection to Canal 3 remains unavailable.","evidence":[{"source":"dillehay-2005-preceramic-irrigation-canals","locator":"pp. 17242–17244, Figs. 1–3 and discussion of the lower bench","supports":"The canals lie above a lower bench identified as a probable field location. The report gives a fill age for Canal 3 and describes the buried field as undated."}]},"after":{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"requires","from_event":"archaeological-evidence-3990bce","to_event":"tierra-blanca-field-cultivation","status":"candidate","statement":"Did cultivation on the buried lower-bench field depend on water delivered by Canal 3?","scope":"The water-delivery function of Canal 3 and cultivation on the buried lower-bench field at Quebrada sin Nombre-1.","timing":"The Canal 3 fill age falls within the 2011 Tierra Blanca phase interval. The lower-bench field's age remains open.","finding":"The excavators proposed a shared destination on the lower bench when comparing the canal gradients and flows. That model is consistent with irrigation there. The field remains undated and an excavated outlet from Canal 3 has not been traced to it.","evidence":[{"source":"dillehay-2005-preceramic-irrigation-canals","locator":"pp. 17242–17244, Figs. 1–3 and discussion of the lower bench","supports":"The canals lie above a lower bench identified as a probable field location. The report gives a fill age for Canal 3 and describes the buried field as undated."}]}},"edges":[{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"requires","from_event":"archaeological-evidence-3990bce","to_event":"tierra-blanca-field-cultivation","before":"absent","after":"candidate","statement":"Did cultivation on the buried lower-bench field depend on water delivered by Canal 3?","scope":"The water-delivery function of Canal 3 and cultivation on the buried lower-bench field at Quebrada sin Nombre-1.","evidence":[{"source":"dillehay-2005-preceramic-irrigation-canals","locator":"pp. 17242–17244, Figs. 1–3 and discussion of the lower bench","supports":"The canals lie above a lower bench identified as a probable field location. The report gives a fill age for Canal 3 and describes the buried field as undated."}]}]}],"incident_causal_edges":[{"from":"gravity-canals-upper-zana-valley-northern-peru","to":"nanchoc-early-crop-system","type":"requires","from_event":"archaeological-evidence-3990bce","to_event":"tierra-blanca-field-cultivation","before":"absent","after":"candidate","statement":"Did cultivation on the buried lower-bench field depend on water delivered by Canal 3?","scope":"The water-delivery function of Canal 3 and cultivation on the buried lower-bench field at Quebrada sin Nombre-1.","evidence":[{"source":"dillehay-2005-preceramic-irrigation-canals","locator":"pp. 17242–17244, Figs. 1–3 and discussion of the lower bench","supports":"The canals lie above a lower bench identified as a probable field location. The report gives a fill age for Canal 3 and describes the buried field as undated."}]}],"rationale":"Candidate requires now asks whether cultivation of the specific lower-bench field depended on Canal 3 water delivery, a functional dependency question fitting the infrastructure endpoint. Dillehay et al. model a probable destination; field age, outlet and necessity are not established.","verdict":"accept"},{"id":"telarmachay-camelid-herding","name":"Telarmachay camelid management","date":"Layer IV, modeled between 6.4–6.0 and 5.8–4.5 ka BP","frozen_date":"Approximately 6000 cal BP (4050 BCE), proposed","lane":"andes","region":"south_america","domain":"food","outcome":"deferred","finding":"Revised the local event to report the layer IV estimate and the later inference of greater management of vicuña-like camelids. The new talus and isotopic evidence challenges the older domestic-phenotype interpretation and leaves restriction method unresolved. A modern documented Cotahuasi pack-llama use is no evidence of descent from this rock shelter.","next":"Seek diagnostic older animal DNA or mobility indicators and dated regional sequences bridging early management and later domestic populations.","sources":[{"url":"https://cuevasdelperu.org/publicaciones/peru/1988_CRAIBL_Lavallee.pdf","locator":"pp. 275–281, De la chasse à la domestication","note":"Original field-project synthesis includes the mortality and incisor interpretations."},{"url":"https://www.academia.edu/166211372/New_insights_into_the_domestication_process_of_south_American_camelids_at_Telarmachay_Peru_from_9_000_to_4_500_years_before_present_BP","locator":"§2.2, Table 1, §4 and Figs. 5, 7–8","note":"Morphometrics, isotopes and dental analyses on same excavation corpus, with Wheeler in both research lineages."},{"url":"https://www.foragerarchaeology.org/papers/Noe2025.pdf","locator":"Discussion comparing the Lake Titicaca Basin and Telarmachay","note":"Independent regional assemblage and hypothesis comparison. It does not revisit the original Telarmachay bones."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"telarmachay-camelid-herding","to":"cotahuasi-llama-salt-caravan-2007","type":"requires","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Le Neün 2026 abstract and analysis interpret altered vicuña-like talus shapes as potential management intensification, without alpaca/llama phenotypic divergence; outer phase bounds 6400–4500 cal BP retain uncertainty. Lavallée 1988 pp. 275–281 presents earlier mortality and tooth-based domestication interpretation; overlapping site corpus and Wheeler authorship are not independent replication.","verdict":"accept"},{"id":"indigo-dyeing-on-the-north-coast-of-peru","name":"Indigo dyeing on the north coast of Peru","date":"about 6200 to 6000 years ago","frozen_date":"about 6200 to 6000 years ago","lane":"andes","region":"south_america","domain":"materials","outcome":"candidate","finding":"Retained the directly dated stratum 52 cotton yarn as a separate finding. The stratum 44 cloth incorporates plied cotton yarn. The candidate asks whether making that particular cloth depended on supply by the yarn-making practice documented at Huaca Prieta. Its yarn supplier and place of spinning remain unknown.","next":"Seek a dated production context or material evidence identifying the plied yarn supplier for the indigo-striped cloth.","sources":[{"url":"https://tiffinytung.com/wp-content/uploads/2019/07/2012dillehay_etal_chronologymound-buildinghuacaprieta_antiqty-1.pdf","locator":"p. 56, Table 1, HP-3 stratum 52 specimen AA82121","note":"Direct radiocarbon date on earlier cotton yarn, separate from the indigo-bearing specimen."},{"url":"https://www.talkingaboutthescience.com/studies/Splitstoser2016.pdf","locator":"Introduction, Fig. 1 and Table 1, sample 2009.052.01.B&C","note":"Textile structure and dye chemistry give different kinds of evidence on the same specimen."},{"url":"https://www.researchgate.net/publication/355029465_Huaca_Prieta_Twined_and_Woven_Artifacts_Part_1_Textiles","locator":"pp. 474–476, Table 12.5 and Fig. 12.1d","note":"Same lead analyst and wider assemblage. The phase number differs for Stratum 44 across publications. Used stratum and specimen without a phase claim."}],"graph_status_before":"open","graph_status":"candidate","after":{},"connections":[{"from":"cotton-yarn-making-at-huaca-prieta","to":"indigo-dyeing-on-the-north-coast-of-peru","type":"requires","decision":"new-candidate","edges":[{"from":"cotton-yarn-making-at-huaca-prieta","to":"indigo-dyeing-on-the-north-coast-of-peru","type":"requires","from_event":"","to_event":"archaeological-evidence-4050bce","before":"absent","after":"candidate","statement":"Did making the stratum 44 indigo-striped cloth depend on plied cotton supplied by the yarn-making practice evidenced at Huaca Prieta?","scope":"Yarn supply for specimen 2009.052.01.B&C. The earlier cotton yarn AA82121 from stratum 52 is evidence of yarn-making.","caveats":"Spinning location, fibre source and the order of spinning and dyeing remain open.","evidence":[{"source":"splitstoser-2016-early-pre-hispanic","locator":"Introduction, Fig. 1 and Table 1, specimen 2009.052.01.B&C","supports":"Documents plied yarns in the warps and identifies an indigoid dye in the blue yarn sampled from the cloth."},{"source":"dillehay-2012-huaca-prieta-chronology","locator":"p. 56, Table 1, AA82121","supports":"Radiocarbon analysis independently dates an earlier cotton yarn from the same site and trench."},{"source":"splitstoser-2017-huaca-prieta-textiles","locator":"Table 12.5 and Fig. 12.1d","supports":"Documents varieties of yarn in the broader textile assemblage and illustrates the identified indigo specimen."}]}]}],"incident_causal_edges":[{"from":"cotton-yarn-making-at-huaca-prieta","to":"indigo-dyeing-on-the-north-coast-of-peru","type":"requires","from_event":"","to_event":"archaeological-evidence-4050bce","before":"absent","after":"candidate","statement":"Did making the stratum 44 indigo-striped cloth depend on plied cotton supplied by the yarn-making practice evidenced at Huaca Prieta?","scope":"Yarn supply for specimen 2009.052.01.B&C. The earlier cotton yarn AA82121 from stratum 52 is evidence of yarn-making.","caveats":"Spinning location, fibre source and the order of spinning and dyeing remain open.","evidence":[{"source":"splitstoser-2016-early-pre-hispanic","locator":"Introduction, Fig. 1 and Table 1, specimen 2009.052.01.B&C","supports":"Documents plied yarns in the warps and identifies an indigoid dye in the blue yarn sampled from the cloth."},{"source":"dillehay-2012-huaca-prieta-chronology","locator":"p. 56, Table 1, AA82121","supports":"Radiocarbon analysis independently dates an earlier cotton yarn from the same site and trench."},{"source":"splitstoser-2017-huaca-prieta-textiles","locator":"Table 12.5 and Fig. 12.1d","supports":"Documents varieties of yarn in the broader textile assemblage and illustrates the identified indigo specimen."}]}],"rationale":"Candidate requires now asks whether the local yarn-making function supplied the plied yarn in the specific indigo-striped cloth. Splitstoser 2016 confirms yarn in the cloth; Dillehay 2012 documents the separate earlier site instance. Supplier and spinning site are unproven. This is a bounded functional question, not an established supplier or a claim of descent from the earlier object.","verdict":"accept"},{"id":"lower-amazon-shell-midden-pottery","name":"Grit-tempered pottery at Taperinha","date":"7600–7280 cal BP (c. 5650–5330 BCE)","frozen_date":"Approximately 8000–7000 years BP","lane":"andes","region":"south_america","domain":"materials","outcome":"deferred","finding":"Replaced a broad site-level range with the published ceramic-specific reduced-carbon date for the level 12-base sherd and gave its grit-tempered bowl context. Potential dating biases remain, and there is no evidence for vessel contents or craft inheritance. Other Amazonian pottery remains comparative.","next":"Seek a modern independent redating and targeted residue analyses from sealed context, then compare technological composition and chronology with nearby assemblages.","sources":[{"url":"https://img1.wsimg.com/blobby/go/e83108cd-3865-44bd-b08b-d8bebe078aba/downloads/d022eba4-7b3f-4ade-b3bc-08622cc44cac/roosevelt1991emp%20%282%29.pdf?ver=1758828852255","locator":"pp. 1622–1624, Tables 1–2 and Figs. 5–6","note":"AMS fractions and thermoluminescence are from the same sherd. Shell and charcoal are separately associated occupation materials."},{"url":"https://www.scielo.cl/scielo.php?pid=S0717-73562011000100014&script=sci_arttext","locator":"Review discussion of Taperinha and Barlovento","note":"Differing late intrusion interpretation relies on style and stratigraphic reading. It provides no new direct sherd dates."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Roosevelt Table 1 identifies 7600–7280 cal BP reduced-carbon assay OxA-2431 from level 12-base sherd; same sherd has separate humic fraction and TL assay, not independent artifacts. Bowl fragments are grit tempered; fauna indicate aquatic foraging, and paper warns possible carbon contamination.","verdict":"accept"},{"id":"plant-fibre-fabrics-and-cordage-among-early-andean-foragers","name":"Plant-fibre fabrics and cordage among early Andean foragers","date":"12,130–11,080 cal BP across dated specimens","frozen_date":"c. 10,150 to 9130 BCE (12,100 to 11,080 years ago)","lane":"andes","region":"south_america","domain":"materials","outcome":"deferred","finding":"Replaced press-release reliance with the original table of separately dated cords and close and open twining. The much later spiral-interlinked sample is not part of the early date span. Similarity to Huaca Prieta textile techniques does not bridge regional and chronological differences.","next":"Seek dated intermediate fibre assemblages and unusual shared construction signatures that would support a transmission hypothesis.","sources":[{"url":"https://www.scribd.com/document/931517465/Jolie-Et-Al-2011","locator":"pp. 289–292, Table 2 and Figs. 2–4","note":"Full original article rendering. The institutional PDF was blocked for direct download."},{"url":"https://digitalcommons.unl.edu/anthropologyfacpub/136/","locator":"Citation and abstract","note":"Institutional publication metadata. The abstract and full article rendering are the same study."},{"url":"https://pubmed.ncbi.nlm.nih.gov/17777927/","locator":"Abstract, Lynch et al. 1985","note":"Earlier direct dating of cord, charcoal and wood. Same excavated collection, with different determinations."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"plant-fibre-fabrics-and-cordage-among-early-andean-foragers","to":"cotton-yarn-making-at-huaca-prieta","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Jolie Table 2 separately dates two-ply cord 12130–11800, close twining 11330–11100 and open twining 11280–11080 cal BP; spiral interlinking is later. Coils support but do not prove manufacture onsite. Functions and transmission remain hypotheses.","verdict":"accept"},{"id":"shellfish-gathering-pinnacle-point-south-africa","name":"Shellfish gathering, Pinnacle Point, South Africa","date":"c. 164,000 years ago (±12,000)","frozen_date":"c. 164,000 years ago","lane":"oceania","region":"africa","domain":"food","outcome":"deferred","finding":"The original PP13B report puts food shells in LC-MSA Lower at roughly 164 ± 12 ka, with brown mussel the most abundant taxon by minimum number of individuals. It infers accessible rocky shores and tidal pools from habitat. The existing press-release event was the same observation and is consolidated into the bounded excavation event. Bajondillo is a roughly contemporaneous comparison, so worldwide priority is left open. Shells and flaked tools in the same stratum do not show that a named technique supplied shellfish procurement.","next":"Inspect shell growth increments, assemblage taphonomy and any object with securely identified contact wear in the oldest dated PP13B subcontext. Such evidence could refine collecting conditions or a tool relationship.","sources":[{"url":"https://www.archaeomagnetism.com/wp-content/uploads/2011/03/Marean-et-al-2007-Nature.pdf","locator":"pp. 905–907, tables 1–2","note":"Original Nature report; PDF SHA-256 c2287517b0293690a9b0382d1f515218869e311c5b657f6d106732d03cb3021d. Shore proximity is a model, not a direct observation."},{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0024026","locator":"Results and Discussion, Bj19; Conclusions","note":"Independent archaeological assemblage in Spain, no evidence of transfer."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Accept bounded refinement and duplicate-event consolidation; no new tool or transmission relation is established.","verdict":"accept"},{"id":"hook-and-line-and-open-sea-fishing-in-timor-and-alor","name":"Pleistocene marine fishing and shell hooks in Timor and Alor","date":"c. 42,000 years ago (c. 40,050 BCE)","frozen_date":"c. 42,000 years ago (c. 40,050 BCE)","lane":"oceania","region":"asia","domain":"food","outcome":"deferred","finding":"Jerimalai's oldest Square B assemblage includes scombrids, identified at family level in 2011. Independent comparative habitat data leave either inshore or offshore capture possible. The later shell hook in Square A, spit 29, and the dated Alor burial hook remain separate observations. Shared types across Wallacea and later Pacific fishing do not date the early capture technique or prove a specific transmission route.","next":"Seek early Jerimalai gear or species-level biomolecular identification tied to the earliest stratigraphy. To test transmission, compare dated production and use evidence from Timor, Alor and Kisar.","sources":[{"url":"https://openresearch-repository.anu.edu.au/bitstreams/395b3624-7aba-44e8-ae54-08a923e67615/download","locator":"pp. 1117–1120, table 3 and fig. 3","note":"Read the original Science report beyond the baseline abstract."},{"url":"https://openresearch-repository.anu.edu.au/server/api/core/bitstreams/65cb1300-b211-43ef-8904-826b57794ed5/content","locator":"pp. 879–883 and the excavators’ reply","note":"Same bones are debated; Anderson independently brings in habitat and size comparisons. The authors retain the technologically demanding capture inference."},{"url":"https://www.cambridge.org/core/journals/antiquity/article/fishing-in-life-and-death-pleistocene-fishhooks-from-a-burial-context-on-alor-island-indonesia/BD9145338CF10EE824AC4A7F0AF7E2D9","locator":"AMS dating of burial context and grave goods; comparison","note":"Direct shell date for one Alor hook; comparison with earlier Timor and Okinawa contexts cannot make them a single sequence."},{"url":"https://www.tandfonline.com/doi/full/10.1080/00438243.2023.2172072","locator":"Fishing technology","note":"Presents a later Wallacean interaction hypothesis with similarities and local hook differences. Does not supply gear in the oldest Timor assemblage."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Accept narrower fishing identity and separated later-hook evidence; specific capture method and offshore use remain unresolved.","verdict":"accept"},{"id":"norje-fish-fermentation-storage","name":"Norje Sunnansund fish fermentation and storage","date":"9600–8600 calibrated years BP","frozen_date":"9600–8600 calibrated years BP","lane":"oceania","region":"europe","domain":"food","outcome":"deferred","finding":"The excavation documents a discrete fish-rich gutter. Later strontium evidence distinguishes sampled fish in and out of the pit, and the authors infer autumn roach gathering. That season is inferred from ecology; the isotope tests address provenance rather than fermentation. The Antrea net is a comparison with separate chronology and geography, and does not identify Norje gear or imply transfer. The baseline scope and site date are retained.","next":"Seek site-provenanced fishing gear or collection installations and independent residues or taphonomic comparisons that can distinguish preservation from other causes of the deposit.","sources":[{"url":"https://www.academia.edu/85188597/Something_rotten_in_Scandinavia_The_worlds_earliest_evidence_of_fermentation","locator":"Boethius 2016, pp. 172–179, figs. 3–9 and Discussion","note":"Original article's rendered text. Fermentation inference uses contextual observations and ethnographic analogy; alternative deposit origins are discussed."},{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0245222","locator":"Fish teeth data; Discussion; Concluding remarks","note":"New measurements of the same site assemblage, not independent documentation of fermentation chemistry."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Accept additional source and season as an explicitly inferred open question, not direct fermentation chemistry.","verdict":"accept"},{"id":"kuk-banana-cultivation","name":"Kuk Swamp banana cultivation","date":"Approximately 6950–6440 cal BP (5000–4490 BCE)","frozen_date":"Approximately 6950–6440 cal BP (5000–4490 BCE)","lane":"oceania","region":"oceania","domain":"food","outcome":"candidate","finding":"Early Phase 2 mound bases represent a separate land-preparation achievement. Denham, Golson and Hughes interpret banana phytolith concentrations in the adjacent feature fills as deliberate planting in those mounded plots. Excavated field architecture and plant residues are distinct kinds of evidence. Their spatial attribution is an inference from fills and the studies overlap in authors and material, so the local uses_process relation stays a candidate. The westward dispersal discussed by Perrier and colleagues combines regional genetics and linguistics; neither traces a specific plant line directly out of the sampled Kuk plots.","next":"Seek spatially resolved phytoliths or macrobotanical remains on additional preserved mound surfaces with documented controls for settling, wash-in and mixing. Distinguish wider spread of cultivation from site-to-site transfer.","sources":[{"url":"https://faculty.washington.edu/plape/pacificarchaut12/Denham%20et%20al%202003.pdf","locator":"pp. 190–192, figs. 2C and 3–4","note":"Original excavations and separate plant evidence."},{"url":"https://press-files.anu.edu.au/downloads/press/n2540/pdf/ch12.pdf","locator":"pp. 201–204, 210–212, Use and landuse","note":"Combines observations from the 1970s and 1998–1999 fieldwork. P. 211 explicitly interprets bananas in mounded plots."},{"url":"https://press-files.anu.edu.au/downloads/press/n2540/pdf/ch10.pdf","locator":"p. 171 Table 10.T2.1, early feature fills 3004 and 3009","note":"Separately reports the phytolith proxy cited by ch. 12. Do not match sample numbers to the 2003 or 2011 articles without a crosswalk."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3136277/","locator":"Archaeobotanical evidence, figs. 3 and 5","note":"Reanalyses Kuk plant material, and adds comparative genetics and linguistics for regional dispersal."}],"graph_status_before":"open","graph_status":"candidate","after":{},"connections":[{"from":"kuk-phase-two-mounded-cultivation","to":"kuk-banana-cultivation","type":"uses_process","decision":"new-candidate","edges":[{"from":"kuk-phase-two-mounded-cultivation","to":"kuk-banana-cultivation","type":"uses_process","from_event":"early-phase-two-mounds","to_event":"documented-evidence","before":"absent","after":"candidate","statement":"Were early Phase 2 bananas at Kuk cultivated on raised planting plots?","scope":"Early Phase 2 palaeosurface, Kuk Swamp, 6950–6440 cal BP","evidence":[{"source":"denham-2017-kuk-mounded-cultivation","locator":"pp. 202, 210–212; Use","supports":"Excavated Phase 2 surfaces date to 6950–6440 cal BP. The authors interpret the concentrations in early feature fills as evidence of bananas deliberately planted in mounded plots."},{"source":"lentfer-2017-kuk-archaeobotany","locator":"p. 171, Table 10.T2.1","supports":"Reports elevated Musaceae phytolith frequencies and diagnostic Musa section seed phytoliths in samples from fills 3004 and 3009."},{"source":"denham-2003-kuk-agriculture","locator":"p. 190, fig. 2C; pp. 191–192, figs. 3–4","         if (url.protocol === 'https:' || url.protocol === 'http:') {
          const anchor = element('a', `${item.title || url.hostname} · ${locator}`);
          anchor.href = url.href;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          line.append(anchor);
        } else line.append(locator);
      } catch { line.append(locator); }
      if (item.note || item.supports) line.append(element('div', item.note || item.supports, 'text-small'));
      return line;
    }

    function connection(mention, anchorId = '') {
      const node = element('li');
      const start = names[mention.from] || mention.from;
      const end = names[mention.to] || mention.to;
      node.append(element('div', `${start} → ${end}`));
      const basis = anchorId ? (mention.from === anchorId ? 'outgoing' : 'incoming') : label(mention.decision);
      node.append(element('div', `${label(mention.type)} · ${layers[mention.type]} · ${basis}`, 'text-small'));
      if (mention.predicate_correction) {
        const {before, after} = mention.predicate_correction;
        node.append(element('div', `${title(after.status)} retained · ${label(before.type)} → ${label(after.type)}`));
      }
      for (const edge of mention.edges ?? [mention]) {
        const scope = [edge.from_event, edge.to_event].filter(Boolean).join(' → ');
        const status = `${edge.before} → ${edge.after}`;
        node.append(element('div', scope ? `${status} · ${scope}` : status, 'text-small'));
        if (edge.statement) node.append(element('div', edge.statement));
        if (edge.scope) node.append(element('div', edge.scope));
        if (edge.caveats) node.append(element('div', edge.caveats, 'text-small'));
        if (edge.evidence?.length) {
          const citations = element('ul');
          for (const item of edge.evidence) citations.append(source({...sources[item.source], ...item}));
          node.append(disclosure('Relationship evidence', citations));
        }
      }
      return node;
    }

    function show() {
      const row = byId.get(record.value);
      detail.replaceChildren();
      detail.hidden = !row;
      if (!row) return;
      const after = Object.entries(row.after).map(([kind, n]) => `${n} ${label(kind)}`).join(', ');
      const context = [row.id, row.date || 'Undated', label(row.region), label(row.domain)].filter(Boolean).join(' · ');
      const insufficient = row.incident_causal_edges.filter(edge => edge.after === 'insufficient').length;
      detail.append(element('h3', row.name), element('div', context, 'text-small'),
        element('div', `Graph outcome · ${graphLabels[row.graph_status]}${after ? ` · ${after}` : ''}`));
      if (insufficient) detail.append(element('div', `Insufficient assessments · ${insufficient}`, 'text-small'));
      if (row.frozen_date !== row.date) detail.append(element('div', `Frozen date · ${row.frozen_date || 'Undated'}`, 'text-small'));
      detail.append(element('div', `Researcher’s assessment · ${title(row.outcome)}`),
        element('div', 'May concern a dated find or an affinity relationship.', 'text-small'), element('p', row.finding));
      if (row.next) detail.append(element('div', 'Next evidence'), element('p', row.next));
      const citations = element('ul');
      for (const item of row.sources) citations.append(source(item));
      detail.append(disclosure(`Source passages (${row.sources.length})`, citations));
      if (row.incident_causal_edges.length) {
        const links = element('ul');
        for (const edge of row.incident_causal_edges) links.append(connection(edge, row.id));
        detail.append(disclosure(`Dependence and transmission (${row.incident_causal_edges.length})`, links));
      }
      if (row.connections.length) {
        const links = element('ul');
        for (const mention of row.connections) links.append(connection(mention));
        detail.append(disclosure(`Research ledger comparisons (${row.connections.length})`, links));
      }
      detail.append(disclosure(`Independent review · ${label(row.verdict)}`, element('p', row.rationale)));
    }

    function filter(selected = record.value) {
      const query = search.value.trim().toLowerCase();
      const matches = records.filter(row => (!lane.value || lane.value === row.lane)
        && (!outcome.value || outcome.value === row.graph_status)
        && `${row.name} ${row.id}`.toLowerCase().includes(query));
      count.textContent = `${matches.length} of ${records.length} discoveries`;
      record.replaceChildren(...matches.map(row => new Option(row.name, row.id)));
      record.disabled = !matches.length;
      if (matches.some(row => row.id === selected)) record.value = selected;
      for (const period of ['before', 'after']) {
        const status = period === 'before' ? 'graph_status_before' : 'graph_status';
        const n = matches.filter(row => row[status] === 'established').length;
        const bar = root.querySelector(`[data-bar="${period}"]`);
        bar.setAttribute('aria-valuemax', Math.max(matches.length, 1));
        bar.setAttribute('aria-valuenow', n);
        bar.setAttribute('aria-valuetext', `${n} of ${matches.length}`);
        bar.firstElementChild.style.width = `${matches.length ? 100 * n / matches.length : 0}%`;
        root.querySelector(`[data-total="${period}"]`).textContent = `${n} / ${matches.length}`;
      }
      const outcomes = Object.entries(graphLabels).map(([status, label]) =>
        `${matches.filter(row => row.graph_status === status).length} ${label.toLowerCase()}`);
      root.querySelector('[data-graph-summary]').textContent = outcomes.join(' · ');
      show();
    }

    function save() {
      window.openai?.setWidgetState?.({modelContent: {selectedDiscovery: record.value},
        privateContent: {lane: lane.value, outcome: outcome.value, query: search.value, selected: record.value}})?.catch(() => {});
    }

    function restore(saved) {
      if (saved) {
        if ([...lane.options].some(option => option.value === saved.lane)) lane.value = saved.lane;
        if ([...outcome.options].some(option => option.value === saved.outcome)) outcome.value = saved.outcome;
        if (typeof saved.query === 'string') search.value = saved.query;
      }
      filter(saved?.selected);
    }

    for (const input of [lane, outcome, search]) input.addEventListener('input', () => { filter(); save(); });
    record.addEventListener('change', () => { show(); save(); });
    restore(window.openai?.widgetState?.privateContent);
    window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState?.privateContent));
  })();
  </script>
</div>

</body>
