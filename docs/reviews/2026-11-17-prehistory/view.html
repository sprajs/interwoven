 Golan domesticated-type emmer","date":"Approximately 9800 cal BP (7850 BCE)","frozen_date":"Approximately 9800 cal BP (7850 BCE)","lane":"grain","region":"asia","domain":"food","outcome":"deferred","finding":"The existing record matches the domestication-type emmer occurrence in horizon II at about 9800 cal BP. Added primary analysis of earlier wild grass assemblages and retained uncertainty about how those grasses were gathered or managed. Excavators’ interpretations differ over pre-domestication cultivation. No earlier site-level cultivation node, origin of the emmer, or transfer into later records such as Giza’s emmer bread is established.","next":"Seek directly associated cultivation surfaces or calibrated seed-context series that discriminate locally sown wild cereals from harvesting natural stands, and geographically matched lineage evidence for arrival or onward transmission of the emmer.","sources":[{"url":"https://pubmed.ncbi.nlm.nih.gov/23828939/","locator":"Riehl et al. 2013, Abstract","note":"Early publication of the 2009–2010 excavation results. Documents the approximate late appearance of domestic-type emmer."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5749723/","locator":"Weide et al. 2018, Chogha Golan, Sampling and laboratory methods, Wild grasses in the subsistence of Chogha Golan, and Conclusion","note":"Adds 23 samples for horizons VII to III and reuses 15 previously analyzed horizon II samples. Earlier local wild grasses may have been harvested from naturally occurring or disturbed stands."},{"url":"https://downloads.hindawi.com/journals/bmri/2015/532481.pdf","locator":"Riehl et al. 2015, Abstract and Discussion","note":"Uses ecological and stratigraphic evidence from the same site. Cultivation is one interpretation of the wild barley size and isotope pattern."},{"url":"https://www.willcoxpages.fr/pdf/WillcoxDouchePaleorient2018.pdf","locator":"Douché and Willcox 2018, fig. 6","note":"An external comparison questions interpreting the percentage of domestic emmer bases as a domestication onset. Its plotted Chogha Golan figures are taken from the earlier study."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Emmer occurrence retained and earlier plant management unresolved; same Weide support was inserted twice. Repair removes duplicates; final bytes checked.","verdict":"accept"},{"id":"dhra-raised-floor-granary","name":"Dhra raised-floor granary","date":"Approximately 11,300–11,200 cal BP (9350–9250 BCE)","frozen_date":"Approximately 11,300–11,200 cal BP (9350–9250 BCE)","lane":"grain","region":"asia","domain":"food","outcome":"deferred","finding":"Kept one Structure 4 raised-floor record. Added independently informative plant remains from the same excavation to its interpretation. Floor phytoliths and charred barley above the floor support association with cereal storage, with the contents and quantity during use unresolved. The floor supports belong to the same architectural observation. A Dhra-to-Tell Aswad pathway or narrower proof that any particular harvest was stored here is unavailable.","next":"Seek primary storage deposits associated with specific use surfaces, direct dates of their contents, and matching local crop or harvesting-tool evidence.","sources":[{"url":"https://doi.org/10.1073/pnas.0812764106","locator":"Kuijt and Finlayson 2009, p. 10967, Granaries at Dhra′, figs. 2–3","note":"Original excavation report on the inferred floor supports and preliminary detection of barley husk phytoliths in the mud floor."},{"url":"https://www.researchgate.net/publication/322562142_New_insights_on_plant_domestication_production_intensification_and_food_storage_the_archaeobotanical_evidence_from_PPNA_Dhra","locator":"Colledge and Conolly, 17 January 2018 online version, Dhra′ cereal densities, context 2134 and table 5","note":"Separate charred plant sample from above the floor within the same structure, not a repeat identification of the floor phytoliths. The hosted online text has the older title and two authors."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Source-backed caveat and plant evidence duplicated in final bytes. Repair removes duplicates; final bytes checked.","verdict":"accept"},{"id":"ohalo-wild-grain-gathering-and-grinding","name":"Ohalo II wild-grain gathering and grinding","date":"About 23,000 calibrated years BP","frozen_date":"About 23,000 calibrated years BP","lane":"grain","region":"asia","domain":"food","outcome":"candidate","finding":"Proposed a distinct site instance of hafted cereal cutting, based on blade wear. Existing Ohalo II gathering and grinding includes a separate in situ slab and wild grain assemblage. Near-ripe stem wear and predominantly ripe recovered grains leave open whether hafted cutting and grinding worked together in local food preparation. The catalogue’s open multi-insert sickle lead encompasses a stronger claim above the scope of the Ohalo evidence.","next":"Look for taxonomically diagnostic residues and secure contexts linking particular harvested batches to their processing. A separate sequence and carrier would be needed for any transmission to later Natufian practices.","sources":[{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0167151","locator":"Groman-Yaroslavski et al. 2016, Results, figs. 5–6, and Discussion","note":"Publisher PDF retained via checksum descriptor. Two blades show inferred hafting wear and other analyzed blades appear hand-held. Use-wear is from different specimens than starch or grain finds."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC470712/","locator":"Weiss et al. 2004, Plant remains and discussion of the hut grinding stone","note":"Separate macrobotanical and spatial evidence for use of wild cereals. Overlapping team."},{"url":"https://doi.org/10.1017/S0003598X00048201","locator":"Nadel et al. 2012, article extract","note":"Starch residues on the same grinding slab previously studied by Piperno et al. The characterization of routine processing is tempered by Dubreuil and Nadel’s separate 2015 wear analysis of that slab."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4614720/","locator":"Dubreuil and Nadel 2015, Discussion and conclusion","note":"Use-wear indicates plant material processing. It is consistent with occasional rather than intensive flour production."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"ohalo-hafted-blade-cereal-harvesting","to":"ohalo-wild-grain-gathering-and-grinding","type":"companion_of","decision":"new-candidate","edges":[{"from":"ohalo-hafted-blade-cereal-harvesting","to":"ohalo-wild-grain-gathering-and-grinding","type":"companion_of","from_event":"documented-evidence","to_event":"documented-evidence","before":"absent","after":"candidate","statement":"Did cutting near-ripe cereals with hafted blades and grinding wild grains work together in food preparation at Ohalo II?","scope":"Possible association between hafted cereal cutting and wild-grain processing at Ohalo II","evidence":[{"source":"groman-yaroslavski-2016-ohalo-harvesting","locator":"Discussion, paragraphs beginning ‘The use-wear analysis’ and ‘Large quantities’","supports":"Distinct blade wear supports cereal cutting with some hafted tools. The authors note that most grains recovered at the site were ripe."},{"source":"weiss-2004-ohalo-wild-grasses","locator":"Plant remains and conclusion","supports":"The distribution of wild grain around the grinding stone documents a separate line of evidence for cereal gathering and processing."}]}]}],"incident_causal_edges":[],"rationale":"The proposed local arrangement is a candidate question, not established history or transmission.","verdict":"accept"},{"id":"shubayqa-bread-like-food","name":"Shubayqa bread-like food","date":"About 14,400–14,200 cal BP (12,450–12,250 BCE)","frozen_date":"About 14,400–14,200 cal BP (12,450–12,250 BCE)","lane":"grain","region":"asia","domain":"food","outcome":"established","finding":"Proposed the Early Natufian ground stone processing practice as a distinct instance and a scoped uses_process edge. The grinding and pounding wear on tools and the fine plant particles within charred foods make independent archaeological observations within the same excavation. Only the ingredient-reduction step is claimed. The specific tools used for individual pieces and the route to later baking traditions remain unresolved.","next":"Seek published residue results and tighter context-level dates to attribute material to particular tools. Direct transmission from Ohalo II or onward to Giza remains undocumented.","sources":[{"url":"https://www.researchgate.net/publication/405124317_From_Stone_to_Food_Foodways_and_Ground_Stone_Tools_During_the_Natufian_and_Early_Neolithic_of_Eastern_Jordan","locator":"Pedersen et al. 2026, §§3.1 and 4.1, table 2 and fig. 4","note":"Publisher-hosted article copy on ResearchGate. Early Natufian tool evidence identifies plausible contact materials from a small sample. The article compares wear on the tools with separate food fragments of the same broad occupation. Full residue results were pending."},{"url":"https://doi.org/10.1073/pnas.1801071115","locator":"Arranz-Otaegui et al. 2018, The Chaîne Opératoire for the Production of Bread-Like Products in Shubayqa 1 and SI Appendix table S2","note":"Food-fragment microscopy and particle sizes support fine ingredient preparation. A shared excavation and two overlapping authors do not make the archaeological tools and food fragments the same sample."},{"url":"https://journals.ed.ac.uk/lithicstudies/article/view/1647","locator":"Pedersen et al. 2016, Abstract and Conclusions","note":"Earlier tool study treated the Late Natufian phase. It was not suitable to establish exact contemporary tool use for the Early Natufian breads."}],"graph_status_before":"open","graph_status":"established","after":{"incoming_dependence":1},"connections":[{"from":"shubayqa-early-natufian-grinding-and-pounding","to":"shubayqa-bread-like-food","type":"uses_process","decision":"new-established","edges":[{"from":"shubayqa-early-natufian-grinding-and-pounding","to":"shubayqa-bread-like-food","type":"uses_process","from_event":"documented-evidence","to_event":"documented-evidence","before":"absent","after":"established","statement":"Fine grinding or pounding of plant ingredients contributed to the bread-like preparations at Early Natufian Shubayqa 1.","scope":"Plant ingredient preparation in the Early Natufian at Shubayqa 1","caveats":"Tool wear and food microstructure support the preparation step at the scale of the occupation. The exact sequence of milling, pounding, sieving or winnowing remains uncertain, and individual tools cannot be assigned to individual food remains.","evidence":[{"source":"arranz-otaegui-2018-shubayqa-bread","locator":"The Chaîne Opératoire for the Production of Bread-Like Products in Shubayqa 1, SI Appendix table S2","supports":"Particles in the charred foods support fine preparation of plant ingredients. The authors consider repeated milling, sieving or careful winnowing among the possible steps."},{"source":"pedersen-2026-shubayqa-ground-stone","locator":"Section 4.1, Early Natufian Use-Wear, table 2 and fig. 4","supports":"In Early Natufian Shubayqa 1, wear on a handstone suggests seed or cereal grinding. Wear on a combined quern and mortar and nearby tool is consistent with grinding or pounding tubers or similar soft plants. The excavators compare these traces with food remains of the same broad period."}]}]},{"from":"ohalo-wild-grain-gathering-and-grinding","to":"shubayqa-bread-like-food","type":"transmitted_from","decision":"deferred","edges":[]},{"from":"shubayqa-bread-like-food","to":"mould-baked-leavened-bread-at-old-kingdom-giza","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[{"from":"shubayqa-early-natufian-grinding-and-pounding","to":"shubayqa-bread-like-food","type":"uses_process","from_event":"documented-evidence","to_event":"documented-evidence","before":"absent","after":"established","statement":"Fine grinding or pounding of plant ingredients contributed to the bread-like preparations at Early Natufian Shubayqa 1.","scope":"Plant ingredient preparation in the Early Natufian at Shubayqa 1","caveats":"Tool wear and food microstructure support the preparation step at the scale of the occupation. The exact sequence of milling, pounding, sieving or winnowing remains uncertain, and individual tools cannot be assigned to individual food remains.","evidence":[{"source":"arranz-otaegui-2018-shubayqa-bread","locator":"The Chaîne Opératoire for the Production of Bread-Like Products in Shubayqa 1, SI Appendix table S2","supports":"Particles in the charred foods support fine preparation of plant ingredients. The authors consider repeated milling, sieving or careful winnowing among the possible steps."},{"source":"pedersen-2026-shubayqa-ground-stone","locator":"Section 4.1, Early Natufian Use-Wear, table 2 and fig. 4","supports":"In Early Natufian Shubayqa 1, wear on a handstone suggests seed or cereal grinding. Wear on a combined quern and mortar and nearby tool is consistent with grinding or pounding tubers or similar soft plants. The excavators compare these traces with food remains of the same broad period."}]}],"rationale":"Local ingredient reduction is supported by complementary food microstructure and contemporaneous ground-stone wear; no tool-specific attribution or transmission claimed.","verdict":"accept"},{"id":"tell-aswad-domestic-barley","name":"Tell Aswad barley with domestication traits","date":"Approximately 8200–7500 cal BCE (Middle PPNB, phase AW2)","frozen_date":"Approximately 10,200–9500 cal BP (8250–7550 BCE)","lane":"grain","region":"asia","domain":"food","outcome":"deferred","finding":"Amended the archaeological event to phase AW2, about 8200–7500 cal BCE, using the original secure-context reanalysis. Wild barley remains predominate. Removed the earlier general percentage from the evidence for the dated event because the older and revised phasing and sample selections differ. AW3 storage came later. No matched precursor harvest regime or transmission to Tell Aswad is established.","next":"Seek direct context-level co-occurrence of secure AW2 diagnostic rachises with a particular harvesting or sowing regime. Test seed exchange with dated assemblages and lineage evidence before assigning any place of domestication.","sources":[{"url":"https://www.willcoxpages.fr/pdf/WillcoxDouchePaleorient2018.pdf","locator":"Douché and Willcox 2018, pp. 47–50, table 1, Results and fig. 5","note":"Primary reanalysis with revised AW1 and AW2 phasing and secure context filter, partially overlapping the earlier samples and team."},{"url":"https://www.willcoxpages.fr/pdf/WillcoxTannoVHA2012.pdf","locator":"Tanno and Willcox 2012, p. 113, Aswad and Ramad discussion","note":"Earlier estimate placed domestic forms in the earliest samples. The later study specifically revises the substantial domestic-type share from AW1 to AW2."},{"url":"https://www.journals.uchicago.edu/doi/10.1086/659307","locator":"Zeder 2011, Cereals","note":"Older synthesis gives about 35% non-shattering barley across a rounded context span. It is not an independent sample or the scope of the revised AW2 result."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"The secure-context reanalysis revises older chronology and proportion, with wild types predominant and no origin claim.","verdict":"accept"},{"id":"artificial-basin-irrigation-nile-valley","name":"Artificial basin irrigation, Nile valley","date":"by c. 3100 BCE","frozen_date":"by c. 3100 BCE","lane":"olives","region":"africa","domain":"food","outcome":"deferred","finding":"Refined the existing Scorpion macehead witness with its original publication and the competing interpretation. Natural flood-recession cultivation is a plausible local precursor, but the read evidence does not date a specific precursor practice tied to the carved canal scene. It identifies neither a constructed basin system at c. 3100 BCE nor conveyance from Mesopotamia. Regional canal parallels are out of scope as ancestry.","next":"Find Willems (2012), The Physical and Cultic Landscape of the Northern Nile Delta according to Pyramid Texts Utterance 625, pp. 1101–1107, and identify the exact Niuserre relief or reconstruction. Seek archaeologically dated local flood works or cultivation with site-level stratigraphy.","sources":[{"url":"https://petrieproject.com/book/hierakonpolis-part-i","locator":"pp. 9–10, note to Pl. XXVIc, drawing and photo plate","note":"Original object publication reads the carving as inauguration of an irrigation canal."},{"url":"https://www.ashmolean.org/egypt-and-its-origins-gallery","locator":"AN1896-1908.E.3632, Mace-head of Scorpion King","note":"Holding museum reads an irrigation canal. This is another reading of the same carved evidence."},{"url":"http://www.econ.yale.edu/~egcenter/manning-2012.pdf","locator":"Section 4, Irrigation","note":"Repository excerpt preserves the draft wording and approximate date. Live original was unavailable."},{"url":"https://www.inlibra.com/document/download/pdf/uuid/486029aa-9cbf-38b8-83f4-dffa90a07aa9?page=1&toc=5723285","locator":"Section 1, pp. 259–260 and n. 12","note":"Discusses Schenkel's objection and cites a different witness, Niuserre's Fifth Dynasty scene. Authors differentiate local basins from later large systems."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Accept improved attribution and explicit dispute; separate canal depiction is not evidence of a constructed basin network at 3100 BCE. No transmission connection is supported.","verdict":"accept"},{"id":"gesher-recurrent-fire-use","name":"Gesher Benot Ya‘aqov recurrent fire use","date":"approximately 0.78–0.79 million years ago","frozen_date":"approximately 0.78–0.79 million years ago","lane":"olives","region":"asia","domain":"energy","outcome":"candidate","finding":"Proposed a bounded Level 1 fuel procurement instance and a candidate uses_process relationship on the existing recurrent-fire event. Allué and colleagues interpret available lakeshore deadwood or driftwood as fuel. The newly measured charcoal and the earlier flint are different materials from one excavation horizon. The exact procurement mechanism and a site-wide inference remain open. Earlier Wonderwerk burning and later Barnham ignition indications provide chronologically distant comparisons without local transmission.","next":"Independent analysis of the mapped charcoal, including adjacent horizons and unburnt controls, could distinguish fuel collected by hominins from spatially concentrated natural wood or transported charcoal.","sources":[{"url":"https://www.researchgate.net/publication/405546157_Paleoenvironmental_and_behavioral_insights_into_firewood_selection_by_early_Middle_Pleistocene_hominins","locator":"Sections 2–4, Table 1 and Figs. 2–3, DOI 10.1016/j.quascirev.2026.109973","note":"266 charcoal fragments from Layer II-6 Level 1, 188 identified. Charcoal and unburnt wood have common ash and olive but differing distributions."},{"url":"https://doi.org/10.1016/j.quascirev.2008.06.009","locator":"Table 1 and section 3","note":"Documents localized burnt flint in the eight horizons. Its Level 1 inventory is reused in the charcoal comparison."},{"url":"https://doi.org/10.1038/s41586-025-09855-6","locator":"Introduction and Barnham site context","note":"Independent archaeology concerns fire-making at a different, later site. It supplies a comparison for evidence of ignition, with no claim about Gesher procurement."}],"graph_status_before":"candidate","graph_status":"candidate","after":{},"connections":[{"from":"gesher-inferred-firewood-gathering","to":"gesher-recurrent-fire-use","type":"uses_process","decision":"new-candidate","edges":[{"from":"gesher-inferred-firewood-gathering","to":"gesher-recurrent-fire-use","type":"uses_process","from_event":"level-one-charcoal","to_event":"fire-traces","before":"absent","after":"candidate","statement":"Did hominins sustain the Level 1 fires with wood gathered along the palaeo-Lake Hula shore?","scope":"Gesher Benot Ya‘aqov, Layer II-6 Level 1, one of the eight fire horizons.","caveats":"Charcoal and burnt flint distributions do not precisely coincide. The source analyses one horizon and has investigators in common with the earlier Gesher fire studies.","evidence":[{"source":"allue-2026-gesher-firewood","locator":"Table 1, Fig. 2B and section 4, pp. 5–7","supports":"Compares burnt and unburnt wood and maps the charcoal against the older Level 1 flint inventory."},{"source":"alperson-afil-2008-gesher-fire-levels","locator":"Table 1, Layer II-6 L-1","supports":"Documents the earlier burnt-flint counts in the same horizon."}]}]}],"incident_causal_edges":[{"from":"gesher-inferred-firewood-gathering","to":"gesher-recurrent-fire-use","type":"uses_process","from_event":"level-one-charcoal","to_event":"fire-traces","before":"absent","after":"candidate","statement":"Did hominins sustain the Level 1 fires with wood gathered along the palaeo-Lake Hula shore?","scope":"Gesher Benot Ya‘aqov, Layer II-6 Level 1, one of the eight fire horizons.","caveats":"Charcoal and burnt flint distributions do not precisely coincide. The source analyses one horizon and has investigators in common with the earlier Gesher fire studies.","evidence":[{"source":"allue-2026-gesher-firewood","locator":"Table 1, Fig. 2B and section 4, pp. 5–7","supports":"Compares burnt and unburnt wood and maps the charcoal against the older Level 1 flint inventory."},{"source":"alperson-afil-2008-gesher-fire-levels","locator":"Table 1, Layer II-6 L-1","supports":"Documents the earlier burnt-flint counts in the same horizon."}]},{"from":"gesher-recurrent-fire-use","to":"gesher-fish-cooking-inference","type":"uses_process","from_event":"fire-traces","to_event":"documented-evidence","before":"candidate","after":"candidate","statement":"Did hominins use the recurring fires identified in Area B to cook fish?","scope":"Gesher Benot Ya‘aqov, Area B Layer II-6 levels 1–7, including 4b.","caveats":"The hotspot tests measure clustering within the fish assemblage. Spatial overlap with burnt flint is shown in density maps, often using finds recorded by excavation unit. A separate assessment of the thermal and spatial evidence for cooking is still needed. The charcoal measurements add a separate material, while the Level 1 fish and flint are drawn from the earlier assemblages.","evidence":[{"source":"alperson-afil-2008-gesher-fire-levels","locator":"Table 1, section 3 and Fig. 2","supports":"The eight horizons with burnt-flint clusters match the stratigraphic scope of the fish study."},{"source":"zohar-2022-gesher-fish-cooking","locator":"Figs. 4–5, Discussion and Supplementary Text E","supports":"The authors infer cooking from the heating comparison and spatial overlap. They consider the alternative of consumption of raw or dried fish followed by disposal into a fire."},{"source":"allue-2026-gesher-firewood","locator":"Fig. 2B–C and section 4, p. 6","supports":"The authors interpret spatial overlap of charcoal and fish teeth at Level 1 as further support for cooking and acknowledge that taxon-specific implications remain unresolved."}]}],"rationale":"Candidate local fuel-process question is bounded to Level 1; the charcoal measurement is a separate material but shares site, researchers and horizon with earlier fire work.","verdict":"accept"},{"id":"gesher-fish-cooking-inference","name":"Gesher Benot Ya‘aqov inferred fish cooking","date":"About 780,000 years ago","frozen_date":"About 780,000 years ago","lane":"olives","region":"asia","domain":"food","outcome":"candidate","finding":"Retained the local fire-to-cooking candidate and added a narrow Level 1 evidence comparison. The separate charcoal data overlap with fish remains, while the earlier fish and burnt-flint inventories are shared. The new paper attributes the overlap to cooking, but provides neither an independent test of intentional heating nor cooking apparatus. No separate evidence identifies the fishing equipment or a later direct descendant.","next":"Test site-unit-level charcoal, tooth heat signatures and burnt versus unburnt flint under a shared sampling model. An independent cyprinid experiment comparing incidental reheating with intentional cooking would inform interpretation.","sources":[{"url":"https://www.nature.com/articles/s41559-022-01910-z","locator":"Figs. 4–5 and Supplementary Texts D–E","note":"Experimental tooth alteration and contextual associations inform the original cooking inference."},{"url":"https://www.researchgate.net/publication/405546157_Paleoenvironmental_and_behavioral_insights_into_firewood_selection_by_early_Middle_Pleistocene_hominins","locator":"Fig. 2B–C and section 4, p. 6","note":"New charcoal measurements are physically distinct. Fish and flint data are from earlier studies. The exact charcoal/flint locations differ and the fish association concerns Level 1 only."}],"graph_status_before":"candidate","graph_status":"candidate","after":{},"connections":[{"from":"gesher-recurrent-fire-use","to":"gesher-fish-cooking-inference","type":"uses_process","decision":"existing-candidate","edges":[{"from":"gesher-recurrent-fire-use","to":"gesher-fish-cooking-inference","type":"uses_process","from_event":"fire-traces","to_event":"documented-evidence","before":"candidate","after":"candidate","statement":"Did hominins use the recurring fires identified in Area B to cook fish?","scope":"Gesher Benot Ya‘aqov, Area B Layer II-6 levels 1–7, including 4b.","caveats":"The hotspot tests measure clustering within the fish assemblage. Spatial overlap with burnt flint is shown in density maps, often using finds recorded by excavation unit. A separate assessment of the thermal and spatial evidence for cooking is still needed. The charcoal measurements add a separate material, while the Level 1 fish and flint are drawn from the earlier assemblages.","evidence":[{"source":"alperson-afil-2008-gesher-fire-levels","locator":"Table 1, section 3 and Fig. 2","supports":"The eight horizons with burnt-flint clusters match the stratigraphic scope of the fish study."},{"source":"zohar-2022-gesher-fish-cooking","locator":"Figs. 4–5, Discussion and Supplementary Text E","supports":"The authors infer cooking from the heating comparison and spatial overlap. They consider the alternative of consumption of raw or dried fish followed by disposal into a fire."},{"source":"allue-2026-gesher-firewood","locator":"Fig. 2B–C and section 4, p. 6","supports":"The authors interpret spatial overlap of charcoal and fish teeth at Level 1 as further support for cooking and acknowledge that taxon-specific implications remain unresolved."}]}]}],"incident_causal_edges":[{"from":"gesher-recurrent-fire-use","to":"gesher-fish-cooking-inference","type":"uses_process","from_event":"fire-traces","to_event":"documented-evidence","before":"candidate","after":"candidate","statement":"Did hominins use the recurring fires identified in Area B to cook fish?","scope":"Gesher Benot Ya‘aqov, Area B Layer II-6 levels 1–7, including 4b.","caveats":"The hotspot tests measure clustering within the fish assemblage. Spatial overlap with burnt flint is shown in density maps, often using finds recorded by excavation unit. A separate assessment of the thermal and spatial evidence for cooking is still needed. The charcoal measurements add a separate material, while the Level 1 fish and flint are drawn from the earlier assemblages.","evidence":[{"source":"alperson-afil-2008-gesher-fire-levels","locator":"Table 1, section 3 and Fig. 2","supports":"The eight horizons with burnt-flint clusters match the stratigraphic scope of the fish study."},{"source":"zohar-2022-gesher-fish-cooking","locator":"Figs. 4–5, Discussion and Supplementary Text E","supports":"The authors infer cooking from the heating comparison and spatial overlap. They consider the alternative of consumption of raw or dried fish followed by disposal into a fire."},{"source":"allue-2026-gesher-firewood","locator":"Fig. 2B–C and section 4, p. 6","supports":"The authors interpret spatial overlap of charcoal and fish teeth at Level 1 as further support for cooking and acknowledge that taxon-specific implications remain unresolved."}]}],"rationale":"Retained local fire-to-cooking question; charcoal overlap is additional observation rather than independent proof of intentional cooking.","verdict":"accept"},{"id":"hishuley-carmel-preserved-olives","name":"Hishuley Carmel preserved olives","date":"Approximately 6700–6400 years BP","frozen_date":"Approximately 6700–6400 years BP","lane":"olives","region":"asia","domain":"food","outcome":"deferred","finding":"Expanded the existing occurrence with the two structures, experimental feasibility of seawater fermentation and the alternate dry-salt interpretation. Kfar Samir oil residues serve as a different processing comparison. The proposed Nahal Mearot salt basins are about 12 km away and have neither a directly associated date nor a secure salt signature or supply link. The study considers plot-and-berm agriculture as an alternative. The role of local wild trees or cultivation remains open.","next":"Target intact basins and adjacent deposits at Nahal Mearot for secure dating, controls for post-submergence salts and evidence for function. A shared distribution context or direct compositional tracer would be needed to test supply to Hishuley Carmel.","sources":[{"url":"https://www.researchgate.net/publication/348790332_Early_production_of_table_olives_at_a_mid-7th_millennium_BP_submerged_site_off_the_Carmel_coast_Israel","locator":"Results, Figs. 6 and 8; Discussion, function of the Hishuley Carmel structures","note":"Excavated deposits, pit fragmentation and experimental feasibility. Natural coastal pools and seawater are possibilities. Comparative structures at Kfar Samir differ."},{"url":"https://www.mdpi.com/2073-4395/11/11/2187","locator":"Sections 2.1 and 5 and Fig. 7","note":"New geometric analysis spans shapes similar to wild and modern cultivated fruit. Same excavated site and some shared authors."},{"url":"https://www.mdpi.com/2077-1312/14/15/1422","locator":"Sections 5.3–5.4 and 6, Fig. 13","note":"A new nearby assemblage with lead investigator in common. Date is conditional on paleo-shoreline inference and assumed purpose. Initial sediment analyses gave no definitive salt-production indicator."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Accept attributed curing hypothesis and clearly modern experiments; no source-of-salt link is established.","verdict":"accept"},{"id":"kfar-samir-olive-oil-extraction","name":"Kfar Samir olive oil extraction","date":"About 7500–7000 years BP","frozen_date":"About 7500–7000 years BP","lane":"olives","region":"asia","domain":"food","outcome":"candidate","finding":"Linked the original assemblage report to the existing oil-extraction event and proposed a distinct basketry node and a candidate companion_of relationship asking whether KS 2 was part of the local oil-processing equipment. The observed alternate pair-twining, olive-bearing pit and site dating are separate evidence from the inferred processing function. Neither pit 6's loose reed or straw nor the basket analogy fixes the processing sequence or demonstrates that this particular basket extracted oil. Ein Zippori vessel residues independently support regional early oil use but do not trace production to Kfar Samir. Later Levantine rock-cut installations do not establish descent.","next":"Establish whether the Fig. 5 object and catalogued KS 2 can be securely matched in the field records. Seek contextual dating of the basket and fibre-level traces or residues that would distinguish oil processing from storage and discard.","sources":[{"url":"https://www.researchgate.net/publication/248578882_Evidence_for_Earliest_OliveOil_Production_in_Submerged_Settlements_off_the_Carmel_Coast_Israel","locator":"The archaeological findings and Discussion, pp. 1143–1147, Figs. 1–2, 5 and 7","note":"Original excavation contexts, olive pulp and fragmented stones, possible strainers and analogies. DOI 10.1006/jasc.1997.0193."},{"url":"https://www.mdpi.com/1999-4907/14/12/2373","locator":"Section 3.2, KS 2, Fig. 7 and Table 1","note":"Technical documentation of three basket fragments and associated olive stones. Original oil-processing analogy cites Galili et al. 1997. Site chronology only."},{"url":"https://www.tandfonline.com/doi/abs/10.1080/07929978.2014.960733","locator":"Abstract and methods","note":"Separate residue study at Ein Zippori. Addresses oil in vessel ceramics, not a Kfar Samir source or basket use."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"kfar-samir-pair-twined-basketry","to":"kfar-samir-olive-oil-extraction","type":"companion_of","decision":"new-candidate","edges":[{"from":"kfar-samir-pair-twined-basketry","to":"kfar-samir-olive-oil-extraction","type":"companion_of","from_event":"ks2-basket-fragments","to_event":"documented-evidence","before":"absent","after":"candidate","statement":"Might the KS 2 pair-twined basket have formed part of the local equipment for olive-oil extraction?","scope":"Kfar Samir, central sector. The basket's age derives from the site chronology.","caveats":"The function remains inferred. Separate plant fragments from pit 6 cannot be assigned to the KS 2 basket. The later study cites the original excavation interpretation.","evidence":[{"source":"rosenberg-2023-carmel-wood-and-basketry","locator":"Section 3.2, KS 2, Fig. 7 and Table 1","supports":"Documents the basket, find context, proposed function and indirect date."},{"source":"galili-1997-kfar-samir-oil-excavation","locator":"Discussion and conclusions, Fig. 5","supports":"Uses a later olive-pressing basket as an analogy for ancient basketry found at the site."}]}]}],"incident_causal_edges":[],"rationale":"Pit evidence and inferred oil extraction are supported; the basket function is a candidate, with object identity and use in pit 6 unresolved.","verdict":"accept"},{"id":"olive-and-fig-horticulture-in-the-jordan-valley","name":"Olive and fig horticulture in the Jordan Valley","date":"c. 7000 years ago (c. 5050 BCE)","frozen_date":"c. 7000 years ago (c. 5050 BCE)","lane":"olives","region":"asia","domain":"food","outcome":"deferred","finding":"Added a direct assay of the young Area C olive branch to the existing Tel Tsaf occurrence. It is a new sample-level date supporting the same local horticulture interpretation. The 2024 synthesis's proposed source areas on the Carmel coast or Galilee do not identify a source orchard. The Hishuley sample is younger and Kfar Samir oil waste does not establish cultivation or transfer to Tel Tsaf. Pella provides separate regional evidence of olive exploitation and processing.","next":"Compare contemporaneous coastal and inland assemblages with direct dates and multiple independent indicators of cultivation. Test whether young olive wood and local natural range make imported fuel or transported branches distinguishable from local orchards.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9076912/","locator":"Abstract and Discussion","note":"Original charcoal identification and inferred cultivation outside the olive's wild range. The pruning link is an interpretation of twig age."},{"url":"https://www.academia.edu/121002056/The_core_area_of_fruit_tree_cultivation_central_Jordan_Valley_Levant_ca_7000_BP_Langgut_2024_PALYNOLOGY","locator":"Section 3.1, Table 2 and Fig. 3","note":"Same lead author's synthesis adds the direct olive branch date and repeats the 2022 fig twig date. Regional transfer is hypothesized. DOI 10.1080/01916122.2024.2347905."},{"url":"https://research-repository.uwa.edu.au/en/publications/bronze-age-olive-domestication-in-the-north-jordan-valley-new-mor/","locator":"Abstract","note":"Independent Pella project reports olive exploitation and possible pressing evidence at another Jordan Valley site. Abstract provides regional comparison without an exchange or transmission route."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"A directly dated olive branch complements the previously dated fig twig; route and specific coastal source remain open.","verdict":"accept"},{"id":"ounjougou-ravin-de-la-mouche-pottery","name":"Ounjougou early ceramic vessels","date":"Before 9400 calibrated BCE","frozen_date":"Before 9400 calibrated BCE","lane":"ferment","region":"africa","domain":"materials","outcome":"deferred","finding":"Updated original context evidence. HA1 material was redeposited before 9400 cal BCE. The oldest vessel contents, prerequisite and later diffusion remain unresolved.","next":"Find residues or use-wear from secure early vessel fragments and compare fabrics and forming sequences at the earliest dated West African and Saharan sites.","sources":[{"url":"https://access.archive-ouverte.unige.ch/access/metadata/ca1d70c2-47ed-48cf-a5c4-2986b072acb8/download","locator":"pp. 909–915, Figs. 1, 3–5","note":"Original excavation. The 2020 synthesis describes the same HA1 material."},{"url":"https://www.sciencedirect.com/science/article/pii/S0031018209000911","locator":"Ravin de la Mouche stratigraphy and interpretation","note":"Overlapping mission and sedimentary sequence. Environmental phytoliths support a landscape reconstruction, whereas cereal cooking remains hypothetical."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Original Huysecom 2009 pp. 909–911 describes three HA1 sherds, redeposited before the overlying dated units, bowl form and sparse evidence; function and diffusion appropriately unresolved. The 2020 synthesis is the same excavation, not an independent sample.","verdict":"accept"},{"id":"beer-brewing-late-uruk-godin-tepe-central-zagros","name":"Possible beer in a Late Uruk jug at Godin Tepe","date":"ca. 3500–2900 BCE, original Period V assignment","frozen_date":"late Uruk period, ca. 3500–3200 BCE","lane":"ferment","region":"asia","domain":"food","outcome":"deferred","finding":"Replaced the strong beer identification with an attributed hypothesis and documented the original assay and period assignment. A local fabric for a comparable jar and uncertainty about the residue rule out a demonstrated import or wheel-coiling prerequisite.","next":"Locate the Royal Ontario Museum specimen and sample record and reassess the residue and manufacturing marks.","sources":[{"url":"https://www.biomolecular-archaeology.com/wp-content/uploads/2010/04/firstwinebeeranalytchem.pdf","locator":"pp. 409A and 412A–413A","note":"Primary test, same authors as 1992 Nature letter DOI 10.1038/360024b0, whose full text was inaccessible."},{"url":"https://www.academia.edu/26539639/A_view_from_the_east_The_Godin_VI_Oval_and_the_Uruk_Sphere","locator":"Fig. 5 and §7, p. 843","note":"Independent analysis of a comparable shape, with no sample crosswalk to the oxalate-tested jug."},{"url":"https://www.journals.uchicago.edu/doi/10.1086/716610","locator":"Direct Evidence for Prehistoric Fermented Beverages","note":"Independent assessment of marker specificity."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"potters-wheel-in-mesopotamia","to":"beer-brewing-late-uruk-godin-tepe-central-zagros","type":"uses_process","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"1993 original pp. 409A, 412A–413A gives period V range, oxalate positive, controls and contextual barley inference; independent Craig warns oxalate and spot test are nonspecific. Local-clay GOT_20 is a different specimen, so no wheel manufacture or local brewing identified.","verdict":"accept"},{"id":"grape-wine-making-kvemo-kartli-georgia","name":"Grape wine making, Kvemo Kartli, Georgia","date":"ca. 6000–5800 BC","frozen_date":"ca. 6000–5800 BC","lane":"ferment","region":"asia","domain":"food","outcome":"deferred","finding":"Qualified the grape-wine attribution. Chemical analyses and regional grape evidence support a likely interpretation. They cannot isolate fermentation inside any particular jar or trace the manufacturing knowledge to a catalogue community.","next":"Compare uncontaminated jar sherds and soil controls using additional biomarkers, identify the jar-forming sequence, and seek archaeological traces identifying use stages.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5715782/","locator":"Pottery Prerequisites; Results and Discussion; Table 1","note":"Original analyses with site controls and archaeological context."},{"url":"https://doi.org/10.1080/20548923.2020.1738728","locator":"Tartaric acid and Zamostje 2 controls","note":"Independent study on different samples challenges marker specificity."},{"url":"https://www.persee.fr/doc/paleo_0153-9345_2008_num_34_2_5258","locator":"Shulaveri-Shomu pottery phase descriptions","note":"Original regional ceramic observations describe handmade local clay wares. No sampled wine-vessel paste cross-match."},{"url":"https://www.sciencedirect.com/science/article/abs/pii/S0305440310004115","locator":"Areni-1 context and residue analysis","note":"Later independent Caucasian wine evidence on different specimens, with no demonstrated chain from Georgia."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","to":"grape-wine-making-kvemo-kartli-georgia","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"McGovern 2017 tests pottery and controls in two sites, interprets organic acids with environmental context as wine; Drieu on other samples questions tartaric-acid specificity. Wording now keeps fermentation and individual use uncertain; no unsupported transmission edge.","verdict":"accept"},{"id":"jiahu-fermented-beverage","name":"Jiahu mixed fermented beverage","date":"Approximately 7000–5500 BCE, sampled Jiahu contexts","frozen_date":"Approximately 7000–5500 BCE, sampled Jiahu contexts","lane":"ferment","region":"asia","domain":"food","outcome":"deferred","finding":"Added a dated event for distinct microfossil evidence of saccharification, and placed the archaeological observations at the registered Jiahu site. The 2026 and 2004 interpretations use different methods. Coauthor Juzhong Zhang and at least context T14H32 overlap. The same individual sherd has not been identified.","next":"Find independently analysed Jiahu sherds with paired molecular and microfossil data and establish a dated distribution of diagnostic brewing vessel forms.","sources":[{"url":"https://mdpi-res.com/d_attachment/heritage/heritage-09-00335/article_deploy/heritage-09-00335.pdf","locator":"§§2.2, 3.1, 5.1–5.3, Table S2"},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC539767/","locator":"An Early Neolithic Mixed Fermented Beverage, Materials and Methods, note 10","note":"Chemical assays and finds from multiple site phases; note 10 lists context T14/H32. The context labels occur under different phase numbering. No direct chronological alignment of the whole sample sets is assumed."},{"url":"https://www.cambridge.org/core/journals/antiquity/article/abs/lijiagou-and-the-earliest-pottery-in-henan-province-china/DEB39062CB84B123C53A712866305801","locator":"Abstract and stratigraphic ceramic comparison","note":"Lijiagou predates Jiahu pottery in Henan. Distinct archaeological site and no documented transfer to the Jiahu beverage makers."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"xianrendong-early-pottery","to":"jiahu-fermented-beverage","type":"transmitted_from","decision":"deferred","edges":[]},{"from":"jiahu-fermented-beverage","to":"mould-starter-qu-fermentation-in-early-neolithic-north-china","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"McGovern 2004 provides chemical interpretation. Liu 2026 §§2–3,5 and supplementary Table S2 provides separate microfossil study and context dates; shared author and context mean individual sherd independence is unresolved. Site location and qualified event are supported; no continuity edge.","verdict":"accept"},{"id":"mould-starter-qu-fermentation-in-early-neolithic-north-china","name":"Mould-starter (qu) fermentation in Early Neolithic north China","date":"between c. 5850 and c. 4950 BCE","frozen_date":"between c. 5850 and c. 4950 BCE","lane":"ferment","region":"asia","domain":"food","outcome":"deferred","finding":"Retained the separate Guantaoyuan practice and changed its origin from first known to unknown. Earlier inferred mould-starter brewing at Shangshan and Jiahu makes the earlier priority label untenable. The shared researcher and analytical approach limit independence of interpretations, although the sites and specimens differ.","next":"Identify diagnostic vessel-making or preparation traits in dated intermediate contexts and test fungal identification by an independent analytic method.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6600912/","locator":"Introduction and Discussion","note":"Original Guantaoyuan and Lingkou study, separate site assemblages and different proposed methods."},{"url":"https://www.pnas.org/doi/pdf/10.1073/pnas.2412274121","locator":"Abstract, Results and Table 1"},{"url":"https://mdpi-res.com/d_attachment/heritage/heritage-09-00335/article_deploy/heritage-09-00335.pdf","locator":"§§5.1 and 5.3","note":"Proposes a regional route without demonstrating a carrier, and does not establish any site-to-site transfer."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"jiahu-fermented-beverage","to":"mould-starter-qu-fermentation-in-early-neolithic-north-china","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Repair attributes mould-starter interpretation to researchers, removes unsupported priority, and leaves continuity unresolved. Liu 2019 Discussion supports the qualified summary; later studies report earlier separately sampled site interpretations, not a demonstrated route.","verdict":"accept"},{"id":"potters-wheel-in-mesopotamia","name":"Potter's wheel in Mesopotamia","date":"around 3900–3800 BCE","frozen_date":"around 3900–3800 BCE","lane":"ferment","region":"asia","domain":"materials","outcome":"candidate","finding":"Added a candidate for development from the earlier possible potting turntable at Tell Feres, a genuinely separate Late Ubaid workshop artefact. Kept the later LC2 wheel-coiling dated with diagnostic traces. A gap in documented devices prevents concluding dependence. Earlier Levantine wheel-coiling has clear evidence but no demonstrated route into Mesopotamia.","next":"Look for dated intermediate pivot or bearing wear and transverse sections on intermediate sherds at Tell Feres and comparable northern Mesopotamian workshops.","sources":[{"url":"https://artefacts-discovery.researcher.life/full_text/DA-2/7b/7bbe026bf8b0336b8cb87069f18f5ccf/full_text/0364c4085d24d66881580f4bf2ec0c3c.pdf","locator":"Tell Feres case study; Figs. 2–4; Conclusion"},{"url":"https://www.academia.edu/9024676/Ceramic_production_and_management_of_the_fire_between_late_Ubaid_and_LC1_The_potter_s_kilns_of_Tell_Feres_al_Sharqi","locator":"pp. 189–190, Level 10 workshop","note":"Same excavation and author lineage, new observations about the workshop equipment."},{"url":"https://iansa.eu/papers/IANSA-2021-02-baldi.pdf","locator":"pp. 193–196, Discussion and Conclusion","note":"Reuses Tell Feres and adds other sites. Discusses hypotheses for development and exchange."},{"url":"https://www.persee.fr/doc/paleo_0153-9345_1997_num_23_1_4643","locator":"Microfabric and macrotrace observations of Abu Hamid bowls","note":"Distinct Late Chalcolithic southern Levant assemblage. Establishes the comparison and cannot trace a transfer."}],"graph_status_before":"open","graph_status":"candidate","after":{},"connections":[{"from":"possible-potting-turntable-at-tell-feres","to":"potters-wheel-in-mesopotamia","type":"builds_on","decision":"new-candidate","edges":[{"from":"possible-potting-turntable-at-tell-feres","to":"potters-wheel-in-mesopotamia","type":"builds_on","from_event":"level-10-clay-disc","to_event":"archaeological-evidence-3800bce","before":"absent","after":"candidate","statement":"Did the use of pivoted pottery supports in the Late Ubaid workshop contribute to the later introduction of wheel-coiling at Tell Feres?","caveats":"The reports describe a possible early rotary support and diagnostic wheel-coiled bowls at the same site, several centuries apart. The excavators cannot trace use through the intervening stages or identify an inherited tool design.","evidence":[{"source":"baldi-roux-2016-wheel-coiling-comparison","locator":"Tell Feres case study and Fig. 2","supports":"Distinguishes a possible early pivot-mounted disc from later shaping by rotary kinetic energy."},{"source":"baldi-2021-how-uruk-potters","locator":"Conclusion, pp. 195–196","supports":"Raises Ubaid rotary devices as a predecessor to investigate. The article does not demonstrate continuity from a particular device."}]}]},{"from":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","to":"potters-wheel-in-mesopotamia","type":"builds_on","decision":"deferred","edges":[]}],"incident_causal_edges":[{"from":"possible-potting-turntable-at-tell-feres","to":"potters-wheel-in-mesopotamia","type":"builds_on","from_event":"level-10-clay-disc","to_event":"archaeological-evidence-3800bce","before":"absent","after":"candidate","statement":"Did the use of pivoted pottery supports in the Late Ubaid workshop contribute to the later introduction of wheel-coiling at Tell Feres?","caveats":"The reports describe a possible early rotary support and diagnostic wheel-coiled bowls at the same site, several centuries apart. The excavators cannot trace use through the intervening stages or identify an inherited tool design.","evidence":[{"source":"baldi-roux-2016-wheel-coiling-comparison","locator":"Tell Feres case study and Fig. 2","supports":"Distinguishes a possible early pivot-mounted disc from later shaping by rotary kinetic energy."},{"source":"baldi-2021-how-uruk-potters","locator":"Conclusion, pp. 195–196","supports":"Raises Ubaid rotary devices as a predecessor to investigate. The article does not demonstrate continuity from a particular device."}]}],"rationale":"Baldi and Roux 2016 Tell Feres case documents late Ubaid possible pivoted disc and much later LC2 wheel-coiled bowls. Candidate builds_on question preserves the gap and does not assert causal continuity. Baldi 2021 shares author and data and is not independent evidence of that causal relation.","verdict":"accept"},{"id":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","name":"Pottery in Neolithic Upper Mesopotamia and the northern Levant","date":"around 7000 BCE","frozen_date":"around 7000 BCE","lane":"ferment","region":"asia","domain":"materials","outcome":"established","finding":"Proposed a distinct local dairy-handling record based on residues in dated pottery contexts. The companion relationship records local use together, as evidenced by the Grey Burnished Ware sherd SAB263. The earliest pottery assemblage at the site provides separate context. Manufacturing provenance and wider continuity remain unresolved.","next":"Add further independent evidence of local manufacture for Grey Burnished Ware and assigned vessel functions, and test the regional origin of the earliest wares.","sources":[{"url":"https://pure.rug.nl/ws/portalfiles/portal/2558823/2010AntiquityNieuwenhuyse.pdf","locator":"Abstract and stratigraphic pottery sequence","note":"Separate stratigraphic observations of earliest pottery."},{"url":"https://research-information.bris.ac.uk/ws/files/53678841/1_s2.0_S0305440315002769_main.pdf","locator":"Table 2 and §4.4","note":"Four dairy positives from different vessels. Reprinted later and partly included in the 2008 region-wide study. Those are not independent replicates."},{"url":"https://www.cambridge.org/core/journals/radiocarbon/article/tell-sabi-abyad-syria-an-interpretation-of-stable-isotope-values-of-faunal-bone-collagen/9EABC7B7159BFEE28BE5F8D5171B9A90","locator":"Abstract and Introduction","note":"Different material evidence for local husbandry; it does not prove a particular dairy use or species for the lipid samples."},{"url":"https://www.tandfonline.com/doi/full/10.1080/00758914.2018.1453213","locator":"Shir ceramic ware sequence","note":"Independent site sequence within the regional anchor. Early import indications do not identify a source or a wheel-coiling connection."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","to":"ruminant-dairy-use-in-pottery-at-tell-sabi-abyad","type":"companion_of","decision":"new-established","edges":[{"from":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","to":"ruminant-dairy-use-in-pottery-at-tell-sabi-abyad","type":"companion_of","from_event":"","to_event":"operation-iv-dairy-residue","before":"absent","after":"established","statement":"A Grey Burnished Ware sherd from the Early Pottery Neolithic at Tell Sabi Abyad preserves ruminant dairy lipids, documenting local use of a pottery vessel to hold a dairy product.","caveats":"The vessel’s manufacturing provenance, the specific dairy product, and any continuity from the earliest pottery at the site remain unresolved.","evidence":[{"source":"nieuwenhuyse-2010-earliest-tell-sabi-abyad-pottery","locator":"Abstract and earliest assemblage","supports":"Documents pottery at Tell Sabi Abyad in a separate, earlier excavated assemblage."},{"source":"nieuwenhuyse-2015-tell-sabi-abyad-pottery-lipids","locator":"Table 2, SAB263; §4.4","supports":"Identifies the specific vessel and dairy contact in its dated archaeological context."}]}]},{"from":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","to":"potters-wheel-in-mesopotamia","type":"builds_on","decision":"deferred","edges":[]},{"from":"pottery-in-neolithic-upper-mesopotamia-and-the-northern-levant","to":"grape-wine-making-kvemo-kartli-georgia","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Nieuwenhuyse 2010 original early Tell Sabi Abyad assemblage supports small well-made pottery and unresolved local or imported origin; Bartl 2023 supports Shir and regional date with site variability. New separate dairy record identifies much later local pottery contact rather than transmission from an early ware.","verdict":"accept"},{"id":"xianrendong-early-pottery","name":"Early pottery at Xianrendong Cave","date":"20,000–19,000 calibrated years BP","frozen_date":"20,000–19,000 calibrated years BP","lane":"ferment","region":"asia","domain":"materials","outcome":"deferred","finding":"Added site-specific forming evidence from the early slab-built ceramic assemblage. Cooking is possible from exterior marks, while no reviewed residue identifies a particular food or fermentation. Later cave sherds with coiling and paddle impressions are a useful comparison across the sequence; direct descent into Jiahu or Shangshan remains unresolved.","next":"Match stratigraphic units for later coiled vessels before dating the transition. Look for same-shard contents evidence and diagnostic manufacturing sequences at intermediate assemblages.","sources":[{"url":"https://www.academia.edu/1812663/Xiaohong_Wu_et_al_Early_Pottery_at_20_000_Years_Ago_in_Xianrendong_Cave_China","locator":"Wu et al. Science 336, pp. 1697–1699 and Table 1","note":"Original stratigraphic dating and remarks on scorch and soot."},{"url":"https://open.bu.edu/bitstreams/28ad71f1-7307-4af3-9b9a-2e72ea36c6cc/download","locator":"pp. 148–150 and Fig. 4-5","note":"Coauthor and overlapping site evidence. Additional detail on the manufacture marks and distinct forming stages."},{"url":"https://www.pnas.org/doi/10.1073/pnas.0900539106","locator":"Yuchanyan stratigraphic and radiocarbon study","note":"An independently excavated southern Chinese assemblage with some shared investigators; does not demonstrate diffusion."},{"url":"https://www.pnas.org/doi/pdf/10.1073/pnas.2412274121","locator":"Abstract and Results","note":"Later distinct Shangshan sample evidence, without a Xianrendong connection."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"xianrendong-early-pottery","to":"jiahu-fermented-beverage","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Wu 2012 and Arpin 2017 pp.148–150 support dated pottery contexts and slab and scraped sherds; repair describes local finds while leaving relationship to later traditions unresolved.","verdict":"accept"},{"id":"common-carp-aquaculture-at-jiahu-henan","name":"Common carp aquaculture at Jiahu, Henan","date":"Jiahu Period III (6200–5700 BCE)","frozen_date":"by c. 6000 BCE","lane":"eastasia","region":"asia","domain":"food","outcome":"deferred","finding":"Refined the Jiahu event with the full paper assigning the inference to Period III. The comparative fish-size method and sample proportions support possible management, with no dated structure or transfer from Jiahu to a later community. The modern rice-field comparison supplies a test case, and Jiahu rice use gives no evidence of integrated rice–fish farming.","next":"Compare excavation plans and faunal distributions for Period III with independent early finds or texts between Jiahu and later managed ponds.","sources":[{"url":"https://www.academia.edu/167862178/Common_carp_aquaculture_in_Neolithic_China_dates_back_8_000_years","locator":"Nakajima et al. (2019), pp. 1415–1417, Fig. 1b–d and 1i and Methods","note":"Uses excavated teeth and a modern comparative sample. The modern sample does not date ancient field or pond use."},{"url":"https://brill.com/view/journals/tpao/111/3-4/article-p353_4.pdf","locator":"Sterckx (2025), pp. 366–369 and 372–373","note":"Examines historical sources independently of the archaeological work. The earliest transmitted text attributed to Fan Li is preserved in the sixth-century Qimin yaoshu; a c. 500 BCE text date is unwarranted."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Source-based correction refines existing event; no evidence of inter-community continuity.","verdict":"accept"},{"id":"early-millet-exploitation-on-the-north-china-plain","name":"Early millet exploitation on the North China Plain","date":"c. 11,000 cal BP (c. 9050 BCE)","frozen_date":"c. 11,000 cal BP (c. 9050 BCE)","lane":"eastasia","region":"asia","domain":"food","outcome":"deferred","finding":"Added a dated macrobotanical witness for one Donghulin deposit with charred grains identified as foxtail millet. Starch and charred grain studies partly share personnel and excavations but examine different material. This supports early millet use without demonstrating how it led to later farming.","next":"Seek direct dates on the Donghulin grains and systematically screened intervening assemblages between the earliest grinding residues and larger village crop assemblages.","sources":[{"url":"https://www.researchgate.net/publication/356299065_Plant_remains_unearthed_at_the_Donghulin_site_in_Beijing_discussion_on_results_of_flotation","locator":"Zhao et al. (2020), Tables 2–4, pp. 103–104, sample BA07888","note":"A date on a seed from one millet-bearing deposit, not on the millet. Authors discuss possible displacement of small charred grains."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3309722/","locator":"Yang et al. (2012), Results and Discussion","note":"Studies ground-stone and pottery starch residues; some wild and domesticated reference material overlaps."},{"url":"https://doi.org/10.1086/659308","locator":"Zhao (2011), Xinglonggou discussion","note":"Reports directly dated charred millets identified morphologically at Xinglonggou, a later northeastern site with no measured continuity from Donghulin."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Distinct charcoal grain deposit complements earlier starch evidence without establishing cultivation continuity.","verdict":"accept"},{"id":"lower-yangtze-pig-management","name":"Lower Yangtze early pig management","date":"Site contexts approximately 8300–7000 cal BP (6350–5050 BCE)","frozen_date":"Site contexts approximately 8300–7000 cal BP (6350–5050 BCE)","lane":"eastasia","region":"asia","domain":"food","outcome":"candidate","finding":"Proposed a site-specific wetland cultivation record and a companion link asking whether cultivated rice or its processing remnants were used to feed managed pigs at Kuahuqiao. Pig calculus documents exposure to rice and prepared foods. Field source and deliberate feeding remain unresolved, and the candidate applies only to Kuahuqiao.","next":"Seek feeding contexts and phase-matched evidence linking a dated managed pig assemblage to rice or residues of rice processing from local cultivated plants.","sources":[{"url":"https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12184640/fullTextXML","locator":"Wang et al. (2025), Fig. 3; Discussion of intersite differences; SI Appendix Table S3","note":"Original dental calculus and metric evidence. Authors relate site differences to subsistence and environment. Rice residue identifies consumption, not field source or feeding arrangement."},{"url":"https://www.researchgate.net/publication/5945483_Fire_and_flood_management_of_coastal_swamp_enabled_first_rice_paddy_cultivation_in_east_China","locator":"Zong et al. (2007), pp. 459–461, Table 1 and Fig. 2","note":"Sediment-based evidence for a separate capability at one of the two sites. Earlier inferred alder clearance and barriers remain disputed or unexcavated."},{"url":"https://www.sciengine.com/doi/pdfView/62b25ca4e17b44ae8e354942bdae586e","locator":"Zheng et al. (2007), pp. 1655–1657 and Table 1","note":"Rice grains and husk remains complement sediment and dental samples, with overlap of some researchers between this study and the later pig study."},{"url":"https://doi.org/10.1016/j.palwor.2012.02.003","locator":"Shu et al. (2012), Abstract","note":"Separate observations contest which vegetation was burned. The abstract was the accessible part."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"kuahuqiao-wetland-rice-cultivation","to":"lower-yangtze-pig-management","type":"companion_of","decision":"new-candidate","edges":[{"from":"kuahuqiao-wetland-rice-cultivation","to":"lower-yangtze-pig-management","type":"companion_of","from_event":"wetland-cultivation-horizon","to_event":"documented-evidence","before":"absent","after":"candidate","statement":"At Kuahuqiao, did people use rice or rice-processing remnants from their wetland cultivation to feed the pigs they managed?","scope":"Kuahuqiao only. The receiving event also covers Jingtoushan.","evidence":[{"source":"zong-2007-kuahuqiao-wetland-cultivation","locator":"pp. 459–461, Table 1 and Fig. 2","supports":"Supports cultivation at Kuahuqiao in the studied wetland sequence."},{"source":"zheng-2007-kuahuqiao-rice-rachillae","locator":"pp. 1655–1657, Fig. 2 and Table 1","supports":"Provides a separate dataset of rice plant remains supporting cultivation at Kuahuqiao."},{"source":"wang-2025-yangtze-pig-management","locator":"Phytolith analysis, Fig. 3; Discussion of intersite differences; SI Appendix, Table S3","supports":"Rice phytoliths occur in three Kuahuqiao pig specimens. The authors associate stronger management at Kuahuqiao with its more intensive rice cultivation and distinguish provisioning from scavenging as possible explanations."}]}]}],"incident_causal_edges":[],"rationale":"Candidate question concerns a possible local integrated crop and pig feeding arrangement, not a developmental descent or an established connection.","verdict":"accept"},{"id":"shangshan-rice-domestication-traits","name":"Shangshan rice with domestication traits","date":"Approximately 9400 calibrated years BP (about 7450 BCE)","frozen_date":"Approximately 9400 calibrated years BP (about 7450 BCE)","lane":"eastasia","region":"asia","domain":"food","outcome":"deferred","finding":"Added a research question supported by directly inspected tool-use evidence. Stone-flake panicle harvesting at Shangshan is supported by separate use-wear and residue observations, but neither the different rice morphology samples nor the harvesting study ties it to emergence of the particular phytolith traits. Subsequent shifts towards stalk harvesting are evidence from later contexts, especially Hehuashan.","next":"Look for phase-matched harvesting tools and quantified, independently dated seed or spikelet populations with evidence of retained sowing stock.","sources":[{"url":"https://doi.org/10.1371/journal.pone.0278200","locator":"Wang et al. (2022), Figs. 6–8; Discussion","note":"SS-10 is a Shangshan specimen. The selective effect depends on seed retention for sowing and is inferred; the tool evidence focuses on technique."},{"url":"https://www.sciengine.com/doi/pdfView/62b25ca4e17b44ae8e354942bdae586e","locator":"Zheng et al. (2007), pp. 1657–1658, tionale":"The same radiocarbon specimen has traceable original context; it is not independent corroboration of seed size.","verdict":"accept"},{"id":"wet-rice-paddy-fields-lower-yangtze","name":"Wet-rice paddy fields, lower Yangtze","date":"c. 4300-4000 BCE","frozen_date":"c. 4300-4000 BCE","lane":"eastasia","region":"asia","domain":"food","outcome":"deferred","finding":"Added local context and an attributed explanation of engineered water management at Caoxieshan. Earlier Kuahuqiao wetland cultivation is a documented comparator, but its particular field engineering and transmission into the Lake Tai region are unproved. Tianluoshan’s excavated early horizons lack the comparable ditch-and-bund layout. At Maoshan and later Shiao, larger layouts document later regional practice. The existing Liangzhu city and Song-era Champa rice records add a regional urban and a much later seed-transmission comparison, respectively. None identifies the builders or users of these Late Majiabang fields as their source.","next":"Cross-match the Lake Tai field contexts against original plans and calibrated phases. Seek a shared local sequence showing how and where the small ditch-linked plots changed into later designs.","sources":[{"url":"https://openresearch-repository.anu.edu.au/bitstream/1885/127433/1/TA_19.pdf","locator":"Huang and Li (2003), pp. 164–169, Fig. 2 and Tables 1–2; conclusions","note":"Primary field-pit samples document local environmental change and an archaeological difference in field layout. Causal explanation is attributed to the researchers."},{"url":"https://doi.org/10.1016/j.jas.2009.09.026","locator":"Zheng et al. (2009), Table 1 and early-field morphology; accessible preprint at https://www.nature.com/articles/npre.2009.2853.1.pdf","note":"Tianluoshan field horizons have dates on associated seeds. No comparable irrigation infrastructure observed in the early phase."},{"url":"https://discovery.ucl.ac.uk/10205995/1/1-s2.0-S0277379125001131-main.pdf","locator":" fragments. The deposit was reworked and the two reigns cannot be assigned to individual objects. Independent find context from the mortuary kits."},{"url":"https://brill.com/display/book/9789004527690/front-1.pdf","locator":"List of illustrations, Figs. 143–145","note":"The catalog associates Saqqara 3471 with Djer and reproduces earlier excavation material. The inspected portion does not provide a direct tomb or saw date."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3780825/","locator":"Table 1 and Fig. 1","note":"Independent radiocarbon model estimates accessions for Djer and Djet. The model dates accessions, not deposition of the tools. The Djer–Djet interval is unusually long and the authors note a possible hiatus."},{"url":"https://www.metmuseum.org/art/collection/search/577298","locator":"Collection context, Meketre models","note":"The target record is a funerary portrayal of river travel. The physical record would require diagnostic tool traces to identify the specific woodworking technology."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Later functional Giza assemblage extends the existing toolkit record; no downstream object-specific dependence established.","verdict":"accept"},{"id":"lost-wax-casting-at-mehrgarh","name":"Lost-wax casting at Mehrgarh","date":"about 6,000 years ago (c. 4000 BCE)","frozen_date":"about 6,000 years ago (c. 4000 BCE)","lane":"minerals","region":"asia","domain":"materials","outcome":"deferred","finding":"Retained the amulet's date estimate and narrowed origin from first known to unknown. Naḥal Mishmar core-organic ages overlap the Mehrgarh find-area horizon. Different materials, production contexts and dating observables leave priority and transmission unresolved.","next":"Obtain a securely associated short-lived sample or production context for the analysed amulet, a feedstock provenance study, and intermediates with chronologically connected find contexts.","sources":[{"url":"https://www.nature.com/articles/ncomms13356","locator":"Fig. 1 and Results, Mehrgarh amulet","note":"Original imaging of the corroded amulet shows cast structure. Possible native copper is an inference from low impurity levels."},{"url":"https://www.imeko.info/publications/tc26-2025/IMEKO-Metroarchaeo-2025-063.pdf","locator":"§III.A, Table 1 and §IV","note":"Separately sampled Levantine objects, c. 4700–3800 BCE per the authors. The study explicitly warns against comparing core-organic dates and contextual ages as if equivalent."},{"url":"https://www.nature.com/articles/s40494-023-01029-9","locator":"Archaeological background, Fazael as production site, and Conclusions","note":"A separately documented Levantine settlement has evidence of local casting in the younger part of the overlap. The workshop interpretation draws on multiple lines of evidence. It does not identify a transfer route to or from Mehrgarh."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Priority and transmission are correctly deferred; narrowing origin is supported.","verdict":"accept"},{"id":"native-copper-working-at-cayonu-tepesi","name":"Native copper working at Çayönü Tepesi","date":"8200-7500 BC","frozen_date":"8200-7500 BC","lane":"minerals","region":"asia","domain":"materials","outcome":"deferred","finding":"The original excavators distinguish worked copper from worked malachite and locate the first clear artifacts in Grill Buildings and basal pits. Retained the 8200–7500 BCE comparative interval as approximate. Annealing and exact earliest calendar dating require a sample-to-context match, and neither nearby copper nor related material proves later smelting descended from Çayönü.","next":"Locate the Maddin et al. 1991 and 1999 metallographic specimen tables and cross-match excavator IDs with subphases and dated deposits.","sources":[{"url":"https://www.scribd.com/document/372776679/O-zdo gged ceramics and the pit morphology support a tentative installation design. The Feature 6 bone date is contextual."},{"url":"https://discovery.ucl.ac.uk/id/eprint/10134148/","locator":"Ch. 26, Tables 1–2, 6 and Fig. 12","note":"Ordinary-copper band C_P2/13 has annealing and working traces, with an associated Feature 3 date of 4493–4365 cal BCE. The manufacturing place of this individual object is unresolved."},{"url":"https://discovery.ucl.ac.uk/id/eprint/10134137/","locator":"Ch. 41, pp. 488–491, Table 3, Group 3 and Figs. 2–3; Group 3 comparison, Fig. 7 and Table 6; Fig. 15","note":"C_P2/13 is in the same dispersed lead-isotope group as B47/12/3 and B23/12. HDM1586 is a separate chisel that closely matches B47/12/3. Trace-element comparisons concern distinct high-purity copper foil P10/13. None of these comparisons identifies the source of tin-bronze foil 63. Chapters reuse specimens but compare separate finds from multiple excavations and the earlier reference data."}],"graph_status_before":"open","graph_status":"candidate","after":{},"connections":[{"from":"belovode-copper-smelting","to":"plocnik-worked-copper-ornament","type":"uses_process","decision":"new-candidate","edges":[{"from":"belovode-copper-smelting","to":"plocnik-worked-copper-ornament","type":"uses_process","from_event":"trench-eighteen-smelting-debris","to_event":"trench-twenty-four-copper-ring","before":"absent","after":"candidate","statement":"Did smelting at Belovode supply the copper used in the Pločnik band or ring C_P2/13?","scope":"Possible material supply from Belovode Feature 6, Trench 18, to one ordinary-copper artefact from Pločnik.","evidence":[{"source":"radivojevic-2021-vinca-copper-supply-networks","locator":"Table 3, Group 3 and Fig. 2","supports":"The report groups C_P2/13 with the residue samples B47/12/3 and B23/12."},{"source":"radivojevic-2021-belovode-metal-production","locator":"Figs. 2–3 and Tables 1–2","supports":"B23/12 and B47/12 residues are related to Feature 6 in the
