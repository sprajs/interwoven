<!doctype html>

<head>

  <title>Prehistory research wave</title>
  <style>
    :root { color-scheme: light dark; --font-size-base: 16px; --background: light-dark(#fbfaf7,#171d1c); --foreground: light-dark(#232d2c,#edf3f1); --muted: light-dark(#e1e6e2,#2d3b38); --muted-foreground: light-dark(#4a5855,#b5c2bf); --viz-series-1: light-dark(#21675b,#99c9bb) }
    body { margin: 24px auto; max-width: 780px; padding-inline: 16px; font: 400 var(--font-size-base)/1.5 system-ui,sans-serif; background: var(--background); color: var(--foreground) }
    h2,h3,p { margin: 0 }
    h2,h3 { font-weight: 500 }
    .viz-controls { display: flex; flex-wrap: wrap; gap: 12px }
    .form-label { display: grid; gap: 4px; min-width: 0; flex: 1 1 10rem }
    .form-select,.form-control { font: inherit; width: 100%; min-width: 0; box-sizing: border-box; padding: 6px }
    .text-small { font-size: .88em; color: var(--muted-foreground) }
    .tabular-nums { font-variant-numeric: tabular-nums }
    .progress { background: var(--muted); height: .625rem; overflow: hidden }
    .progress-bar { background: var(--viz-series-1); height: 100% }
    a { color: var(--viz-series-1) }
    summary { cursor: pointer }
  </style>
</head>

    #prehistory-wave-view li + li { margin-top: calc(var(--font-size-base)*.5) }

  <script type="application/json" data-wave-data>{"records":[{"id":"egyptian-hieroglyphic-writing","name":"Early Egyptian hieroglyphic writing","date":"Middle of the 34th century BCE, Naqada IIIA2 (approximate)","frozen_date":"around 3250 BCE","lane":"symbols","region":"africa","domain":"communication","outcome":"established","finding":"Tallet’s edition documents daily hieratic reports in Merer’s logbooks on papyrus. The specific catalogue comparison with the blank Hemaka roll is deferred because it is a separate object. The Abydos U-j bone and ivory tags supply a separately dated archaeological witness to the early sign system. The relationship of Egyptian writing to Uruk proto-cuneiform and the significance of separate painted marks on vessels remain open. Also proposes a distinct local receiver at Serabit el-Khadim. Several alphabetic signs there preserve recognizable Egyptian sign forms given Semitic consonantal values; an adapts link describes the graphic inheritance. The Temple of Hathor sphinx gives a local witness of the two scripts used on one object. The early Egyptian source record describes the sign repertoire, and a handoff from any individual Abydos object or a route from Serabit to Lachish remains unresolved.","next":"Assess a separately evidenced papyrus-making capability endpoint before linking it to subsequent use. For possible contact with Mesopotamian writing, find chronological and sign-level evidence connecting the specific writing practices.","sources":[{"url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/RedSea/WadiJarf-Tallet2017.pdf","locator":"Tallet 2017, PDF pp. 2, 5–8, 16 (cover summary and Annex I)","note":"The edition identifies the A and B fragments as two hieratic logbooks from late in Khufu’s reign. The translation preserves daily entries about Inspector Merer’s team."},{"url":"https://escholarship.org/content/qt1fh2r94g/qt1fh2r94g.pdf?t=sevdo4","locator":"Verhoeven 2023, June 2024 correction, abstract and Fig. 1 with accompanying text on Old Hieratic","note":"Separate author and a different fragment, Jarf BIV, with surviving writing and photograph. Verhoeven uses Tallet’s edition for its interpretation."},{"url":"https://www.persee.fr/doc/bsfe_0037-9379_2014_num_188_1_1208","locator":"Tallet 2014, p. 25","note":"The calendar bounds come from the excavator’s approximate dates for the whole reign of Khufu. The logs are dated late in the reign. Only part of the article was accessible."},{"url":"https://isac-idb-static.uchicago.edu/multimedia/88/oimp33.pdf","locator":"Dreyer 2011, pp. 127–128, 133–136, figs. 14.16–14.18","note":"Excavation witness, distinct from the later papyri. The excavator’s readings of early phonetic signs and the tags’ function are interpretive."},{"url":"https://doi.org/10.1017/S0033822200018579","locator":"Görsdorf, Dreyer and Hartung 1998, p. 641, Table 1 and conclusion","note":"Same excavation, distinct chronological evidence from the ceramics and wood samples. The wood offers a contextual date; the relative phase date is modeled."},{"url":"https://pluto.huji.ac.il/~orlygoldwasser/2006_AL_OGW.pdf","locator":"Goldwasser 2006, pp. 130–132, 140–141 and Table 13a–e (pp. 154–155)","note":"Original palaeographic comparison of separate Egyptian and Proto-Sinaitic signs. The eye sign is an example, with unresolved origins of individual variants."},{"url":"https://sites.utexas.edu/scripts/wp-content/uploads/sites/3428/2016/07/aren_2013.pdf","locator":"Wilson-Wright 2013, pp. 136–143, Figs. 1–6","note":"Original re-reading from sphinx and early photographs. Converges on the deity’s name while disputing readings of other signs."},{"url":"https://www.academia.edu/96844295/THE_PROTO_SINAITIC_INSCRIPTIONS_AT_SERABIT_EL_KHADIM_IN_THEIR_ARCHAEOLOGICAL_CONTEXT_DATE_AND_FUNCTION","locator":"Parker 2022, pp. 269–275, Figs. 1–4","note":"Stylistic and archaeological chronology independently examines the sphinx and local group. No direct inscribing date."},{"url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/C73F769B7CF3A7E4E2607958A096B7D8/S0003598X2000157Xa.pdf/early-alphabetic-writing-in-the-ancient-near-east-the-missing-link-from-tel-lachish.pdf","locator":"Höflmayer et al. 2021, pp. 711–714, Fig. 7","note":"Independent later Lachish witness confirms recognizable sign forms and affirms comparison with Egyptian forms. No specific Serabit-to-Lachish carrier established."}],"graph_status_before":"open","graph_status":"established","after":{"outgoing_dependence":1},"connections":[{"from":"egyptian-papyrus-sheet-roll","to":"egyptian-hieroglyphic-writing","type":"requires","decision":"deferred","edges":[]},{"from":"proto-cuneiform-economic-recording","to":"egyptian-hieroglyphic-writing","type":"transmitted_from","decision":"deferred","edges":[]},{"from":"egyptian-hieroglyphic-writing","to":"proto-sinaitic-writing-at-serabit-el-khadim","type":"adapts","decision":"new-established","edges":[{"from":"egyptian-hieroglyphic-writing","to":"proto-sinaitic-writing-at-serabit-el-khadim","type":"adapts","from_event":"","to_event":"serabit-alphabetic-inscriptions","before":"absent","after":"established","statement":"The early alphabet attested at Serabit adapted selected Egyptian sign forms to represent consonants in a Semitic language. Palaeographic comparisons identify the Egyptian eye sign as a model for the consonant ʿayin, from the Semitic word for ‘eye’.","scope":"Adaptation of selected sign forms in the early alphabet. The comparison concerns the Egyptian sign repertoire and has no identified individual exemplar.","evidence":[{"source":"goldwasser-2006-egyptian-sign-models","locator":"pp. 130–132, 140–141 and Table 13a–e (pp. 154–155)","supports":"Compares Egyptian eye D4 with Serabit examples of ʿayin and describes the reuse of shapes with new consonantal values. Some specific variant prototypes are uncertain."},{"source":"wilson-wright-2013-sinai-345","locator":"pp. 136–141, figs. 1–5","supports":"Reads the consonantal dedication invoking Baʿalat on the sphinx alongside the Egyptian inscription invoking Hathor."},{"source":"hoflmayer-2021-lachish-alphabet","locator":"pp. 711–714, Fig. 7 and first-line reading","supports":"Independently excavated, later sherd supplies a separate early alphabetic example of the eye-shaped consonant ʿayin linked to Egyptian D4 by the authors."}]}]}],"incident_causal_edges":[{"from":"egyptian-hieroglyphic-writing","to":"proto-sinaitic-writing-at-serabit-el-khadim","type":"adapts","from_event":"","to_event":"serabit-alphabetic-inscriptions","before":"absent","after":"established","statement":"The early alphabet attested at Serabit adapted selected Egyptian sign forms to represent consonants in a Semitic language. Palaeographic comparisons identify the Egyptian eye sign as a model for the consonant ʿayin, from the Semitic word for ‘eye’.","scope":"Adaptation of selected sign forms in the early alphabet. The comparison concerns the Egyptian sign repertoire and has no identified individual exemplar.","evidence":[{"source":"goldwasser-2006-egyptian-sign-models","locator":"pp. 130–132, 140–141 and Table 13a–e (pp. 154–155)","supports":"Compares Egyptian eye D4 with Serabit examples of ʿayin and describes the reuse of shapes with new consonantal values. Some specific variant prototypes are uncertain."},{"source":"wilson-wright-2013-sinai-345","locator":"pp. 136–141, figs. 1–5","supports":"Reads the consonantal dedication invoking Baʿalat on the sphinx alongside the Egyptian inscription invoking Hathor."},{"source":"hoflmayer-2021-lachish-alphabet","locator":"pp. 711–714, Fig. 7 and first-line reading","supports":"Independently excavated, later sherd supplies a separate early alphabetic example of the eye-shaped consonant ʿayin linked to Egyptian D4 by the authors."}]}],"rationale":"The dated Abydos witness and Jarf hieratic papyrus use extend the record; the unsupported edge to the separate Hemaka roll was removed.","verdict":"accept"},{"id":"bizmoune-cave-perforated-shells","name":"Bizmoune Cave perforated shell ornaments","date":"Before approximately 93,000 years ago, conditional on flowstone dating","frozen_date":"Before approximately 93,000 years ago, conditional on flowstone dating","lane":"symbols","region":"africa","domain":"daily-life","outcome":"deferred","finding":"The existing conditional layer 4c evidence is retained. Localized polish corroborates ornament use, while reported chipped holes have several possible causes. The separate Taforalt assemblage shares some shell selections and wear patterns and shows later regional bead use. A specific exchange route, descent from Bizmoune, and a link to the separate South African Blombos beadmaking remain unresolved.","next":"Seek a securely dated intervening assemblage and comparable shell collection, modification and wear sequences tied to a demonstrable transport or contact route.","sources":[{"url":"https://eprints.whiterose.ac.uk/id/eprint/206409/1/sciadv.abi8620.pdf","locator":"Sehasseh et al. 2021, The shell beads and Discussion, figs. 4–7 and table 1","note":"Most holes are partly natural. The authors identify chipping, polish and localized wear and discuss how the assemblage fits wider regional evidence. Table 1 shows conflicting dating signals."},{"url":"https://in-africa.org/wp-content/uploads/2012/12/Bouzouggar-et-al-2007-82K-beads-from-NAfrica.pdf","locator":"Bouzouggar et al. 2007, figs. 2–3 and Discussion","note":"Original report of separate Moroccan assemblage at Taforalt. The authors consider possible exchange and long-distance networks from transport of shells; some investigators overlap with Bizmoune."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"bizmoune-cave-perforated-shells","to":"blombos-cave-shell-beads","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"No changed record. Sehasseh et al. pp. 3–5 support local wear interpretations; conflicting 4c luminescence and U-series prevent firm dating, and later Moroccan assemblage alone does not prove transmission. Deferred edge is not a negative historical conclusion. Existing impact claim of earliest witness should be independently revisited against the conditional chronology.","verdict":"defer"},{"id":"blombos-cave-shell-beads","name":"Blombos Cave shell beads","date":"Approximately 75,000 years ago, M1 context","frozen_date":"Approximately 75,000 years ago, M1 context","lane":"symbols","region":"africa","domain":"daily-life","outcome":"deferred","finding":"The reported M1 beadwork and probable stringing are retained. Separate experiments on shell wear refine how some shells may have been arranged. Ochre residues and experimental reproduction with coated thread leave multiple possible pathways for the pigment and provide no tie to the earlier M3 mixture.","next":"Compare in situ residues on specific shells and sediments with contemporaneous preparation evidence. Seek preserved stringing material if possible and distinguish transfer during wear from deliberate application.","sources":[{"url":"https://in-africa.org/wp-content/uploads/2012/12/Henshilwood-et-al-2004-Science-Blombos-beads.pdf","locator":"Henshilwood et al. 2004, p. 404 and figs. 1–2","note":"Original description of perforation, facets and traces of ochre on some shells; later reanalysis uses part of this assemblage."},{"url":"https://www.sciencedirect.com/science/article/pii/S004724841300033X","locator":"Vanhaeren et al. 2013, abstract, figs. 1 and 10–11, Discussion","note":"A cluster of 24 perforated shells probably came from one beadwork. The study adds direct observations and comparison experiments while sharing authors and specimens with the original reports; stringing patterns are inferred."},{"url":"https://www.in-africa.org/wp-content/uploads/2012/12/Henshilwood-et-al-2011-100000-yr-old-ochre-processing-Blombos_Science.pdf","locator":"Henshilwood et al. 2011, pp. 219–221, figs. 2–4 and manufacturing interpretation","note":"Residues and associated tools support production and storage of two M3 mixtures. The authors infer powder preparation on stone surfaces and mixing in shells. Final use is unknown."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"blombos-ochre-mixture","to":"blombos-cave-shell-beads","type":"uses_process","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"No changed record. Henshilwood et al. 2004 p. 404 reports 39 M1 specimens and possible ochre on shells or contact material; it does not establish that the earlier M3 mixture was applied.","verdict":"defer"},{"id":"blombos-ochre-mixture","name":"Blombos Cave ochre-rich mixture","date":"Approximately 100,000 years ago","frozen_date":"Approximately 100,000 years ago","lane":"symbols","region":"africa","domain":"materials","outcome":"deferred","finding":"The two M3 preparation and storage kits are retained. Pinnacle Point documents earlier powder preparation in a different context. The later Blombos cross-hatched marks were attributed to an ochre crayon on silcrete. Neither comparison identifies a predecessor or a final use for the particular M3 mixture.","next":"Look for residues of the prepared mixture directly on a dated implement or treated object from an associated deposit. Test the correspondence in composition, use-wear and stratigraphy.","sources":[{"url":"https://www.in-africa.org/wp-content/uploads/2012/12/Henshilwood-et-al-2011-100000-yr-old-ochre-processing-Blombos_Science.pdf","locator":"Henshilwood et al. 2011, pp. 219–221, figs. 2–4 and manufacturing interpretation","note":"Residues and associated tools support production and storage of two M3 mixtures. The authors infer powder preparation on stone surfaces and mixing in shells. Final use is unknown."},{"url":"https://in-africa.org/wp-content/uploads/2012/12/Watts-2010-JHE-pigments-Pinnacle-Point.pdf","locator":"Watts 2010, abstract, results on grinding and discussion","note":"Independently analyzed Pinnacle Point assemblage shows deliberate modification of red ochre. Distinct site and samples."},{"url":"https://www.nature.com/articles/s41586-018-0514-3","locator":"Henshilwood et al. 2018, abstract and figs. 2–3","note":"Different specimen from much later Blombos strata. Comparative microscopy and experiments distinguish a crayon from liquid paint. Researchers overlap with the mixture study."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changed record. Henshilwood et al. 2011 identifies two M3 processing kits and unknown final use; later drawing and separate site are not evidence of use or transmission from this mixture.","verdict":"defer"},{"id":"gerzeh-meteoritic-iron-beads","name":"Gerzeh meteoritic-iron beads","date":"c. 3200 BCE","frozen_date":"c. 3200 BCE","lane":"symbols","region":"africa","domain":"materials","outcome":"established","finding":"Established affinity only. Independent excavation and laboratory observations support one shared principle with earlier copper beads at Çayönü, hammering metal to sheet and rolling it into a tube. Historical prerequisites, transmission, and descent to later iron smelting remain deferred. Johnson and colleagues corroborate meteoritic origin and the sheet seam on a distinct Gerzeh specimen. The studies’ thermal inferences differ and apply to different samples.","next":"Seek pre-Gerzeh Egyptian metal sheets or tubes with directly comparable manufacturing traces and chronological context. A transferred technique requires a documented path; later ore smelting also requires separate evidence.","sources":[{"url":"https://discovery.ucl.ac.uk/id/eprint/1430496/1/Rehren_et_al_2013_Petrie_iron_beads_JAS_40.pdf","locator":"Rehren et al. 2013, p. 4786 and Fig. 2; pp. 4788–4791 and Fig. 4","note":"Identifies the two burial contexts and separately pictures a modern re-stringing of stone and faience beads. Neutron images of three Petrie Museum iron beads show rolled seams. Intermittent annealing is inferred."},{"url":"https://onlinelibrary.wiley.com/doi/full/10.1111/maps.12120","locator":"Johnson et al. 2013, Sample and Results, figs. 2–6","note":"The Manchester accession 5303 is different from the three Petrie Museum samples. Independent micro-CT and microscopy corroborate findings on form and origin; retained taenite supports cold working on this specimen."},{"url":"https://www.scribd.com/document/372776679/O-zdogan-1999-Archaeological-evidence-on-the-early-metallurgy-at-Cayonu-Tepesi","locator":"Özdoğan and Özdoğan 1999, pp. 19–21, especially Fig. 4 on p. 20","note":"Excavation chapter showing a beaten-and-rolled copper bead at Çayönü. Distinct site, artifact and researchers. The Minerals lane contributes the same source record and evidence note."},{"url":"https://petrieproject.com/book/the-labyrinth-gerzeh-and-mazghuneh","locator":"Wainwright in Petrie et al. 1912, pp. 15–16 and pl. IV.2","note":"Original tomb reports and necklace order. The tomb includes other bead groupings. A shared burial context with faience is insufficient to show a use or manufacturing dependency."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"native-copper-working-at-cayonu-tepesi","to":"gerzeh-meteoritic-iron-beads","type":"same_principle","decision":"new-established","edges":[{"from":"native-copper-working-at-cayonu-tepesi","to":"gerzeh-meteoritic-iron-beads","type":"same_principle","from_event":"archaeological-evidence-7500bce","to_event":"archaeological-evidence-3100bce","before":"absent","after":"established","statement":"At Çayönü and Gerzeh, craftspeople formed tubular beads by rolling hammered metal sheet. The Çayönü bead was copper and the Gerzeh examples were meteoritic iron.","scope":"Beads made from rolled hammered sheet. The working temperature and historical transmission are separate questions.","evidence":[{"source":"ozdogan-1999-early-metallurgy-cayonu","locator":"p. 20, Fig. 4","supports":"Shows a Çayönü copper bead made by rolling a hammered flat sheet."},{"source":"rehren-2013-years-old-egyptian","locator":"pp. 4788–4791, Fig. 4, discussion and conclusions","supports":"Seams in the Gerzeh beads support manufacture from hammered sheet rolled into tubes. The authors compare earlier native-metal beadmaking in Anatolia."},{"source":"johnson-2013-gerzeh-iron-bead","locator":"Results, Fig. 6","supports":"CT of another Gerzeh bead shows bending and joining of a sheet."}]}]}],"incident_causal_edges":[],"rationale":"The iron and copper evidence supports a narrowly scoped shared fabrication principle, not a historical transmission.","verdict":"accept"},{"id":"leang-karampuang-figurative-scene","name":"Leang Karampuang painted figurative scene","date":"At least 51,200 years ago","frozen_date":"At least 51,200 years ago","lane":"symbols","region":"asia","domain":"arts","outcome":"deferred","finding":"The figurative-scene event and minimum age are retained. The sampled overlying calcite constrains the date but gives no pigment recipe. Hematite identifications at Sumpang Bita 2 apply to two motifs at another cave. The older Liang Metanduno date belongs to a hand stencil and is a minimum age for a different artifact. A shared tradition or specific technique transfer into the Leang Karampuang scene remains unresolved.","next":"Find published composition or tool traces from this panel and securely matched nearby contexts. Compare technique and chronology before considering continuity.","sources":[{"url":"https://www.nature.com/articles/s41586-024-07541-7","locator":"Oktaviana et al. 2024, Fig. 3, Leang Karampuang results and Extended Data Table 1","note":"The key dated carbonate overlies one of the figures. The group's attribution of interaction is interpretive."},{"url":"https://www.sciencedirect.com/science/article/abs/pii/S0026265X18314073","locator":"Kurniawan et al. 2019, abstract, sample site and results","note":"Separate pigment samples from Leang Sumpang Bita 2 gave hematite in the dark red and purple samples. Shared investigators do not make the samples those of the scene."},{"url":"https://www.nature.com/articles/s41586-025-09968-y","locator":"Oktaviana et al. 2026, Fig. 3 and LMET2 result","note":"Separate sample and cave. The older minimum date is for a hand stencil rather than a dated example of the same kind of composed scene."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changed record. Oktaviana et al. 2024 Fig. 3 and extended data date overlying calcite, with a particular figure providing the oldest minimum. Other caves and motifs do not establish the pigment or historical transmission for this panel.","verdict":"defer"},{"id":"faience-making-in-the-near-east-and-egypt","name":"Faience making in the Near East and Egypt","date":"end of the fifth millennium BCE","frozen_date":"end of the fifth millennium BCE","lane":"symbols","region":"multiple","domain":"materials","outcome":"deferred","finding":"Early glazed steatite and synthetic quartz-body faience differ in their substrate. Badarian beads demonstrate a glazed-stone practice in Egypt and some analyzed steatite samples suggest cementation. The faience microscopy series of Tite and colleagues starts at the Middle Kingdom. Neither source independently connects Badarian glazing to the earliest Egyptian or Near Eastern faience production. The modern re-strung Gerzeh assemblage does not establish technological dependence between faience and iron beads.","next":"Seek dated early ground-quartz cores and analyzed glazes from a shared workshop or developmental sequence. Compare those glazes with securely provenanced glazed steatite and distinguish physical transfer from similar firing methods.","sources":[{"url":"https://www.metmuseum.org/art/collection/search/557615","locator":"Matmar Tomb 3107, object 32.2.36, Artwork Details","note":"Named excavated Badarian glazed-steatite bead group. Catalogued object dates its find context, not its production location."},{"url":"https://www.researchgate.net/publication/233199543_Glazed_steatite_An_investigation_of_the_methods_of_glazing_used_in_ancient_Egypt","locator":"Tite and Bimson 1989, pp. 89–91 and Table 1, conclusions","note":"Microstructure of archaeological steatite objects is compared with separately replicated cementation and application glazes. The Badarian bead samples are distinct from quartz-body faience."},{"url":"https://www.sciencedirect.com/science/article/abs/pii/S0305440306002561","locator":"Tite et al. 2007, Abstract and Introduction","note":"The 35 faience objects analyzed range from the Middle Kingdom to the Twenty-second Dynasty. The dates of first appearance are contextual discussion outside that sample."},{"url":"https://discovery.ucl.ac.uk/id/eprint/1430496/1/Rehren_et_al_2013_Petrie_iron_beads_JAS_40.pdf","locator":"Rehren et al. 2013, p. 4786 and Fig. 2; pp. 4788–4791 and Fig. 4","note":"Identifies the two burial contexts and separately pictures a modern re-stringing of stone and faience beads. Neutron images of three Petrie Museum iron beads show rolled seams. Intermittent annealing is inferred."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changed record. Glazed stone and synthetic quartz-body faience are distinct substrates; common burial with metal beads does not establish technique transfer. Baseline first_known and narrow converted chronology need independent specialist review, not reapproval.","verdict":"defer"},{"id":"wonderwerk-early-burning","name":"Wonderwerk Cave early burning evidence","date":"1.79–1.07 million years ago","frozen_date":"about 1 million years ago","lane":"lithics","region":"africa","domain":"energy","outcome":"established","finding":"Proposed a distinct older Stratum 11 event within the cave record. Spectroscopy and luminescence agree on selected calcined small mammal fossils from the 1.79–1.07 Ma deposit. The assays overlap in specimens and the two studies share site investigators, but the particle and microfaunal evidence offer different observations. Stratum 10 remains a separate witness with two possible age correlations. The evidence does not trace the use of fire to Gesher or any other region.","next":"Seek an independently replicated Stratum 11 stratigraphic correlation or an intact combustion feature to test how fire reached and was used within the cave.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13225425/","locator":"Wonderwerk Cave, Figure 1d and Table 1; Results, Table 2; Conclusions","note":"Primary microfaunal analyses on two layers, including reanalysis of previously studied fossils. The bracket concerns the deposit. Table 1 lists both about 0.75 and about 1.0 Ma for Stratum 10."},{"url":"https://doi.org/10.1073/pnas.1117620109","locator":"Abstract, excavation context, microstratigraphy and discussion","note":"Study of intact Stratum 10 sediments and associated material. Hominin involvement is inferred."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"wonderwerk-early-burning","to":"gesher-recurrent-fire-use","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Distinct Stratum 11 evidence is supported; revised Stratum 10 date encloses competing approximate correlations and labels them explicitly as alternatives, not a measured continuous interval.","verdict":"accept"},{"id":"barbed-bone-points","name":"Barbed bone points","date":"By approximately 50,000 years ago","frozen_date":"By approximately 50,000 years ago","lane":"lithics","region":"africa","domain":"machines","outcome":"deferred","finding":"Added the original Katanda excavation report as evidence of worked bone, with its proposed age attributed. The better-constrained date or chronological direction for Katanda remains open. The assemblage does not show a detachable attachment or support a route to later toggling finds.","next":"Check the original dating tables and later chronology report for each Katanda 9 specimen's stratigraphic context. Require an artifact-level attachment or function study before a relation to another tradition.","sources":[{"url":"https://pubmed.ncbi.nlm.nih.gov/7725100/","locator":"Abstract","note":"Primary artifact report. Association with fish and approximate age are assemblage-level claims."},{"url":"https://pubmed.ncbi.nlm.nih.gov/7725099/","locator":"Abstract and journal metadata","note":"Companion chronology refers to the same sites."},{"url":"https://doi.org/10.1038/s41598-022-20680-z","locator":"Introduction, Katanda sites and dating","note":"Comparative background describes dating as inconclusive and reports the later approximately 50 ka minimum assessment."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"barbed-bone-points","to":"line-retained-toggling-harpoon-head","type":"builds_on","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Primary abstract and the 2022 review support the bounded addition; no specific mounting or relationship established.","verdict":"accept"},{"id":"hafted-stone-tipped-javelins-in-the-middle-stone-age-ethiopian-rift","name":"Hafted stone-tipped javelins in the Middle Stone Age Ethiopian Rift","date":"more than 279,000 years ago (before c. 277,050 BCE)","frozen_date":"more than 279,000 years ago (before c. 277,050 BCE)","lane":"lithics","region":"africa","domain":"machines","outcome":"deferred","finding":"Added the geographically local Worja attribution for much of a separate Gademotta assemblage sample, with minority and uncertain assignments. This narrows the archaeological context. The sample does not establish individual point provenance, a directly preserved composite object or a route from earlier sites.","next":"Seek a specimen-specific geochemical comparison and direct contextual evidence from the same dated assemblage before inferring any relationship.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3827237/","locator":"Gademotta Formation context, Figure 1; Abstract","note":"Original study dates the lowest sampled deposits and interprets the archaeological points."},{"url":"https://www.researchgate.net/publication/305043087_Geochemical_Characterization_of_Four_Quaternary_Obsidian_Sources_and_Provenance_of_Obsidian_Artifacts_from_the_Middle_Stone_Age_Site_of_Gademotta_Main_Ethiopian_Rift","locator":"Abstract; Results, Oxide and trace elements and source assignment","note":"Original author-uploaded 26-artifact geochemistry study. Shares Sahle but contributes different observations from geological comparison."},{"url":"https://ejol.aau.edu.et/index.php/SINET/article/download/6970/7548/16480","locator":"Archaeological context; Method, pp. 23–24","note":"Earlier provenance assay concerns 13 separately identified debitage samples. Mixed context limits extension to individual objects."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Retains interpretation as interpretation and separates geochemical sample from particular analyzed points.","verdict":"accept"},{"id":"oldowan-flaked-stone-tools-in-east-africa","name":"Oldowan flaked stone tools in East Africa","date":"3.032 to 2.581 million years ago","frozen_date":"3.032 to 2.581 million years ago","lane":"lithics","region":"africa","domain":"materials","outcome":"established","finding":"Proposed a distinct Nyayanga stone procurement record and a local process link to Oldowan toolmaking in bed NY-1. Geological and artifact measurements indicate substantial nonlocal input, while early-stage pieces indicate the material was worked at the site. Earlier excavation observations and regional geological samples are informative separately, though research teams and some materials overlap. The conclusion concerns the documented Nyayanga case, with no Ledi-Geraru or Gona transmission implied.","next":"Seek older eastern geological deposits and independent sourcing or dated intermediate sites to test the transport estimate and any regional continuity.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12356259/","locator":"Results, Sources accessed by hominins, Stone transport distance and Stone transport behavior; Figures 4–6; Discussion","note":"New geochemical comparisons, surveyed conglomerates and lithic evidence. The distance is to sampled geological analogues. The precisely used ancient sources and travel routes remain unknown."},{"url":"https://www.researchgate.net/publication/368393593_Expanded_geographic_distribution_and_dietary_strategies_of_the_earliest_Oldowan_hominins_and_Paranthropus","locator":"Original Plummer et al. text, pp. 561–564, stratigraphy and Figure 2","note":"Separate original excavation and assemblage analysis documents the same collection context and some of the same artifacts."},{"url":"https://repository.si.edu/bitstream/handle/10088/6080/Braun_et_al_2008_Oldowan_behav.pdf","locator":"Regional source survey, pp. 2333–2338; drainage model and source distances, pp. 2342–2343","note":"Primary field and geochemical comparative evidence from another site. Some coauthors and source data recur in the 2025 evidence. Kanjera South chronology is not inherited by Nyayanga."}],"graph_status_before":"open","graph_status":"established","after":{"incoming_dependence":1},"connections":[{"from":"nyayanga-nonlocal-stone-procurement","to":"oldowan-flaked-stone-tools-in-east-africa","type":"uses_process","decision":"new-established","edges":[{"from":"nyayanga-nonlocal-stone-procurement","to":"oldowan-flaked-stone-tools-in-east-africa","type":"uses_process","from_event":"nonlocal-cobbles-ny1","to_event":"archaeological-evidence-2579050bce","before":"absent","after":"established","statement":"Toolmakers at Nyayanga used stone brought from outside the Homa Peninsula. The assemblage contains early-stage flakes and cores made from nonlocal stone, which Finestone and colleagues interpret as evidence that toolmakers worked imported cobbles at the site.","scope":"The documented Nyayanga tool assemblage in bed NY-1.","caveats":"The ancient pickup sites and exact distances are inferred. Local rock also occurs in the assemblage.","evidence":[{"source":"finestone-2025-nyayanga-stone-transport","locator":"Results, Sources accessed by hominins and Stone transport distance, Figures 4–5","supports":"Artifact chemistry and comparisons with geological samples support a nonlocal origin for much of the stone."},{"source":"finestone-2025-nyayanga-stone-transport","locator":"Results, Stone transport behavior and Figure 6; Discussion","supports":"Nonlocal cores and flakes occur at early reduction stages, supporting on-site toolmaking using the imported stone."},{"source":"plummer-2023-expanded-geographic-distribution","locator":"Figure 2 and the lithic technology account, pp. 562–564","supports":"The original excavation report documents flaked tools, cores and detached pieces in the NY-1 assemblage later tested for geological provenance."}]}]}],"incident_causal_edges":[{"from":"nyayanga-nonlocal-stone-procurement","to":"oldowan-flaked-stone-tools-in-east-africa","type":"uses_process","from_event":"nonlocal-cobbles-ny1","to_event":"archaeological-evidence-2579050bce","before":"absent","after":"established","statement":"Toolmakers at Nyayanga used stone brought from outside the Homa Peninsula. The assemblage contains early-stage flakes and cores made from nonlocal stone, which Finestone and colleagues interpret as evidence that toolmakers worked imported cobbles at the site.","scope":"The documented Nyayanga tool assemblage in bed NY-1.","caveats":"The ancient pickup sites and exact distances are inferred. Local rock also occurs in the assemblage.","evidence":[{"source":"finestone-2025-nyayanga-stone-transport","locator":"Results, Sources accessed by hominins and Stone transport distance, Figures 4–5","supports":"Artifact chemistry and comparisons with geological samples support a nonlocal origin for much of the stone."},{"source":"finestone-2025-nyayanga-stone-transport","locator":"Results, Stone transport behavior and Figure 6; Discussion","supports":"Nonlocal cores and flakes occur at early reduction stages, supporting on-site toolmaking using the imported stone."},{"source":"plummer-2023-expanded-geographic-distribution","locator":"Figure 2 and the lithic technology account, pp. 562–564","supports":"The original excavation report documents flaked tools, cores and detached pieces in the NY-1 assemblage later tested for geological provenance."}]}],"rationale":"The new local process relationship is constrained to the Nyayanga assemblage and does not assert transmission between sites.","verdict":"accept"},{"id":"pressure-retouch-of-stone-edges","name":"Pressure retouch of stone edges","date":"By about 77,000 years ago","frozen_date":"By about 77,000 years ago","lane":"lithics","region":"africa","domain":"materials","outcome":"established","finding":"Added separate archaeological evidence from Blombos Still Bay ochre objects. Velliky et al. interpret wear on CB.200 and CFB-CFC.1566 as pressure flaking on stone. Mourre examined lithic specimens and the studies share Henshilwood but analyze distinct object classes. The instrumental wear does not identify a matching finished object. Earlier specimens are reported with different chronological descriptions and no matching pre–Still Bay products.","next":"Reconcile the ages of the earlier ochre objects by layer and look for independent material attribution in the same deposits.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12204176/","locator":"Archeological background; Results, Figure 2, Figure 3 and Table 1; Discussion","note":"Primary artifact analysis. The Still Bay phase furnishes context dates. No artifact pairing or direct evidence of transfer."},{"url":"https://pubmed.ncbi.nlm.nih.gov/21030655/","locator":"Original study abstract","note":"First study concerns Still Bay silcrete objects, not the ochre specimens. Full original paper was unavailable for this check."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Ochre objects supply independently informative artifact-class evidence within the Still Bay phase, not a matched pair.","verdict":"accept"},{"id":"dhaba-levallois-prepared-core","name":"Dhaba Levallois prepared-core stoneworking","date":"Approximately 80,000–65,000 years ago","frozen_date":"Approximately 80,000–65,000 years ago","lane":"lithics","region":"asia","domain":"materials","outcome":"established","finding":"Extended the existing Dhaba record to younger Dhaba 2 and 3 strata dated about 55–47 ka. Same excavation study as Dhaba 1, but separate archaeological deposits. The excavated sequence does not establish the origin or transmission of the practice. Jwalapuram provides a comparative assemblage with a shared researcher and separate site context.","next":"Seek additional stratified assemblages and independently dated regional contexts that could distinguish local persistence from transmission.","sources":[{"url":"https://www.nature.com/articles/s41467-020-14668-4","locator":"Results, lithic assemblage; Figures 3–5 and Table 1; Discussion","note":"Levallois prominent in younger Dhaba deposits and absent above stratum E in the studied sequence."},{"url":"https://pubmed.ncbi.nlm.nih.gov/17615356/","locator":"Original excavation report abstract, Jwalapuram site","note":"A separate assemblage linked to Toba ash. Similarity does not prove direction or movement."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"The later Dhaba 2 and 3 deposits are a separate dated extension to the existing Dhaba 1 event.","verdict":"accept"},{"id":"lever-assisted-spear-throwing","name":"Lever-assisted spear throwing","date":"By approximately 31,000 calibrated years before 1950","frozen_date":"By approximately 31,000 calibrated years before 1950","lane":"lithics","region":"europe","domain":"machines","outcome":"deferred","finding":"Retained the Maisières-Canal record's inference and the physical La Garenne context separately. Cattelain reports older candidate French objects, but the Le Placard specimens lack secure individual links to the dated levels and the Combe-Saunière context contains inconsistent dates. The dated associated samples are not dates on the objects.","next":"Seek a securely provenienced and directly dated early artifact, with collection records that identify its recovery context.","sources":[{"url":"https://doi.org/10.1038/s41598-023-45554-w","locator":"Site description and archaeological chronology; discussion of the French artifacts","note":"Indirect identification at Maisières; occupation dates fall around 31 ka cal BP. The authors report uncertainties for the Solutrean attributions."},{"url":"https://dipot.ulb.ac.be/dspace/bitstream/2013/299634/3/2018-THE_LE_PLACARD_SPEARTHROWERS.pdf","locator":"Cattelain, 2018, pp. 146, 152–154, especially Table 1","note":"Primary museum object study combined with contextual dating compiled from other sources. The associated level estimates cannot be substituted for directly dated specimens."},{"url":"https://doi.org/10.4000/paleo.2876","locator":"Cattelain et al., 2015, La Garenne B5, printed pp. 22, 24, 26–27","note":"Existing physical specimen in a dated assemblage."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changes proposed for this roster record. The separately contextualized Maisières and La Garenne observations are not reapproved; proposed older examples need secure individual context.","verdict":"defer"},{"id":"birch-bark-tar-for-stone-tool-backing","name":"Birch-bark tar for stone-tool backing","date":"By about 191,000 years ago","frozen_date":"By about 191,000 years ago","lane":"lithics","region":"europe","domain":"materials","outcome":"established","finding":"Added the Campitello original report and distinguished the chemically tested flakes from their geological and faunal age estimate. The later North Sea artifact is independent physical evidence of another application. Neither witness identifies a production installation or a transmission route.","next":"Seek securely associated traces of prehistoric processing or a directly dated residue if resolving the missing process or chronology.","sources":[{"url":"https://www.academia.edu/6091863/A_new_Palaeolithic_discovery_tar_hafted_stone_tools_in_a_European_Mid_Pleistocene_bone_bearing_bed","locator":"Mazza et al., §§3, 5, 7–8, pp. 1312–1317","note":"Indexed published text of the original site and residue report. Authors assign a pre-isotope-stage-6 age from context."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6825292/","locator":"Table 1 and Zandmotor Find","note":"Campitello summary reuses Mazza's material. New tests and direct dating refer to a separate North Sea artifact."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Original Campitello report and chemical observations are cited directly; formerly stale statements now accurately describe evidence and contextual dating.","verdict":"accept"},{"id":"line-retained-toggling-harpoon-head","name":"Line-retained toggling harpoon head","date":"By approximately 7500 calibrated years before 1950","frozen_date":"By approximately 7500 calibrated years before 1950","lane":"lithics","region":"multiple","domain":"food","outcome":"deferred","finding":"The published Vinča comparison gives a broad phase attribution for toggling specimens based on older material. The inspected primary analysis is chiefly of lure-hooks and does not directly tie a named toggling specimen to a modeled dated layer. The Labrador burial artifact, the Pietrele settlement artifacts and Lower Ento-a Japanese examples have distinct contexts. None documents continuity from Katanda. The catalogue's Bering Strait whaling evidence concerns much later contexts and does not connect the three recorded witnesses.","next":"Trace the earlier Bačkalov collection entries to museum identifiers and independently dated strata before adding a Vinča event.","sources":[{"url":"https://www.academia.edu/18332025/Fishing_with_lure_hooks_at_the_Late_Neolithic_site_of_Vin%C4%8Da_Belo_Brdo_Serbia_Journal_of_Archaeological_Science","locator":"Cristiani et al., p. 136 and Figure 4","note":"Reports the toggling identification from earlier collections. Its newly analyzed sample concerns hook-like artifacts."},{"url":"https://doi.org/10.1515/opar-2022-0263","locator":"Section 5.1 and Figure 6","note":"Synthesis proposes a tentative earlier interval from multiple regional occupations. This is not independent dating of a particular toggle."},{"url":"https://www.flutopedia.com/refs/McGhee_1975_ArchaicSequenceLabrador_FP.pdf","locator":"Printed pp. 88, 92","note":"Original Labrador burial inventory and associated hearth chronology; no artifact-level calibrated date."},{"url":"https://doi.org/10.4312/dp.40.14","locator":"Pietrele, pp. 181, 185–187","note":"Different settlement artifacts in a regional chronological horizon."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changed record. Vinča specimen-to-phase assignment remains unresolved; no Katanda-to-later transmission can be inferred. Baseline claims are not reapproved.","verdict":"defer"},{"id":"gona-flaked-stone-cutting","name":"Gona core-and-flake stone technology","date":"2.6–2.5 million years ago","frozen_date":"2.6–2.5 million years ago","lane":"lithics","region":"unplaced","domain":"materials","outcome":"established","finding":"Enriched the existing East Gona event with local material context and physical refits from EG10. The geological hypothesis draws on prior reports; the refits are new observations of the same archaeological collection. Local gravel access differs from the inferred transport at Nyayanga. The chronological overlap and differences provide no ancestral direction.","next":"Seek comparative source counts and securely dated contacts across the Afar localities before asserting process transfer.","sources":[{"url":"https://doi.org/10.15184/aqy.2018.169","locator":"Introduction; Conjoining and refitting lithic sets from EG 10","note":"Original physical refits from a new analysis, shared excavation contributors."},{"url":"https://scholarblogs.emory.edu/stoutlab/files/2013/07/Stout-et-al-2005-Raw-Materials.pdf","locator":"Methodology, archaeological and geological samples, pp. 368–370, Table 1","note":"Primary independent material comparisons on Gona sites other than EG10 or EG12. Regional context only."},{"url":"https://pubmed.ncbi.nlm.nih.gov/9002516/","locator":"Abstract","note":"Original field report with approximate geological dates."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"gona-flaked-stone-cutting","to":"oldowan-flaked-stone-tools-in-east-africa","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"EG10 refits add observations to the existing event; geologic source is appropriately expressed as likely.","verdict":"accept"},{"id":"fur-and-leather-working-for-clothing-at-contrebandiers-cave","name":"Fur and leather working for clothing at Contrebandiers Cave","date":"120,000 to 90,000 years ago","frozen_date":"120,000 to 90,000 years ago","lane":"textiles","region":"africa","domain":"daily-life","outcome":"deferred","finding":"Added the local processing evidence to the current event. The authors found seven rib spatulates in IV-2 and separate skinning evidence on MSA carnivore bones. A linked garment industry remains inference. El Mnasra and Dar es-Soltan I provide comparable artefacts from separate sites, without a demonstrated line of transfer. The catalogue’s Denisova needle and Bizmoune ornaments provide no instance of using these particular tools or hides.","next":"Find a preserved piece, residue or independently examined use-wear that ties a particular tool to a garment or distinguishes the neighbouring spatulate traditions.","sources":[{"url":"https://pure.mpg.de/pubman/item/item_3346622_5/component/file_3346623/Hallett_Worked_iScience_2021.pdf","locator":"pp. 3–6, Figs. 2–5, Tables S1–S3 and Discussion","note":"Primary study of spatulate wear, cut-mark distribution and the Moroccan comparative assemblages. Distinct physical proxies for processing, with clothing an inference."},{"url":"https://quaternary.uibk.ac.at/QuaternaryResearchGroup/files/63/63584672-527a-47de-8b5a-7ec17ecdf313.pdf","locator":"Jacobs et al. 2011, abstract and Methods, pp. 3631–3643","note":"Original measurements of sediment dating. Jacobs is also a co-author of Hallett et al. This dates deposits and does not independently establish clothing."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Changed event evidence and caveat: Hallett 2021 pp. 3–6 reports seven Layer IV-2 rib spatulates and distinct carnivore skinning versus bovid butchery marks. Comparative experimental wear informs interpretation, but their limitation section p. 10 states 40x examination did not diagnose contact material. Clothing remains an inference; no transmission or individual link is claimed.","verdict":"accept"},{"id":"denisova-eyed-needle","name":"Denisova Cave eyed needle","date":"Approximately 40,000 cal BP (38,050 BCE)","frozen_date":"Approximately 40,000 cal BP (38,050 BCE)","lane":"textiles","region":"asia","domain":"daily-life","outcome":"deferred","finding":"Added the 2016 excavation report for the complete Main Chamber horizon 11.2 needle and microscopy of wear. The exact age, sewing material and human lineage remain open. The older East Chamber date belongs to a different bone. The 2025 excavation-author account reproduces the same object. At Canyars and the Great Basin there are other kinds of hide-work evidence, but no documented transfer from the Altai.","next":"Match the needle’s horizon and sediment chronology, and look for preserved material or diagnostic use traces that identify a thread or product rather than inferring it from form alone.","sources":[{"url":"https://archaeology.nsc.ru/wp-content/uploads/2018/05/ses_2016_min.pdf","locator":"Derevianko et al. 2016, pp. 72–75 (whole PDF pp. 72–75), figs. 1–2 and layer dating","note":"Original excavation and traces, including the different contexts of the Main and East Chambers."},{"url":"https://archaeology.nsc.ru/wp-content/uploads/2025/12/aeaeen_534_003-027.pdf","locator":"Derevianko 2025, p. 9 and Fig. 1.3–6","note":"Reports 40–45 ka BP for Main Chamber layer 11. Same specimen and illustration."},{"url":"https://www.science.org/doi/pdf/10.1126/sciadv.adg0834?download=true","locator":"d’Errico et al. 2023, Abstract and Results","note":"Experimental and archaeological assessment of hide perforation at independent Canyars site, with no evidence that the Denisova needle supplied the technique."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12871465/","locator":"Rosencrance et al. 2026, Results: Sewn hide and bone needles","note":"Independent US finds of sewn hide and needles, without evidence of direct descent from the Altai."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Description, event, evidence, caveats, earliest rationale and research note: Derevianko et al. 2016 pp. 72–75 identifies intact Main Chamber 11.2 specimen, reports polish and infers thread from eye; Gilligan et al. 2024 table gives approximately 40 ka cal BP for site, not direct dating; East Chamber 50.3 ± 2.2 ka measurement does not date this needle. 2018 d’Errico et al. notes inconsistent layer determinations; age and users remain uncertain. No connection proposed.","verdict":"accept"},{"id":"cotton-thread-making-at-neolithic-mehrgarh","name":"Cotton thread making at Neolithic Mehrgarh","date":"c. 5250–4650 cal BCE (Mehrgarh Period I context)","frozen_date":"6th millennium BCE","lane":"textiles","region":"asia","domain":"materials","outcome":"deferred","finding":"Replaced the source summary with the journal paper and updated the contextual date to the revised Period I envelope of c. 5250–4650 cal BCE. Grave 158 and the bead have no secure match to a direct date. The same site’s lost-wax amulet used a different method at a later date. Tel Tsaf and Dhuweila do not identify Mehrgarh as their cotton source. The Shahi Tump and Mohenjo-daro finds document other objects, with no demonstrated transfer from this burial community.","next":"Cross-reference burial 158 to the stratigraphic register and phase samples. Look for geographically diagnostic species or provenance evidence before linking Mehrgarh to the cotton finds farther west.","sources":[{"url":"https://www.harappa.com/sites/default/files/pdf/First_Evidence_of_Cotton_at_Mehrgarh.pdf","locator":"Moulherat et al. 2002, pp. 1393–1396, Figs. 2–4 and 7–9; pp. 1398–1400","note":"Primary fibre analysis. Identifies Period I grave MR.84.03.158 and gives the then-current chronology. The metal bead preserved the threads. This is not evidence for the origin of cotton plants or spinning devices."},{"url":"https://www.nature.com/articles/s41598-025-92621-5.pdf","locator":"Mutin et al. 2025, pp. 3–4, Fig. 2, and Discussion","note":"Independent lab measurements on teeth plus Bayesian modelling revise the site’s Period I sequence. Grave 158 was not identified in the inspected model. These are phase dates."},{"url":"https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2022.1045554/full","locator":"Liu et al. 2022, Results and discussion of cotton provenance","note":"Independent fibres from the Tel Tsaf site. The authors hypothesize a South Asian source from circumstantial evidence. They do not identify a Mehrgarh workshop, transmission route or specific producing community."},{"url":"https://www.sciencedirect.com/science/article/abs/pii/S0305440384710491","locator":"Betts et al. 1994, abstract","note":"Primary report of fabric impressions and fibres on lime plaster at Dhuweila. The tentative Levantine provenance comparison does not establish a particular source for this cloth."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Summary, description, origin, event and evidence, approximate contextual date, rationale and unresolved: Moulherat 2002 pp. 1393–1400 analyses Gossypium threads in grave MR.84.03.158 bead with light and electron microscopy. Mutin 2025 pp. 3–4 and discussion revises Period I to about 5250–4650 cal BCE using other cemetery teeth. This model is distinct evidence but does not directly date or securely identify this grave; retained event caveat states this. Wild/domestic identity and tool remain unknown. No first-known claim or connection.","verdict":"accept"},{"id":"silk-weaving-in-yangshao-culture-henan","name":"Silk weaving in Yangshao-culture Henan","date":"c. 3550 to 3350 BCE (5,500 to 5,300 years ago)","frozen_date":"c. 3550 to 3350 BCE (5,500 to 5,300 years ago)","lane":"textiles","region":"asia","domain":"materials","outcome":"deferred","finding":"Added the original museum laboratory report for silk in the W12 crossed-warp specimen, retained the press-reported approximate context date, and narrowed the record to woven material in the burial. The previous first-known and sericulture assignments were unsupported. Jiahu’s older soil proteins and possible textile tools cannot identify the source of Wanggou cloth or establish silkworm rearing. No evidence ties later Qianshanyang cloth to this settlement.","next":"Locate the W12 excavation stratigraphy and assay report with individual sample references, plus dated local textile tools, cocoon evidence or production traces that can establish how the silk was made.","sources":[{"url":"https://www.chinasilkmuseum.com/uploadfiles/2018/04/20180403151807586.pdf","locator":"China National Silk Museum 2017 annual report, pp. 44–45, Wanggou urn samples (PDF p. 32)","note":"Primary lab note separates a coarser plain weave and the finer, crossed-warp, ELISA-positive silk specimen in W12. No direct date here."},{"url":"https://www.chinasilkmuseum.com/cs/info_168.aspx?itemid=27700&parent=","locator":"Zhou Yang interview, chronology of Wanggou sampling","note":"Investigator account distinguishes 2017 report from 2019 work. Substantially the same investigators as the museum lab source."},{"url":"https://www.xinhuanet.com/english/2019-12/05/c_138606911.htm","locator":"Age paragraph and sericulture discussion","note":"Press report of the same research team supplies the contextual age estimate."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5152897/","locator":"Gong et al. 2016, Methods, Table 1 and Results, Table 2","note":"Independent Jiahu burial-soil peptides from different contexts and specimens. They do not preserve the structure or provenance of any cloth."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Summary, description, origin and removal of sericulture concept, event and evidence, research basis and uncertainties: original China National Silk Museum 2017 annual report pp. 44–45 identifies W12 crossed-warp fabric as silk by immunoassay, tentatively leno; 2019 press report gives site-level 5300–5500-year age, not direct W12 age. Source samples and coverage share study; location of cloth production, rearing, precise age and historical continuity remain open. Baseline name implies a local weaving tradition but event caveat explicitly limits evidence to cloth in burial; flag this as pre-existing scope concern.","verdict":"accept"},{"id":"antrea-bast-fishing-net","name":"Antrea bast fishing net","date":"8400–8300 calibrated BCE","frozen_date":"8400–8300 calibrated BCE","lane":"textiles","region":"europe","domain":"food","outcome":"deferred","finding":"Added the topological identification of the Antrea knot from published drawings. Kaaronen et al. compare sheet bends at several northern European sites and explicitly leave convergence and transmission unresolved. The Järvensuo material is more than three millennia later. Neither the existing Maras cord nor Dzudzuana fibres document Antrea's manufacture or historical source. Kept the existing approximate date pending reconciliation of the net-bast and associated bark dates.","next":"Retrieve the original laboratory ages for the bast and floats with their material and context IDs. Compare orientation and mesh topology across dated nets to assess possible transmission against recurrent knotting.","sources":[{"url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/B35E9C2DB89FA3C81F58F309B8F754FA/S0959774325000071a.pdf/the-ties-that-bind-computational-cross-cultural-analyses-of-knots-reveal-their-cultural-evolutionary-history-and-significance.pdf","locator":"Kaaronen et al. 2025, pp. 479–481 and Fig. 1E","note":"Independent comparative reconstruction of Pälsi’s published knot. Its Antrea date derives from Manninen et al. 2021."},{"url":"https://biccs.dh.gu.se/api/uploads/13_Suomela_Suhonen_Koivisto_Unravelling_the_Stone_Age_fishing_net_knots_a8f66e4ea3.pdf","locator":"Suomela et al. 2025, pp. 1–3, material and discussion","note":"New micro-CT observations on Järvensuo knots, different objects from Antrea. Its Antrea dating and willow-bast identification cite Miettinen et al. 2008."},{"url":"https://journal.fi/iskos/article/download/110409/64902","locator":"Miettinen et al. 2008, pp. 78 and 84","note":"The primary Antrea dating and material report could not be opened through this route. Page locations are reported by Suomela et al."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Description, date basis, event statement/evidence/caveats and unresolved: Kaaronen 2025 discussion and Fig. 1E identify published Antrea knot drawing as alternative sheet-bend form; this independent interpretation uses an existing specimen/drawing, not a fresh excavation or dating. Materials and date supported by earlier sources but different calibrations remain unresolved. Similar knots do not establish transfer.","verdict":"accept"},{"id":"abri-du-maras-three-ply-cord","name":"Three-ply cord at Abri du Maras","date":"Approximately 54,000–39,000 years BP, contextual age envelope","frozen_date":"Approximately 54,000–39,000 years BP, contextual age envelope","lane":"textiles","region":"europe","domain":"materials","outcome":"deferred","finding":"Retained the three-ply cord interpretation and contextual age. The fragment adhered to a flake. The connection between the artefacts during use is unresolved, so no link to local tool use or to the separate Dhaba Levallois record is proposed. The 2013 study reports earlier observations of different, fragmentary fibres by overlapping investigators. It cannot establish what the 2020 specimen did, or a line to the Antrea net.","next":"Find an independently assessed similar fragment with a secure production or use association at the site or an attributable later context.","sources":[{"url":"https://www.nature.com/articles/s41598-020-61839-w.pdf","locator":"Hardy et al. 2020, pp. 2–4 and Fig. 2, Level 4.2 specimen G8 128","note":"Primary fragment and microscopy, with contextual dating and interpretive limits."},{"url":"https://www.unife.it/interfacolta/lm.preistoria/insegnamenti/archeozoologia-1/materiale-didattico/a-a-2013-2014/presentazioni-8-13-14-gennaio/14-gennaio/hardy-et-al-2013.pdf","locator":"Hardy et al. 2013, residue analysis and discussion of fibres","note":"Earlier observations on different samples at the same site, with overlapping authors. The complete cord fragment in the 2020 study is distinct."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changed discovery. Hardy 2020 pp. 2–4, Fig. 2 reports three-ply fragment adhered to flake in layer 4.2, not a proven binding or use; fibre dating is context-based. The 2013 observations are other samples by partly overlapping authors, not independent proof of this cord’s function. No link proposed; defer the relation, not historical existence.","verdict":"deferred"},{"id":"framed-openwork-snowshoe","name":"Framed openwork snowshoe","date":"3811–3640 cal BCE (reported wood-date components)","frozen_date":"Approximately 3800–3690 BCE (wood-date summaries; use inferred)","lane":"textiles","region":"europe","domain":"transport","outcome":"deferred","finding":"Upgraded to the original article and classified the Alpine evidence as a dated find. The approximate 3811–3640 cal BCE envelope covers the two reported wood-date components (63% and 88.1% probability). The authors’ rounded summary is 3800–3700 BCE. The report distinguishes surviving attachments, wear and reconstructed strands. The laboratories tested wood from the same object, with reuse and date of use unresolved. Neither later Alpine nor modern hide-webbed frames establish descent.","next":"Inspect the labs’ full calibration distributions and compare other securely dated frames and binding traces before proposing a lineage.","sources":[{"url":"https://www.academia.edu/81438886/Ein_jungsteinzeitlicher_Schneereif_vom_Gurgler_Eisjoch_3134_m_im_Pfossental_Schnals_S%C3%BCdtirol_","locator":"Steiner et al., 2016 pp. 447–451 (Figs. 4–5), 459 (nn. 13–14), and 462 (summary)","note":"Primary article text reproduced at source URL. Two reported determinations date the wood, while form, wear and context support the interpretation."},{"url":"https://journals.ub.uni-heidelberg.de/index.php/ak/article/view/74815","locator":"Journal’s abstract and DOI","note":"Same article lineage as the hosted full text. The publisher's PDF download was unavailable in this pass."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Accepted revised snowshoe summary, record, event, source and lane report. Steiner et al. pp. 447–451 identifies structure, wear, wood and proposed use; p. 451 gives calibrated 2σ components 3811–3710 BCE (63%) and 3810–3640 BCE (88.1%). Final 3811–3640 envelope covers the reported components and explicitly states that they contain only part of each probability distribution. Wood age and potential reuse do not prove use date. Same-object lab determinations are not independent artifacts; modern sales event is unchanged. No transmission link is proposed.","verdict":"accept"},{"id":"dzudzuana-twisted-plant-fibres","name":"Dzudzuana Cave twisted plant fibres","date":"Approximately 36,000–31,000 calibrated years BP","frozen_date":"Approximately 36,000–31,000 calibrated years BP","lane":"textiles","region":"unplaced","domain":"materials","outcome":"deferred","finding":"Retained the Unit D interpretation and the species and function caveats. The 2011 site report distinguishes Unit D tools from the younger Unit C's richer evidence, and reuses the same team's fibre study. Awls and points in Unit D establish co-occurrence with the deposits, without an association to a particular fibre. Likeness to the Maras cord or later flax cloth does not identify a dependency.","next":"Look for direct identification, contextual replication of the twisting evidence and a fibre physically associated with a worked object or sewing trace.","sources":[{"url":"https://ghss.ug.edu.ge/storage/themes/June2025/3ev9ncSLyickvEe40dMm.pdf","locator":"Kvavadze et al. 2009, Unit D and fig. 1; Unit C discussion","note":"Original article hosted by the University of Georgia. Context gives the age; intended materials and fibre functions remain uncertain."},{"url":"https://org.uib.no/ift-posten/IFT-posten2010/1634-b.pdf","locator":"Bergfjord et al. 2010, technical comment","note":"Independent methodological assessment questions flax identification using the published observations rather than a new test of the specimen."},{"url":"https://www.academia.edu/1062050/Dzudzuana_an_Upper_Palaeolithic_cave_site_in_the_Caucasus_foothills_Georgia_","locator":"Bar-Yosef et al. 2011, Unit D artefacts pp. 337–338 and fibres, Fig. 8","note":"Original site report contextualizes tools and fibre parcels. Shares investigators and fibre evidence with Kvavadze et al."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changed discovery. Kvavadze 2009 p. 1359 and Fig. 1 describe spun/twisted fibres in Unit D and separate two-ply examples in younger Unit C; Bergfjord 2010 critiques species identification using same published microscopy, and use is unknown. Chronology dates context, not the fibres; defer any fibre-tool link and cross-site transmission.","verdict":"deferred"},{"id":"kalambo-notched-interlocking-timbers","name":"Kalambo Falls notched interlocking timbers","date":"At least approximately 476,000 ± 23,000 years ago","frozen_date":"At least approximately 476,000 ± 23,000 years ago","lane":"architecture","region":"africa","domain":"materials","outcome":"deferred","finding":"The BLB5 logs and stone-tool work marks are documented. Associated Acheulean artefacts and experimental matches constrain the tool class, but no particular tool or existing catalogue record is identified as doing the work. Oldowan/Gona flaking and the later Hemudu and Altscherbitz construction records have different contexts. Site C North is a separate sequence.","next":"Seek the published BLB5 lithic use-wear and residue results and assess whether they identify a separately documented local woodworking-tool capability.","sources":[{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10550827/","locator":"Main, BLB5 structural element, figs. 3–4, Extended Data figs. 1–4, and Methods, Experimental work","note":"Original excavation, marks and tool experiments. Wood use and the makers' species remain uncertain."},{"url":"https://pure.aber.ac.uk/ws/portalfiles/portal/29024098/_21915784_Journal_of_African_Archaeology_Excavations_at_Site_C_North_Kalambo_Falls_Zambia_New_Insights_into_the_Mode_2_3_Transition_in_South-Central_Africa.pdf","locator":"Introduction and Site C North stratigraphy","note":"Recent excavation in a different site unit. Shared investigators do not make C North a replication of the BLB5 association."},{"url":"https://www.traceolab.uliege.be/cms/c_9797318/en/traceolab-kalambo-falls-zambia","locator":"Use-wear and residue analyses","note":"Project account that specifies lithics from the 2019 work as the study material."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No changes; bounded deferral of a specific tool connection is warranted. Barham et al. BLB5 describe cut marks and experimentally compare stone tools; this does not identify a particular catalogued tool as the maker. Dates concern deposit, and exact function and hominin species remain unknown.","verdict":"accept"},{"id":"burnt-lime-plaster-in-the-epipalaeolithic-and-neolithic-levant","name":"Burnt-lime plaster in the Epipalaeolithic and Neolithic Levant","date":"c. 14,050 BCE (c. 16 k cal BP)","frozen_date":"c. 14,050 BCE (c. 16 k cal BP)","lane":"architecture","region":"asia","domain":"construction","outcome":"candidate","finding":"Proposed a dated field description of the bench in Shelter 1, assigned to Early Natufian Layer II by Haklay and Gopher. The original laboratory identification of calcined plaster in a bench-like feature at the site remains undated and may concern a different feature. The new event adds architectural use to the existing adhesive, interpreted hearth and burial-plaster evidence.","next":"Find the collection record for sample 86-1 and test whether it identifies the bench in Shelter 1.","sources":[{"url":"https://repository.si.edu/server/api/core/bitstreams/90d7b2ae-44bf-4e69-909e-6315a31a861f/content","locator":"pp. 224, 226, table 1, sample 86-1","note":"Original microscopy and energy-dispersive X-ray analysis of incomplete calcination in an Eynan bench-like built feature. Sample from the Hebrew University collection with no published locus ID."},{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0130121","locator":"The Early Natufian architectural remains, fig. 1","note":"Independent architectural study describes a plastered bench in Shelter 1, layer II, using Perrot-era excavations. It does not reanalyse sample 86-1."},{"url":"https://journals.openedition.org/bmsap/pdf/9548","locator":"p. 16, Natufian landmarks, phase divisions","note":"About 13,000–11,600 cal BCE is a regional Early Natufian range. It is not a direct date on the plaster."},{"url":"https://www.imeko.org/publications/tc4-Archaeo-2022/IMEKO-TC4-MetroArchaeo2022-004.pdf","locator":"Materials and Methods and Results","note":"Original material analyses identify both anthropogenic burnt lime and natural calcium carbonate at different locations at Eynan. The paper does not identify a repeat test of the Eynan bench sample."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"burnt-lime-plaster-in-the-epipalaeolithic-and-neolithic-levant","to":"settled-village-life-among-natufian-foragers-in-the-levant","type":"companion_of","decision":"new-candidate","edges":[{"from":"burnt-lime-plaster-in-the-epipalaeolithic-and-neolithic-levant","to":"settled-village-life-among-natufian-foragers-in-the-levant","type":"companion_of","from_event":"","to_event":"","before":"absent","after":"candidate","statement":"Did Eynan’s bench-like feature with burnt-lime plaster serve a residential or communal function in the settled hamlet?","scope":"Function of the bench-like built feature within the Eynan settlement.","caveats":"The bench material establishes architectural use of burnt-lime plaster at the site. The association of sample 86-1 with Shelter 1 and the function of the feature remain unresolved.","evidence":[{"source":"kingery-1988-eynan-lime-plaster","locator":"p. 224, table 1, sample 86-1, and p. 226, Eynan discussion","supports":"Microscopy and energy-dispersive X-ray analysis support the identification of incompletely calcined lime plaster in Eynan sample 86-1 from a bench-like built feature."},{"source":"haklay-gopher-2015-eynan-shelters","locator":"The Early Natufian architectural remains, fig. 1","supports":"The architectural study describes the bench in Shelter 1 and considers dwelling and funerary or ritual interpretations."}]}]}],"incident_causal_edges":[],"rationale":"The dated event now states only Haklay and Gopher’s identification of the Shelter 1 bench, in Early Natufian Layer II, with regional phase bounds explicitly applied. The distinct laboratory sample and uncertain locus are retained as an unresolved question; the two are not claimed to be identical.","verdict":"accept"},{"id":"catalhoyuk-roof-access-settlement","name":"Çatalhöyük roof-access settlement","date":"Eastern mound occupation approximately 7400–6200 BCE","frozen_date":"Eastern mound occupation approximately 7400–6200 BCE","lane":"architecture","region":"asia","domain":"construction","outcome":"deferred","finding":"Extended the existing settlement evidence with Building 1 traces consistent with roof access and a blocked ground-level doorway at Building 3. No separately dated Anatolian prerequisite or transmission is established. A lime-plaster floor sample from Çatalhöyük has unknown building level and cannot be linked to the suspected ladder trace or to the Levantine process by resemblance.","next":"Seek preserved ladder or stair fabric and an independently dated material or tool record from its specific context.","sources":[{"url":"https://www.catalhoyuk.com/archive_reports/1996/ar96_02.html","locator":"Phase 1, Space 71, fig. 1","note":"Original Building 1 excavation report. The ladder and route are archaeological interpretations of plaster curvature and trampling."},{"url":"https://www.catalhoyuk.com/archive_reports/2003/ar03_01.html","locator":"Introduction, Building 3, fig. 22","note":"Excavated doorway behind plaster gives a counterexample for at least some phases."},{"url":"https://repository.si.edu/server/api/core/bitstreams/90d7b2ae-44bf-4e69-909e-6315a31a861f/content","locator":"p. 224, table 1, Çatal Höyük sample 86-17","note":"Original analysis identifies a lime plaster floor sample whose level is unknown."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Matthews Phase 1 describes indirect roof and possible ladder traces by oven; Hodder Building 3 documents a blocked entrance and infers ground-level access in some phases. Mound dates remain broad. The changes qualify rather than universalize the access claim.","verdict":"accept"},{"id":"city-life-in-southern-mesopotamia","name":"City life in southern Mesopotamia","date":"by around 3200 BCE","frozen_date":"by around 3200 BCE","lane":"architecture","region":"asia","domain":"construction","outcome":"deferred","finding":"Uruk's economic signs and its built settlement have a shared context. The oldest Eanna tablets largely come from secondary debris used to level later building platforms. This does not identify the responsible household or a direction between administration and urban growth. The existing kiln-fired brick record documents later use and is distinct from mud brick. No new edge.","next":"Seek construction-phase records or in situ tablet contexts that identify how an administrative practice materially supported a specific phase of urban building.","sources":[{"url":"https://www.persee.fr/doc/arnil_1161-0492_2016_num_26_1_1102","locator":"pp. 35–37, §6 Dating Problems","note":"Nissen’s reanalysis explains the secondary contexts and uncertain original source of tablets. His attribution to stores of an administrative unit is qualified."},{"url":"https://www.metmuseum.org/essays/uruk-the-first-city","locator":"Opening and writing sections","note":"Site and period context for monumental mud-brick construction and administrative records. Institutional synthesis."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"proto-cuneiform-economic-recording","to":"city-life-in-southern-mesopotamia","type":"uses_process","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Unchanged. Deferred proposed administrative dependency is a bounded outcome; secondary tablet contexts and co-occurrence alone do not establish a directed construction relationship. Existing first_known remains a material unreviewed baseline uncertainty.","verdict":"accept"},{"id":"dug-wells-in-neolithic-cyprus","name":"Dug wells in Neolithic Cyprus","date":"Approximately 8600–8200 cal BCE (Well 116 fill samples)","frozen_date":"7500-6700 cal BCE (fill of well 133)","lane":"architecture","region":"asia","domain":"construction","outcome":"deferred","finding":"Added a separate Well 116 event at Kissonerga-Mylouthkia. Three seeds from fills 123 and 124 are summarised by the 2003 excavation report as approximately 8600–8200 cal BCE. This anchors earlier well evidence while leaving the digging date approximate. Well 133 retains its original distinct date. Earlier publications recalibrate the same seed samples. Formal similarities with Shillourokambos, Atlit-Yam or later central European wells do not identify a transmission route.","next":"Inspect independently dated shaft construction levels at Shillourokambos and original mainland well features before claiming a shared construction lineage.","sources":[{"url":"https://www.scribd.com/document/176396632/Peltenburg-the-Colonisation-and-Settlement-of-Cyprus-Investigations-at-Kissonerga-Mylouthkia-1976-1996-2003","locator":"Chapter 11, §11.1 pp. 83–84, table 11.1 and fig. 11.3","note":"Final excavator report with sample identifiers, stratigraphy and explicit approximate range."},{"url":"https://www.bu.edu/asor/pubs/books-monographs/swiny.pdf","locator":"Peltenburg et al., pp. 62–63, table 1","note":"Earlier calibration of the same short-lived samples. Do not count it as independent radiocarbon evidence."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"New Well 116 event is distinct from Well 133 and dates fill, not the act of digging. Peltenburg 2001 table 1 identifies three separate samples from fills 123 and 124; the 2003 report uses an approximate 8600–8200 cal BCE Period 1A synthesis. 2007 recalibration is the same samples and includes a wider earliest interval. Do not treat approximate synthesis as exact calibrated bounds.","verdict":"accept"},{"id":"jointed-timber-pile-dwellings-at-hemudu-lower-yangtze","name":"Jointed timber pile-dwellings at Hemudu, lower Yangtze","date":"c. 7000 BP (c. 5050 BCE)","frozen_date":"c. 7000 BP (c. 5050 BCE)","lane":"architecture","region":"asia","domain":"construction","outcome":"deferred","finding":"Hemudu timber components document local carpentry. The individually examined posts at nearby Tianluoshan document timber construction in a related settlement, with their own context. Neither comparison establishes transfer of a particular joint. Eastern Saxon Altscherbitz is a different, distant use of mortise-and-tenon joinery. The primary 1978 Hemudu excavation report was identified but its full text was unavailable in this lane.","next":"Read the full Zhejiang 1978 excavation report (Acta Archaeologica Sinica 1978(1)) an
