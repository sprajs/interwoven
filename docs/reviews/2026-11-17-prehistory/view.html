d compare timber IDs, stratigraphy and direct dates against the Tianluoshan excavation report.","sources":[{"url":"https://doi.org/10.1002/9781118325698.ch27","locator":"Recent Research on the Hemudu Culture and the Tianluoshan Site, introduction and references","note":"Excavator’s overview names the original 1978 Hemudu and Tianluoshan reports. The web rendering provides only portions of the original chapter."},{"url":"https://en.chnmuseum.cn/Portals/0/web/exhibition/exhibitions/161120Chines-Epic/en.html","locator":"Hemudu Site exhibit description","note":"National Museum describes excavated rows of piles, logs and planks, without dating a specific joint."},{"url":"https://www.jstage.jst.go.jp/article/jgssp/8/13/8_v08.c60/_pdf/-char/ja","locator":"Tianluoshan geotechnical study, excavated pillars and fig. 1","note":"Primary pillar measurements and structural modeling, not evidence of a woodworking transmission route."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Unchanged; no link warranted from comparison with Tianluoshan or central European wells. The 1978 Hemudu full excavation report was unavailable; this is an access limitation, not proof against local joinery or contact. Existing BP conversion and origin interpretations are not newly reviewed.","verdict":"accept"},{"id":"settled-village-life-among-natufian-foragers-in-the-levant","name":"Settled village life among Natufian foragers in the Levant","date":"as early as 15,000 BP (c. 13,050 BCE)","frozen_date":"as early as 15,000 BP (c. 13,050 BCE)","lane":"architecture","region":"asia","domain":"construction","outcome":"candidate","finding":"The evidence establishes burnt-lime plaster in a bench-like built feature at Eynan. The feature’s role in the settlement remains open. A companion_of candidate asks whether it was used in residential or communal life. The dated Shelter 1 field observation and undated sample 86-1 have no proven join.","next":"Find the collection record for sample 86-1 and identify its original feature. Use the feature’s excavation and occupation sequence to test its function.","sources":[{"url":"https://repository.si.edu/server/api/core/bitstreams/90d7b2ae-44bf-4e69-909e-6315a31a861f/content","locator":"pp. 224, 226, table 1, sample 86-1","note":"Original microscopy and energy-dispersive X-ray analysis of incomplete calcination in an Eynan bench-like built feature. Sample from the Hebrew University collection with no published locus ID."},{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0130121","locator":"The Early Natufian architectural remains, fig. 1","note":"Independent architectural study describes a plastered bench in Shelter 1, layer II, using Perrot-era excavations. It does not reanalyse sample 86-1."},{"url":"https://journals.openedition.org/bmsap/pdf/9548","locator":"p. 16, Natufian landmarks, phase divisions","note":"About 13,000–11,600 cal BCE is a regional Early Natufian range. It is not a direct date on the plaster."},{"url":"https://www.imeko.org/publications/tc4-Archaeo-2022/IMEKO-TC4-MetroArchaeo2022-004.pdf","locator":"Materials and Methods and Results","note":"Original material analyses identify both anthropogenic burnt lime and natural calcium carbonate at different locations at Eynan. The paper does not identify a repeat test of the Eynan bench sample."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"The companion_of edge is explicitly a candidate question about feature function, not an asserted relation to residential or communal life. Sample identity and the function remain unresolved.","verdict":"accept"},{"id":"altscherbitz-tenon-well-frame","name":"Altscherbitz timber frame with wedged tenons","date":"5102 BCE timber felling to 5099 BCE construction-pit plank","frozen_date":"5102 BCE timber felling to 5099 BCE construction-pit plank","lane":"architecture","region":"europe","domain":"construction","outcome":"established","finding":"The split-oak lining and its wedged-tenon supporting frame worked together in the same well assembly, as described in Tegel et al., Results and figs. 4–5. A companion_of relation now captures this observed arrangement. The authors explicitly describe a split basal frame for Eythra E1 in Text S1. At Altscherbitz their splitting analysis concerns the lining, leaving preparation of the four basal-frame members unresolved. The distinct Ostrov assemblage remains evidence of the earlier regional splitting process.","next":"Find the basal-frame timber sample numbers and their grain orientations if a future claim needs to name which components were split in each direction.","sources":[{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0051374","locator":"Results, Well A, figs. 3–5, S8 and S9","note":"Original timber and dendrochronology observations. The authors distinguish felling in 5102 BCE from a separate pit plank of 5099 BCE."},{"url":"https://www.academia.edu/175380587/Multi_proxy_analysis_of_an_Early_Neolithic_wooden_well_in_a_pastoral_landscape_in_eastern_Bohemia","locator":"§3.1 Trace evidence, table 1, figs. 6–8; §3.2 Dendrochronology and radiocarbon dating","note":"Original Ostrov assemblage. The trees used for horizontal planks were felled in 5256–5255 BCE. Shared dendrochronology co-author and cross-dating do not make the local timber observations duplicates."},{"url":"https://af.exarc.net/issue-2015-2/ea/field-trials-neolithic-woodworking-relearning-use-early-neolithic-stone-adzes","locator":"Field trials and Conclusions","note":"Modern trials reconstruct log splitting and the Altscherbitz frame. They use the earlier excavation as a comparator, so they test feasibility without identifying the actual ancient tool."},{"url":"https://doi.org/10.1371/journal.pone.0051374.s001","locator":"Text S1, The Well from Altscherbitz (A) and The Well from Eythra (E1)","note":"The supplement specifically identifies the split members of the Eythra E1 basal frame. It does not give an equivalent attribution for the four basal-frame timbers at Altscherbitz."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"lbk-split-oak-well-timbers","to":"altscherbitz-tenon-well-frame","type":"companion_of","decision":"new-established","edges":[{"from":"lbk-split-oak-well-timbers","to":"altscherbitz-tenon-well-frame","type":"companion_of","from_event":"altscherbitz-split-oak-beams","to_event":"documented-case","before":"absent","after":"established","statement":"The split-oak lining of Altscherbitz Well A rested on a basal frame assembled with wedged mortise-and-tenon joints.","scope":"Physical support of the split-timber lining by the basal frame in Well A at Altscherbitz.","caveats":"The radial and tangential splitting observations concern the lining timbers. The preparation of the four basal-frame members remains unresolved.","evidence":[{"source":"w10-tegel-2012-altscherbitz-joinery","locator":"Results, Well A, figs. 4B–D and 5","supports":"The excavators identify split oak beams in the log lining and describe the lining as resting on the basal assembly, which has wedged tenons. Figure 4C–D shows the physical arrangement."}]}]}],"incident_causal_edges":[],"rationale":"The split-oak lining and wedged-tenon basal frame are physical components working together within the same well, matching companion_of. Tegel Results Well A establishes the configuration and splitting for the log lining; evidence does not identify the basal members as split. Ostrov is separate and no transfer is asserted.","verdict":"accept"},{"id":"bronocice-wheeled-vehicle-imagery","name":"Bronocice wheeled-vehicle imagery","date":"3635–3370 cal BCE (94.5%)","frozen_date":"3635–3370 cal BCE (94.5%)","lane":"architecture","region":"europe","domain":"transport","outcome":"deferred","finding":"Bronocice's associated dated material supports a vehicle depiction. Contemporary imagery in other Funnel Beaker settlements and physical tracks at Flintbek independently establish additional witnesses, leaving origin, direction and the specific construction or motive power behind the Bronocice image unsettled. Do not link the much later Sintashta horse traction or the different Mesopotamian potter's wheel on resemblance or sequence.","next":"Seek a securely associated local wheel, axle or other vehicle remains. Compare independently dated contact and material evidence before inferring transmission.","sources":[{"url":"https://eprints.whiterose.ac.uk/id/eprint/239379/1/10.1515_pz-2025-2032.pdf","locator":"Further evidence for the earliest wheeled transport in Europe?","note":"New imagery comparisons. Bronocice repeats GrN-19612 and is not a new independent assay of the object."},{"url":"https://www.cambridge.org/core/journals/antiquity/article/abs/earliest-evidence-of-wheeled-vehicles-in-europe-and-the-near-east/4835B594180234DC116F6F0105771573","locator":"pp. 778–780, Bronocice and table 1","note":"Earlier report including Bronocice excavators. The date pertains to associated material."},{"url":"https://www.academia.edu/2774737/The_Neolithic_burial_sequence_at_Flintbek_LA_3_north_Germany_and_its_cart_tracks_a_precise_chronology","locator":"Supplement summary and table 3","note":"Original Flintbek model is separate physical evidence. The supplement's Bronocice comparison reuses the radiocarbon measurement."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"No change; deferral of wheel construction or traction link is appropriate. Kowalski et al. Further evidence reports GrN-19612; the date is associated material, not a direct dating of depiction, and imagery remains an interpretation.","verdict":"accept"},{"id":"takarkori-early-dairying","name":"Takarkori early dairying","date":"Middle Pastoral contexts approximately 5210–3660 BCE","frozen_date":"Middle Pastoral contexts approximately 5210–3660 BCE","lane":"herds","region":"africa","domain":"food","outcome":"deferred","finding":"Added the primary lipid source to the existing Middle Pastoral event. di Lernia independently dates earlier caprine remains at the shelter, but these do not identify the milk producer in the later ceramics. Takarkori and Turkana provide separate regional evidence for milk use.","next":"Compare directly dated caprine and cattle assemblages across the Early and Middle Pastoral contexts with any species-specific milk residues. Establish stock or practice continuity before linking.","sources":[{"url":"https://www.nature.com/articles/nature11186","locator":"Abstract; Figs. 1–3","note":"Original Middle Pastoral sherd measurements. The 2018 synthesis incorporates this dataset."},{"url":"https://link.springer.com/article/10.1007/s10963-021-09162-8","locator":"Abstract and map of early cattle and caprines, panel b, site 30","note":"Abstract and figure evidence inspected. Full paper requires a subscription; earlier remains and later lipids are distinct materials."},{"url":"https://www.nature.com/articles/s41586-025-08793-7","locator":"Abstract; Discussion on the spread of pastoralism","note":"Human genomes from two later Takarkori burials inform population history and leave the route and dairy knowledge unresolved."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"takarkori-early-dairying","to":"turkana-early-pastoralism","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Disposition applies to changed claims only; unchanged baseline facts are not silently reapproved.","verdict":"accept"},{"id":"turkana-early-pastoralism","name":"Early Lake Turkana pastoralism","date":"Approximately 5000 years BP (3050 BCE)","frozen_date":"Approximately 5000 years BP (3050 BCE)","lane":"herds","region":"africa","domain":"food","outcome":"deferred","finding":"Added a site-level episode from Dongodien with one pottery residue consistent with ruminant milk. The regional early dates and the lipid-bearing sherd's contextual range answer different questions. A direct Takarkori-to-Turkana transmission remains unestablished.","next":"Match the dairy-classified sherd to its exact sampled context and AMS result. Trace stock and culinary evidence in documented intermediary settlements.","sources":[{"url":"https://doi.org/10.1073/pnas.1920309117","locator":"Table 1; Lipid residue results, Meat and milk; Fig. 4","note":"A pot is classified as dairy among five interpretable Dongodien extracts. The c. 5000–4500 cal BP range is the site context."},{"url":"https://www.cambridge.org/core/journals/antiquity/article/lithic-technological-strategies-of-the-earliest-herders-at-lake-turkana-northern-kenya/0931AEA12C986267411F6982D075A913","locator":"Early herding sites in northern Kenya","note":"Independent lithic study with a 4500–4000 cal BP archaeological context range. Its site ages cite earlier archaeology."},{"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6827346/","locator":"Introduction and Discussion","note":"Human admixture evidence is informative for regional spread and cannot identify a particular dairy technology or source population at the site."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[{"from":"takarkori-early-dairying","to":"turkana-early-pastoralism","type":"transmitted_from","decision":"deferred","edges":[]}],"incident_causal_edges":[],"rationale":"Disposition applies to changed claims only; unchanged baseline facts are not silently reapproved.","verdict":"accept"},{"id":"asikli-caprine-management","name":"Aşıklı Höyük early caprine management","date":"Approximately 8400 cal BCE","frozen_date":"By approximately 8200 cal BCE","lane":"herds","region":"asia","domain":"food","outcome":"deferred","finding":"Added the earlier Level 5 episode of small-scale capture and keeping, dated approximately 8400 cal BCE. The s remain unresolved.","next":"Find earlier directly dated canids and a denser regional genomic sequence that can resolve ancestry direction and the source of domestication.","sources":[{"url":"https://doi.org/10.1038/s41586-026-10170-x","locator":"pp. 996–997, Dogs were widespread during the Palaeolithic; Fig. 1d","note":"Nuclear assignments and direct ranges of 15,915–15,669 cal BP at Pınarbaşı and 14,793–14,090 cal BP at Gough’s Cave. Fig. 1d places these specimens and one from Bonn-Oberkassel in mitochondrial clade C5."},{"url":"https://doi.org/10.1038/s41586-026-10112-7","locator":"pp. 986–988; Fig. 1","note":"Other newly analysed specimens, notably the 14.2 ka Kesslerloch dog. Some author and comparative dataset overlap with Marsh; the fossils differ."}],"graph_status_before":"open","graph_status":"open","after":{},"connections":[],"incident_causal_edges":[],"rationale":"Disposition applies to changed claims only; unchanged baseline facts are not silently reapproved.","verdict":"accept"},{"id":"kujawia-dairy-straining","name":"Kuyavia dairy straining","date":"Approximately 5200–4800 BCE","frozen_date":"Approximately 5200–4800 BCE","lane":"herds","region":"europe","domain":"food","outcome":"established","finding":"Proposed a separate cattle husbandry record for Ludwinowo 7 and a site- and phase-scoped uses_process link. Cattle bones, tooth isotopes and dairy-bearing perforated sherds concern the same occupational phases. The 2023 integrated study identifies cattle as the probable principal supplier and allows other ruminant milk. Herd management and ceramic curd separation are distinct practices evidenced by different objects. Neither is a duplicate of another catalogue record.","next":"Species-specific milk proteins from the phase IIB and III sieves could resolve the share of cattle and caprines.","sources":[{"url":"https://doi.org/10.33547/ODA-SAH.08.Lud.07.1","locator":"Chapter 7.1, §§7.1.1, 7.1.4–7.1.5","note":"Primary zooarchaeological comparison and animal
