<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="960" height="354" viewBox="0 0 960 354" role="img">
  <title id="title">What the excavation records identify</title>
  <desc id="desc">Shelter 1 and Eynan sample 86-1 lack a shared inventory number. At Kfar Samir, the same field photograph identifies the dated basket, while its use remains open.</desc>
  <rect width="960" height="354" fill="#fbfaf6" />
  <text font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" x="23" y="35" fill="#213a36">What the excavation records identify</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="23" y="71" fill="#213a36">Eynan / ʿAin Mallaha</text>
  <rect x="23" y="83" width="294" height="90" rx="5" fill="#e1eee8" />
  <text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" x="35" y="108" fill="#213a36">Field record</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="35" y="133" fill="#213a36">The 1955 photo shows</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="35" y="154" fill="#213a36">Shelter 1 and its rim.</text>
  <rect x="334" y="83" width="294" height="90" rx="5" fill="#e1eee8" />
  <text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" x="346" y="108" fill="#213a36">Laboratory record</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="346" y="133" fill="#213a36">Sample 86-1 came through</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="346" y="154" fill="#213a36">the Hebrew University collection.</text>
  <rect x="645" y="83" width="294" height="90" rx="5" fill="#f8e9ce" />
  <text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" x="657" y="108" fill="#213a36">Unresolved identity</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="657" y="133" fill="#213a36">The descriptions fit. No shared</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="657" y="154" fill="#213a36">field number has been traced.</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" x="23" y="214" fill="#213a36">Kfar Samir</text>
  <rect x="23" y="226" width="294" height="90" rx="5" fill="#e1eee8" />
  <text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" x="35" y="251" fill="#213a36">Field record</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="35" y="276" fill="#213a36">The winter 1994 excavation</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="35" y="297" fill="#213a36">recovered three braided pieces.</text>
  <rect x="334" y="226" width="294" height="90" rx="5" fill="#e1eee8" />
  <text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" x="346" y="251" fill="#213a36">Object identified</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="346" y="276" fill="#213a36">Matching photographs trace the</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="346" y="297" fill="#213a36">pieces to catalogue item KS 2.</text>
  <rect x="645" y="226" width="294" height="90" rx="5" fill="#f8e9ce" />
  <text font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" x="657" y="251" fill="#213a36">Unresolved use</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="657" y="276" fill="#213a36">The braiding was directly dated.</text>
  <text font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" x="657" y="297" fill="#213a36">Use for pressing remains open.</text>
</svg>
