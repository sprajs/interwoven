  <script type="application/json" data-cases>[{"lane":"eynan","kind":"artifact","title":"Tracing Eynan plaster sample 86-1 to Shelter 1","question":"Did the burnt-lime sample analysed as 86-1 come from the plastered rim of Early Natufian Shelter 1 at Eynan-Mallaha, and what does the evidence establish about the feature's use?","summary":"Shelter 1 is a plausible match for the bench-like feature described in the laboratory report. The excavation photograph and plan identify the shelter, and a published comparison explicitly proposes the match. The laboratory report traces the specimen to the Hebrew University collection through Ofer Bar-Yosef. The link between the collection specimen and the position sampled in the excavation is still missing.","steps":[{"title":"Locate Shelter 1 in the excavation record","action":"Compare the original November 1955 excavation photograph reproduced by the current field team with the phase-coded plan. Check the archived French titles for the same numbered feature.","result":"The archival photo labels portions of Shelter 1 on either side of Shelter 3. Its caption identifies Shelter 1's plastered perimeter, upright slabs, partly paved floor and square hearth. Haklay and Gopher place Shelter 1 near Cemetery A in Early Natufian Layer II, away from Shelters 131 and 51. The Nanterre archive uses abri n° 1, locus n° 1 and the early interpretation La grande tombe. JP557 also contains plates of Locus 3, so the dossier title alone does not identify the contents of an individual image.","sources":[{"title":"Bocquentin and colleagues, Hunter-gatherer-builders (2025)","url":"https://www.sciencedirect.com/science/article/pii/S2352226725000285","locator":"Section 2.2, figure 4 and caption, and table 1"},{"title":"November 1955 field photograph from the Jean Perrot fonds","url":"https://ars.els-cdn.com/content/image/1-s2.0-S2352226725000285-gr4_lrg.jpg","locator":"Figure 4, source credit JP646–JP659. The study does not supply an individual slide identifier."},{"title":"Haklay and Gopher, A New Look at Shelter 131/51 (2015)","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0130121","locator":"The Early Natufian architectural remains, figure 1, top left of the plan, numbered 1 in Layer II"},{"title":"MSH Mondes, Jean Perrot fonds finding aid","url":"https://archives.mshmondes.cnrs.fr/downloads/jean-perrot-du-village-a-letat-au-proche-et-moyen-orient-diffusion.pdf#page=21","locator":"Printed pp. 21–22, JP557, La grande tombe (abri n° 1), plate 25 Locus 1. The catalogue description was inspected."}]},{"title":"Follow Perrot's descriptions and illustrations","action":"Trace the first excavation interpretation, the 1966 feature description and the second Perrot reference used by the laboratory study. Compare the description with the plan and photos reproduced from the excavators' work.","result":"The current field team dates Perrot's first interpretation of the built complex as a monumental grave to his 1957 report in Antiquity and Survival. In 1966 he reconsidered the complex as superimposed dwellings. Perrot's p. 445, quoted by Dubreuil, describes a polished coating with red surviving inside a shallow circular depression about 5 m across. It extended over the edge as an outward-sloping rim, about 70 cm wide and bordered by upright stones. Goring-Morris and Belfer-Cohen reproduce a plan and photographs of the installation after Perrot (1966) and Perrot and Ladiray (1988). Kingery's other citation, Perrot's Mallaha (Eynan), 1975, discusses House 131, with a different plan and excavation photograph. The 1957 and 1966 full articles were not retrieved. The 1957 and 1966 archival dossiers identify where to inspect the original inked plans and the 1966 offprint.","sources":[{"title":"MSH Mondes, Jean Perrot fonds, publication dossiers","url":"https://archives.mshmondes.cnrs.fr/downloads/jean-perrot-du-village-a-letat-au-proche-et-moyen-orient-diffusion.pdf#page=92","locator":"Printed p. 92, JP664 for Le Mésolithique de Palestine (Antiquity and Survival 2, 1957, pp. 91–110) and JP665 for Le gisement natoufien de Mallaha (L'Anthropologie 70, 1966)"},{"title":"Dubreuil, Étude fonctionnelle des outils de broyage natoufiens (2002)","url":"https://oskar-bordeaux.fr/bitstream/handle/20.500.12278/25427/DUBREUIL_LAURE_2002.pdf?isAllowed=y&sequence=1","locator":"Printed p. 124, section 1.4.1.4 reproduces the French description in Perrot 1966, p. 445"},{"title":"Goring-Morris and Belfer-Cohen, A Roof Over One’s Head (2008), author copy","url":"https://www.academia.edu/6954267/A_Roof_Over_One_s_Head_Developments_in_Near_Eastern_Residential_Architecture_Across_the_Epipalaeolithic_Neolithic_Transition","locator":"Pp. 246–247, figures 5–6 and captions. Figure 6 is credited to Perrot 1966 and Perrot and Ladiray 1988."},{"title":"Perrot, Mallaha (Eynan), 1975","url":"https://www.persee.fr/doc/paleo_0153-9345_1974_num_2_2_1072","locator":"Pp. 485–486 and plate I, House 131. Paléorient's issue is catalogued as 1974 and the report title says 1975."}]},{"title":"Read the laboratory label and collection credit","action":"Check the sample row, methods, institutional footnote and discussion in the 1988 laboratory report. Follow the named supplying collection and distinguish the published number from a field or museum identifier.","result":"Kingery, Vandiver and Prickett describe 86-1 as hard tan or brown material from an Eynan bench-like structure and interpret its microstructure and composition as incompletely calcined lime plaster altered after deposition. The footnote says it came from the Institute of Archaeology at the Hebrew University of Jerusalem, courtesy of Ofer Bar-Yosef. It supplies no field or collection catalogue number, sampling point, locus, layer or collection date for 86-1. The Institute describes its collections and archives, but a public sample-level record or transfer slip for 86-1 was not located. Harvard's listed Bar-Yosef personal archive has accessions dated 1988–2008 and no pertinent file was identified. The Smithsonian's public laboratory finding aids identify institutional holdings with overlapping dates but do not establish custody of 86-1 or identify its receipt.","sources":[{"title":"Kingery, Vandiver and Prickett, The Beginnings of Pyrotechnology, Part II (1988)","url":"https://repository.si.edu/server/api/core/bitstreams/90d7b2ae-44bf-4e69-909e-6315a31a861f/content","locator":"Pp. 222–223, methods. P. 224, table 1, Eynan row 86-1. P. 225, table 1 footnote marked †. P. 226, Eynan discussion."},{"title":"Hebrew University Institute of Archaeology, Collections","url":"https://archaeology.huji.ac.il/collections","locator":"Institute Collections and description of the Institute Archives"},{"title":"Harvard University Archives, Ofer Bar-Yosef personal archive","url":"https://guides.library.harvard.edu/c.php?g=1034799&p=7501235","locator":"Bar-Yosef, Ofer, collection-level entry. Harvard catalogue ID 990138604640203941."},{"title":"Smithsonian Institution Archives, Conservation Analytical Laboratory director's records","url":"https://siarchives.si.edu/collections/siris_arc_279689","locator":"Accession 08-109, 1982–1986, overview and container list"},{"title":"Smithsonian Institution Archives, Museum Conservation Institute director's records","url":"https://siarchives.si.edu/collections/siris_arc_371246","locator":"Accession 15-273, 1959–2014, overview and container list, including predecessor laboratory material"}]},{"title":"Identify the missing field catalogue entry","action":"Look up the Perrot field catalogue, early notebooks, Shelter 1 drawings and photographic catalogue in the Nanterre finding aid. Check what can be inspected online.","result":"The strongest field lead is JP220, explicitly catalogued as containing a sample catalogue for 1955–1961. JP216 holds two notebooks from the 1955, 1956 and 1959 campaigns. JP553 contains original sections and drawings for loci 1, 26–29 and 51 and cross-references early records in JP220. JP557 plate 25 is catalogued as Locus 1. The archive lists 40 digitized slides for the 1955 campaign under JP646, EM_dia_1955_01 through EM_dia_1955_40. The contents of the JP220 sample catalogue and the original JP553 drawings were not available in the copies retrieved. The published Figure 4 is an accessible reproduction of a 1955 field photo, credited to JP646–JP659 as a group.","sources":[{"title":"MSH Mondes, Jean Perrot fonds finding aid","url":"https://archives.mshmondes.cnrs.fr/downloads/jean-perrot-du-village-a-letat-au-proche-et-moyen-orient-diffusion.pdf","locator":"Printed p. 8, JP216. P. 11, JP220. P. 14, JP553. Pp. 21–22, JP557. Pp. 75–76, JP646–JP659 and individual digitized identifier range for JP646."},{"title":"Eynan-Mallaha excavation project, Des archives au terrain","url":"https://archeologie.culture.gouv.fr/fr/eynan-mallaha","locator":"Des archives au terrain, dépôt at MSH Mondes in Nanterre and ongoing work on legacy inventories, notebooks and photographs"}]},{"title":"Test whether the descriptions identify the same sample","action":"Compare the excavator's rim, the laboratory description and later analyses of other material at Eynan. Check whether any independent report gives a numbered sampling position for 86-1.","result":"Dubreuil explicitly argues that the feature analysed by Kingery and colleagues probably corresponds to Perrot's margelle. This is a published comparison of the descriptions. Kingery's sample row gives no arc dimensions, upright stones, red finish or other field marker that singles out the specimen's sampling spot. Valla and colleagues analysed other Eynan lime material, including flat pieces lining Locus 239 under Shelter 26, in separate samples documented in table 5. The Raman and micromorphology study by Es Sebar and colleagues distinguished lime plaster from other carbonate-rich material at the site, including geological and later-precipitated calcite. Neither study identifies or retests 86-1.","sources":[{"title":"Dubreuil, Étude fonctionnelle des outils de broyage natoufiens (2002)","url":"https://oskar-bordeaux.fr/bitstream/handle/20.500.12278/25427/DUBREUIL_LAURE_2002.pdf?isAllowed=y&sequence=1","locator":"Printed p. 124, section 1.4.1.4, explicit probable match to Perrot 1966, p. 445"},{"title":"Valla and colleagues, Les fouilles de Ain Mallaha de 2003 à 2005 (2007)","url":"https://www.academia.edu/68290979/Les_fouilles_de_Ain_Mallaha_Eynan_de_2003_%C3%A0_2005_quatri%C3%A8me_rapport_pr%C3%A9liminaire","locator":"Pp. 146–148 and figure 3, Locus 239 placement. Pp. 162–165 and table 5, analysis and separately numbered samples."},{"title":"Es Sebar and colleagues, Raman and micromorphological characterization (2022)","url":"https://www.imeko.org/publications/tc4-Archaeo-2022/IMEKO-TC4-MetroArchaeo2022-004.pdf","locator":"Sections III–V, especially figure 3 and geogenic and secondary calcite classifications"}]},{"title":"Assess use independently of specimen identity","action":"Compare the publication sequence with the excavation team's current interpretation of the architecture, its relation to graves and documented modern disturbance.","result":"The construction and plastered perimeter are visible in the documented feature. The modern cut had already removed part of Shelter 1. The field team describes a disputed sequence and still considers the relation of the nested shelters to funerary activity open. A recovered sampling record could settle whether 86-1 dates to the Early Natufian context of Shelter 1. The historic function would still require evidence relating the bench, occupation surfaces and any burials by phase.","sources":[{"title":"Bocquentin and colleagues, Hunter-gatherer-builders (2025)","url":"https://www.sciencedirect.com/science/article/pii/S2352226725000285","locator":"Section 2.2 and figure 4, modern cut and changing interpretation of Shelters 1 and 3"},{"title":"Haklay and Gopher, A New Look at Shelter 131/51 (2015)","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0130121","locator":"The Early Natufian architectural remains, field layout and discussion of interpretations of Shelter 1"}]}],"decision":"Record this as a plausible descriptive match with unresolved specimen provenance. Keep the Early Natufian field observation at Shelter 1 separate from the laboratory identification of 86-1 at Eynan. The existing candidate link and provenance note cite the published comparison, the laboratory's collection credit and the archive finding aid. The specimen has no secure field date, and the question about the feature's use remains open.","next":"Inspect the 1955–1961 sample catalogue in JP220 at MSH Mondes, using the Shelter 1 notebook, section or photograph to map any entry for the margelle or red enduit. Match its field number and sampling position to an original label, dispatch record or laboratory intake entry tied to 86-1 from the Hebrew University collection. If the number is absent, an annotated sampling photograph or a separately analysed surviving fragment with a drawing-based provenance could settle the material identification at Shelter 1. A new sample would have its own identity.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"source_checks":[{"url":"https://www.academia.edu/45082621/The_Beginnings_ofPyrotechnology_Part_IT_Production_and_Use_of_Lime_and_Gypsum_Plaster_in_the_Pre_Pottery_Neolithic_Near_East","locator":"Kingery et al. pp.224–226, table 1 and footnote","availability":"original article searchable transcription read; Smithsonian direct PDF timed out","independence":"original material analysis, same sample not independently corroborated by later studies"},{"url":"https://oskar-bordeaux.fr/bitstream/handle/20.500.12278/25427/DUBREUIL_LAURE_2002.pdf?isAllowed=y&sequence=1","locator":"p.124 §1.4.1.4","sha256":"71a3c89d2c7015ace1b625c4c1eeaae63e69cdfe0172c7ce701d455154492035","availability":"local full PDF independently read","independence":"author’s explicitly probable comparison; Perrot quotation is secondary and does not provide specimen accession"},{"url":"https://archives.mae.parisnanterre.fr/downloads/jean-perrot-du-village-a-letat-au-proche-et-moyen-orient-diffusion.pdf","locator":"printed pp.8,11,14,21–22,75–76,92","availability":"original institutional archive finding aid read; item contents not examined","independence":"finding aid describes collections; its identifiers are document shelfmarks not verified specimen identities"},{"url":"https://ars.els-cdn.com/content/image/1-s2.0-S2352226725000285-gr4_lrg.jpg","locator":"Bocquentin et al. 2025 figure 4","sha256":"9faa6bf91e239e61c2234e68a88b20087c3774f18cc3b9513d133ddc9fa3f8e8","availability":"independently viewed local reproduced image; journal article direct access 403 in this execution","independence":"archival field view reproduced and annotated later; image cannot identify laboratory sample"},{"url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0130121","locator":"Early Natufian architectural remains, figure 1","availability":"original article text read","independence":"site architectural interpretation of Perrot field plans; does not establish Kingery specimen join"},{"url":"https://www.persee.fr/doc/paleo_0153-9345_1974_num_2_2_1072","locator":"Perrot report pp.485–486 and plate I","availability":"original publication read","independence":"House 131 distinct from Shelter 1; no matching laboratory identifier"},{"url":"https://www.academia.edu/68290979/Les_fouilles_de_Ain_Mallaha_Eynan_de_2003_%C3%A0_2005_quatri%C3%A8me_rapport_pr%C3%A9liminaire","locator":"Valla et al. pp.146–148, 162–165 and table 5","availability":"original excavation publication transcription read","independence":"distinct Locus 239 later samples; no proof of 86-1 crosswalk"},{"url":"https://www.imeko.org/publications/tc4-Archaeo-2022/IMEKO-TC4-MetroArchaeo2022-004.pdf","locator":"Es Sebar et al. sections III–V, figure 3","availability":"original paper read","independence":"separate samples and techniques; no identified repeat test of 86-1"},{"url":"https://guides.library.harvard.edu/c.php?g=1034799&p=7501235","locator":"Bar-Yosef personal archive collection-level entry","availability":"finding aid read","independence":"collection-level inventory 1988–2008 does not establish contents of individual files"},{"url":"https://siarchives.si.edu/collections/siris_arc_279689","locator":"SIA accession 08-109; director records","availability":"collection finding aid read","independence":"does not establish custody of sample or intake documentation"},{"url":"https://siarchives.si.edu/collections/siris_arc_371246","locator":"SIA accession 15-273; director records","availability":"collection finding aid read","independence":"does not establish custody of sample or intake documentation"}],"limitations":["Perrot 1957 and 1966 articles and original JP220/JP553 contents not independently available; the 1966 passage was read in Dubreuil’s quotation.","Bocquentin 2025 full article was blocked in this review; the separately available annotated image was examined, not its full caption from the article.","No field accession, sampling position, dispatch slip or lab intake record proved the 86-1 to Shelter 1 match; no inference of universal absence or historical function."],"claim_reviews":[{"path":"title, question, summary, decision and next","decision":"accept","rationale":"Kingery table 1 sample 86-1 and footnote document collection source and bench-like feature; Dubreuil p.124 calls the match to Perrot’s Shelter 1 description probable rather than a confirmed specimen match. Source record or field catalogue/dispatch comparison remains the correct next route. A newly sampled fragment would not be 86-1."},{"path":"steps/0 locate Shelter 1","decision":"accept","rationale":"Haklay and Gopher Early Natufian remains and fig.1 identify layer II and Shelter 1; archive JP557 finding aid pp.21–22 labels La grande tombe (abri 1), plate 25 locus 1, while other plates include locus 3. Independently viewed the reproduced field photograph with later Shelter 1/3 labels. Published photo does not itself carry the laboratory specimen identifier."},{"path":"steps/1 Perrot descriptions","decision":"accept","rationale":"Dubreuil p.124 §1.4.1.4 reproduces Perrot 1966 p.445 on feature dimensions and polished coating; quotation remains a secondary reproduction since original 1966 paper not opened. Perrot 1975 original pp.485–486 and plate I concern House 131; archive JP664/JP665 lists preparatory records. The earlier and later original reports were not conflated."},{"path":"steps/2 laboratory and collection credit","decision":"accept","rationale":"Kingery et al. 1988 pp.224–226, table 1 and footnote explicitly identify 86-1, site, material, interpretation and collection credit; do not identify field position or catalogue accession. HUJI collection page and Smithsonian/Harvard finding aids are leads rather than custody or absence proof."},{"path":"steps/3 field catalogue","decision":"accept","rationale":"MSH Mondes Perrot fonds finding aid pp.8, 11, 14, 21–22 identifies JP216 notebooks, JP220 sample catalogue, JP553 sections and JP557 plate 25 locus 1. These describe potential documents, not an observed sample link. JP646 photo series identifiers provide route, not particular figure attribution."},{"path":"steps/4 material comparison","decision":"accept","rationale":"Dubreuil p.124 uses probablement; Valla et al. 2007 pp.146–148, 162–165/table 5 reports distinct Locus 239 material and sample identifiers; Es Sebar et al. 2022 distinguishes several carbonate categories. None independently identifies or retests 86-1."},{"path":"steps/5 historic function","decision":"accept","rationale":"Shelter 1 field evidence and modern disturbance provide context but cannot establish function of sample 86-1; decision properly separates context, identity and use."},{"path":"relationship and data model","decision":"accept","rationale":"No discovery file or established link added; baseline candidate companion_of remains a question. Site coincidence and a probable descriptive comparison do not satisfy the exact companion_of functional relationship or establish a dated specimen event."},{"path":"data/discoveries/construction/burnt-lime-plaster-in-the-epipalaeolithic-and-neolithic-levant.json#research.unresolved/eynan-plaster-sample-provenance","decision":"accept","rationale":"Kingery et al. table 1 and footnote trace sample 86-1 to the Hebrew University collection courtesy Ofer Bar-Yosef; Dubreuil p.124 §1.4.1.4 explicitly proposes a probable match to the Perrot Shelter 1 feature, without a common accession; the MSH finding aid p.11 lists JP220 sample catalogue. The source-based lead and unknown identity remain appropriately qualified."},{"path":"data/discoveries/construction/settled-village-life-among-natufian-foragers-in-the-levant.json#links/0 finding and evidence","decision":"accept","rationale":"The Kingery collection chain, Dubreuil probable comparison and JP220 archive lead are source-grounded, with unverified sample field number and feature function explicitly unresolved. The existing candidate companion_of status and question remain unchanged, not an established historical relationship. Both endpoints are regional lime process and Natufian settlement practice; neither similarity nor site context establishes an actual joint function.","relation_attestation":{"relation":"question whether feature functioned in residential/communal settlement life","direction":"candidate affinity question, no claimed transmission or production dependence","context":"Eynan bench-like sample and Shelter 1 may match but accession crosswalk missing","status":"candidate","independent_corroboration":"Dubreuil compares earlier descriptions, not an independent specimen trace; Kingery and field sources provide distinct observations","historical_or_question":"plaster sample and field bench observations supported separately; identity and function retained as questions"}},{"path":"data/sources/d/dubreuil-2002-mallaha-plastered-rim.json","decision":"accept","rationale":"Original thesis p.124 §1.4.1.4 calls the link probable, quotes Perrot, and provides no shared field number. The source record correctly preserves lineage and qualification."},{"path":"data/sources/k/kingery-1988-eynan-lime-plaster.json#passages/1","decision":"accept","rationale":"Original article p.225 table 1 footnote gives collection and Ofer Bar-Yosef as courtesy for samples 86-1 and 86-2; no corresponding field identifier is furnished."},{"path":"data/sources/m/msh-mondes-jean-perrot-fonds-finding-aid.json","decision":"accept","rationale":"Original archive finding aid p.11 lists JP220 including 1955–1961 sample catalogue. The dossier description does not itself identify individual samples; uninspected catalogue is a lead."}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"independent review","independence":"Separate from gpt-6.2-sol high proposer; independently read cited sources, examined photograph and archive descriptions."},"overall_decision":"accept","worker_commit":"0eff1a11700e70d521e520e5fd7f5cfe73a6381e","verified_commit":"0eff1a11700e70d521e520e5fd7f5cfe73a6381e","files_checked":6}},{"lane":"samir","kind":"artifact","title":"The Kfar Samir basket in Figure 5 and KS 2","question":"Does the 1997 underwater image show the same fragments later called KS 2, where and when were they recovered, and how much does the evidence say about pressing olives?","summary":"Three distinctive fragments and the same underwater scene link the 1997 Figure 5, the 2007 Israel Antiquities Authority excavation report and the 2023 KS 2 catalogue entry. The field report assigns a direct radiocarbon result of 5000–4730 cal BCE (RT 4689) to the braiding and locates its pit several dozen metres north of a crushed-olive installation. The proposed pressing function remains an inference from the basket form, olive stones in the basket pit and a later ethnographic comparison.","steps":[{"title":"Locate the original published scene","action":"Read the earliest accessible publication and its figure directly. Compare its caption, installation map, field descriptions and radiocarbon sample table with the later catalogue identifiers.","result":"Galili et al. (1997) Fig. 5 pictures a woven fragment associated with olive stones and labels the scale as 20 cm. The caption uses reed and gives no object or pit number. Fig. 2a and Fig. 7 identify pit 6 separately, with dimensions 0.60 × 0.50 m, a pebble bed and crushed olives, pulp, and smaller plant fragments. Table 3 assigns RT-1929A to pit 7 olive stones, RT-855 to the pit 8 woven mat and PTA-3821 to wood from well 3. The public abstract of the 1994–1995 Galili and Sharvit article reports that about 73% of the stones from the pebble-bottomed pit were crushed, with sharp edges and pulp. This gives an earlier description of the extraction assemblage. The ESI 13 parallel entry and the 1990 and 1994–1995 journal records were located, but the full pages were unavailable through the accessed routes. The 1997 photograph is the earliest view verified in the accessible publications.","sources":[{"title":"Galili et al. 1997, Evidence for Earliest Olive-Oil Production","url":"https://www.researchgate.net/profile/Weinstein-Evron-Mina/publication/248578882_Evidence_for_Earliest_OliveOil_Production_in_Submerged_Settlements_off_the_Carmel_Coast_Israel/links/5ab27c35aca2721710019c6b/Evidence-for-Earliest-OliveOil-Production-in-Submerged-Settlements-off-the-Carmel-Coast-Israel.pdf","locator":"Figs. 1–2 and 5, pp. 1142–1145, and Table 3, p. 1148. Published text and captions inspected."},{"title":"Figure 5 image from the authors' uploaded article","url":"https://www.academia.edu/figures/12216744/figure-5-woven-reed-fragment-found-associated-with-olive","locator":"Caption and linked image. The host's extraction labels its page Figure 6, while the printed figure caption is Figure 5."},{"title":"Galili and Sharvit 1994–1995, Evidence of Olive Oil Production from the Submerged Site at Kfar Samir","url":"https://www.jstor.org/stable/23380046","locator":"Mitekufat Haeven 26, pp. 122–133. Bilingual abstract inspected in the public preview. Full article requires sign-in."},{"title":"Carmi and Segal 1994–1995, Radiocarbon Dates of Olive Stones","url":"https://www.jstor.org/stable/23380048","locator":"Mitekufat Haeven 26, pp. 146–147, issue contents. Full chapter unavailable through the accessed route."},{"title":"Israel Antiquities Authority, Excavations and Surveys in Israel 13","url":"https://publications.iaa.org.il/esi_english_series/7/","locator":"Contents entry Kafr Samir, G-26/92, Galili, Sharvit and Kislev. The PDF download returned a 403. The 2007 English field report cites ESI 13:31–32 for the separate oil installation."}]},{"title":"Verify the physical object across publications","action":"Compare field and post-conservation images directly. Look for multiple irregular details tied to the fragments and their surroundings, and record different orientations, scales and source credits.","result":"The actual 1997 Fig. 5 scan, IAA 2007 Fig. 3 and 2023 Fig. 7a show the same underwater scene at different crops and contrast. A striped scale board has the same orientation against a clay fissure and a pale oval pebble to its right. The frayed crescent above the board, a short upright strand by the pebble and crossed branches below the board match. The 2007 Fig. 4A possible base has a central loss and detached arc below, both turned about 90 degrees anticlockwise in 2023 Fig. 7b, where the arc is on the right. The unique bent strands of the two wall pieces in 2007 Fig. 4B–C match the two pieces on the right in Fig. 7b. Fig. 7c retains the distinctive pattern of the earlier Fig. 5 twining sketch. The 2023 conserved pieces have separate 3 cm bars. The 1997 paper acknowledges J. Galili for underwater photographs without a Fig. 5 byline, the IAA report credits T. Sagiv for survey photography with IAA copyright, and the 2023 composite credits E. Galili and the IAA. These group credits do not assign the original frame to a named photographer.","sources":[{"title":"Galili et al. 1997, Fig. 5 image asset","url":"https://figures.academia-assets.com/40144739/figure_006.jpg","locator":"Printed p. 1145. SHA-256 bad3abf30e947ac418d64a0d335fc961f7fd2c5f373a66cdd3f467732572bf73."},{"title":"Galili, Rosen and Boaretto 2007, Haifa, Kafr Samir","url":"https://hadashot.iaa.org.il/report_detail_eng.aspx?id=552&mag_id=112","locator":"Figs. 3–5 under Figs. 1–5 and introductory survey credits."},{"title":"Rosenberg et al. 2023, The Unseen Record","url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/Levant/Israel-Rosenberg2023.pdf#page=8","locator":"Printed PDF p. 8, Fig. 7a–c and caption."}]},{"title":"Trace recovery, conservation and the sample","action":"Read the official report in its original and translated versions. Use report aliases and sample and survey identifiers to check public archives and distinguish excavation coverage, conservation, physical custody and laboratory evidence.","result":"The IAA field report records three pieces from one winter 1994 pit, 0.90 m across and 0.55 m deep, cut into clay at a water depth of 2.3 m, about 65 m west of the paved bowl findspot. The fill contained dozens of olive stones. Hebrew confirms the thin branches measure 3–5 mm, correcting the English unit typo, and both versions give the calibrated 5000–4730 BCE range for the braiding (RT 4689). The report names the IAA Maritime Archaeological Unit, permits G-26/1992 and G-21/1994, site map references NIG 19616/74442 and OIG 14616/24442, and transfer of the survey's plant finds to the Israel Museum laboratories in Jerusalem for treatment. The IAA guest catalogue returned both permits when searched with כפר סמיר. The RT 4689 search returned five records, including the same 2007 publication and the 1994–2005 survey with permit G-21/1994. The survey catalogue record corroborates the project and permit, with no published basket accession, sample worksheet or collection transfer entry found in these results. KS 2 is the 2023 study's label, and RT 4689 identifies the assay. The 2023 methods describe IAA treasury storage of the waterlogged wooden objects generally and single out the separate KS 4 bowl as on display at the Israel Museum. They give no catalogue or store entry specific to this basket.","sources":[{"title":"2007 IAA excavation report, Hebrew","url":"https://hadashot.iaa.org.il/Report_Detail.aspx?id=552&mag_id=112","locator":"License introduction and final three paragraphs, including diameter in mm and דגימה 4689 RT."},{"title":"2007 IAA excavation report, English","url":"https://hadashot.iaa.org.il/report_detail_eng.aspx?id=552&mag_id=112","locator":"Survey credits, conservation transfer and winter 1994 account."},{"title":"IAA National Archaeological Database, RT 4689 search","url":"https://discover.iaa.org.il/?entity_index=0&tabId=0&freeText=RT%204689","locator":"Guest list view, five records as inspected 2026-11-17."},{"title":"IAA National Archaeological Database, 1994–2005 sea survey","url":"https://discover.iaa.org.il/?entity_index=0&tabId=0&freeText=RT%204689&entityId=4527063&entityType=survey","locator":"Licenses table, first row G-21/1994, Ehud Galili and Jacob Sharvit. IAA persistent catalogue identifier 882-840-5107."},{"title":"Rosenberg et al. 2023, storage and conservation methods","url":"https://www.mdpi.com/1999-4907/14/12/2373","locator":"Section 2.1, Field, final paragraph. General storage and separate bowl exception."}]},{"title":"Reconcile the later descriptions and dates","action":"Compare pictures, measurements, sample labels, report history and site identifiers in the later papers. Keep different archaeological contexts and unverified sample codes distinct.","result":"Skyllis Fig. 13A (2013) and 2017 Fig. 7.5a show the same conserved possible base with the missing sector and detached arc on the right and a 0–3 cm scale. Their companion panels show a modern pressing basket. The two publications repeat the 1994 pit dimensions. Galili et al. (2018) explicitly distinguish the 0.90 × 0.55 m braided-twig pit, the pebble-bottomed crushed-olive pit and the shallower coiled mat. Galili et al. (2020) repeat the two contexts and reproduce the same archaeological and modern basket photographs used in 2017. The 2017 caption credits the archaeological panel to the IAA, while the 2020 caption credits both photographs to E. Galili. The 2023 inventory reports 2.5 m water depth, versus 2.3 m in the field report, and preserves the 65 m west offset and the same pit dimensions. Its Table 1 uses a contextual 7964–6299 cal BP envelope and does not cite the direct result there. The matching intervals in 2020 Table 23.2 come from RT 1929A pit-7 olive stones (6531–6299 cal BP) and PTA 3821 well-3 wood (7964–7431 cal BP). The latter interval exactly matches the 2023 row that shows BETA 3821, suggesting a prefix error. A lab record could verify the designation. Skyllis p. 190 gives 7517–7038 cal BP to the braiding. The 2017 Table 7.1 independently specifies this identical range for the different RT-855 pit-8 mat, also designated KS 3 in 2023. The identical values suggest an attribution mix-up. The 2007 sample-level claim is the strongest documented age basis for KS 2, pending the original RT 4689 paperwork.","sources":[{"title":"Galili et al. 2013, Submerged prehistoric settlements off the Mediterranean coast of Israel","url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/Levant/Israel-Galili2013.pdf#page=13","locator":"Skyllis 13(2), p. 190, §4.2.1.2, Basketry and Fig. 13A–B."},{"title":"Galili et al. 2017, Submerged Pottery Neolithic Settlements off the Coast of Israel","url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/Levant/Israel-Galili2017.pdf#page=9","locator":"Table 7.1 and Special Finds, pp. 109–111, Fig. 7.5."},{"title":"Galili et al. 2018, The archaeology and paleoenvironment of Kfar Samir","url":"https://www.academia.edu/41603975/The_archaeology_and_paleoenvironment_of_the_submerged_Pottery_Neolithic_settlement_of_Kfar_Samir_Israel_Galili_et_al_2018_PALEORIENT","locator":"Paléorient 44(2), pp. 115–116, Figs. 1C(b), 2 and Table 1. Full text inspected."},{"title":"Galili et al. 2020, Israel: Submerged Prehistoric Sites and Settlements on the Mediterranean Coastline","url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/Levant/Israel-Galili2020.pdf#page=30","locator":"Table 23.2, p. 451, for the contextual dates and sample codes. Section 23.6.3.2, p. 465 and Fig. 23.19, p. 467, for the basket."},{"title":"Rosenberg et al. 2023, The Unseen Record","url":"https://www.mdpi.com/1999-4907/14/12/2373","locator":"Section 3.2, KS 2 and KS 3, Figs. 7–8, and Table 1."},{"title":"Galili and Schick 1990, Basketry and a Wooden Bowl","url":"https://www.jstor.org/stable/23373289","locator":"Mitekufat Haeven 23, pp. 142*–151*. Public bibliographic record. The later field team explicitly distinguishes the mat described there."}]},{"title":"Test pressing against holding and deposition","action":"Separate material and technique, depositional association, contemporary use and functional analogy. Look for a dated operational context, pressure-related wear or residues on the same object and consider whether the observations distinguish competing functions.","result":"The three woven fragments and dozens of olive stones were found together in grey clay. The 2007 field authors describe a separate installation with crushed olive material several dozen metres south, and the 1997 pit 6 report records a different assemblage with abundant crushed stones and pulp. The basket pit's publication gives no olive pulp embedded in the weave, diagnostic pressure wear, residue assay or press assembly identifying KS 2 in operation. Shape and the modern aqal comparison support a possible pressing or straining role. Holding or storage and discarded material in a shared fill also fit the recorded context. The 1997 discussion additionally considers storage of spent extraction waste for an installation and hot-water separation of oil. Those alternatives concern the installations, while the use of the basket remains open. Later accounts repeat the excavation team's comparison and share authors or images. The direct date is on plant material from the basket and cannot identify a particular extraction episode from a different pit.","sources":[{"title":"Galili et al. 1997, Evidence for Earliest Olive-Oil Production","url":"https://doi.org/10.1006/jasc.1997.0193","locator":"Fig. 5 on p. 1145, Figs. 7–8 on p. 1146, Discussion and Conclusions on p. 1147."},{"title":"2007 IAA field report","url":"https://hadashot.iaa.org.il/report_detail_eng.aspx?id=552&mag_id=112","locator":"Winter 1994 context, aqal interpretation and separate installation."},{"title":"Galili et al. 2017 photograph and interpretation","url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/Levant/Israel-Galili2017.pdf#page=11","locator":"pp. 110–111 and Fig. 7.5a–b, IAA specimen and modern comparator."}]}],"decision":"Identify the photographed 1997 fragments as KS 2. Use 5000–4730 cal BCE as the reported approximate direct range, explicitly preserving the dating discrepancy and missing assay details. Retain the candidate companion_of link from kfar-samir-pair-twined-basketry, event ks2-basket-fragments, to kfar-samir-olive-oil-extraction, event documented-evidence. The separate extraction assemblage still supplies the evidence for local oil production.","next":"The remaining physical chain needs the field find or object number under IAA survey G-21/1994, the Israel Museum treatment record and the corresponding IAA treasury accession for the three photographed fragments, and the Weizmann RT 4689 submission and lab result showing which fragment was sampled, its pretreatment, uncalibrated measurement and calibration. A residue or use-wear analysis tied to the same accession, or a field record connecting that basket to an operating press, could test its function independently.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"source_checks":[{"source":"IAA 2007 English and Hebrew","urls":["https://hadashot.iaa.org.il/report_detail_eng.aspx?id=552&mag_id=112","https://hadashot.iaa.org.il/Report_Detail.aspx?id=552&mag_id=112"],"locators":"Winter 1994 pit, RT4689, Figs 3–5, survey introduction","availability":"Both primary report texts and figures directly inspected; Hebrew unit 3–5 mm, English typo says m.","independence":"Same excavation team and object as later accounts."},{"source":"1997 original","url":"https://www.researchgate.net/publication/248578882_Evidence_for_Earliest_OliveOil_Production_in_Submerged_Settlements_off_the_Carmel_Coast_Israel","locators":"pp.1143–1148, Figs 2,5,7, Table3; image https://figures.academia-assets.com/40144739/figure_006.jpg","availability":"Original article transcription and Fig.5 image directly inspected.","independence":"Original excavation, repeated by subsequent accounts."},{"source":"2023 Rosenberg","url":"https://www.mdpi.com/1999-4907/14/12/2373","locators":"section 2.1 and 3.2, Figs 7–8, Table1","availability":"Publisher HTML and figure 7 image directly inspected.","independence":"Reuses object images and excavation interpretation; not independent use evidence."},{"source":"2013 Galili","url":"https://www.ancientportsantiques.com/wp-content/uploads/Documents/PLACES/Levant/Israel-Galili2013.pdf","locators":"p.190 §4.2.1.2 Fig13","availability":"Original PDF text and conserved-object figure inspected.","independence":"Shared author and interpretation; directly assigns a conflicting range."},{"source":"2017 Galili","url":"https://www.academia.edu/82215735/Submerged_Pottery_Neolithic_Settlements_off_the_Coast_of_Israel_Subsistence_Material_Culture_and_the_Development_of_Separate_Burial_Grounds","locators":"Table7.1, pp.109–111, Fig7.5","availability":"Original article transcription inspected.","independence":"Shared archaeological materials and investigators, not independent verification."},{"source":"2020 Galili","url":"https://www.vliz.be/imisdocs/publications/343870.pdf","locators":"Table23.2 p.451 and section23.6.3.2","availability":"Original PDF directly read.","independence":"Reuses project data, with its own recalibration table."},{"source":"IAA guest catalogue","url":"https://discover.iaa.org.il/?entity_index=0&tabId=0&freeText=RT%204689","locators":"guest search result and survey detail 882-840-5107","availability":"Live replay unavailable; independently read researcher-captured DOM excerpt at .samir-research/iaa-catalogue-guest-dom-20261117.txt; SHA-256 21c5cb1ddc5c416d5450e310e749e6d313b8d8f9209992a0e0ff4539e77446f2. This is a manually extracted representation, not raw archival data.","independence":"Confirms report and survey catalogue associations as captured; does not identify object accession or lab paperwork."},{"source":"Galili and Sharvit 1994–1995","url":"https://www.jstor.org/stable/23380046","locators":"Public bilingual abstract, Mitekufat Haeven 26 pp.122–133","availability":"JSTOR abstract could not be directly replayed here; researcher-captured accessibility excerpt independently read, SHA-256 88b42f4f2a3e80c79861ba2e00491d5c0674918a4ce68ecf2ffd70ac11a12da9, .samir-research/jstor-23380046-public-abstract-dom-20261117.txt. Full pages not accessed.","independence":"Earlier report on same excavation and assemblage; not independent corroboration of basket function."}],"limitations":["IAA sample report does not specify laboratory measurement, calibration curve, probability or exact fragment; RT4689 documentation is still sought.","A 2013 report assigns 7517–7038 cal BP to the braid but 2017 Table7.1 assigns this interval to RT855, the separate pit-8 mat; 2023 uses a contextual site envelope.","Guest catalogue could not be replayed in this reviewer environment. Captured excerpts document the reported search but are not an independently authenticated raw response; user-facing claims remain restricted to search results, not proof of an object accession or current custody.","Actual pressing, residue/use wear, and co-use contemporaneity remain unproven.","JSTOR 1994–95 public abstract inspected as researcher-captured excerpt because direct preview did not render in reviewer environment; full article unavailable."],"claim_reviews":[{"path":"data/discoveries/materials/kfar-samir-pair-twined-basketry.json#/events/0/statement","decision":"accept","rationale":"The IAA winter-1994 report documents three fragments of alternate pair-twined twig basketry, associated olive stones and clay fill; its in-situ and conserved images match Rosenberg KS 2 Fig. 7.","sources":["2007 report winter 1994 and Figs. 3–5","2023 section 3.2, Fig. 7"]},{"path":"data/discoveries/materials/kfar-samir-pair-twined-basketry.json#/events/0/date and evidence","decision":"accept","rationale":"IAA states calibrated 5000–4730 BCE for the braiding, RT 4689. Its original lab documentation, sampled fragment, calibration and probability remain unavailable. 2013 attributes a different range to the braid; the same range is assigned to pit-8 mat RT 855 in 2017. 2023 gives a site envelope. The new date remains explicitly reported and approximate.","sources":["2007 winter 1994 report","2013 p.190","2017 Table 7.1 pp.109–111","2023 Table 1"]},{"path":"data/discoveries/materials/kfar-samir-pair-twined-basketry.json#/events/0/caveats, earliest_record, caveats","decision":"accept","rationale":"A reported direct date on the braiding is distinct from the dating of a separate crushed-olive installation; inferred holding and pressing are not demonstrated.","sources":["2007 report, final paragraphs","1997 pp.1143–1147"]},{"path":"data/discoveries/food/kfar-samir-olive-oil-extraction.json#/research/note and links/0","decision":"accept","rationale":"The actual 1997 Fig. 5, IAA 2007 Fig. 3 and 2023 Fig. 7a reproduce the same in-situ photograph. IAA reports separate crushed-olive installation several dozen metres south. The basket’s function and contemporaneity with a specific episode are not established.","sources":["1997 Fig. 5 and discussion","2007 Figs. 3–5 and final paragraphs","2023 Fig. 7 and section 3.2"],"relation":{"type":"companion_of","vocab":"The two worked together as parts of one arrangement.","direction":"KS2 basketry toward Kfar Samir oil extraction; hypothesized local co-use","status":"candidate","established_history":false,"corroboration":"Shared authors and repeated image/analogy, not independent function evidence."}},{"path":"data/sources/g/galili-1997-kfar-samir-oil-excavation.json and evidence/g/galili-1997-kfar-samir-oil-excavation-notes.txt","decision":"accept","rationale":"The 1997 original captions, pit 6 and Table 3 support the reported contexts and laboratory designations. I independently inspected the figure asset and same identifiable scene in 2007 and 2023. Figure match is not evidence of pressing.","sources":["1997 Figs. 2, 5, 7, Table 3 and discussion","IAA 2007 Fig.3","2023 Fig.7"]},{"path":"data/sources/g/galili-2007-kafr-samir-survey.json and evidence/g/galili-2007-kafr-samir-survey-notes.txt","decision":"accept","rationale":"Original English and Hebrew reports support date, location, interpretation and historical treatment destination; Hebrew states twig diameter in mm. RT 4689 is a sample ID, not object accession.","sources":["IAA English and Hebrew 2007 report, figs 3–5"]},{"path":"data/sources/r/rosenberg-2023-carmel-wood-and-basketry.json and evidence/r/rosenberg-2023-carmel-wood-and-basketry-notes.txt","decision":"accept","rationale":"KS2 table gives site envelope and BETA 3821; 2020 table gives same interval for PTA 3821 well-3 wood. Prefix mismatch is unresolved and a possible error, not established identity. RT1929A is pit-7 olives.","sources":["2023 section 3.2, Fig.7, Table1","2020 Table 23.2 p.451"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/samir.json","decision":"accept","rationale":"Dossier accurately distinguishes reused photographs, shared-source lineage, direct reported date, distinct pits, functional inference and competing dates. IAA catalogue result details were checked against a researcher-captured DOM excerpt, not independently replayed; the corroborating 2007 report was read directly.","sources":["1997 Fig.5","IAA 2007 English and Hebrew","2013 p.190","2017 Table 7.1","2020 Table23.2","2023 Fig.7 and Table1","IAA guest DOM captured excerpt"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/samir.json#/steps/0","decision":"accept","rationale":"Captured JSTOR public preview reports pebble base, about 73% crushed stones with sharp edges, and mixture of crushed stones and pulp. This describes the extraction assemblage, not use of the basket. Full article unavailable to reviewer.","sources":["Galili and Sharvit 1994–1995 public abstract, captured browser accessibility excerpt","1997 pp.1143–1147 corroborating reused assemblage"]}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"independent review","independence":"Separate execution from proposer gpt-6.2-sol high; articles reuse shared excavation and imagery."},"overall_decision":"accept","worker_commit":"fc7b54706a6d602acfab48bb39b5a7c87d1cfcac","verified_commit":"fc7b54706a6d602acfab48bb39b5a7c87d1cfcac","files_checked":9}},{"lane":"computing","kind":"workflow","title":"Trace a published specification into a shipped software package","question":"Did the released software contain working support for the exact standardized feature, and what kind of support did the evidence establish?","summary":"Tested the Emoji 15.1 head shaking horizontally sequence through Unicode’s released data, Google’s tagged Noto Color Emoji fonts, and Debian’s archived 12.4 font package. Identical input shaped as two glyphs in upstream v2.038 and as one glyph in v2.040, v2.042 and Debian 2.042-0+deb12u1. The package contains a colour bitmap for that glyph. The test isolates font support from application font selection and platform rendering.","inputs":["Versioned specification and preceding edition","Exact code point, sequence or conformance fixture","Named implementation, producer tag and comparator","Named release channel and archived binary package","A diagnostic that can test the feature in isolation"],"steps":[{"title":"Define the smallest historical claim","action":"Search the catalogue and prior reviews for the standard, exact feature identifier, implementation name and release. Record whether the proposed endpoint is publication, implementation availability, distribution or observed application use.","result":"Searching the project for Unicode, Noto Color Emoji, 1F642 and head shaking found the existing Unicode standard record with 1990–1991 events and no matching adoption event. The bounded endpoint is Debian stable distribution of a font supporting this one sequence.","sources":[{"title":"Unicode 15.1 release page","url":"https://www.unicode.org/versions/Unicode15.1.0/","locator":"Release header, §A and §H"},{"title":"Debian 12.4 release","url":"https://www.debian.org/News/2023/20231210","locator":"Release header and Miscellaneous Bugfixes"}]},{"title":"Resolve the identifier in the final standard","action":"Search the issuer’s version archive for the exact feature token, predecessor and conformance fixture. Compare whole fields or parse their structured records. Record the normative status and any older component identifiers. Use a proposal or draft solely to investigate provenance.","result":"The original L2/23-034 proposal uses the same four scalars. Final Emoji 15.1 RGI data lists 1F642 200D 2194 FE0F at line 1524. Emoji 15.0 contains no exact match. All four scalars already occur in Unicode 15.0 DerivedAge, with ages 7.0, 1.1, 1.1 and 3.2. The 15.1 test fixture distinguishes the full sequence at line 96 from the minimally-qualified form ending at 2194 at line 97.","sources":[{"title":"Original head-shake proposal","url":"https://www.unicode.org/L2/L2023/23034-head-shaking-horizontal.pdf","locator":"Proposed code point sequence"},{"title":"Final Unicode Emoji 15.1 technical standard","url":"https://www.unicode.org/reports/tr51/tr51-25.html","locator":"Revision 25, §1.5.2 and §2.5"},{"title":"Emoji 15.1 sequence data","url":"https://www.unicode.org/Public/emoji/15.1/emoji-zwj-sequences.txt","locator":"Version header and exact record at line 1524"},{"title":"Earlier Emoji 15.0 sequence data","url":"https://www.unicode.org/Public/emoji/15.0/emoji-zwj-sequences.txt","locator":"All first-column sequence tokens"},{"title":"Emoji 15.1 test fixture","url":"https://www.unicode.org/Public/emoji/15.1/emoji-test.txt","locator":"Lines 96–99"},{"title":"Unicode 15.0 character ages","url":"https://www.unicode.org/Public/15.0.0/ucd/DerivedAge.txt","locator":"Lines 273, 284, 655 and 1457"}]},{"title":"Pin implementation sources and bytes","action":"Search the producer’s release pages, release API and tag history for the version or exact identifier. Resolve tags with git ls-remote, following peeled commits for annotated tags. Fetch the exact shipped asset and, where available, its source or tests from each commit. Compare a previous released artifact to the release that claims the feature.","result":"Noto v2.038 was published on 16 September 2022 for 15.0; v2.040 on 17 November 2023 added 15.1 assets; v2.042 on 30 November 2023 fixed a separate flag issue. The pinned v2.042 source has svg/emoji_u1f642_200d_2194.svg; that asset path returns 404 at the v2.038 commit. The released font payloads and dates are pinned below. The asset filename omits VS16, so the shaping check uses the full specification sequence.","sources":[{"title":"Noto v2.038 release API","url":"https://api.github.com/repos/googlefonts/noto-emoji/releases/tags/v2.038","locator":"published_at and body"},{"title":"Noto v2.040 release API","url":"https://api.github.com/repos/googlefonts/noto-emoji/releases/tags/v2.040","locator":"published_at and body"},{"title":"Noto v2.042 release API","url":"https://api.github.com/repos/googlefonts/noto-emoji/releases/tags/v2.042","locator":"published_at and body"},{"title":"Noto v2.042 sequence asset","url":"https://raw.githubusercontent.com/googlefonts/noto-emoji/d79d23e6822e0f6e5731b114cbfb26b2a4e380da/svg/emoji_u1f642_200d_2194.svg","locator":"Commit-pinned original artwork"},{"title":"Noto v2.042 font","url":"https://raw.githubusercontent.com/googlefonts/noto-emoji/d79d23e6822e0f6e5731b114cbfb26b2a4e380da/fonts/NotoColorEmoji.ttf","locator":"Exact packaged upstream font bytes"}]},{"title":"Verify the distribution handoff","action":"Search the distribution’s release announcements, versioned packaging files, archive index and binary archive. Compare dates and package versions. Download the exact binary, check its index hash, and extract the relevant file without installation. When its bytes differ from upstream, inspect build rules and test both files.","result":"The Debian maintainer’s changelog identifies 2.042-0+deb12u1 as the bookworm update for the new upstream release. Debian’s 10 December 2023 point release lists the font update. The archived package’s control metadata and SHA-256 match the bookworm index entry. Its extracted TTF differs from the tagged Google TTF. Debian’s build rules explicitly build and install NotoColorEmoji.ttf.","sources":[{"title":"Debian 12.4 release notice","url":"https://www.debian.org/News/2023/20231210","locator":"10 December 2023 and fonts-noto-color-emoji row"},{"title":"Bookworm package changelog","url":"https://sources.debian.org/src/fonts-noto-color-emoji/2.042-0%2Bdeb12u1/debian/changelog/","locator":"2.042-0+deb12u1 entry dated 30 November 2023"},{"title":"Bookworm package index","url":"https://deb.debian.org/debian/dists/bookworm/main/binary-amd64/Packages.xz","locator":"fonts-noto-color-emoji stanza, Version, Filename, SHA256"},{"title":"Bookworm package build rules","url":"https://sources.debian.org/data/main/f/fonts-noto-color-emoji/2.042-0%2Bdeb12u1/debian/rules","locator":"Lines 6–16, override_dh_auto_build and override_dh_install"},{"title":"Debian binary archive object","url":"https://deb.debian.org/debian/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_2.042-0+deb12u1_all.deb","locator":"control.tar.xz and data.tar.xz"}]},{"title":"Run the same fixture on each artifact","action":"Run a small external probe against each exact artifact, selecting it explicitly and disabling fallback. Record tool version, flags, output and negative controls. Add a technical check specific to the claimed output, such as extracting the actual glyph bitmap. Test application display separately if that is part of the claim.","result":"HarfBuzz 15.1.0 shaped the same full sequence into glyphs 949 and 24 with upstream v2.038, glyph 2827 with v2.040 and v2.042, and glyph 2924 with the Debian font. The Debian glyph contains a 3,167-byte PNG at the tested 109 ppem, which was extracted and inspected. Dropping ZWJ gave a separate smile and arrow. The form without VS16 produced the same combined glyph in these newer fonts despite the different fixture classification. The vertical sequence produced a distinct glyph.","sources":[{"title":"HarfBuzz command documentation","url":"https://harfbuzz.github.io/utilities.html","locator":"hb-shape, glyph indices, text-and-font combinations"},{"title":"HarfBuzz shaping flags","url":"https://manpages.debian.org/unstable/libharfbuzz-bin/hb-shape.1.en.html","locator":"--unicodes, --remove-default-ignorables, --no-glyph-names"},{"title":"Official qualification fixture","url":"https://www.unicode.org/Public/emoji/15.1/emoji-test.txt","locator":"Fully and minimally qualified test cases, lines 96–99"},{"title":"Archived Debian font package","url":"https://deb.debian.org/debian/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_2.042-0+deb12u1_all.deb","locator":"./usr/share/fonts/truetype/noto/NotoColorEmoji.ttf"}]},{"title":"Make the two-ended decision","action":"Require the exact standard feature at the source and the matching output in the shipped artifact at the destination. Establish uptake with producer or distributor records naming the version and the change. Use a separate distributor account or independently reproduce the output if the producer’s claims are the only narrative evidence. Treat matching labels, images or encoded input alone as insufficient.","result":"The Consortium specifies the sequence, Google documents its asset release, and Debian separately documents packaging and stable distribution. The archive hash and controlled probe corroborate the end-to-end match. Unicode’s test file and RGI data share one publisher. Debian’s asset derives from Google’s Noto sources, so it corroborates distribution rather than providing an independent invention. The bytes test supplies separate evidence of shipped behavior.","sources":[{"title":"Emoji 15.1 sequence data","url":"https://www.unicode.org/Public/emoji/15.1/emoji-zwj-sequences.txt","locator":"Version header and exact record at line 1524"},{"title":"Google’s upstream release","url":"https://github.com/googlefonts/noto-emoji/releases/tag/v2.042","locator":"Release title and v2.042 tag"},{"title":"Documented Debian stable adoption","url":"https://www.debian.org/News/2023/20231210","locator":"fonts-noto-color-emoji in Miscellaneous Bugfixes"}]}],"decision":"Propose a dated Emoji 15.1 publication event and a dated Debian 12.4 adoption event on the existing Unicode standard record. The supported relation is uptake of one standardized sequence in a named distributed font package. Record package availability and observed shaping in a controlled environment. Application display, universal font coverage and the size of the user community remain open.","reject_if":"Reject a new code-point claim when the constituent characters predate the edition. Reject a shipped-support claim based only on a chart picture, release announcement, component glyphs or a tested file that cannot be matched to the distribution version. For a rebuild, verify the distribution binary independently and reproduce the feature in both files.","stop_when":"Stop with a bounded adoption finding once both exact identifiers, the release chronology, the archive provenance and a diagnostic positive with relevant negative control agree. Stop at a documented evidence gap when the released artifact or applicable test is missing. Leave application use unresolved unless it was tested on the named shipping stack.","next":"Reuse the worksheet on a different character or sequence, keeping the versioned inputs and one negative control. For this pilot, the remaining question is whether a named Debian 12.4 application selected this font and displayed the combined glyph with the versions of its renderer and fallback configuration actually shipped.","next_anchor":"Unicode 15.0 Kawi Letter A (U+11F04) → a pinned Noto Sans Kawi release and its first traceable distribution build. Verify both the base character and an orthographic combining sequence.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","replication":{"artifacts":{"normative_sequence_file":{"url":"https://www.unicode.org/Public/emoji/15.1/emoji-zwj-sequences.txt","sha256":"9a76a03dcacfcd8f9bfe08c49c8d90b55182b977cbcc87a694e8a8193efb0e57","bytes":251595},"predecessor_sequence_file":{"url":"https://www.unicode.org/Public/emoji/15.0/emoji-zwj-sequences.txt","sha256":"fe357f9117b7746676063765d587137edf9b25903a792bd54935bf0856791182","bytes":231164},"qualification_fixture":{"url":"https://www.unicode.org/Public/emoji/15.1/emoji-test.txt","sha256":"d876ee249aa28eaa76cfa6dfaa702847a8d13b062aa488d465d0395ee8137ed9","bytes":639405},"prior_character_ages":{"url":"https://www.unicode.org/Public/15.0.0/ucd/DerivedAge.txt","sha256":"7570877e0fa197c45338f7c41a02636da4e14c8dba6a3611a01cd30bf329d5ca","bytes":130720},"debian_binary_package":{"url":"https://deb.debian.org/debian/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_2.042-0+deb12u1_all.deb","sha256":"a5ab0f69c7938423862320d9aca5dd187b3fd879d6a9a57dd52e17c3fa8d2751","bytes":9893872,"version":"2.042-0+deb12u1","package_index":"https://deb.debian.org/debian/dists/bookworm/main/binary-amd64/Packages.xz"},"debian_extracted_font":{"url":"https://deb.debian.org/debian/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_2.042-0+deb12u1_all.deb","sha256":"e5899ed38b8ed83e08bd3ac5de09791e9d19d288333a796de1d35ad17396f1ec","bytes":10980856,"archive_member":"./usr/share/fonts/truetype/noto/NotoColorEmoji.ttf"},"debian_packaging_rules":{"url":"https://sources.debian.org/data/main/f/fonts-noto-color-emoji/2.042-0%2Bdeb12u1/debian/rules","sha256":"bbf4f7c291d8c8281d3be9de40d42eb2e58df9287994c735f4544e7e0d3eeaad","bytes":451},"upstream_v2.038":{"url":"https://raw.githubusercontent.com/googlefonts/noto-emoji/e8073ab740292f8d5f19b5de144087ac58044d06/fonts/NotoColorEmoji.ttf","sha256":"5a953e4c2c3c650c37d9e996eae6fef08414854871e1f9a916daf4c59527f008","bytes":10352796,"tag":"v2.038","commit":"e8073ab740292f8d5f19b5de144087ac58044d06","published_at":"2022-09-16T02:51:44Z"},"upstream_v2.040":{"url":"https://raw.githubusercontent.com/googlefonts/noto-emoji/144e84dbc2b49f164279bfce230569116ac98bfd/fonts/NotoColorEmoji.ttf","sha256":"eadac8f4c67331412f36967b5a3aa58f46a89664957b8981413f31b324c2b8e6","bytes":10591160,"tag":"v2.040","commit":"144e84dbc2b49f164279bfce230569116ac98bfd","published_at":"2023-11-17T07:11:38Z"},"upstream_v2.042":{"url":"https://raw.githubusercontent.com/googlefonts/noto-emoji/d79d23e6822e0f6e5731b114cbfb26b2a4e380da/fonts/NotoColorEmoji.ttf","sha256":"c2f19f6a404baa7da7a710b018c2892d7b51386983ddca146811f76aea0b6861","bytes":10589456,"tag":"v2.042","commit":"d79d23e6822e0f6e5731b114cbfb26b2a4e380da","published_at":"2023-11-30T04:15:28Z"}},"fixture_codepoints":"1F642 200D 2194 FE0F","fixture_utf8_hex":"f0 9f 99 82 e2 80 8d e2 86 94 ef b8 8f","implementation":"Local C probe linked against HarfBuzz 15.1.0. For each file it used hb_blob_create_from_file_or_fail, hb_face_create(index 0), hb_font_create, hb_ot_font_set_funcs and hb_font_set_ppem(109,109). For each input it used hb_buffer_add_codepoints, hb_buffer_guess_segment_properties, HB_BUFFER_FLAG_REMOVE_DEFAULT_IGNORABLES and hb_shape with default features. It inspected count and indexes from hb_buffer_get_glyph_infos and read colour bitmap bytes with hb_ot_color_glyph_reference_png. Only one font was loaded per test.","repeat_commands":["Run mkdir -p .cache/unicode. Download the original files listed in artifacts and verify their SHA-256 digests. Save the three upstream TTFs as .cache/unicode/noto-2.038.ttf, .cache/unicode/noto-2.040.ttf and .cache/unicode/noto-2.042.ttf, and save the Debian archive as .cache/unicode/bookworm.deb. Verify the Debian TTF digest after extracting it from that archive.","For the standards files run awk -F ';' '$1 ~ /^[[:space:]]*1F642 200D 2194 FE0F[[:space:]]*$/ {print NR, $0}' on each version's sequence data, changing the identifier on reuse.","Extract without installation: ar p .cache/unicode/bookworm.deb data.tar.xz | tar -xJO ./usr/share/fonts/truetype/noto/NotoColorEmoji.ttf > .cache/unicode/bookworm.ttf","Inspect package metadata: ar p .cache/unicode/bookworm.deb control.tar.xz | tar -xJO ./control","Optional glyph selection check with hb-shape: hb-shape --no-glyph-names --remove-default-ignorables --unicodes=1F642,200D,2194,FE0F FONT.ttf","Repeat the shape command with --unicodes=1F642,2194,FE0F to test standalone components and with --unicodes=1F642,200D,2194 to test the minimally-qualified input.","Run the commands in probe.commands for the full test, including the bitmap checksum."],"glyph_ids":{"input_order":["1F642 200D 2194 FE0F","1F642 200D 2194","1F642 2194 FE0F","1F642 200D 2195 FE0F","1F642"],"upstream_v2.038":[[949,24],[949,24],[949,24],[949,25],[949]],"upstream_v2.040":[[2827],[2827],[949,24],[2828],[949]],"upstream_v2.042":[[2827],[2827],[949,24],[2828],[949]],"debian_2.042-0+deb12u1":[[2924],[2924],[949,24],[2925],[949]]},"debian_horizontal_bitmap_png":{"glyph_id":2924,"bytes":3167,"pixels":[136,128],"sha256":"69dc14a825f59379b0f73bc3d03f1781a8d591d945c0a44dc433cecb4f88ffca"},"access_limits":"The producer release files, distribution changelog, archive index and binary package were public and accessible. The consortium’s direct September 2023 blog post was temporarily blocked in the web reader. Its September archive and the dated version-specific page supplied the release date. The package SHA-256 was checked against the current first-party bookworm index for the matching exact version. The pinned URLs identify the original artifacts and the embedded C probe records the exact test used to extract the bitmap.","probe":{"language":"C11","dependencies":"C compiler, pkg-config, and HarfBuzz 15.1.0 headers and library. Run the commands from the repository root.","source":"#include \u003cstdint.h>\n#include \u003cstdio.h>\n#include \u003chb.h>\n#include \u003chb-ot.h>\n\nstatic void probe(hb_font_t *font, const char *label, const uint32_t *text, int size) {\n    hb_buffer_t *buffer = hb_buffer_create();\n    hb_buffer_set_flags(buffer, HB_BUFFER_FLAG_REMOVE_DEFAULT_IGNORABLES);\n    hb_buffer_add_codepoints(buffer, text, size, 0, size);\n    hb_buffer_guess_segment_properties(buffer);\n    hb_shape(font, buffer, NULL, 0);\n\n    unsigned count = 0;\n    hb_glyph_info_t *glyphs = hb_buffer_get_glyph_infos(buffer, &count);\n    printf(\"%s (%u glyphs):\", label, count);\n    for (unsigned i = 0; i \u003c count; i++) {\n        hb_blob_t *png = hb_ot_color_glyph_reference_png(font, glyphs[i].codepoint);\n        unsigned byte_count = hb_blob_get_length(png);\n        printf(\" %u/cluster %u/png %u\", glyphs[i].codepoint, glyphs[i].cluster, byte_count);\n        if (count == 1 && glyphs[i].codepoint == 2924) {\n            FILE *out = fopen(\".cache/unicode/bookworm-horizontal.png\", \"wb\");\n            if (out) {\n                fwrite(hb_blob_get_data(png, NULL), 1, byte_count, out);\n                fclose(out);\n            }\n        }\n        hb_blob_destroy(png);\n    }\n    putchar('\\n');\n    hb_buffer_destroy(buffer);\n}\n\nint main(int argc, char **argv) {\n    const uint32_t exact[] = {0x1F642, 0x200D, 0x2194, 0xFE0F};\n    const uint32_t no_joiner[] = {0x1F642, 0x2194, 0xFE0F};\n    const uint32_t vertical[] = {0x1F642, 0x200D, 0x2195, 0xFE0F};\n    printf(\"HarfBuzz %s\\n\", hb_version_string());\n    for (int i = 1; i \u003c argc; i++) {\n        hb_blob_t *file = hb_blob_create_from_file_or_fail(argv[i]);\n        if (!file) return 2;\n        hb_face_t *face = hb_face_create(file, 0);\n        hb_font_t *font = hb_font_create(face);\n        hb_ot_font_set_funcs(font);\n        hb_font_set_ppem(font, 109, 109);\n        puts(argv[i]);\n        probe(font, \"full horizontal\", exact, 4);\n        probe(font, \"minus VS16\", exact, 3);\n        probe(font, \"minus ZWJ\", no_joiner, 3);\n        probe(font, \"full vertical\", vertical, 4);\n        probe(font, \"ordinary smile\", exact, 1);\n        hb_font_destroy(font);\n        hb_face_destroy(face);\n        hb_blob_destroy(file);\n    }\n    return 0;\n}\n","commands":["mkdir -p .cache/unicode","python3 -c 'import json, pathlib, sys; pathlib.Path(\".cache/unicode/compare.c\").write_text(json.load(open(sys.argv[1]))[\"replication\"][\"probe\"][\"source\"])' docs/reviews/2026-11-17-provenance/lanes/computing.json","pkg-config --modversion harfbuzz","cc -std=c11 -Wall -Wextra -o .cache/unicode/compare .cache/unicode/compare.c $(pkg-config --cflags --libs harfbuzz)",".cache/unicode/compare .cache/unicode/noto-2.038.ttf .cache/unicode/noto-2.040.ttf .cache/unicode/noto-2.042.ttf .cache/unicode/bookworm.ttf","sha256sum .cache/unicode/bookworm-horizontal.png"],"output":"The probe prints glyph indexes, cluster indexes and available PNG bytes for the five inputs. The PNG at .cache/unicode/bookworm-horizontal.png records glyph 2924 from the Debian font at 109 ppem. In this font the fully and minimally qualified inputs select that same glyph and write identical PNG bytes. A different font or sequence may require changing the inputs and export glyph ID."}},"review":{"issues":[],"source_checks":[{"path":"data/sources/d/debian-2023-bookworm-12-4-release.json","id":"debian-2023-bookworm-12-4-release","url":"https://www.debian.org/News/2023/20231210","locator":"Release header and Miscellaneous Bugfixes, fonts-noto-color-emoji row","read_representation":"Original publisher page, cached artifact, or data as identified in independent checks","access_limit":"partial-text","lineage":"Original documenting distributor’s dated stable point release. It describes the package update and is independent of Google’s upstream release notes as evidence of distribution.","file_sha256":"2233f678943c45c1e14194a4af2ff5669eb7f11594d8d168b8899bbbb402b27d"},{"path":"data/sources/d/debian-2023-bookworm-noto-color-emoji-changelog.json","id":"debian-2023-bookworm-noto-color-emoji-changelog","url":"https://sources.debian.org/src/fonts-noto-color-emoji/2.042-0%2Bdeb12u1/debian/changelog/","locator":"Lines 1–9, 2.042-0+deb12u1 entry","read_representation":"Original publisher page, cached artifact, or data as identified in independent checks","access_limit":"partial-text","lineage":"First-party distribution source archive contains the maintainer’s exact package changelog. This is separate from the font producer’s release description.","file_sha256":"95e0d2338a35fed646cb9ac53cbf7c0dbe94b0837a444f1bb1a1805e91daf24b"},{"path":"data/sources/d/debian-2023-bookworm-noto-color-emoji-package.json","id":"debian-2023-bookworm-noto-color-emoji-package","url":"https://deb.debian.org/debian/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_2.042-0+deb12u1_all.deb","locator":"control.tar.xz, ./control; data.tar.xz, ./usr/share/fonts/truetype/noto/NotoColorEmoji.ttf","read_representation":"Original publisher page, cached artifact, or data as identified in independent checks","access_limit":"partial-text","lineage":"Original Debian package. Extracted without installation. Version and SHA-256 agree with the Debian archive index, and the package's font was tested without font fallback.","file_sha256":"606ea5b8660d6d81501fc63a946c42a03e52717c7f566fd80135c153e5f7918d"},{"path":"data/sources/n/noto-emoji-2023-v2-042-release.json","id":"noto-emoji-2023-v2-042-release","url":"https://github.com/googlefonts/noto-emoji/releases/tag/v2.042","locator":"Release title, tag and description; Tagged svg/emoji_u1f642_200d_2194.svg and fonts/NotoColorEmoji.ttf","read_representation":"Original publisher page, cached artifact, or data as identified in independent checks","access_limit":"partial-text","lineage":"Producer’s original versioned release and bundled font. The archive supplies evidence of upstream font availability separate from the distributor's release.","file_sha256":"dbb0faa58b024e8a3cefce4cbdabf22275a92d6fc290f5b3559710fcfadaa9c5"},{"path":"data/sources/u/unicode-consortium-2023-emoji-15-1-release.json","id":"unicode-consortium-2023-emoji-15-1-release","url":"https://www.unicode.org/versions/Unicode15.1.0/","locator":"Release header and §A Synchronization, §H UTS #51","read_representation":"Original publisher page, cached artifact, or data as identified in independent checks","access_limit":"partial-text","lineage":"Consortium’s version-specific publication page. Its date agrees with the public announcement dated 12 September 2023.","file_sha256":"90f9ac35c6d6a84fe2daa780ef0d4dd3fd7c660f445b07b9726a71617da7071e"},{"path":"data/sources/u/unicode-consortium-2023-emoji-15-1-zwj-data.json","id":"unicode-consortium-2023-emoji-15-1-zwj-data","url":"https://www.unicode.org/Public/emoji/15.1/emoji-zwj-sequences.txt","locator":"Version header and line 1524","read_representation":"Original publisher page, cached artifact, or data as identified in independent checks","access_limit":"partial-text","lineage":"Exact published normative-property data file. Comparison against Emoji 15.0 and the Emoji 15.1 test fixture was conducted from the official versioned URLs.","file_sha256":"2f1a42114407c304acd938a13288c9e4d6ab9a14965ab06d9b190210dc8fee05"}],"limitations":["The upstream SVG, Debian font and sequence data do not establish a particular application used or rendered the font.","The Debian and Google code assets share implementation lineage; distributor provenance and separate binary verification corroborate distribution and behavior, not independent invention."],"claim_reviews":[{"path":"data/discoveries/electronics/unicode-multilingual-character-standard.json#/events/emoji-15-1-head-shake-publication","decision":"accept","rationale":"Unicode issuer dates 15.1 to 12 September 2023 and synchronizes UTS #51; exact released data record at line 1524 labels the four-scalar string RGI Emoji 15.1. Prior characters are not new; publication on existing standard extends the record, not duplicates a 1990–1991 event.","sources":["https://www.unicode.org/versions/Unicode15.1.0/ §A and §H","https://www.unicode.org/Public/emoji/15.1/emoji-zwj-sequences.txt line 1524","https://unicode.org/reports/tr51/index.html Emoji Versions"]},{"path":"data/discoveries/electronics/unicode-multilingual-character-standard.json#/events/debian-12-4-emoji-15-1-font-adoption","decision":"accept","rationale":"Debian 10 December 2023 point release lists the font update; changelog specifies 2.042-0+deb12u1. Archive control and bookworm index version and package SHA match. Independently reran controlled HarfBuzz probe against exact extracted font: full sequence glyph 2924 and 3167 PNG bytes; compared prior 2.038 and newer upstream artifacts, correct IDs, no joiner negative control. This shows package-level availability and single-font behavior, not application selection or user adoption. Distinct bounded distribution event extends standard.","sources":["https://www.debian.org/News/2023/20231210 fonts-noto-color-emoji","https://sources.debian.org/src/fonts-noto-color-emoji/2.042-0%2Bdeb12u1/debian/changelog/ entry 1–9","https://deb.debian.org/debian/pool/main/f/fonts-noto-color-emoji/fonts-noto-color-emoji_2.042-0+deb12u1_all.deb archive control/data","https://github.com/googlefonts/noto-emoji/releases/tag/v2.042"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/computing.json#/steps,inputs,reject_if,stop_when,next_anchor","decision":"accept","rationale":"Reusable actions have explicit inputs, sources, roles, negative controls and a stopping rule; executed results are bounded to the shipped font. Repair preserves C11 source and build/run/extraction instructions in the committed ledger. Independently reconstructed and compiled the embedded code with HarfBuzz 15.1.0 in a temporary directory and reproduced all output glyph IDs and the exact 3167-byte PNG SHA-256."},{"path":"data/sources and evidence","decision":"accept","rationale":"Consortium data and release, producer tag, distributor announcement/index/package and recorded notes have distinct source roles; Debian font rebuilt from Noto is not independent invention. Source metadata and preserved note hashes match the data reviewed; no independent witness of application display claimed."}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"independent review","independence":"Separate from gpt-6.2-sol high researcher; original sources and cached artifacts independently checked."},"overall_decision":"accept","worker_commit":"cddccd038d281925887f6b021da0fc8c94e70ca3","verified_commit":"cddccd038d281925887f6b021da0fc8c94e70ca3","files_checked":10}},{"lane":"electricity","kind":"workflow","title":"Trace offshore wind procurement to metered grid service","question":"Can supplier, developer, regulator and settlement records link the installed East Anglia ONE equipment and export connection to actual electricity delivered to the British grid?","summary":"The workflow joins the ordered SWT-7.0-154 model to the installed fleet and tests the wind farm’s operational dependence on its 220 kV AC offshore export link. The receiving-side record and Elexon meter volumes confirm grid service in September 2019. The developer reported full turbine operation by 27 July 2020, and two December balancing-unit meter readings sum to 207.090 MWh in one half-hour.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","inputs":["Project name and aliases","Developer legal entity and grid interface","Candidate equipment model or package and supplier","Claimed first-power and commissioning window","Market operator asset IDs and official metering endpoint"],"steps":[{"title":"Resolve the procurement and deployment identities","action":"Search the repo discovery, source and review paths for the plant aliases, equipment string and unit IDs. Search the supplier’s investor events, results and product archives for the project plus the order, model or package. Search the developer’s construction and commissioning releases for the same project and installed model. Record the supplier name used at each date, installed count and capacity scope.","result":"Searches for East Anglia ONE, East Anglia 1, T_EAAO and SWT-7.0-154 found no prior case. Earlier Bogø and Gedser records cover distinct installations. Siemens’s June 2016 order report pairs the SWT-7.0-154 with ScottishPower Renewables’ East Anglia ONE project. The developer reports all 102 Siemens Gamesa SWT-7.0-154 units installed by 29 April 2020.","sources":[{"title":"Execution of Vision 2020 fully on track","url":"https://assets.new.siemens.com/siemens/assets/api/uuid:44871707-b477-4e4b-ab45-bc7867f99e79/160609-presentation-jp-morgan-conference.pdf","locator":"9 June 2016 investor presentation, slide 16, right column, Major offshore order in Wind Power"},{"title":"Turbine installation complete on East Anglia ONE offshore windfarm","url":"https://www.scottishpowerrenewables.com/w/turbine-installation-complete-on-east-anglia-one-offshore-windfarm","locator":"29 April 2020 announcement, opening paragraphs and installation account"}]},{"title":"Test the installed export dependency at both ends","action":"Find the supplier’s named export contract in its original project or investor record. Search the transmission regulator’s project cost assessment for the contractor, cable scope, circuit configuration and energisation. In the planning inspectorate register or transmission-owner interface records, find a project-specific grid interface record and trace the route from generator bus to receiving grid.","result":"Nexans names its East Anglia One connection contract. Ofgem’s forensic review allocates the subsea export package to Nexans and the onshore package to Prysmian. The technical description supplied by the developer traces 66 kV array collection, offshore step-up, two 220 kV AC export circuits and connection at Bramford to the 400 kV network. National Grid’s published draft grid-interface statement corroborates power reaching the substation near Bramford during September 2019. Grid export at that destination depended on the installed export path from the offshore substation. The public material does not identify the individual circuit carrying the earliest measured output. The actual AC route excludes inference from the earlier Gotland HVDC record or from East Anglia ONE’s optional HVDC consent.","sources":[{"title":"2020 Universal Registration Document","url":"https://www.nexans.com/app/uploads/2024/02/2020-nexans-universal-registration-document.pdf","locator":"p. 104, §3.1.2.3, 2016 UK offshore connection contracts (East Anglia One and Beatrice)"},{"title":"Cost Assessment Report for East Anglia One Offshore
