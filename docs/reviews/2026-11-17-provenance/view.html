cript variants. Search the work title and names in the workshop archive, film or audio finding aid, and maker interviews. Record whether each source names a role, shows a particular task, or repeats somebody else’s attribution. Compare recorded speech against any narrator or subtitles and document the translation used.","result":"The catalogue credits Kenojuak. The National Film Board film shows her examining a newly pulled impression. Rhoda Kayakjuak’s translation of the Inuktitut dialogue records Kenojuak pointing out an omitted eye when Terry Ryan asks about the print. The English narration substitutes a story about the source of her inspiration. This supports her role in designing and evaluating the print; the dialogue alone cannot show how the workshop acted on her feedback. Dorset Fine Arts captions a photo as Lukta Qiatsuq cutting this block. First Arts attributes cutting to Iyola Kingwatsiak and printing to Lukta Qiatsuk, interpreting the filmed sequence. The sources leave exclusive cutting credit unresolved and their claims cannot identify who pulled accession 38038. For the film sequence the pilot used the published frame and retranslated dialogue; repeated accounts of that same dialogue do not add a second witness.","sources":[{"title":"National Film Board, Eskimo Artist: Kenojuak","url":"https://www.nfb.ca/film/eskimo-artist-kenojuak/","locator":"Filmed stonecut proof examination; original film record"},{"title":"Sandra Dyck, Looking for Kenojuak, in Atiqput","url":"https://dokumen.pub/atiqput-inuit-oral-history-and-project-naming-9780228013358.html","locator":"Chapter 14, pp. 198–199 and note 39, Rhoda Kayakjuak’s translation of the artist’s dialogue"},{"title":"The Art of Inuit Administration, Polar Record","url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/BC4067D5A862065CA44E4245A2D5016F/S0032247423000372a.pdf/art_of_inuit_administration_postwar_canada_cultural_diplomacy_and_northern_administration.pdf","locator":"p. 5, Fig. 2, original film frame of Kenojuak examining the impression; text credits Dyck for translation"},{"title":"Dorset Fine Arts, Stonecut","url":"https://www.dorsetfinearts.com/stonecut/","locator":"Stonecutting photograph caption and Chops section"},{"title":"First Arts, The Arrival of the Sun, unnumbered proof","url":"https://firstarts.ca/content/feature/934/artworks-21148-kenojuak-ashevak-c.c.-r.c.a.-1927-2013-kinngait-cape-dorset-the-arrival-of-the-sun-1962-69/","locator":"Lot 20, named cutter and printmaker fields, essay paragraphs 1 and 4"}]},{"title":"Test a named operation at both workshops","action":"Define one operation and its source and recipient separately. Search the partners’ names with the tool’s local and foreign names, date, and contact route. Find a donor-side object or account demonstrating the operation and an independently recorded recipient-side object, testimony, or work scene showing local adoption or adaptation. Require a dated common actor, shipment, training, or other bridge. Distinguish the primary items from the modern publication that brings them together.","result":"Searches combined Hiratsuka, Houston, Cape Dorset, and baren. The source side is Un’ichi Hiratsuka’s Japanese woodblock practice, specifically rubbing the back of the sheet for ink transfer. In a translated passage from his own 1962 account, Hiratsuka describes rubbing the paper between ink applications. Ikeda and Tiampo’s catalogue draft identifies the rubbing pad as a baren and describes Houston learning to make one. The draft cites a dated 3 November 1958 Houston note in the Alastair Grant Collection. The CMH exhibit inventory records Japanese prints transported to Cape Dorset by Houston on his return in 1959. On the recipient side, the inventory lists locally made tools used by Inuit printmakers, including a sealskin baren. The draft identifies it as CMC IV-C-3558, distinguishes its covering from Japanese bamboo leaf, reproduces contemporary NFB publicity photo PA-94469 showing Kananginak Pootoogook rubbing the paper with a baren, and reports his separate 2009 interview (interpreted by Jimmy Manning) recalling the distinctive Japanese tools. The draft and exhibit inventory share a curatorial lineage; the artist’s account, photographed task, and surviving tool are separate underlying evidence. Together they support adaptation of the rubbing tool at the Kinngait workshop. The photo could be posed and does not identify its baren as IV-C-3558. Hiratsuka’s original-language article and the Houston note were not inspected directly.","sources":[{"title":"Asato Ikeda and Ming Tiampo, Travelling Prints","url":"https://www.academia.edu/38778945/Travelling_Prints_James_Houston_Unichi_Hiratsuka_and_the_Early_Cape_Dorset_Print_Studio","locator":"Public manuscript version 4, 7 December 2010. Draft pp. 37–39 and nn. 31–35, Houston note and excerpt from Hiratsuka’s Reader’s Digest (Japan), November 1962, pp. 52–53, in translation; draft pp. 53–54, Figs. 27–28 and n. 79, baren IV-C-3558, photo PA-94469 and Kananginak Pootoogook’s 26 March 2009 interview"},{"title":"Canadian Museum of History, Inuit Prints: Japanese Inspiration","url":"https://www.historymuseum.ca/app/DocRepository/1/Exhibitions/Traveling_Exhibitions/inuitprintse.pdf","locator":"PDF p. 2, Contents > Works of Art and Artifacts, transported prints and locally used tools"},{"title":"Canadian Museum of History, Inuit Prints of Cape Dorset, 1950s","url":"https://www.historymuseum.ca/capedorsetprints/history/1950s.php/1000","locator":"Experimental years and timing of the November 1958 to February 1959 Japan trip"}]},{"title":"Run a chronology and scope control","action":"Search for a dated pre-contact example of the claimed recipient operation, and for a post-contact case in which an available tool or image could be mistaken for a documented use. Compare the feature that actually travelled with recipient materials and production roles. For an independent check, search a physical object register or conservation report by identifier and a maker or photographer archive by date and participant.","result":"CMH’s object record places Niviaksiak’s Three Caribous stonecut, UN CD 1957/58-003 EXPE, in 1957. This predates Houston’s November 1958 departure and rules out that trip as the origin of Kinngait stonecut printing. The 1962 catalogue calls The Arrival of the Sun a stonecut and accession 38038 describes its paper as japan paper. Neither establishes which baren touched that sheet, its paper supplier, nor adoption of a complete Japanese workflow. The Kinngait evidence here includes several hands in production and does not establish Hiratsuka’s single-artist model there. The collected CMH block of 1960 is another work, Talluliyuk, Sea Goddess, as identified in the draft’s Fig. 27 (CMC IV-C-3559). For independent confirmation of the Arrival matrix, seek a block accession through the National Gallery’s collection documentation and compare the relief in reverse with the printed image; for a specific impression, look instead for an annotated proof, print-shop ledger, paper analysis or unique sheet feature tied to its accession.","sources":[{"title":"Canadian Museum of History object entry, Three Caribous","url":"https://www.historymuseum.ca/capedorsetprints-iu/include/modalArtefact.php?code=38&lang=en","locator":"Niviaksiak, Date made 1957, experimental print no. UN CD 1957/58-003 EXPE, technique Stonecut"},{"title":"National Gallery of Canada object record, The Arrival of the Sun","url":"https://www.gallery.ca/collection/artwork/the-arrival-of-the-sun","locator":"Accession 38038, Materials field"},{"title":"Asato Ikeda and Ming Tiampo, Travelling Prints","url":"https://www.academia.edu/38778945/Travelling_Prints_James_Houston_Unichi_Hiratsuka_and_the_Early_Cape_Dorset_Print_Studio","locator":"Public manuscript version 4, draft Fig. 27 (block IV-C-3559) and pp. 54–56 (division of work at the studios)"}]}],"decision":"Accept the work-level match to 69-62 and Kenojuak’s role in designing and evaluating the impression shown. Accept workshop-level adaptation of a Japanese-style rubbing pad through Houston’s 1958–59 exchange. The film sheet’s identity and exclusive cutting credit remain unresolved. The earliest local stonecut in this test predates the exchange. The existing Kinngait practice record already describes the experiments and the later exchange, so retain this additional evidence in the workflow without creating an edition as a discovery or a workshop graph edge.","reject_if":"A shared title, image, work number, or edition denominator alone is offered as proof that two records document one sheet. Reject a claimed origin if the recipient already used the operation before the proposed contact, and leave an adoption claim unresolved if the bridge or the recipient’s use evidence is absent.","stop_when":"For a work join, stop when an original catalogue and an independently documented artifact agree on distinctive identifiers. For a sheet join or an individual role, stop only at an identifying object or primary workshop record, or record the missing identifier and leave the claim unresolved after checking the relevant public catalogues and archives. Admit a workshop exchange only at the scope where the source practice, dated bridge, and recipient use all converge.","next":"Open the Povungnituk section of the same cooperative catalogue, PDF pp. 35–37. Start with Stuart Williams’s signed survey of the 1961 experiments and Victor Tinkl’s advisory role in 1962, then compare the item image under Qumalu, Qumaluk and the French title. Use Avataq’s historical catalogue archive and the Agnes Etherington Art Centre’s Puvirnituq holdings to seek the recipient impression and workshop documentation. The shared release establishes a publishing relationship and gives a starting point for testing any claimed transfer of printing practice.","next_anchor":"Puvirnituq’s first catalogued stonecuts, using Leah Qumalu’s Sea Goddess / La déesse des mers, no. 75-62, in the 1962 Cape Dorset and Povungnituk catalogue.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"issues":[],"source_checks":[{"url":"https://static1.squarespace.com/static/5400c027e4b0cb1fd47c5bc9/t/592d99b015d5db9c9215c6c4/1496160739213/1962.pdf","locator":"PDF pp. 3, 33, 35–37","read_representation":"Original scanned PDF and rendered page images, local /tmp/big-idea-printing.Qc4mWh/1962.pdf","sha256":"76c5b706974b7cf12ba7529e902a2e4ac3407f3e5da117150811943cc407065b","access_limit":"No text layer; inspected page images and OCR. Index’s 1962 label and 1963 approved-graphics wording differ.","lineage":"Contemporary producer/distributor catalogue, independent from present holding institution."},{"url":"https://www.gallery.ca/collection/artwork/the-arrival-of-the-sun","locator":"object 38038, materials, date, credit","read_representation":"National Gallery online object metadata","access_limit":"No object comparison or matrix accession established by this page.","lineage":"Holding-institution record for an impression."},{"url":"https://epe.lac-bac.gc.ca/100/205/301/ic/cdc/world_around_me/world/vr1/pop-ups/1988164.htm?nodisclaimer=1","locator":"1988.164, 40/50","read_representation":"Archived collection entry","access_limit":"Inscription and object not physically examined.","lineage":"Separate holding of another impression, not proof of identical sheet."},{"url":"https://publications.gc.ca/collections/collection_2012/beaux-arts-gallery/NG1-2001-eng.pdf","locator":"p. 15, Kenojuak paragraph","read_representation":"Online annual report","access_limit":"No block accession or direct physical comparison.","lineage":"Institutional evidence for holding, not independent imaging of relationship."},{"url":"https://firstarts.ca/content/feature/934/artworks-21148-kenojuak-ashevak-c.c.-r.c.a.-1927-2013-kinngait-cape-dorset-the-arrival-of-the-sun-1962-69/","locator":"Lot 20, roles, final paragraph, provenance","read_representation":"Auction listing full text","access_limit":"Its film-sheet identity suggestion is explicitly speculative; role attributions conflict with studio caption.","lineage":"Commercial seller, distinct from workshop source and holding museums."},{"url":"https://dokumen.pub/atiqput-inuit-oral-history-and-project-naming-9780228013358.html","locator":"Dyck chapter pp. 198–199, note 39","read_representation":"Published chapter text and referenced translated dialogue","access_limit":"Film and underlying translator email not independently inspected; translator’s analysis as quoted.","lineage":"Independent scrutiny of recorded speech; secondary translation of a single filmed event."},{"url":"https://www.dorsetfinearts.com/stonecut/","locator":"Stonecutting photograph caption","read_representation":"Studio/distributor page","access_limit":"Caption offers attribution, not exclusive complete production documentation.","lineage":"Workshop-connected account, differs from auction catalogue."},{"url":"https://www.academia.edu/38778945/Travelling_Prints_James_Houston_Unichi_Hiratsuka_and_the_Early_Cape_Dorset_Print_Studio","locator":"version 4 dated Dec 7 2010 pp. 37–39, 53–55, notes 31–35 and 79, Figs 27–28","read_representation":"Public manuscript text; author’s reproduction of oral testimony, photo, inventory and translated Hiratsuka account","access_limit":"Underlying Hiratsuka original, Houston note, photo original and interview audio not directly inspected; conclusions retain draft’s historical reconstruction limitations.","lineage":"Museum research draft and exhibition inventory share curatorial lineage; physical item, documented photograph and artist interview provide different but related primary traces."},{"url":"https://www.historymuseum.ca/app/DocRepository/1/Exhibitions/Traveling_Exhibitions/inuitprintse.pdf","locator":"p. 2, works and artifacts","read_representation":"Museum exhibition inventory","access_limit":"Describes tools and artwork in exhibition, no direct use of this specific tool on Arrival of the Sun.","lineage":"Related curatorial project; not an independent new analysis."},{"url":"https://www.historymuseum.ca/capedorsetprints-iu/include/modalArtefact.php?code=38&lang=en","locator":"Three Caribous, 1957, UN CD 1957/58-003 EXPE","read_representation":"Museum online object record","access_limit":"Catalogued attribution; physical object not inspected.","lineage":"Same museum collections but separate pre-trip work, relevant chronology control."}],"limitations":["The independent review saw the published film frame and translation, not the complete original film or the translator’s original email.","The 1958 Houston note, Hiratsuka’s Japanese original, 2009 interview recording, physical baren and printing matrix were not directly inspected. Workshop adaptation remains a source-grounded historical inference at limited scope.","The next Puvirnituq target is a starting point, not evidence of technological transfer. No historical dataset changes or new graph edges are proposed."],"claim_reviews":[{"path":"inputs, steps[].action, reject_if, stop_when, next_anchor","decision":"accept","rationale":"Inputs and five sequential actions generalize across distinct workshops and explicitly seek work vs impression, producer vs holder, independent role evidence, both endpoints, bridge and pre-contact alternative. The work-level stopping rule is distinct from stricter individual-sheet and exchange thresholds; next anchor is a concrete different Puvirnituq work, 75-62, whose catalogue caption and image I inspected on PDF p. 37."},{"path":"steps[0].result","decision":"accept","rationale":"Original scanned catalogue PDF p. 33 visually identifies 69-62, Kenojuak, bilingual title and stonecut; p. 3 says production in 1962 and also refers to 1963 approved graphics, so distributor label, object date and release are properly separated. Existing Kinngait dataset record covers local experimental practice and does not identify a separate edition."},{"path":"steps[1].result","decision":"accept","rationale":"National Gallery accession 38038 records 1962, stonecut in black and yellow on japan paper and cooperative 1995 gift. Archived Lethbridge 1988.164 says 40/50. National Gallery 2000–01 annual report p. 15 identifies the film print and block in its collection without block accession. First Arts lot 20 says unnumbered proof and openly speculates as to the filmed sheet; related but unproven individual-sheet identity is appropriately deferred. Dimensions differ without common stated measurement basis."},{"path":"steps[2].result","decision":"accept","rationale":"Original catalogue names Kenojuak; Dyck pp. 198–199 and note 39 give Rhoda Kayakjuak’s translated dialogue and distinguish voice-over. Independent Dorset Fine Arts caption credits Lukta cutting while First Arts assigns cutting to Iyola and printing to Lukta. Record properly leaves exclusive credit unresolved, does not equate this filmed sheet with accession 38038, and identifies its reliance on a published frame and translation rather than asserting independent viewing."},{"path":"steps[3].result and decision workshop exchange","decision":"accept","rationale":"Ikeda/Tiampo draft version 4 pp. 37–39, 53–54 quotes Hiratsuka’s own 1962 account, describes Houston learning the Japanese rubbing pad and separately references his dated 1958 travel note; pp. 53–54 and figures document locally made sealskin pad IV-C-3558, publicity image PA-94469 and Kananginak Pootoogook interview. CMH exhibition inventory independently identifies local tools and prints brought back. These are an archival and curatorial reconstruction with distinct types of evidence, not fully independent curatorial publications or direct inspection of every historical item. Support is for adapting a Japanese-style rubbing tool at workshop scope, not a complete workflow or tool use on a specified sheet."},{"path":"steps[4].result and decision chronology","decision":"accept","rationale":"CMH object entry 1957 Three Caribous stonecut predates 1958–59 Japanese trip; this is a control against making the visit the origin of Kinngait stonecut practice, not a claim that every later tool had an earlier form. Draft figure 27 identifies IV-C-3559 as the different Talluliyuk block. Historical graph edge is not proposed."},{"path":"next and next_anchor","decision":"accept","rationale":"The original catalogue PDF pp. 35–37 surveys Puvirnituq experiments in 1961 and Tinkl’s 1962 role, and p. 37 illustrates and captions Leah Qumalu Sea Goddess no. 75-62. Shared publication supports a cataloguing/release association and does not by itself establish technological transmission."}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"separate independent source review","independence":"Distinct from proposing gpt-6.2-sol high execution."},"overall_decision":"accept","worker_commit":"428bc82395802b1ab38287e4f7306802e7b8927e","verified_commit":"428bc82395802b1ab38287e4f7306802e7b8927e","files_checked":1}},{"lane":"rail","kind":"workflow","title":"Distinguish railway inauguration, public availability and paid traffic","question":"When did Bombay–Thane move from a ceremonial passenger trip to regular public service, and what evidence connects the project to its financial sponsor?","summary":"The 8 April 1853 notice offered future fares for service starting 18 April. The 16 April invitation train carried passengers from Bori Bunder to Tannah. The Government Director records 18 April as the date the section opened for traffic, and the company revenue account starts the same day. A November 1853 newspaper summary gives 17 April and reports daily trains thereafter. The first ordinary train or ticket remains unresolved. A contract-and-accounts check supports an East India Company interest guarantee for the GIPR undertaking that included the first segment.","inputs":["Candidate route, endpoints, alternate spellings and operator","Candidate opening date or date window","Dated period newspaper, timetable or company notice","Operator’s operating or traffic returns and account periods","Proposed source and destination of a financing or technology transfer"],"steps":[{"title":"Identify the route and its changing station names","action":"Search a period newspaper archive by operator and both endpoints, then use the first retrieved spelling variants in a railway timetable or official gazette repository. Search the heritage inventory and operator’s historical notices for dated station-name changes and verify the building date before joining sites.","result":"The ceremony report uses Boree Bunder and Tannah, modern Bori Bunder and Thane. ICOMOS places the later Victoria Terminus at Bori Bunder and dates its formal opening to 1887. The ministry dates the building’s start to 1878 and its name changes to 1996 and 2017. Chhatrapati Shivaji Maharaj Terminus identifies the modern site, and the current building postdates the 1853 trip.","sources":[{"title":"Bombay Gazette inauguration report, reprinted in The Argus, Melbourne","url":"https://irfca.org/docs/history/au-news-gipr-first-train-1853.html","locator":"26 July 1853 issue excerpt, departure at Boree Bunder and arrival at Tannah; transcription"},{"title":"ICOMOS advisory evaluation, Chhatrapati Shivaji Terminus","url":"https://whc.unesco.org/archive/advisory_body_evaluation/945rev.pdf","locator":"No. 945 rev, §2, History, printed p. 63"},{"title":"Indian Ministry of Railways, 130 years of Chhatrapati Shivaji Maharaj Terminus building","url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=1532953&lang=2&reg=48","locator":"21 May 2018 release, paragraphs on building date, names and anniversaries"}]},{"title":"Read the offer and the ceremony account separately","action":"Search historical newspaper catalogues for the operator plus the endpoints and the terms opening, inauguration, fares and daily. Retrieve issues before and after the supposed opening. For each item record the publication date, event date, who could travel, and whether the writer reports a trip or advertises one. Trace reprints to the originating paper or catalogue and count duplicates as a single witness.","result":"The 8 April Bombay Times notice, inspected in later reproductions, advertises class fares and daily service from Monday 18 April. The Bombay Gazette account reprinted in Melbourne describes the 16 April ceremonial departure, guests, fourteen carriages and three unnamed engines. It gives a reported estimate of about 500 people. The modern Indian Railways account gives about 400. A separate Bombay Times report also describes an invitation event and nearly 500 attendees. These are estimates of the inaugural party. The original Trove page was unavailable during this run; the searchable Argus transcription preserves the newspaper report.","sources":[{"title":"Bombay Times notice reproduced in Yojana","url":"https://www.publicationsdivision.nic.in/journals/Journalarchives/Yojana/Yojana-English/1976/February/Yojana_1976_February_pdf.pdf","locator":"15 February 1976, p. 5, reproduced Bombay–Thanah notice, intended start and fares"},{"title":"India’s 1st train: When Sahib, Sindh & Sultan blew steam","url":"https://timesofindia.indiatimes.com/news/Indias-1st-train-When-Sahib-Sindh-Sultan-blew-steam/toi175yrsarticleshow/19717248.cms","locator":"Archives and 8 April 1853 notice"},{"title":"Bombay Gazette inauguration account, Argus transcription","url":"https://irfca.org/docs/history/au-news-gipr-first-train-1853.html","locator":"26 July 1853, Inauguration of the Great Indian Peninsula Railway, departure passage"},{"title":"Bombay Times and Journal of Commerce, The Opening of the Bombay Railway","url":"https://railroadsofbombay.blogspot.com/2026/05/18-april-1853-bombay-times-another-read.html","locator":"18 April 1853 article, opening paragraphs and return passage, modern transcription; original page not inspected"},{"title":"National Library of Australia, Argus article","url":"https://trove.nla.gov.au/newspaper/article/4794959","locator":"26 July 1853, article 4794959; page unavailable in this inspection"},{"title":"History of RPF: Evolution of Railways in India","url":"https://wr.indianrailways.gov.in/ministry/our-department/preview/465","locator":"Evolution of Railways in India, inaugural journey account"}]},{"title":"Test public availability against traffic and annual accounts","action":"Search government and parliamentary report collections using the operator, year, receipts, working expenses, and opened for traffic. Look for a signed dated return, a section-opening table and passenger receipts or counts. Verify the scan and column headings, record start and end dates, and check whether the route grew during the accounting period.","result":"Danvers §41 dates the Bombay–Tannah opening to 18 April 1853, in a row grouped with the Mahim branch; it lists Tannah–Callian separately on 1 May 1854. Watt’s signed account starts 18 April 1853, as verified on the table itself; the appendix contents erroneously give 1858 for that start. The first row through 30 June 1854 gives £14,252 3s 8d total receipts across 34½ miles open. Danvers §142 separately reports 535,195 passenger conveyances and £13,647 passenger receipts in the year ending 30 June 1854. Those returns establish paid traffic during a period reaching beyond Bombay–Thane. Their shared company accounting limits their independence and their figures cannot be assigned to the first day.","sources":[{"title":"Juland Danvers, Report on Railways in India to the End of the Year 1859","url":"https://upload.wikimedia.org/wikipedia/commons/2/28/Report_to_the_Secretary_of_State_for_India_in_Council_on_Railways_in_India_to_the_end_of_the_year_1859%2C_1860-61_to_1879-80_%28IA_dli.granth.109260%29.pdf","locator":"Printed p. 13, §41 (scan page 15); Printed p. 33, §142 (scan page 35)"},{"title":"GIPR company secretary’s 1858 revenue account in the House of Commons Indian Railways report","url":"https://archive.org/download/reporttogetherwi00grea/reporttogetherwi00grea.pdf","locator":"Appendix contents printed p. 290; Appendix No. 1, printed p. 292 (scan page 318), statement signed 15 June 1858"}]},{"title":"Seek a period source outside the accounts and preserve the alternative date","action":"Search period newspaper runs for the operator plus directors, half-yearly report and route variants. Compare a report close to the event with official dates, and search a local official gazette for carriage terms and changes to the schedule. Confirm digits in the scan. Distinguish first movement, first regular departure, public offer and the accounting start date.","result":"The Economist page image prints 17 April and reports two trains running daily thereafter, attributing both to the GIPR directors’ eighth half-yearly report. Searching that report title and the British Library company listings did not yield an inspected original. The independent newspaper publication relays the operator’s account. The 17 April date conflicts with Danvers’s 18 April date. The original directors’ report or a dated traffic log could clarify the discrepancy. The indexed Gazette points to a 26 April timetable notice reproduced on 11 August. Review of the page image, including stops and ticket terms, remains pending.","sources":[{"title":"The Economist, Great Indian Peninsula","url":"https://upload.wikimedia.org/wikipedia/commons/8/86/The_Economist_1853-11-05-_Vol_11_Iss_532_%28IA_sim_economist_1853-11-05_11_532%29.pdf","locator":"5 November 1853, vol. 11, no. 532, printed p. 1260 (scan page 24), Great Indian Peninsula"},{"title":"Bombay Government Gazette, GIPR alteration in hours","url":"https://dspace.gipe.ac.in/xmlui/bitstream/handle/10973/56096/GIPE-BGG-1853-23-32-01.pdf?isAllowed=y&sequence=1","locator":"11 August 1853, vol. 23, no. 32, printed p. 1260. Indexed text only; page image unavailable."},{"title":"British Library GIPR company records","url":"https://searcharchives.bl.uk/catalog/037-000980625","locator":"IOR/L/AG/46/12, board minute books and other surviving company records"}]},{"title":"Trace the financing at both ends","action":"For each proposed prerequisite or carrier, identify the actor and resource at the sending end and the receiving organisation, asset or section at the other. Search the corporate or government archive catalogue for the agreement, then match it against dated evidence of disbursement, repayment or use. Test whether another party supplied the capital or equipment and whether the documented contribution applied to the route.","result":"The sender was the East India Company acting as guarantor. The receiver was the Great Indian Peninsula Railway Company’s Bombay–Callian project, whose first opening was Bombay–Tannah. The British Library item identifies the August 1849 construction agreement, and Danvers §§36 and 41 identify the same undertaking and opening sequence. Danvers §48 records guaranteed interest received on capital raised in England and India, and the operator’s signed return records £7,122 4s 2d for the initial accounting period paid back to the East India Company in reduction of interest advanced. The 1853 share figures in The Economist and Danvers’s §44 identify investor capital alongside guaranteed interest. The original 1849 contract was located at catalogue level only; no exact rate for that original agreement or route-specific cost share is inferred.","sources":[{"title":"British Library, GIPR agreements","url":"https://searcharchives.bl.uk/catalog/040-000980626","locator":"IOR/L/AG/46/12/1, scope and content item (b), August 1849 Bombay–Callian agreement"},{"title":"Juland Danvers, Report on Railways in India to the End of the Year 1859","url":"https://upload.wikimedia.org/wikipedia/commons/2/28/Report_to_the_Secretary_of_State_for_India_in_Council_on_Railways_in_India_to_the_end_of_the_year_1859%2C_1860-61_to_1879-80_%28IA_dli.granth.109260%29.pdf","locator":"Printed pp. 12–14, §§36, 41, 44 and 48 (scan pages 14–16)"},{"title":"GIPR company secretary’s 1858 revenue account in the House of Commons Indian Railways report","url":"https://archive.org/download/reporttogetherwi00grea/reporttogetherwi00grea.pdf","locator":"Appendix No. 1, printed p. 292 (scan page 318), statement signed 15 June 1858"},{"title":"The Economist, Great Indian Peninsula","url":"https://upload.wikimedia.org/wikipedia/commons/8/86/The_Economist_1853-11-05-_Vol_11_Iss_532_%28IA_sim_economist_1853-11-05_11_532%29.pdf","locator":"5 November 1853, vol. 11, no. 532, printed p. 1260 (scan page 24), Great Indian Peninsula, capital account to 30 June 1853"}]},{"title":"Decide the supported milestone and limit identity claims","action":"Record the earliest dated evidence for each milestone. Test any later commemoration against the contemporary account and seek an operating log, delivery record, or manufacturer’s serial number before assigning a locomotive or design lineage. Assign uncertainty at the level of the unresolved run, transaction, person or vehicle.","result":"Record 16 April as the invitation run and attribute the 18 April opening for traffic to Danvers. Preserve 17 April as an alternative reported date and the aggregate receipts as evidence of subsequent paid use. The Bombay departure remains Bori Bunder. The 1909 Gazetteer uses “opened for traffic” for 16 April and describes the public holiday and salutes. Read alongside the two period newspaper accounts of invitations and the operator’s 18 April accounting start, that phrase is insufficient to date ordinary paid service. The railway ministry’s anniversaries and postal issues mark the later station building. The period ceremony account describes three unnamed engines, which gives no specific join to the Merthyr Tramroad locomotive represented by steam-railway-traction.","sources":[{"title":"Bombay Gazette inauguration account, Argus transcription","url":"https://irfca.org/docs/history/au-news-gipr-first-train-1853.html","locator":"26 July 1853 issue excerpt, departure and engine count"},{"title":"Gazetteer of Bombay City and Island, Railway chapter","url":"https://gazetteers.maharashtra.gov.in/cultural.maharashtra.gov.in/english/gazetteer/Bombay%20City/volume_1/Railways.html","locator":"1909, vol. I, ch. V, The Great Indian Peninsula Railway, paragraph describing the opening and salutes"},{"title":"Indian Ministry of Railways, 130 years of Chhatrapati Shivaji Maharaj Terminus building","url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=1532953&lang=2&reg=48","locator":"21 May 2018, 1878 construction start and later commemorative stamp and postal cover"}]}],"decision":"Add Danvers’s recorded opening for traffic on 18 April 1853. Keep the 8 April timetable as an offer, the contemporary report of 17 April as a conflicting date, and the later accounts as evidence of paid use during the reporting period. The first ordinary train or ticket remains unresolved. The accounts support the East India Company interest guarantee for the Bombay–Callian undertaking. Locomotive design transfer remains unresolved.","next":"To resolve the one-day conflict, locate the original eighth half-yearly directors’ report or a dated station or traffic log for 17–18 April 1853. Search the British Library company minute books beginning at IOR/L/AG/46/12/2–29, checking the date range of each volume for the relevant meeting or report.","reject_if":"Reject an exact first-day use claim based solely on a forward timetable, invitation ride, commemoration or the first row of a multi-date revenue account. Reject vehicle or design ancestry if records at the two ends give no common delivery, serial, drawing or personnel identifier.","stop_when":"Record the strongest available stage once period operating or traffic evidence and an independently published check establish its scope. If published accounts conflict after the search of operating records and the nearest original company source is inaccessible, retain both dates with attribution and stop at the recorded opening rather than the first individual journey.","next_anchor":"Madras–Arcot passenger railway (Royapuram to Walajah Road), 1856. Start with Danvers §52 and pair the public opening account with a route-level Madras Railway timetable and traffic return.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"issues":[],"source_checks":[{"url":"https://upload.wikimedia.org/wikipedia/commons/2/28/Report_to_the_Secretary_of_State_for_India_in_Council_on_Railways_in_India_to_the_end_of_the_year_1859%2C_1860-61_to_1879-80_%28IA_dli.granth.109260%29.pdf","locator":"printed pp.13 and 33; source scan pages 15 and 35","read_representation":"full original worker-local PDF text, before cleanup; matched page text","access_limit":"full remote PDF exceeds web fetch limit; guarantee p.14 is supported by worker excerpt but full p.12 was not independently reread","source_lineage":"government director synthesis may draw on company returns"},{"url":"https://archive.org/download/reporttogetherwi00grea/reporttogetherwi00grea.pdf","locator":"appendix p.292 scan page 318","read_representation":"original worker-local scan page visually inspected","access_limit":"remote unavailable via web; source cached descriptor records source digest and excerpt page mapping","source_lineage":"signed operator return; not independent from company reports"},{"url":"https://upload.wikimedia.org/wikipedia/commons/8/86/The_Economist_1853-11-05-_Vol_11_Iss_532_%28IA_sim_economist_1853-11-05_11_532%29.pdf","locator":"5 Nov 1853 p.1260 scan page 24","read_representation":"worker-local original scan page visually inspected","access_limit":"original directors report uninspected","source_lineage":"contemporary newspaper quoting directors; independent publication, dependent underlying account"},{"url":"https://dspace.gipe.ac.in/xmlui/bitstream/handle/10973/56096/GIPE-BGG-1853-23-32-01.pdf?isAllowed=y&sequence=1","locator":"vol 23 no 32 pp.1260–1261, 26 Apr notice","read_representation":"not independently inspected","access_limit":"24MB PDF exceeds web limit; worker removed temporary copy; requested local original","source_lineage":"operator notice printed in government gazette"},{"url":"https://searcharchives.bl.uk/catalog/040-000980626","locator":"IOR/L/AG/46/12/1 scope (b)","read_representation":"catalogue directly read","access_limit":"contract contents not digitized in record","source_lineage":"archival metadata only"},{"url":"https://whc.unesco.org/archive/advisory_body_evaluation/945rev.pdf","locator":"p.63 history","read_representation":"original ICOMOS evaluation PDF read","access_limit":"retrospective heritage evaluation","source_lineage":"separate heritage inventory"},{"url":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=1532953&lang=2&reg=48","locator":"21 May 2018 building dates and names","read_representation":"official source directly read","access_limit":"retrospective; does not describe 1853 building","source_lineage":"operator ministry release"},{"url":"https://timesofindia.indiatimes.com/news/Indias-1st-train-When-Sahib-Sindh-Sultan-blew-steam/toi175yrsarticleshow/19717248.cms","locator":"archive 8 April 1853 notice","read_representation":"modern reproduction directly read","access_limit":"not the original issue image","source_lineage":"newspaper reporting from its archive"},{"url":"https://indiaofthepast.org/bombay-gazette/life-back-then/india-s-first-commercial-passenger-train-journey","locator":"Bombay Gazette inaugural trip transcription","read_representation":"modern transcription checked","access_limit":"Argus original Trove unavailable; transcript not independent of Gazette original","source_lineage":"derivative witness, not two reports"}],"limitations":["The 26 April Gazette notice has not been independently examined as a page image; the revised workflow retains indexed Gazette information only as an archive lead.","Guarantee relates to the Bombay–Callian undertaking; original 1849 contract remains a catalogue item only.","No specific design transmission from Merthyr locomotive is established.","Danvers and company accounting may share underlying operator data; first ordinary trip and ticket remain unresolved."],"claim_reviews":[{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/kind,title,question,inputs,steps/action,reject_if,stop_when,next_anchor","decision":"accept","rationale":"Reusable inputs, searches, comparison steps, rejection and stopping criteria are explicitly operational and distinguish route-level evidence from design ancestry. The next anchor is a different 1856 railway case, not an invented result. Actions are distinct from observed results.","sources":["British Library IOR/L/AG/46/12 catalogue","Danvers §§41,142","Economist 5 November 1853 p.1260"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/steps/0/result","decision":"accept","rationale":"Revised result removes uninspected Gazette station table. Contemporary account in transcription identifies historic departure and ICOMOS identifies Bori Bunder as site of later Victoria Terminus; ICOMOS and ministry support building and name chronology.","sources":["ICOMOS evaluation no.945 rev p.63","Ministry of Railways 21 May 2018","Bombay Government Gazette vol 23 no 32 p.1260"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/steps/1/result","decision":"accept","rationale":"Times of India reproduces 8 April notice as future 18 April daily service; a modern transcription of the Bombay Gazette account reports 14 carriages, three unnamed engines and an estimated 500 guests. Its Argus reprint is the same report, not independent corroboration. Bombay Times modern transcription and 400 modern count are separated as estimates; no original Trove page claim is made.","sources":["Times of India 25 Apr 2013 archives","Bombay Gazette 18 Apr 1853 modern transcription","Ministry of Railways/RPF history"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/steps/2/result","decision":"accept","rationale":"The original Danvers scan §41 reports traffic opening 18 April in a combined route row and later extension 1 May 1854. §142 reports 535,195 passenger conveyances and £13,647 for period ending June 1854. Original Watt signed 1858 account starts 18 April, ends June 1854 and totals £14,252 3s 8d across 34½ miles; it does not identify receipts on any particular day. Company-account lineage constrains independence.","sources":["Danvers 1860 pp.13,33","GIPR Watt 1858 appendix p.292"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/steps/3/result","decision":"accept","rationale":"Original Economist image reports 17 April and two daily trains, attributed to directors; company report uninspected. Revised Gazette reference is an indexed archive lead only; page-image review and notice details remain explicitly pending.","sources":["Economist 5 Nov 1853 p.1260","Bombay Government Gazette 26 Apr 1853 pp.1260–1261","British Library IOR/L/AG/46/12"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/steps/4/result,decision","decision":"accept","rationale":"Archive catalogue lists August 1849 Bombay–Callian agreement but not the terms; Danvers §41 identifies opening section and §48 records guaranteed interest, while original Watt account reports repayment against interest advanced. This supports an institutional guarantee associated with the wider undertaking, not exact route-specific spending or a technological lineage. Shares and guarantee are separate roles. The 1849 agreement itself remains uninspected.","sources":["British Library IOR/L/AG/46/12/1","Danvers 1860 §§36,41,44,48","GIPR Watt 1858 p.292","Economist 5 Nov 1853 p.1260"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/rail.json#/summary,steps/5/result,decision","decision":"accept","rationale":"Revised workflow clearly attributes 18 April traffic opening to Danvers, separates the earlier advertisement and later company reported service and aggregate receipts, retains 17 April conflicting report and leaves first ordinary trip or ticket unresolved.","sources":["Danvers 1860 §41","GIPR Watt 1858 p.292","Economist 5 Nov 1853 p.1260","Times of India 2013 reproduction of 8 April notice"]},{"path":"data/discoveries/transport/bombay-thane-passenger-railway.json#/events/recorded-public-opening-1853,earliest_record,research","decision":"accept","rationale":"The new practical deployment event attributes 18 April opening for traffic to Danvers. It distinguishes the proposed passenger service, press report of 17 April, and subsequent aggregate revenue; it does not assert a first-day passenger journey. Existing 8 April offer and 16 April invitation event are distinct. Operator role is supported by contemporaneous company return and director table.","sources":["Danvers 1860 §41","GIPR Watt 1858 p.292","Economist 5 Nov 1853 p.1260"]},{"path":"data/sources/d/danvers-1860-indian-railways-through-1859.json + evidence/d/danvers-1860-indian-railways-through-1859.pdf.cache.json","decision":"accept","rationale":"Page map binds archival selected scans; primary government report line and annual table were independently read from the researcher’s full original before temporary cache removal. £13,647 and 535,195 refer to wider network/year, not first day.","sources":["Danvers 1860 pp.13,33"]},{"path":"data/sources/g/gipr-1858-receipts-working-expenses.json + evidence/g/gipr-1858-receipts-working-expenses.pdf.cache.json","decision":"accept","rationale":"Original 1858 signed company return was visually inspected; initial period and fields correctly identified, not treated as a daily log.","sources":["GIPR Watt 1858 appendix p.292"]},{"path":"data/sources/e/economist-1853-gipr-eighth-report.json + evidence/e/economist-1853-gipr-eighth-report.pdf.cache.json","decision":"accept","rationale":"Original newspaper p.1260 was visually inspected. It prints 17 April and claims two trains daily, attributed to directors’ report. This is not independent of company reporting and is an unresolved conflicting account.","sources":["Economist 5 Nov 1853 p.1260"]}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"independent review_credit reassigned rail","independence":"Separate execution from gpt-6.2-sol high proposer."},"overall_decision":"accept","worker_commit":"24649759285e474ded1b1bf9ec9bc3e687f270d5","verified_commit":"24649759285e474ded1b1bf9ec9bc3e687f270d5","files_checked":8}},{"lane":"steam","kind":"workflow","title":"From a maker’s engine order to a steamboat in service","question":"Can a Boulton & Watt works record be joined to the engine that powered Fulton’s North River Steamboat and to a documented passenger voyage?","summary":"Boulton & Watt’s invoice and dispatch correspondence match Fulton’s identification of the 1804 engine in his New York–Albany passenger boat. A signed passenger account records the first packet passage of 4–5 September 1807. The works code and the direct delivery and installation records remain open.","inputs":["Maker and buying parties, including trading or forwarding names","Approximate order, dispatch and operating dates","Vessel names, registration jurisdiction and route","Machine specifications and markers distinguishing successive orders or refits"],"steps":[{"title":"Bound the vessel and its configuration","action":"Search port or customs registers for the vessel name and owner. Search each spelling or alias in a dated interval. Record the issuing office, enrollment or hull number, previous enrollment, dimensions and date of each rebuild. Use name changes and surrender or cancellation notes to identify the vessel at the proposed service date.","result":"The 14 May 1808 enrollment printed by Dickinson names the enlarged North River Steamboat of Clermont and cites the surrender of New York enrollment no. 973, issued 3 September 1807. The operator’s contemporary advertisement is headed The North River Steam Boat. Searches should include North River Steam Boat, North River Steamboat of Clermont and Fulton or Livingston. Clermont in the signed passenger account is a landing along the route. No. 973 belongs to the vessel enrollment.","sources":[{"title":"Dickinson, Robert Fulton, Engineer and Artist, Cornell scan","url":"https://archive.org/download/cu31924005003466/cu31924005003466.pdf#page=274","locator":"Printed p. 228, transcription of the 14 May 1808 enrollment and reference to no. 973"},{"title":"The North River Steam Boat advertisement","url":"https://nyslibrary.libguides.com/steamboats/newspapers","locator":"American Citizen, 2 September 1807, New York State Library BOX 409"}]},{"title":"Identify the maker’s numbering system","action":"Open the maker’s production series and read its cataloguing notes on order numbers, shop codes, drawing numbers and reused sequences. Use the date range to choose the main volume and any overlapping small-engine or dispatch volumes. Search contemporary customer spellings, intermediaries, dimensions and places. Record the volume and folio, exact mark and adjacent fields. Match the mark in a second dated maker document before assigning it to the engine.","result":"Birmingham’s MS 3147/4 finding aid says Boulton & Watt added letter codes to orders, production and fitting books, packing and billing records from February 1803 and later repeated sequences. Engine Order Book No. 5, MS 3147/4/91, encloses the July 1804 order within its December 1802–October 1804 main sequence, with a second small-engines sequence. MS 3147/3/496 indexes Fulton’s letters, including two written as Robert Francis. Searches for Fulton, R. Fulton, Robert Francis, 24 inch and engine order book identified the relevant volume and correspondence. The item catalogue gives no Fulton folio and no engine code. The scanned September drawing names R. Fulton, but I could not verify the abbreviated shop notation as a code. The 1244a–c numbers in the correspondence calendar are drawing portfolio references.","sources":[{"title":"Birmingham Archives, Boulton & Watt production records","url":"https://calmview.birmingham.gov.uk/CalmView/Record.aspx?id=MS+3147/4&src=CalmView.Catalog","locator":"MS 3147/4, Engine Codes and February 1803 onwards"},{"title":"Birmingham Archives, Engine Order Book No. 5","url":"https://calmview.birmingham.gov.uk/calmview/Record.aspx?id=MS+3147/4/91&src=CalmView.Catalog","locator":"MS 3147/4/91 item description and access status"},{"title":"Birmingham collection correspondence calendar, Adam Matthew finding aid","url":"https://webdoc.sub.gwdg.de/zdmdm/mifoguide/matthew/INDUSTRIAL_REVOLUTION_S1_p15.pdf","locator":"MS 3147/3/496, heading and items 7, 9, 12a and 13"},{"title":"Boulton & Watt cylinder and condenser drawing","url":"https://archive.org/download/cu31924005003466/cu31924005003466.pdf#page=211","locator":"Plate facing p. 174, shop drawing for R. Fulton, 13 September 1804"}]},{"title":"Follow the engine forward from order to delivery","action":"Read the signed authorization, specifications, invoice, packing list and dispatch letters in date order. Transcribe buyer, destination, carrier, dimensions and which parts were supplied. Follow each destination in the receiving port, yard or operator archive. Treat a works handover, forwarding instruction, loaded freight, port receipt and installation as separate milestones. Compare names, quantities, dates and any shared engine code at each handoff.","result":"The calendar records Fulton’s 28 July 1804 authorization. The cylinder and condenser drawing for R. Fulton is dated 13 September. The maker’s account of 17 January 1805 names Fulton, specifies a 24-inch bore and four-foot stroke, and lists Soho as the point of delivery. The dispatch letter of the same date describes packed goods awaiting carriage during frozen-canal conditions. The 21 February letter reports that Skey & Bird’s boats took the goods on 6 February for London. The surviving reproductions establish dispatch toward the London addressee. I found no transatlantic freight entry, signed receipt or contemporaneous installation handover in these reproductions.","sources":[{"title":"Birmingham collection correspondence calendar, Adam Matthew finding aid","url":"https://webdoc.sub.gwdg.de/zdmdm/mifoguide/matthew/INDUSTRIAL_REVOLUTION_S1_p15.pdf","locator":"MS 3147/3/496, items 9, 11, 12a–b and 13"},{"title":"Boulton & Watt account and dispatch correspondence in Dickinson","url":"https://www.museum.state.il.us/RiverWeb/landings/Ambot/Archives/dickinson/chapter8.html","locator":"Printed pp. 174 and 177–178, 13 September 1804 drawing, 17 January 1805 account and letters of 17 January and 21 February 1805"}]},{"title":"Trace the installed machine backward from the operator","action":"Search the operator’s engineering books, vessel accounts, repair records and dated letters for an explicit link to the maker’s order. Compare the configuration date, recipient and specs against the supplier record. Test the nearest competing earlier or later order and any rebuild. Inspect accession records and original drawings for later labels or retouched captions. Attribute shared-source transcriptions to the same underlying document.","result":"On 15 September 1810 Fulton told Boulton & Watt that their engine made for him in 1804, with a 24-inch cylinder and four-foot stroke, powered a New York–Albany passenger boat. The builder and recipient agree with the invoice. In the same letter Fulton asks for another engine, initially of 26 inches, with later changes in correspondence. This second order cannot identify the engine used in the 1807 voyage. The 1798 Livingston inquiry already mentions the earlier dimensions, so size alone is insufficient. U.S. National Museum staff examined drawing no. 180137 and identified the machinery layout as the remodeled North River vessel, flagging its later inscription. That drawing cannot establish the unmodified 1807 installation. Dickinson’s transcription and the correspondence calendar point to the same Fulton letter.","sources":[{"title":"Fulton’s 15 September 1810 letter in Dickinson","url":"https://archive.org/download/cu31924005003466/cu31924005003466.pdf#page=276","locator":"Printed pp. 230–231. Birmingham reference MS 3147/3/496, item 15"},{"title":"Livingston’s earlier inquiry in Dickinson","url":"https://www.museum.state.il.us/RiverWeb/landings/Ambot/Archives/dickinson/chapter7.html","locator":"Printed p. 137, Livingston to James Watt, 4 November 1798"},{"title":"Birmingham collection correspondence calendar, Adam Matthew finding aid","url":"https://webdoc.sub.gwdg.de/zdmdm/mifoguide/matthew/INDUSTRIAL_REVOLUTION_S1_p15.pdf","locator":"MS 3147/3/496, heading and items 15 and 16"},{"title":"United States National Museum Bulletin 173","url":"https://upload.wikimedia.org/wikipedia/commons/5/53/Bulletin_-_United_States_National_Museum_%28IA_bulletinunitedst1731939unit%29.pdf","locator":"Machinery of the ‘Clermont’ and the ‘Chancellor Livingston’, U.S.N.M. no. 180137"}]},{"title":"Verify an actual duty or journey","action":"Use the operator’s notice to identify the date, location, fares and intended service. Search original local newspapers and the terminal’s arrival, clearance or passenger registers around the advertised date and across both termini. Identify the author, witnesses and any reprint lineage for each report. Look for a completed journey or recorded duty and match the vessel, route and operating purpose to the installation. Check trial runs, departures and advertisements separately.","result":"The 2 September 1807 American Citizen facsimile in New York State Library BOX 409 offers a 4 September departure from Paulas Hook ferry and a seven-dollar Albany fare. Its timings are advertised. In Wilson’s account in the Annals of Albany, a signed passenger statement dated at Albany on 5 September states the boat left New York on Friday and reached Albany the following morning on its first packet passage. Wilson identifies Friday as 4 September and signs the reported statement. The passengers provide an account independent of the builder and operators. Wilson says the Albany Register printed it on 8 September 1807. The New York State Library inventory identifies the Albany Register run with gaps, and the account was examined in its 1855 reprint. The August trial report and an October departure report refer to other passages. A fare offer and signatures do not establish an individual payment or a total passenger count.","sources":[{"title":"American Citizen advertisement facsimile","url":"https://libapps.s3.amazonaws.com/accounts/286230/images/northriv.gif","locator":"2 September 1807, New York State Library BOX 409, Albany fare and advertised departure"},{"title":"The Annals of Albany, volume VI, passenger statement","url":"https://archive.org/details/annalsofalbany06munsuoft/page/25/mode/1up","locator":"Printed pp. 23 and 25, John Q. Wilson narrative and signed statement dated 5 September 1807"},{"title":"New York State Library, Albany newspaper inventory","url":"https://nysl.nysed.gov/nysnp/101","locator":"Albany Register, 071 E12 84-25695, 1807–1808 run with some issues missing"},{"title":"New York State Library, early steamboat newspaper reports","url":"https://nyslibrary.libguides.com/steamboats/newspapers","locator":"21 August 1807 American Citizen reprint of Mercantile Advertiser trial report"},{"title":"A Picture of New-York in 1846","url":"https://tile.loc.gov/storage-services/public/gdcmassbookdig/pictureofnewyork01rugg/pictureofnewyork01rugg.pdf","locator":"Printed pp. 104–105, September advertisement and reported 2 October departure"}]}],"decision":"The producer’s 1805 invoice and the buyer’s 1810 letter support a supply relationship from Boulton & Watt’s 1804 Fulton order to the engine in his New York–Albany passenger boat. The independent passenger statement supports actual packet service on 4–5 September 1807. The identifier-level link remains unresolved because no dated works-code entry or receiving-side identifier was verified. The evidence supports a scoped supplier attribution on the existing boat service record.","reject_if":"Reject an exact-engine join when the matching number belongs to another numbering system, was assigned after a rebuild, or was reused in a different period. Reject a join based only on common dimensions, a similar name or repeated copies of the same underlying document. Treat an itinerary or announcement as intent until there is evidence of observed service.","stop_when":"Close an identifier-level join when a dated maker record and delivery or installation record identify the same machine in the same configuration and independent evidence attests the claimed duty. If the relevant folio or receiving record is unavailable, stop at the strongest supported intermediate join and record the repository, item reference and exact missing fields. Here that means the entry and code in MS 3147/4/91, a dated second code-bearing works record, and any freight or installation record that connects it to the New York vessel.","next":"For the next pilot start with the surviving engine and locate the maker and installation documents for the original vessel. Use the accession number to find collection history, then seek the maker’s own identifier and check passenger or harbour evidence for the advertised duty.","next_anchor":"Henry Bell’s Comet on the Clyde in 1812. Start from Science Museum Group object 1862-53/1 at https://collection.sciencemuseumgroup.org.uk/objects/co8018658/the-original-engine-of-henry-bells-paddle-steamer. Search Glasgow and Greenock newspaper issues of 14–15 August 1812 for the advertised service and check a separate arrival, harbour or passenger account.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"issues":[],"source_checks":[{"url":"https://nyslibrary.libguides.com/steamboats/newspapers","locator":"American Citizen 2 September 1807 transcription and BOX 409","representation":"State Library transcript read; local notes contain facsimile URL and hash","role":"operator advertisement / library reproduction","independence":"The 1846 advertisement reproduction is same underlying notice."},{"url":"https://archive.org/download/cu31924005003466/cu31924005003466.pdf","locator":"pp.174,177–178,228,230–231","representation":"1913 printed book scan read locally; SHA-256 53f8563941e28ead3bcab5a8b33b95d951e74837f27a2b0d886ee73e158e3f51","role":"transcriptions of maker dispatch, customer letter and enrollment","independence":"Distinct 1805 maker correspondence and 1810 buyer statement; neither original manuscript independently inspected."},{"url":"https://archive.org/details/annalsofalbany06munsuoft/page/25/mode/1up","locator":"vol.VI p.25","representation":"local printed page facsimile read; SHA-256 cc81c664052ed4054c47c5a82eaea3000b1e82e3c8832f18ca0a2a18204ca5e9","role":"passenger testimonial in 1855 reprint","independence":"Separate evidence of passenger passage from manufacturer and operator; original 1807 newspaper issue not inspected."},{"url":"https://calmview.birmingham.gov.uk/CalmView/Record.aspx?id=MS+3147/4&src=CalmView.Catalog","locator":"series introduction, Engine Codes","representation":"catalogue full text read","role":"finding aid and source of coding conventions","independence":"Catalog metadata is not an independent inspection of Fulton order folio; item 4/91 page unavailable to reviewer."},{"url":"https://webdoc.sub.gwdg.de/zdmdm/mifoguide/matthew/INDUSTRIAL_REVOLUTION_S1_p15.pdf","locator":"MS 3147/3/496 heading and correspondence item list","representation":"finding aid PDF read","role":"catalogue locator for original letters","independence":"Index to same letters as Dickinson, not another historical eyewitness."},{"url":"https://upload.wikimedia.org/wikipedia/commons/5/53/Bulletin_-_United_States_National_Museum_%28IA_bulletinunitedst1731939unit%29.pdf","locator":"Machinery of Clermont and Chancellor Livingston, no.180137","representation":"digitized museum bulletin text read","role":"independent scrutiny of drawing attribution","independence":"Museum interpretation, not an installation record."},{"url":"https://collection.sciencemuseumgroup.org.uk/objects/co8018658/the-original-engine-of-henry-bells-paddle-steamer","locator":"object 1862-53/1","representation":"museum collection entry read","role":"next pilot object catalogue","independence":"does not independently establish historical passenger service."}],"limitations":["Fulton’s original manuscript, the 1807 Albany Register issue, maker order folio/code and transatlantic and installation handovers were not inspected.","Reviewer could not load Birmingham MS 3147/4/91 item or the cited Archive.org p.23 page. The p.25 statement itself shows Friday departure and September 5 date; catalogue series guidance is accessible.","No complete verification of user-side searches beyond recorded specific outcomes is claimed; provenance of the results is cited."],"claim_reviews":[{"path":"data/discoveries/transport/north-river-steamboat-passenger-service.json#/description","decision":"accept","rationale":"Passenger statement and Fulton 1810 identify an operating boat and its maker; the description attributes the 1804 engine identification to Fulton rather than asserting the original machine ledger was examined.","sources":["Munsell 1855 p.25","Dickinson 1913 pp.230–231"]},{"path":"data/discoveries/transport/north-river-steamboat-passenger-service.json#/events/fare-offer-1807 and measures/advertised passage fare","decision":"accept","rationale":"New York State Library transcript of its American Citizen September 2 issue advertises Friday September 4, Paulas Hook and seven dollars to Albany. Offer is not actual payment; later guide repeats same offer.","sources":["American Citizen 2 September 1807, NYSL transcript","1846 Picture pp.104–105"]},{"path":"data/discoveries/transport/north-river-steamboat-passenger-service.json#/events/first-packet-passage-1807","decision":"accept","rationale":"Printed 1855 reprint of 5 September passenger statement recounts Friday New York departure and Albany arrival, and identifies it as first passage as a packet. Date is source-supported; no claim of actual fare or overall first steamboat. Newspaper original not examined.","sources":["Munsell 1855 vol.VI p.25"]},{"path":"data/discoveries/transport/north-river-steamboat-passenger-service.json#/events/fulton-accounts-for-engine-1810 except contributions","decision":"accept","rationale":"Fulton in his September 1810 letter identifies a 24-inch by four-foot 1804 Boulton & Watt engine with his passenger boat. The 1805 account and forwarding letter provide maker side and say goods forwarded toward London, not proof of arrival, freight, or fitting. The event date is the letter date.","sources":["Dickinson 1913 pp.177–178 and 230–231"]},{"path":"data/discoveries/transport/north-river-steamboat-passenger-service.json#/events/fulton-accounts-for-engine-1810/contributions","decision":"accept","rationale":"The 1810 letter event no longer includes the misplaced supplier contribution. Maker attribution remains in the letter statement; 1805 forwarding evidence does not assert delivery or installation.","sources":["Dickinson 1913 pp.177–178 and 230–231","docs/data-model.md: Event contributions"]},{"path":"data/discoveries/transport/north-river-steamboat-passenger-service.json#/research/unresolved","decision":"accept","rationale":"The code, transatlantic freight and installation remain unverified. Maker-side order/forwarding and buyer-side later identification establish stronger supply evidence than shared dimensions alone; exact identity with a different Soho installation is not shown.","sources":["Dickinson 1913 pp.177–178 and 230–231"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/steam.json#/inputs, reject_if, stop_when and next_anchor","decision":"accept","rationale":"Reusable entry fields and stops require specific matching and independent duty evidence; reject common numbers and advertisements alone. Science Museum object 1862-53/1 is a traceable different Comet engine pilot, not proof of its operation schedule.","sources":["Birmingham Archives MS 3147/4 engine codes","Science Museum Group 1862-53/1"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/steam.json#/steps/0","decision":"accept","rationale":"Instructions generalize port-record checks; 1808 enrollment transcription identifies remodeled vessel and prior enrollment 973 from 1807, while the passenger text uses Clermont as a landing.","sources":["Dickinson 1913 p.228","Munsell 1855 p.25"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/steam.json#/steps/1","decision":"accept","rationale":"Maker catalogue describes alphabetical and repeated code systems, order books and alternative small-engine sequence; calendar MS 3147/3/496 lists Fulton/Francis correspondence and drawings. No particular code assigned. Item MS 3147/4/91 page could not be loaded by reviewer; its exact item date and access status remain an access limitation, not independently verified.","sources":["Birmingham Archives MS 3147/4","Adam Matthew MS 3147/3/496"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/steam.json#/steps/2","decision":"accept","rationale":"Maker account and letters document order and dispatch via carrier for London in 1805, not transatlantic receipt or fitting; distinction of these steps is sound.","sources":["Dickinson 1913 pp.174,177–178","Adam Matthew MS 3147/3/496"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/steam.json#/steps/3","decision":"accept","rationale":"Fulton’s 1810 buyer statement explicitly ties 1804 engine to Hudson passenger service and requests another; matching dimensions alone are not an identity test. U.S. National Museum bulletin identifies drawing 180137 as remodeled North River, not original installation. Multiple copies of 1810 letter are one underlying source.","sources":["Dickinson 1913 pp.230–231","Adam Matthew MS 3147/3/496 item 15","USNM Bulletin 173, object 180137"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/steam.json#/steps/4 and decision","decision":"accept","rationale":"Contemporary advertisement is an offer; independent passenger testimony is preserved in a later reprint and records first packet passage. Source roles and later reproduction are stated, and no exact maker code, installed-object identity or ticket purchase is claimed.","sources":["NYSL American Citizen 2 September 1807 transcript","Munsell 1855 vol.VI p.25","Dickinson 1913 pp.230–231"]},{"path":"data/sources and evidence changed files","decision":"accept","rationale":"The source metadata identifies the advertisement facsimile/transcript, Dickinson printed transcriptions, and Munsell 1855 reprint separately; PDF and JPEG checksums match local originals. The 1807 original passenger newspaper issue and actual manuscripts remain uninspected.","sources":["NYSL newspaper page","Dickinson 1913 pp.177–178, 228, 230–231","Munsell 1855 p.25"]}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"separate independent review","independence":"Separate from gpt-6.2-sol high proposer; original documents or clearly identified reprints independently read"},"overall_decision":"accept","worker_commit":"2c4d33738b1a865ccf15a0b402871aa6346f382e","verified_commit":"2c4d33738b1a865ccf15a0b402871aa6346f382e","files_checked":8}},{"lane":"telephony","kind":"workflow","title":"From telephone directories to evidence of service and use","question":"What can the New Haven exchange's subscriber list establish about early service, and what independent records establish use or connect the exchange to a particular technical predecessor?","summary":"The February 1878 broadside has 50 printed listings, including 11 under Residences, and gives the operator's stated hours. A local newspaper independently reports a March 1880 telephone notification to the Police Office, which had appeared on the 1878 sheet. Coy's 1880 patent describes central switching as a technical operation. The exact opening tally, the route of the 1880 call, and the identity of the January 1878 switch design remain unresolved.","inputs":["Operator and all name variants, locality, central-office addresses and claimed milestone dates","Claimed event type and count unit, including date range, geography and denominator if supplied","Candidate earlier technology and later operator or installation, with names of parties involved","Directory, operator, regulator and subscriber archives, plus local newspaper issues"],"steps":[{"title":"Identify the item and its editions","action":"Search national telephone-directory collections and the operator's corporate finding aid for the exact firm name plus subscriber list, telephone directory or prospectus. Try company-name variants and search by city and year. Compare title, issue date, publisher, street address and pagination; inspect the facsimile itself. Use catalogue entries to track custody and compare reproductions of the same document.","result":"The complete facsimile reads List of Subscribers, New Haven District Telephone Company, 219 Chapel Street, February 21, 1878. Connecticut Humanities credits the UConn Southern New England Telephone Company Records. The Library of Congress gallery indexes a second reproduction as reel 0 905006, frame 12, after an electrostatic reproduction target. The direct UConn object and Library of Congress frame endpoints could not be retrieved. The Seton Guide catalogues the February sheet at HE8841.N322.1878 and under MSS B56. The November 1878 bound directory has a different named publisher and its auction record describes instructions and a later subscriber list. It is a distinct edition.","sources":[{"title":"New Haven District Telephone Company, List of Subscribers","url":"https://connecticuthistory.org/wp-content/uploads/2012/10/FirstTelephoneExchange.jpg","locator":"Complete facsimile, heading and footer"},{"title":"Connecticut Humanities, reproduction credit","url":"https://connecticuthistory.org/the-first-commercial-telephone-exchange-today-in-history/","locator":"List of Subscribers figure caption"},{"title":"Library of Congress, New Haven telephone directory reel","url":"https://www.loc.gov/resource/gdcmassbookdig.usteledirec04526/?st=gallery","locator":"Reel 0 905006, images 11–12, reproduction target and List of Subscribers"},{"title":"New Haven Museum, The Seton Guide","url":"https://www.newhavenmuseum.org/wp-content/uploads/2025/08/Seton.pdf","locator":"Printed p. 65, Telephone Exchange and Directory"},{"title":"Christie's, November 1878 Telephone Directory","url":"https://www.christies.com/en/lot/lot-5084352","locator":"Lot 5084352, publisher, physical description and contents"}]},{"title":"Count listings and read qualifications","action":"Count printed rows from the full image by heading and record how addresses, branches, ditto marks, repeated names and carry-over rows are handled. Record hours and other future-tense promises separately from the named entries. Compare names and premises in city directories or subscriber contracts before deduplicating. Obtain a separate dated account register, line book, connection log or defined survey population before claiming the corresponding totals or rate.","result":"Visual count of the sheet yielded 11 residence, 3 physician, 2 dentist, 8 miscellaneous, 20 store and factory, 4 market, and 2 stable rows. M. F. Tyler appears under Residences and with Law Chambers under Miscellaneous. New Haven Flour Co. has four location rows, three with ditto marks. Fifty rows count names or listed places; eleven count entries under Residences. Distinct persons, households, premises, paying accounts, active devices or stations, connected lines and completed calls require other sources. The footer gives 6 a.m. to 2 a.m. and announces all-night opening after March 1.","sources":[{"title":"New Haven District Telephone Company, List of Subscribers","url":"https://connecticuthistory.org/wp-content/uploads/2012/10/FirstTelephoneExchange.jpg","locator":"Single sheet, seven section headings, M. F. Tyler, New Haven Flour Co. and footer"}]},{"title":"Seek a subscriber or independent operating witness","action":"Select a distinctive listed institution and search its original minutes, reports, accounts or correspondence and the local press around the claimed installation and subsequent use. Search newspaper OCR by local title, date, central office or telephone exchange and the institution's name or role. Check original page mastheads and whether each result is a paid notice, independent news item or firsthand user report. Record both endpoints and operator, and look for an explicit switching step or circuit identifier.","result":"The February sheet includes Police Office under Miscellaneous. In the Chronicling America New Haven newspaper material, searching for telephone and police located a March 23, 1880 news item reporting that word was sent to the police office by telephone during the prior afternoon's recovery of Owen McGrail's body. The story reports the coroner's response and leaves the caller's premises, provider and route unspecified. Separate period newspaper testimony in the September 2, 1886 Evening Mercury reprints a New Haven Register report describing a reporter who spoke from the Southern New England Telephone Company executive office to New York. The demonstrated toll circuit and announced future availability to merchants are separate claims; neither dates the January 1878 local service.","sources":[{"title":"New Haven District Telephone Company, List of Subscribers","url":"https://connecticuthistory.org/wp-content/uploads/2012/10/FirstTelephoneExchange.jpg","locator":"Single sheet, Miscellaneous, Police Office"},{"title":"New Haven Daily Morning Journal and Courier, Owen McGrail’s Body Found","url":"https://tile.loc.gov/storage-services/service/ndnp/ct/batch_ct_elm_ver01/data/sn82015483/00271764157/1880032301/0287.pdf","locator":"23 March 1880, p. 1, Owen McGrail’s Body Found"},{"title":"Evening Mercury, A Wonderful Desk","url":"https://dai.mun.ca/pdfs/eveherald/EveningMercury18860902.pdf","locator":"2 September 1886, A Wonderful Desk, attributed to New Haven Register, closing paragraph"}]},{"title":"Reconcile launch, routine commercial service and adoption","action":"Write one claim per date and unit. Mark launch announcements, formal opening, practical connection, payment and ordinary use separately. Trace commemorative figures to original sources and identify repeated reporting or incompatible denominators. Require operating or billing records, contractual performance, or independent direct reporting before converting a claim about listings or availability into actual uptake.","result":"De Land retrospectively reports roughly 30 subscribers beginning to receive service January 21 and a formal opening January 28. The National Park Service gives January 28 and 21 initial subscribers. The Census Bureau's later account gives January 25 for opening for business. The Bell Laboratories Record later pairs 21 customers with eight lines, while De Land describes subscribers sharing lines. These accounts leave the first-day tally and comparability unsettled. The February sheet can be counted directly, but does not establish whether all entries were installed, billed or in use, or whether the number of paying accounts doubled. An earlier prospectus makes the failure mode concrete. Kingsbury reproduces Ponton's October 1877 Titusville plan for a central switch room and records Ponton's January 1878 report that he had failed to generate sufficient interest to establish it.","sources":[{"title":"Fred De Land, Notes on the Development of Telephone Service III","url":"https://en.wikisource.org/wiki/Popular_Science_Monthly/Volume_70/January_1907/Notes_on_the_Development_of_Telephone_Service_III","locator":"Section VI, paragraph beginning Mr. Coy commenced installing and shared single-wire lines discussion"},{"title":"National Park Service, Site of the First Telephone Exchange","url":"https://home.nps.gov/subjects/nationalhistoriclandmarks/site-of-the-first-telephone-exchange.htm","locator":"History section, 28 January and initial subscribers"},{"title":"U.S. Bureau of the Census, Telephones and Telegraphs","url":"https://www2.census.gov/prod2/decennial/documents/13472615ch1.pdf","locator":"Printed p. 66, paragraph giving 25 January 1878"},{"title":"Bell Laboratories Record, Bell System history","url":"https://www.telephonecollectors.info/index.php/browse/document-repository/catalogs-manuals/bell-system-we/bell-labs-record/11606-68feb-blr-p40-bell-system-history-1/file","locator":"February 1968, caption under first New Haven switchboard illustration"},{"title":"J. E. Kingsbury, The Telephone and Telephone Exchanges","url":"https://forohistorico.coit.es/index.php/biblioteca/libros-electronicos?element=a01c647a-3a3f-49fc-8f69-c5a9f1e6faf9&format=raw&item_id=147&method=download&task=callelement","locator":"Printed pp. 74–75, Ponton circular of October 1877 as transcribed and report of 3 January 1878"}]},{"title":"Test a named technical dependency from both ends","action":"Identify precisely what moved from the source achievement to the recipient, identifying supplier, instrument or design, exact dates and means of transfer. On the supplying side inspect patents, order books or correspondence. On the receiving side inspect a signed agreement, delivery or installation record and a source showing how the specified item or method was used. Test proposed routes against private lines, same-line signaling, message relay and independent design.","result":"Bell's 7 March 1876 U.S. patent 174,465, claim 5, describes electric transmission of voice sounds. At the recipient end, the Seton Guide identifies an early local prospectus with Bell authorization in the title, but only the catalogue entry was available. De Land reports use of Bell telephones and the local licence. The evidence makes Bell instrument use credible and leaves the exact instrument or shipment and licence terms unverified from originals. Coy's separate U.S. patent 224,653 describes an attendant joining two circuits so their parties can speak, and postdates the 1878 opening. It provides original technical evidence for Coy's later design, with no match established to January hardware. The 1877 demonstration or the resemblance of earlier telegraph and district call-box systems does not document the transfer of a specific board or switching method to Coy.","sources":[{"title":"Alexander Graham Bell, Improvement in Telegraphy","url":"https://patents.google.com/patent/US174465A/en","locator":"U.S. patent 174,465, 7 March 1876, claim 5"},{"title":"New Haven Museum, The Seton Guide","url":"https://www.newhavenmuseum.org/wp-content/uploads/2025/08/Seton.pdf","locator":"Printed p. 65, No Battery Used. Authorized by the Bell Telephone Company prospectus entry"},{"title":"Fred De Land, Notes on the Development of Telephone Service III","url":"https://en.wikisource.org/wiki/Popular_Science_Monthly/Volume_70/January_1907/Notes_on_the_Development_of_Telephone_Service_III","locator":"Section VI, Bell private lines, November licence and opening"},{"title":"George W. Coy, Switch for Telephone-Exchanges","url":"https://patents.google.com/patent/US224653A/en","locator":"U.S. patent 224,653, 17 February 1880, Figs. 1–7 and specification paragraph beginning The operation of the switch is as follows"}]},{"title":"Close or record the next archival check","action":"Write the strongest direct claim, actual use of the specific system if evidenced, and the missing link or denominator. Use the most precise titles and dates for the next search. Separate available scans, catalogue-only material, subscription collections and physical holdings.","result":"The New Haven Free Public Library lists Daily Palladium microfilm spanning 1878, and the Yale guide list
