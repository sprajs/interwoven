 Transmission Assets","url":"https://www.ofgem.gov.uk/sites/default/files/2022-12/EA1_CAR_Report%20Final%20Dec.pdf","locator":"§§3.1–3.5 and technical-description footnote, §§3.23–3.24 and §§3.76–3.79"},{"title":"Bramford to Twinstead Reinforcement. Draft Statement of Common Ground TC East Anglia ONE OFTO Limited, Final Issue A","url":"https://nsip-documents.planninginspectorate.gov.uk/published-documents/EN020002-000831-National%20Grid%20Electricity%20Transmission%20-%20Additional%20and%20any%20updated%20Statements%20of%20Common%20Ground%20%28SoCG%29%20%28see%20PD1%20in%20Annex%20F%20of%20the%20Rule%206%20letter%29..pdf","locator":"September 2023 examination exhibit 8.3.6.3, §§2.1.2 and 2.2.1–2.2.2"},{"title":"East Anglia ONE non-material change report","url":"https://assets.publishing.service.gov.uk/media/61b20b04e90e0704478a9e87/EA1-CON-F-GBE-242081_NMC_Report_FINAL.pdf","locator":"EA1-CON-F-GBE-242081, pp. 4–5 §§4–6; developer elected HVAC in 2016"}]},{"title":"Bind project IDs and query metered use","action":"Get the market operator’s BM Unit reference table and match the exact asset name, legal lead party and fuel. Check the official dataset schema for signed actual MWh, settlement period and revision status. Query the dataset with each matched BM Unit as a repeated parameter and a fixed run type. In the lead-up window, check one row per day, period and unit. Save exact URLs, original-response hashes and selected rows, then read signed volumes from the same settlement period on a second date after commissioning.","result":"Elexon maps T_EAAO-1 and T_EAAO-2 to East Anglia One Limited, with EICs 48W000000EAAO-1R and 48W000000EAAO-2P. The 1–12 September 2019 B1610 Post-Final Settlement Run (DF) stream contains 1,152 unique unit-period rows. First positive in that window is 0.043 MWh for T_EAAO-1 on 2 September at period 25. A separately retained query for 2 September at period 30 gives +2.075 and −0.006 MWh. The retained 1 December 2020 period 25 query gives +101.936 and +105.154 MWh, for +207.090 MWh across both units. These are settlement volumes for a half-hour. The measurement cannot identify E19, an individual circuit, gross turbine production or total annual energy. Scheduled output and aggregate wind-fuel data fail the plant-meter check. Contains BMRS data © Elexon Limited copyright and database right 2026.","sources":[{"title":"Elexon Insights B1610 settlement output and BM Unit reference for East Anglia One","url":"https://data.elexon.co.uk/swagger/v1/swagger.json","locator":"OpenAPI GET /datasets/B1610 and GET /datasets/B1610/stream, actual metered volumes by period"},{"title":"Elexon Insights B1610 settlement output and BM Unit reference for East Anglia One","url":"https://data.elexon.co.uk/bmrs/api/v1/reference/bmunits/all","locator":"Current reference rows T_EAAO-1 and T_EAAO-2"},{"title":"Elexon Insights B1610 settlement output and BM Unit reference for East Anglia One","url":"https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610/stream?settlementDateFrom=2019-09-01&settlementDateTo=2019-09-12&settlementPeriodFrom=1&settlementPeriodTo=48&settlementRunType=DF&bmUnit=T_EAAO-1&bmUnit=T_EAAO-2","locator":"DF bounded early window, 1–12 September 2019, periods 1–48"},{"title":"Elexon Insights B1610 settlement output and BM Unit reference for East Anglia One","url":"https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610?settlementDate=2019-09-02&settlementPeriod=30&settlementRunType=DF&bmUnit=T_EAAO-1&bmUnit=T_EAAO-2","locator":"DF 2 September 2019, settlement period 30, both project units"},{"title":"Elexon Insights B1610 settlement output and BM Unit reference for East Anglia One","url":"https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610?settlementDate=2020-12-01&settlementPeriod=25&settlementRunType=DF&bmUnit=T_EAAO-1&bmUnit=T_EAAO-2","locator":"DF 1 December 2020, settlement period 25, both project units"},{"title":"BMRS data copyright licence","url":"https://www.elexon.co.uk/bsc/data/balancing-mechanism-reporting-agent/copyright-licence-bmrs-data/","locator":"Data reuse and attribution"},{"title":"Elexon Trading Disputes Process","url":"https://bscdocs.elexon.co.uk/bsc-module/guidance-notes/trading-disputes-process/v-10-0/id-6810ef8d51436753585bbbf8","locator":"Post-Final Settlement Run (DF)"}]},{"title":"Reconcile first export, full operation and acceptance","action":"Order contemporaneous commissioning announcements, independent metering, contract acceptance and network-transfer records. Write separate dated claims for each verified scope. Compare project-nameplate MW with actually observed and appropriately aggregated MWh. Preserve any disagreement in time or boundary and identify the source for each milestone.","result":"The developer announced E19 as its first generating turbine on 12 September 2019. Elexon proves plant-level metered output by 2 September. Installation was complete by the 29 April 2020 announcement and all 102 turbines were reported operational by the 27 July announcement. The Low Carbon Contracts Company records the phase 3 CfD start in May 2020 and the Final Installed Capacity milestone in February 2021. The later offshore works completion in October 2020 and transmission asset transfer in December 2022 refer to other milestones. The operator’s 714 MW fleet rating is a capacity figure. Elexon gives 207.090 MWh in a specific half-hour.","sources":[{"title":"First power generated at East Anglia’s largest offshore windfarm","url":"https://www.scottishpower.com/w/first_power_generated_at_east_anglia_s_largest_offshore_windfarm","locator":"12 September 2019 announcement, opening and first-turbine paragraph"},{"title":"Turbine installation complete on East Anglia ONE offshore windfarm","url":"https://www.scottishpowerrenewables.com/w/turbine-installation-complete-on-east-anglia-one-offshore-windfarm","locator":"29 April 2020 announcement, opening paragraphs and installation account"},{"title":"East Anglia reaches major milestone with windfarm completion","url":"https://www.scottishpowerrenewables.com/w/east-anglia-reaches-major-milestone-with-windfarm-completion","locator":"27 July 2020 announcement, opening paragraphs and Keith Anderson statement"},{"title":"Low Carbon Contracts Company annual report and accounts 2020–2021","url":"https://www.lowcarboncontracts.uk/documents/18/LCCC_Annual_Report_and_Accounts_2020-2021_interactive_pdf_9.pdf","locator":"Performance against Strategy, CfD Management, A year of firsts"},{"title":"East Anglia ONE non-material change report","url":"https://assets.publishing.service.gov.uk/media/61b20b04e90e0704478a9e87/EA1-CON-F-GBE-242081_NMC_Report_FINAL.pdf","locator":"EA1-CON-F-GBE-242081, pp. 4–5 §§4–6, October 2020 completion of offshore works"},{"title":"Transmission Capital East Anglia One project","url":"https://transmissioncapital.com/projects/11/","locator":"Project overview, acquisition of transmission assets on 20 December 2022"}]}],"decision":"Propose one project-level grid service record for independent review. The model match and actually installed AC export dependency are supported at the project level, with practical service independently witnessed by Elexon. The public evidence supports neither a first instant of export nor a dependency on an earlier project’s design.","reject_if":"Reject a claimed supplier-to-service dependency if supplier and receiving-side records identify different projects, packages or technology, if the order remains proposed, or if the only operational evidence is a planned capacity or output schedule.","stop_when":"Stop after confirming the same installed package at both ends, checking project-specific actual use and preserving the separate milestone dates. Leave an exact first interval, turbine or individual circuit unresolved when the provenance for that join is missing.","next_anchor":"Beatrice Offshore Wind Farm, the second UK offshore connection contract in Nexans’s 2020 registration document.","next":"Repeat the contract–receiver–meter comparison for Beatrice, starting with its distinct supplier package. Exclude component or circuit assignments without a matching project record.","review":{"issues":[],"source_checks":[{"role":"producer","url":"https://assets.new.siemens.com/siemens/assets/api/uuid:44871707-b477-4e4b-ab45-bc7867f99e79/160609-presentation-jp-morgan-conference.pdf","locator":"9 June 2016 slide 16","representation":"Original PDF, local /tmp/electricity-siemens-june.pdf, SHA-256 9b7727855e2836f22d9c2742751955e9a1351b9d231bd6605092f2870d119954","access_limit":"Former Siemens URL returned 404; revised canonical URL provided.","lineage":"Producer order, not operational proof."},{"role":"producer","url":"https://www.nexans.com/app/uploads/2024/02/2020-nexans-universal-registration-document.pdf","locator":"p.104 §3.1.2.3","representation":"Original PDF text","access_limit":"Names project and completion, not individual cable first energisation.","lineage":"Company report; Ofgem independently audits contract allocation."},{"role":"regulator","url":"https://www.ofgem.gov.uk/sites/default/files/2022-12/EA1_CAR_Report%20Final%20Dec.pdf","locator":"§§3.1–3.5, 3.23–3.24, 3.76–3.79","representation":"Original 15 Dec 2022 PDF","access_limit":"Technical overview sourced from developer; cost scrutiny is not separate direct turbine measurement.","lineage":"Ofgem and Grant Thornton review."},{"role":"network operator","url":"https://nsip-documents.planninginspectorate.gov.uk/published-documents/EN020002-000831-National%20Grid%20Electricity%20Transmission%20-%20Additional%20and%20any%20updated%20Statements%20of%20Common%20Ground%20%28SoCG%29%20%28see%20PD1%20in%20Annex%20F%20of%20the%20Rule%206%20letter%29..pdf","locator":"September 2023 exhibit 8.3.6.3 §§2.1.2 and 2.2.1–2.2.2","representation":"Original draft statement PDF","access_limit":"Reports month not exact day.","lineage":"National Grid account."},{"role":"market operator","url":"https://data.elexon.co.uk/swagger/v1/swagger.json","locator":"GET /datasets/B1610 and /datasets/B1610/stream","representation":"Live original OpenAPI specification","access_limit":"Metered MWh per settlement period; output may be revised; historical publishTime null. Does not identify net vs gross turbine production beyond metering boundary.","lineage":"Elexon settlement data, independent operational observation."},{"role":"market operator","url":"https://data.elexon.co.uk/bmrs/api/v1/reference/bmunits/all","locator":"T_EAAO-1 and T_EAAO-2","representation":"Live original JSON, SHA-256 59f0e0a51748fc81f3d06a7e8d4a3d59c9f99b2fcc115c418dce262e303924ac","access_limit":"Current registration, not by itself historical installation-level mapping.","lineage":"Elexon registry maps both identifiers to East Anglia One Limited."},{"role":"market operator","url":"https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610/stream?settlementDateFrom=2019-09-01&settlementDateTo=2019-09-12&settlementPeriodFrom=1&settlementPeriodTo=48&settlementRunType=DF&bmUnit=T_EAAO-1&bmUnit=T_EAAO-2","locator":"DF 1–12 September 2019, all 48 periods, both units","representation":"Live original JSON SHA-256 afbd368074e7034f8ea13dc5e2a9ee75681dc087c60f46d484020d5953340678; 1152 rows; first positive in window SP25 2 Sep 0.043 MWh","access_limit":"Bounded window, not earliest physical export.","lineage":"Dataset responds at BM unit level."},{"role":"market operator","url":"https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610?settlementDate=2019-09-02&settlementPeriod=30&settlementRunType=DF&bmUnit=T_EAAO-1&bmUnit=T_EAAO-2","locator":"SP30, both units","representation":"Original JSON hash f9d912a7a00f85064bd9013c021133b84997f4f91641f8fd80b59bcf0ebfda95; +2.075, −0.006 MWh","access_limit":"publishTime null; individual circuit and turbine unidentified.","lineage":"Elexon DF post-final settlement run."},{"role":"market operator","url":"https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610?settlementDate=2020-12-01&settlementPeriod=25&settlementRunType=DF&bmUnit=T_EAAO-1&bmUnit=T_EAAO-2","locator":"SP25, both units","representation":"Original JSON hash 382fef28630d640926b56cc53fae8c2c197037815ced59dfc9480081d886235a; +101.936, +105.154 MWh","access_limit":"One half-hour only, not annual output or gross production.","lineage":"Elexon DF post-final settlement run."},{"role":"developer/operator","url":"https://www.scottishpower.com/w/first_power_generated_at_east_anglia_s_largest_offshore_windfarm","locator":"12 Sept 2019, first-turbine paragraph","representation":"Original publication","access_limit":"Date is announcement, no exact first-power timestamp.","lineage":"Developer report."},{"role":"developer/operator","url":"https://www.scottishpowerrenewables.com/w/turbine-installation-complete-on-east-anglia-one-offshore-windfarm","locator":"29 April 2020 announcement","representation":"Original publication","access_limit":"Installation not proof of full operation.","lineage":"Developer report."},{"role":"developer/operator","url":"https://www.scottishpowerrenewables.com/w/east-anglia-reaches-major-milestone-with-windfarm-completion","locator":"27 July 2020 opening","representation":"Original publication","access_limit":"Company report, not meter reading.","lineage":"Developer report."},{"role":"contract counterparty","url":"https://www.lowcarboncontracts.uk/documents/18/LCCC_Annual_Report_and_Accounts_2020-2021_interactive_pdf_9.pdf","locator":"A year of firsts, p.15","representation":"Original annual report PDF","access_limit":"Contract milestones, not dates of physical first power.","lineage":"LCCC reports its own CfD milestones."},{"role":"planning applicant","url":"https://assets.publishing.service.gov.uk/media/61b20b04e90e0704478a9e87/EA1-CON-F-GBE-242081_NMC_Report_FINAL.pdf","locator":"March 2021 §§4–6","representation":"Original supporting statement PDF","access_limit":"Later report of prior selection and works.","lineage":"Developer planning submission."},{"role":"transmission owner","url":"https://transmissioncapital.com/projects/11/","locator":"project overview","representation":"Project page","access_limit":"Transfer date, not first power.","lineage":"Transmission Capital owner."}],"limitations":["No individual turbine or cable circuit is identifiable from settlement unit volumes; first positive is limited to the queried window.","Elexon B1610 is period MWh, not instantaneous MW or gross turbine production; 2019/2020 publishTime fields null and later settlement versions may change.","No direct historical design transfer or generic offshore-wind prerequisite is established.","Ofgem network description cites developer and is not independent metering; company procurement/commissioning claims are complemented by network and settlement evidence."],"claim_reviews":[{"path":"docs/reviews/2026-11-17-provenance/lanes/electricity.json#/inputs,steps/0","decision":"accept","rationale":"Inputs and reusable action specify aliases, project IDs, supplier archives and operational confirmation. Actual Siemens 9 June 2016 slide 16 names EA1, model and customer; 29 April 2020 developer release documents 102 installed. Gedser and Bogø are distinct installations in catalog.","sources":["Siemens 2016 slide 16","ScottishPower 2020 installation"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/electricity.json#/steps/1","decision":"accept","rationale":"Supplier report names EA1 connection order and 2020 completion; Ofgem independently audits construction contracts and distinguishes Nexans offshore and Prysmian onshore. Ofgem and the developer-submitted 2021 DCO report identify HVAC and physical path; National Grid 2023 reports power at Bramford from September 2019. These support the project-specific installed route, not individual circuit or design inheritance.","sources":["Nexans 2020 p. 104","Ofgem 2022 §§3.1–3.5 and 3.23–3.24","National Grid 2023 §§2.1.2, 2.2.1–2.2.2","DCO 2021 §§4–6"],"relation":"installed export path enables project-level grid service","source_endpoint":"EA1 offshore substation and 220 kV AC submarine export package","destination_endpoint":"EA1 grid interface at Bramford","status":"supported project-level functional connection; no explicit dataset graph link","alternatives":"HVDC consent was an alternative; developer selected HVAC in 2016."},{"path":"docs/reviews/2026-11-17-provenance/lanes/electricity.json#/steps/2 and evidence/e/elexon-east-anglia-one-settlement-evidence.json","decision":"accept","rationale":"Independent GETs reproduced both exact response payload hashes and all listed rows; registry and bounded-stream original bytes also match saved hashes. 1152 rows; earliest positive within window is 0.043 MWh on 2 Sept SP25. 2 Sept SP30 +2.075/−0.006 and 1 Dec SP25 +101.936/+105.154 sum +207.090 MWh. Swagger defines signed metered volume MWh per settlement period, not MW, and publishTime is null for 2019/20 responses. Data are plant BM-unit settlement volumes, not gross turbine output, turbine-level data or an exact first-generation instant.","sources":["Elexon API B1610 exact query URLs and OpenAPI","Elexon BM unit reference"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/electricity.json#/steps/3,decision,reject_if,stop_when,next_anchor","decision":"accept","rationale":"Commissioning announcement, installation and full-operation milestones are bounded by publication; LCCC report confirms May 2020 third-phase start and February 2021 FIC; DCO report October 2020 offshore works and Transmission Capital Dec 2022 transfer are separate. Rejection, stopping rule and next anchor are workable and do not force lineage.","sources":["ScottishPower 2019 and 2020 announcements","LCCC 2020–21 annual report p. 15","DCO 2021 §6","Transmission Capital EA1 project"]},{"path":"data/discoveries/energy/east-anglia-one-offshore-wind-grid-service.json#/identity,description,kind,domain,grain,concept,places","decision":"accept","rationale":"EA1 is a specific deployed grid-connected wind farm in southern North Sea; operator and regulator identify turbines and AC connection at Bramford. The existing Gedser and Bogø records describe different installations.","sources":["ScottishPower 2020 installation","Ofgem 2022 §§3.1–3.5","DCO 2021 §§4–6"],"duplicate_screen":"No EA1 project record at base; local deployment is distinct from historic Gedser/Bogø demonstrations."},{"path":"data/discoveries/energy/east-anglia-one-offshore-wind-grid-service.json#/events/metered-export-by-september-2019 and earliest_record","decision":"accept","rationale":"B1610 T_EAAO-1 has +2.075 MWh on 2 September 2019 SP30 and registry maps the unit to EA1. It is an upper bound within a searched window, not proof of exact first export, E19 assignment, circuit selection or individual turbine measurement. The 12 September announcement identifies E19 as first and says power was flowing by publication.","sources":["Elexon B1610 and unit registry","ScottishPower 2019 first power","National Grid 2023 §2.2.2"]},{"path":"data/discoveries/energy/east-anglia-one-offshore-wind-grid-service.json#/events/turbine-installation-complete","decision":"accept","rationale":"Siemens original 2016 slide identifies order and model; developer announcement dated 29 April 2020 reports installation of all 102, no exact completion day inferred.","sources":["Siemens 2016 slide 16","ScottishPower 2020 installation"]},{"path":"data/discoveries/energy/east-anglia-one-offshore-wind-grid-service.json#/events/full-turbine-operation and measures/rated generating power","decision":"accept","rationale":"Developer announced all 102 fully operational and 714 MW project capacity on 27 July 2020. Rated MW is capacity, not actual output.","sources":["ScottishPower 2020 full operation"]},{"path":"data/discoveries/energy/east-anglia-one-offshore-wind-grid-service.json#/events/metered-grid-output-december-2020 and measures/combined metered settlement energy","decision":"accept","rationale":"The observed signed DF volumes 101.936 and 105.154 MWh total 207.090 MWh at the BM-unit boundary over SP25; do not infer gross generation or annual production. Source reports three decimal places, no extra precision asserted.","sources":["Elexon B1610 2020-12-01 SP25 exact response"]},{"path":"data/discoveries/energy/east-anglia-one-offshore-wind-grid-service.json#/research","decision":"accept","rationale":"Sourced, draft status accurately preserves independent review boundary. The project dependency is described with specified endpoints rather than an unsupported typed link to generic earlier wind or HVDC records.","sources":["Ofgem 2022 §§3.1–3.5","Nexans 2020 p.104","National Grid 2023 §2.2.2","Elexon B1610"]},{"path":"data/sources/e/elexon-east-anglia-one-settlement-evidence.json and evidence/e/elexon-east-anglia-one-settlement-evidence.json","decision":"accept","rationale":"Source identifies API v1 DF as post-final, current registry, two original responses and bounded stream; recomputed both embedded response hashes, and independent live retrieval matched both hashes plus registry and stream. Publication timestamps are null in the historical responses.","sources":["Elexon OpenAPI B1610","Elexon Trading Disputes Process DF","Elexon exact query URLs"]},{"path":"data/sources/n/nexans-2020-east-anglia-one-export-order.json; data/sources/n/nget-east-anglia-one-interface-statement.json; data/sources/o/ofgem-2022-east-anglia-one-transmission-cost-assessment.json","decision":"accept","rationale":"Metadata and passage scopes match respective issuer texts; Ofgem scrutiny draws on developer data and forensic accounting rather than independently measuring every electrical flow.","sources":["Nexans p. 104","National Grid 2023 §2.2","Ofgem §§3.1–3.5, 3.23–3.24"]},{"path":"data/sources/s/scottishpower-2019-east-anglia-one-first-power.json; data/sources/s/scottishpower-2020-east-anglia-one-full-operation.json; data/sources/s/scottishpower-2020-east-anglia-one-turbine-installation.json; data/sources/s/siemens-2016-east-anglia-one-turbine-order.json","decision":"accept","rationale":"Author, version, dates and cited project claims agree with originals; Siemens PDF checked at corrected canonical URL and locally with matching SHA-256. Company materials are producer/operator evidence, not independent replication.","sources":["Siemens 2016 slide 16","ScottishPower 2019 first power","ScottishPower 2020 installation","ScottishPower 2020 full operation"]}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"separate independent review","independence":"Separate from gpt-6.2-sol high researcher; checked original documents and fetched original meter data independently."},"overall_decision":"accept","worker_commit":"04f203399c01b1a620a7be9636fb8a6a8eaf6f1e","verified_commit":"04f203399c01b1a620a7be9636fb8a6a8eaf6f1e","files_checked":11}},{"lane":"metrology","kind":"workflow","title":"From an international standard to a measured national realization","question":"How can an international decision about a measurement unit be linked to an identified laboratory operation, and what evidence separates the vote, the effective date, the measurements and dissemination?","summary":"The 1875 Metre Convention established the authority under which the CGPM sanctioned a material kilogram in 1889 and adopted a fixed-Planck-constant definition on 16 November 2018. That definition took effect on 20 May 2019. NIST used its NIST-4 Kibble balance and the exact constant to assign masses to two identified standards in September and October 2019 and repeated the realization on the same standards in early 2025. BIPM separately measured the transfer specimens against its own working standard in the first comparison. NIST's dissemination chain transitioned to the international consensus value on 1 February 2021.","inputs":["Unit, definition or standard name and relevant years","Standard-setting institution, document archive and official language","Potential receiving national laboratory and instrument, specimen or comparison identifiers","Candidate measurement output and the former basis for traceability"],"steps":[{"title":"Identify the mandate and the institutional anchor","action":"Search the existing graph and lead files for the unit, instrument name and spelling variants. Search the issuing body's treaty and proceedings archive using the institution, standard name and mandate year. In the operative articles, record the organization that adopts decisions, the committee that oversees the work and the laboratory or secretariat that maintains standards. Check article-level amendment markers before dating any clause in a consolidated edition.","result":"The catalogue had an institutional Metre Convention record and a lead on the physical 1889 metre. Searches for the SI kilogram, redefinition, Planck constant and Kibble or watt balances found no equivalent modern kilogram definition or realization record. The clauses marked 1875 in the consolidated treaty establish the international bureau, place it under the CIPM and CGPM, and assign the CGPM the sanction of fundamental metrological determinations. The CGPM is the definition issuer. BIPM is also the comparison pilot and comparator examined below, while NIST operates NIST-4.","sources":[{"title":"Metre Convention and Annexed Rules, consolidated bilingual text","url":"https://www.bipm.org/documents/20126/44107685/metre-convention.pdf/cd9c9e57-0cc6-4cda-2930-ec1d7c853743?download=true&version=1.5","locator":"English pp. 2, 6 (PDF pp. 13, 17), Convention Arts. 1 and 3 and Annexed Rules Art. 7, provisions marked 1875"}]},{"title":"Cross-check a material standard through allocation and later use","action":"For a material lineage, search the issuer's original proceedings index for the unit and 'prototype', 'allocation' or 'tirage au sort'. Transcribe serial numbers and recipient from the allocation table. In the recipient laboratory's publications catalogue, search those exact serials with 'national prototype' and 'recalibration'; require the operator's record of the same specimens before asserting actual retention or use. Record whether calibration certificates are available directly or only as transcriptions.","result":"The first CGPM sanctioned the international prototypes on 26 September 1889. Its distribution table assigns national kilogram copies 4 and 20 to the United States. R. S. Davis of the US National Bureau of Standards identifies K20 as the national prototype and K4 as its check standard, and transcribes their 1889 certificate offsets of −0.039 mg and −0.075 mg from nominal 1 kg. The paper also reports 1984 BIPM recalibration results for both serials. The transcribed original certificate values are accessible in the laboratory paper. Separate certificate facsimiles were outside the inspected evidence.","sources":[{"title":"First CGPM proceedings","url":"https://www.bipm.org/documents/20126/17314988/CGPM1.pdf/ab69792a-2e5e-2040-14d0-11464bc9414c?download=true&t=1633423308593&version=1.3","locator":"26 September 1889, pp. 34–40, vote pp. 38–39 and prototype distribution table p. 40, États-Unis row"},{"title":"Third CGPM, Declaration 2 of 1901","url":"https://www.bipm.org/en/committees/cg/cgpm/3-1901/resolution-2","locator":"Preamble records the 1889 date and cites p. 34 of the proceedings. Declaration paragraph 1 specifies the kilogram as a unit of mass."},{"title":"R. S. Davis, Recalibration of the U.S. National Prototype Kilogram","url":"https://nvlpubs.nist.gov/nistpubs/jres/090/jresv90n4p263_A1b.pdf","locator":"pp. 263–265, abstract, introduction and K20/K4 certificate and recalibration values"}]},{"title":"Verify decision, effect and operational scope","action":"Query the competent body's decisions index for the unit, meeting year and definitional term. Open the final resolution and proceedings, then locate the adoption item, any effective-date clause, the former definition being superseded, and the operative value and units. Check the published method guide under 'mise en pratique' or 'realization' for eligible methods, recording its edition date. Keep its general method description distinct from evidence of a dated laboratory run.","result":"In the seventh session of the 26th CGPM on 16 November 2018, members unanimously adopted Draft Resolution A as Resolution 1. The English final text explicitly sets 20 May 2019 as the effective date and abrogates the prototype-based definition. The kilogram now uses the exact value h = 6.626 070 15 × 10⁻³⁴ J s, with the metre and second defined by c and ΔνCs. The 2021 mise en pratique identifies Kibble balances and X-ray crystal density among eligible approaches. That edition explains how a realization can work. The laboratory runs below establish when it did work.","sources":[{"title":"Twenty-sixth CGPM proceedings, vote and final resolution","url":"https://www.bipm.org/documents/20126/35655029/CGPM26.pdf/f1d8d7e6-2570-9479-9ee9-bb8d86138fe9","locator":"French pp. 203–204 and English p. 465, item 54, adoption; English pp. 472–474, effective date, fixed value and abrogation"},{"title":"CGPM Resolution 1 of 2018, revision of the SI","url":"https://www.bipm.org/en/committees/cg/cgpm/26-2018/resolution-1","locator":"Operative clauses beginning with the 20 May 2019 date, annexes 1 and 3"},{"title":"BIPM, Mise en pratique for the definition of the kilogram in the SI","url":"https://www.bipm.org/documents/20126/41489673/SI-App2-kilogram.pdf/5881b6b5-668d-5d2b-f12a-0ef8ca437176?download=true&version=1.9","locator":"7 July 2021 version, pp. 1–3, §§1, 2.1, 2.2 and 3"}]},{"title":"Match the operative rule to a dated laboratory output","action":"Search the issuing body's Key Comparison Database or equivalent under the unit, 'realizations of the [unit]' and the receiver's acronym. Open the final report by identifier. Pair the protocol stating which definition or constant was used with the receiver's signed or coauthored operations section. Check lab, apparatus, procedure date, specimen serials, numerical result and uncertainty in the results table. Record which inputs are fixed and which quantities are obtained by measurement.","result":"BIPM comparison CCM.M-K8.2019 required the exact fixed h in the participants' primary realizations. The final report describes NIST as the operator of NIST-4, two direct measurement series on each travelling platinum–iridium standard numbered 85 and 104 in vacuum during September and October 2019, and a separate entry for the BIPM comparator. NIST reported a deviation from nominal 1 kg of −0.7679 mg for 85 (standard uncertainty 0.027 mg) and +0.398 mg for 104 (standard uncertainty 0.0273 mg). The joined evidence identifies both endpoints: the operative fixed-h definition supplies the numerical input and the dated NIST-4 realization assigns masses with it.","sources":[{"title":"Stock et al., Final report on CCM.M-K8.2019","url":"https://www.bipm.org/documents/20126/48150799/CCM.M-K8.2019.pdf/1212a40a-5e5e-f614-0d2b-dd89404424f8","locator":"16 October 2020, §2 pp. 4–5 for protocol, Table 2 p. 6 for specimen identity, §4.4 p. 8 for NIST dates and apparatus, Table 4 p. 13 for results"},{"title":"NIST, The NIST Mise en Pratique since the Redefinition of the Kilogram","url":"https://www.nist.gov/programs-projects/nist-mise-en-pratique-redefinition-kilogram","locator":"Realization section, NIST-4, K85/K104 and vacuum measurements"}]},{"title":"Check separate measurements and distinguish repetition from independent scrutiny","action":"Inspect the comparator's own measurement method and its results for the same serials. Look up subsequent comparison identifiers for a first-hand report about a fresh campaign, and extract run dates from the lab section instead of assuming the identifier year. Check whether a reference average includes the receiver and whether putatively separate publications reuse the same lab or data. Record inaccessible raw records and which evidence remains independently inspectable.","result":"BIPM weighed the two artefacts against its own working mass standard and reported deviations of −0.7498 mg for 85 and +0.4169 mg for 104, with standard uncertainty 0.0021 mg on each. This is a separate comparator operation on the same specimens. The overall comparison reference includes NIST, so agreement with that average gives no second independent test of NIST's result. The CCM.M-K8.2024 final report documents a fresh NIST-4 campaign in 2025: 85 on 17–27 January and 104 on 28 January–3 February. Some participants and authors recur. Public reports give the methods and outputs, but individual submitted run files and notebooks were outside the inspected evidence.","sources":[{"title":"Stock et al., Final report on CCM.M-K8.2019","url":"https://www.bipm.org/documents/20126/48150799/CCM.M-K8.2019.pdf/1212a40a-5e5e-f614-0d2b-dd89404424f8","locator":"§5 pp. 10–11, Table 4 p. 13, §§6–8 for comparator, receiver measurements and reference-value calculation"},{"title":"Stock et al., Final report of CCM.M-K8.2024","url":"https://www.bipm.org/documents/20126/48150799/CCM.M-K8.2024.pdf/8ab5186c-cfe2-71c5-a389-6d04426d3531?download=true&t=1775130198564&version=5.0","locator":"Final report dated 8 December 2025, published in 2026, Table 2, §4.6 printed p. 9 (PDF p. 11), Table 5 printed p. 18 (PDF p. 20)"}]},{"title":"Test pre-existing use and trace dissemination separately","action":"Search the operator's publications for the instrument model in the years before the vote. Compare the earlier and later experiments' inputs and outputs. For any claim about downstream use, search both the international organization's implementation notices and the receiver's calibration records by 'dissemination', 'traceability' and the reference identifier. Admit only the dependency or implementation step tied to an observed action.","result":"A 2017 NIST paper records NIST-4 measuring h from weighings during 2015–2017, before the 2018 vote. Its existence and operation therefore cannot be attributed to the vote. In 2019 the same instrument applied already fixed h to assign masses, reversing the inference. NIST records initial dissemination via a prototype-traceable chain and a switch on 1 February 2021 to an international consensus value. BIPM's implementation notice independently dates that switch and describes the consensus as combining multiple comparisons. A NIST direct realization, the international consensus and a downstream calibration consequently need separate evidence.","sources":[{"title":"Haddad et al., Measurement of the Planck constant at NIST from 2015 to 2017","url":"https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=923579","locator":"Metrologia 54 (2017), p. 633, abstract and §§1–2"},{"title":"NIST, The NIST Mise en Pratique since the Redefinition of the Kilogram","url":"https://www.nist.gov/programs-projects/nist-mise-en-pratique-redefinition-kilogram","locator":"Dissemination section, initial traceability and first consensus value"},{"title":"BIPM, First consensus value for the kilogram","url":"https://www.bipm.org/en/-/2021-kg-consensus","locator":"Paragraphs on consensus calculation, multiple inputs and traceability from 1 February 2021"}]}],"decision":"Extend metre-convention-international-metrology with the 1889 sanction and retain the exact national-copy chain in the workflow. Propose si-kilogram-definition-by-planck-constant as an institutional builds_on of metre-convention-international-metrology. Propose nist-4-kibble-balance-kilogram-realization as requiring the operative si-kilogram-definition-by-planck-constant for the particular fixed-h mass assignment, supported by the 2019 experiment and a 2025 repeat. The ruling body and laboratory records establish different endpoints. Treat the previously operating balance, the 2021 consensus-based dissemination and wider industrial uptake as distinct claims.","reject_if":"Reject a dependency based only on a decision date, catalogue listing or recurring instrument or specimen name. NIST-4 already measured h before 2018. A pre-vote publication about its existence is evidence of earlier work and cannot establish that the 2018 decision caused its construction or operation. The 2019 comparison earns a narrower dependency because it states that the new fixed value was used in the mass assignment.","stop_when":"Stop when the original decision supplies the rule and its dates, a receiver-run record explicitly consumes that rule and identifies an operational output, and a separate comparator measurement or other original scrutiny has been checked. If the record stops at a method guide, approval, equipment listing or common label, leave the operation or dependency unresolved and name the missing run, output or identity record.","next_anchor":"Test the 17th CGPM 1983 Resolution 1 on the metre against a national laboratory's named stabilized-laser or interferometer measurement. Locate the original resolution in BIPM's history-of-the-metre index and use the NIST collection SI Research in Journal of Research of NIST to find Jennings and colleagues' 1987 The continuity of the meter. Check the operation date and whether the result tests continuity with the former standard or realizes the new definition.","next":"Send the exact proposed events, links and source passages for independent review. Apply the method to the 1983 metre case and check its transmitter and receiver evidence before deciding on any new record.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"issues":[],"source_checks":[{"source":"bipm-metre-convention-articles","url":"https://www.bipm.org/documents/20126/44107685/metre-convention.pdf/cd9c9e57-0cc6-4cda-2930-ec1d7c853743?download=true&version=1.5","version":"BIPM consolidated French text and English translation, PDF version 1.5. Articles labeled by year of the applicable text.","locators":["Convention Arts. 1 and 3 and Annexed Regulations Art. 7 (English pp. 2 and 6; PDF pp. 13 and 17)"],"representation":"local full original PDF inspected; SHA-256 verified","independence":"Official source; treaty and CGPM are institutionally related; comparison includes participating NIST authors.","path":"evidence/b/bipm-metre-convention-articles.pdf","sha256":"a775c2be799eadce3855f6ef4eed9455009f4d80337cd5cbd23321d4a6b98bd0"},{"source":"cgpm-1889-proceedings-prototype-sanction","url":"https://www.bipm.org/documents/20126/17314988/CGPM1.pdf/ab69792a-2e5e-2040-14d0-11464bc9414c?download=true&t=1633423308593&version=1.3","version":"Official French proceedings of the 1889 meeting, BIPM digitization, PDF version 1.3","locators":["26 September 1889, pp. 34–40, sanction and allocation by lot"],"representation":"local full original PDF inspected; SHA-256 verified","independence":"Official source; treaty and CGPM are institutionally related; comparison includes participating NIST authors.","path":"evidence/c/cgpm-1889-proceedings-prototype-sanction.pdf","sha256":"b53dec2ee2d7dcc06c9eda859a06ab9217d431350f18ca7fd2b31fe0783b43c6"},{"source":"cgpm-2018-proceedings-si-vote","url":"https://www.bipm.org/documents/20126/35655029/CGPM26.pdf/f1d8d7e6-2570-9479-9ee9-bb8d86138fe9","version":"Official French and English proceedings of the 2018 meeting. Resolution DOI 10.59161/CGPM2018RES1E.","locators":["Seventh session, 16 November 2018, item 54, French p. 204 and English p. 465","Resolution 1, English pp. 472–474, including Appendices 1–3"],"representation":"local full original PDF inspected; SHA-256 verified","independence":"Official source; treaty and CGPM are institutionally related; comparison includes participating NIST authors.","path":"evidence/c/cgpm-2018-proceedings-si-vote.pdf","sha256":"e3e681d8be7c393a82b541fdf8628d381ec06ff73d6c92aa40b48c403906204a"},{"source":"stock-2020-kilogram-realizations-ccm-m-k8-2019","url":"https://www.bipm.org/documents/20126/48150799/CCM.M-K8.2019.pdf/1212a40a-5e5e-f614-0d2b-dd89404424f8","version":"Final Report, 16 October 2020. DOI 10.1088/0026-1394/57/1A/07030.","locators":["§2 pp. 4–5, Table 2 p. 6, §4.4 p. 8","§5 pp. 10–11, §6 and Table 4 pp. 12–13"],"representation":"local full original PDF inspected; SHA-256 verified","independence":"Official source; treaty and CGPM are institutionally related; comparison includes participating NIST authors.","path":"evidence/s/stock-2020-kilogram-realizations-ccm-m-k8-2019.pdf","sha256":"e9e1c4e11c4255d35de0e4906840691a5547cbe9ba1916177691d8912b359d1d"},{"source":"stock-2026-kilogram-realizations-ccm-m-k8-2024","url":"https://www.bipm.org/documents/20126/48150799/CCM.M-K8.2024.pdf/8ab5186c-cfe2-71c5-a389-6d04426d3531?download=true&t=1775130198564&version=5.0","version":"Final report dated 8 December 2025, published in 2026 as CIPM MRA Comparison Reports 07001, BIPM PDF version 5.0, DOI 10.59161/QOFV3225","locators":["§2 p. 4, Table 2 p. 6, §4.6 p. 9, Table 5 p. 18 (PDF pp. 6, 8, 11, 20)"],"representation":"local full original PDF inspected; SHA-256 verified","independence":"Official source; treaty and CGPM are institutionally related; comparison includes participating NIST authors.","path":"evidence/s/stock-2026-kilogram-realizations-ccm-m-k8-2024.pdf","sha256":"9ee85a9d8f0b8a8c3cfaade41168ae9042fbee4da9e875886e6d2df144ea0cd8"},{"source":"Davis 1985","url":"https://nvlpubs.nist.gov/nistpubs/jres/090/jresv90n4p263_A1b.pdf","locators":"pp. 263–264","representation":"original NBS journal PDF read; 1889 certificates transcribed rather than reproduced","independence":"recipient laboratory source distinct from CGPM proceedings"},{"source":"Haddad et al. 2017","url":"https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=923579","locators":"pp. 633–634","representation":"original NIST coauthored paper","independence":"same NIST apparatus, earlier independent-in-time operation"},{"source":"BIPM 2021 mise en pratique","url":"https://www.bipm.org/documents/20126/41489673/SI-App2-kilogram.pdf/5881b6b5-668d-5d2b-f12a-0ef8ca437176?download=true&version=1.9","locators":"7 July 2021 §§2–3","representation":"online versioned original","independence":"method guidance, not receiver run"},{"source":"BIPM first consensus notice","url":"https://www.bipm.org/en/-/2021-kg-consensus","locators":"calculation and 1 February 2021","representation":"original online official notice","independence":"international comparison operator; separate from NIST service description"}],"limitations":["Original 1889 calibration certificates were not independently inspected; the 1985 NBS report transcribes their values.","2024 repeat uses same NIST instrument; comparator reports and consensus are not independent replications of the NIST run.","Underlying individual raw notebooks were not inspected."],"claim_reviews":[{"path":"workflow.inputs, steps[].action, reject_if, stop_when, next_anchor","decision":"accept","rationale":"The four inputs, six ordered actions, explicit rejection, stopping condition and different next case are reusable instructions. The stop requires actual receiving operation and independent check, not approval or coincident labels.","sources":["docs/reviews/2026-11-17-provenance/lanes/metrology.json"]},{"path":"workflow.steps[0].result","decision":"accept","rationale":"The treaty Arts. 1 and 3 and Annex art. 7 (marked 1875 in consolidated text) create the institutional structure and mandate; catalogue screen found existing Metre Convention record but no modern kilogram definition or NIST-4 record.","sources":["bipm-metre-convention-articles Arts. 1, 3 and Annex Art. 7"]},{"path":"workflow.steps[1].result","decision":"accept","rationale":"1889 French proceedings pp. 38–40 record sanction and US assignment 4 and 20. Davis 1985 pp. 263–264 independently reports use of K20 as national and K4 as check, transcribes 1889 values and describes 1984 recalibration; certificate facsimiles were not inspected.","sources":["cgpm-1889-proceedings-prototype-sanction pp. 34–40","Davis 1985 pp. 263–264"]},{"path":"workflow.steps[2].result","decision":"accept","rationale":"CGPM proceedings seventh session record unanimous vote 16 Nov 2018; resolution fixes h and specifies effective 20 May 2019. 2021 mise en pratique separately presents realization approaches; guide publication does not date a lab measurement.","sources":["cgpm-2018-proceedings-si-vote pp. 465, 472–474","BIPM mise en pratique 7 July 2021 §§2–3"]},{"path":"workflow.steps[3].result","decision":"accept","rationale":"CCM.M-K8.2019 §2 prescribes fixed h; §4.4 identifies NIST-4 and Sept–Oct 2019 series for K85/K104; Table 4 matches values and uncertainties. NIST operator participates in comparison report, not a wholly independent experiment.","sources":["stock-2020-kilogram-realizations-ccm-m-k8-2019 §§2,4.4 Tables 2,4"]},{"path":"workflow.steps[4].result","decision":"accept","rationale":"Report §5 and Table 4 identify separate BIPM comparator values; reference mean includes NIST. 2024 comparison report §4.6 records 2025 NIST dates; it is repeated measurement with overlapping authors and apparatus, not independent NIST replication.","sources":["stock-2020-kilogram-realizations-ccm-m-k8-2019 §§5–8 Table 4","stock-2026-kilogram-realizations-ccm-m-k8-2024 §4.6"]},{"path":"workflow.steps[5].result, summary, decision","decision":"accept","rationale":"Haddad 2017 documents NIST-4 pre-vote h measurement; later fixed h is used to infer mass. NIST and BIPM date consensus dissemination to 1 February 2021; this is not equated with direct 2019 realization.","sources":["Haddad et al. 2017 pp. 633–634","NIST mise en pratique Realization","BIPM First consensus value 2021"]},{"path":"metre-convention-international-metrology.events.documented-episode.evidence","decision":"accept","rationale":"Added original treaty citation supports convention institution and mandate; original existing claims not reapproved wholesale.","sources":["bipm-metre-convention-articles Arts. 1, 3 and Annex Art. 7"]},{"path":"metre-convention-international-metrology.events.prototype-sanction-and-allocation-1889","decision":"accept","rationale":"French proceedings pp. 34–40 date sanction and allocation, including US 4,20. Shipment and later operation are correctly separated. Existing event dates treaty signing rather than representing 1889 sanction; this is an extension.","sources":["cgpm-1889-proceedings-prototype-sanction pp. 34–40"]},{"path":"si-kilogram-definition-by-planck-constant.identity,description,kind,domain,grain,research","decision":"accept","rationale":"The institutional definition is a dated decision, not a specific measured instrument; proceedings resolution gives value, units and dependency on metre and second.","sources":["cgpm-2018-proceedings-si-vote pp. 465, 472–474"]},{"path":"si-kilogram-definition-by-planck-constant.events,earliest_record","decision":"accept","rationale":"Vote 16 November 2018 and operative date 20 May 2019 are distinct in proceedings; old IPK definition abrogated when revision took effect.","sources":["cgpm-2018-proceedings-si-vote pp. 465, 472–474"]},{"path":"si-kilogram-definition-by-planck-constant.links.metre-convention-international-metrology","decision":"accept","rationale":"Type builds_on means developed out of other. Existing capability endpoint is the institutional framework; treaty Art. 3 and Annex 7 establish CGPM and mandate, proceedings record its decision. Scoped institutional development is supported, not a claim the 1875 treaty fixed h. Treaty and proceedings are separate official primary documents, with shared institutional lineage.","sources":["bipm-metre-convention-articles Arts. 1,3 and Annex 7","cgpm-2018-proceedings-si-vote pp. 465, 472–474"]},{"path":"nist-4-kibble-balance-kilogram-realization.identity,description,kind,domain,grain,places,research","decision":"accept","rationale":"A specific NIST direct post-revision realization, with Pt-Ir specimens 85 and 104, is separate from the definition and from instrument construction.","sources":["stock-2020-kilogram-realizations-ccm-m-k8-2019 §§2,4.4 Table 2"]},{"path":"nist-4-kibble-balance-kilogram-realization.events,earliest_record","decision":"accept","rationale":"2019 §4.4 identifies NIST operator, vacuum, both series and date; 2024 report §4.6 identifies fresh 2025 runs on same masses. First event means earliest examined post-revision series, not invention.","sources":["stock-2020-kilogram-realizations-ccm-m-k8-2019 §4.4","stock-2026-kilogram-realizations-ccm-m-k8-2024 §4.6"]},{"path":"nist-4-kibble-balance-kilogram-realization.measures","decision":"accept","rationale":"Table 4 NMI realization columns give -0.7679 ±0.027 mg and +0.398 ±0.0273 mg offsets from 1 kg as standard uncertainties under specified conditions; comparator values are distinct.","sources":["stock-2020-kilogram-realizations-ccm-m-k8-2019 Table 4 p. 13"]},{"path":"nist-4-kibble-balance-kilogram-realization.links.si-kilogram-definition-by-planck-constant","decision":"accept","rationale":"Type requires means function without which recipient could not work. For the narrowly scoped post-2019 numerical mass assignment—not construction or operation of the balance—the specified fixed value h is essential under §2. Both endpoints and event direction checked. Normative resolution and multi-lab report independently document rule and actual operation, although NIST authors contribute to the latter; BIPM comparator supplies separate scrutiny, not an independent NIST run.","sources":["cgpm-2018-proceedings-si-vote pp. 472–474","stock-2020-kilogram-realizations-ccm-m-k8-2019 §§2,4.4,5 and Table 4"]}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"independent metrology review","independence":"separate execution from gpt-6.2-sol high researcher"},"overall_decision":"accept","worker_commit":"f1e6c4b9209fd4e27584950a6031fd35ca558409","verified_commit":"f1e6c4b9209fd4e27584950a6031fd35ca558409","files_checked":14}},{"lane":"optics","kind":"workflow","title":"Trace a fiber-optic prototype into live telephone service","question":"Which design tested at Bell’s Atlanta facility went into Illinois Bell’s Chicago Lightwave trial, and when did the installation carry customer traffic?","summary":"Bell Laboratories’ stacked-ribbon cable was ready for its complete Atlanta system test on 13 January 1976. Bell engineering reports describe the Chicago cable as a two-ribbon adaptation of Atlanta’s twelve-ribbon design. Independent confirmation of that design transfer is still open. Chicago’s cables were installed in February 1977. Illinois Bell fully cut over the trial system for customer traffic on 11 May 1977.","inputs":["Prototype name and maker, technology designation and approximate year","Receiving operator, site, route endpoints and suspected operating window","Search variants for cable construction, terminal models and carrier bit rate","Existing discovery, event and source IDs for both endpoints"],"steps":[{"title":"Find the named systems","action":"Search discovery, source and lead files for the technology, prototype, operator and receiving-site aliases. Search original journal indexes and engineering archives for the prototype and operator or receiving city in the same query. Collect report titles from contents pages and follow the prototype and application papers cited by the receiving team.","result":"The dataset has early optical-fiber communication links and a generic research lead on operational low-loss optical fibre telephony. Searches for Atlanta Fiber System, Chicago Lightwave, Illinois Bell, fiber ribbon and adhesive sandwich found no record of this Atlanta cable adaptation. Searching the Bell Labs publications catalogue and Bell System Technical Journal for Atlanta Fiber System Experiment and Chicago Lightwave identified the July–August 1978 series. The Chicago paper’s opening points back to the Atlanta experiment and cable.","sources":[{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=165","locator":"Printed p. 1881 / PDF p. 165, §I"},{"title":"Jacobs, Atlanta experiment overview","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=1","locator":"Printed p. 1717 / PDF p. 1, opening and experiment objectives"},{"title":"Buckler, Santana and Saunders, Atlanta cable manufacture","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=29","locator":"Printed pp. 1745–1747 / PDF pp. 29–31, §§II–III and Figs. 1–2"}]},{"title":"Identify the demonstrated configuration","action":"In the prototype papers search for fabricated, test, demonstration, turn-up, interface and the model names. Read manufacturing and systems papers separately. Record the physical design, material supplier, test date, conditions and carried test signal. Inspect labelled cross sections and dated figures. Check what each date refers to before using it to date manufacture.","result":"Manufacturing drawings show twelve adhesive-sandwich ribbons of twelve Western Electric graded-index glass fibers in the protected core. The linear arrays supported group handling and splicing. Atlanta transmitted 44.7 Mb/s test signals through the complete simulated-plant system on 13 January 1976, bounding the cable’s manufacture. The loss comparison’s Atlanta Experiment – 1975 label does not identify a fabrication date. The M13 multiplex and D3 channel bank appear in the prototype report. The 144 nominal fiber positions exceeded the number of working fibers.","sources":[{"title":"Buckler, Santana and Saunders, Atlanta cable manufacture","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=29","locator":"Printed pp. 1745–1747 / PDF pp. 29–31, §§II–III and Figs. 1–2"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=169","locator":"Printed p. 1885 / PDF p. 169, Fig. 5"},{"title":"Jacobs, Atlanta experiment overview","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=1","locator":"Printed p. 1717 / PDF p. 1, opening and experiment objectives"},{"title":"Jacobs, Atlanta experiment overview","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=4","locator":"Printed pp. 1720–1721 / PDF pp. 4–5, system configuration and Chicago follow-on"}]},{"title":"Match the installed cable and terminals","action":"In the receiving operator’s engineering publication search the destination and prototype names alongside installation, splice, cable and the interface or terminal identifier. Match parts, alterations, date and route to drawings. Look for field measurements at the named route endpoints and note which parts were actually transferred, newly manufactured or never specified.","result":"The receiving paper explicitly traces the Chicago cable design to Atlanta and identifies its two-ribbon core. The new Bell Laboratories cables were installed on the Franklin–Wabash and Franklin–Brunswick legs in February 1977. The route and installed-medium measurements, plus a separate crosstalk study at the distributing frames, confirm actual installation of connectorized cable segments. The Chicago terminal diagram shows M13 multiplexes carrying DS3 at 44.7 Mb/s, with standard T1 input on the interoffice leg, SLC-40 customer terminals on the Brunswick leg, and added video encoding and decoding. The account describes shipment of much Atlanta equipment after modification, replacement or repackaging and supplies no component-by-component transfer list.","sources":[{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=165","locator":"Printed p. 1881 / PDF p. 165, §I"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=167","locator":"Printed pp. 1882–1883 / PDF pp. 166–167, §II and Fig. 1"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=168","locator":"Printed pp. 1882–1885 / PDF pp. 166–169, §III and Figs. 3–5"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=171","locator":"Printed pp. 1887–1888 / PDF pp. 171–172, §§V–VI and Fig. 7"},{"title":"Buckler, Santana and Saunders, Atlanta cable manufacture","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=40","locator":"Printed p. 1756 / PDF p. 40, §VII"},{"title":"Buckler and Miller, optical crosstalk evaluation","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=49","locator":"Printed pp. 1765–1768 / PDF pp. 49–52, §IV"}]},{"title":"Verify the operator’s service milestone","action":"Locate the operator’s annual reports or service bulletins for the trial year. Search inside for the project name, city, commercial service, cutover and traffic. Search digitized trade and local publications for the project or operator and date variants. Compare forecasts, installed status, customer traffic and full cutover by publication date and scope. Check whether a source quotes the developer or has its own reporting.","result":"The 1977 AT&T annual report states that it put the Chicago system in commercial service in May while it continued evaluation. It also prints an Illinois Bell executive’s statement about the 1977 installation. The engineering team dates full cutover to 11 May and names interoffice and customer voice, analog and digital data, and Picturephone Meeting Service. The September 1977 Electronic Design article independently publishes the same date and names the operator and services. Its reporting origins and any access to operator logs are unspecified. The engineering paper’s introductory claim of initial commercial traffic on 1 April differs from Hecht’s description of first test signals that day. The operator’s published month does not resolve the April accounts.","sources":[{"title":"AT&T 1977 Annual Report","url":"https://www.telephonearchive.com/uploads/papers/pdfs/att1977.pdf#page=12","locator":"Printed p. 10 / PDF p. 12, High-capacity transmission systems evaluated"},{"title":"Illinois Bell statement in AT&T 1977 Annual Report","url":"https://www.telephonearchive.com/uploads/papers/pdfs/att1977.pdf#page=17","locator":"Printed p. 15 / PDF p. 17, statement by Charles Marshall, Illinois Bell Telephone Company"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=165","locator":"Printed p. 1881 / PDF p. 165, §I"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=171","locator":"Printed pp. 1887–1888 / PDF pp. 171–172, §§V–VI and Fig. 7"},{"title":"Electronic Design, Modern Media","url":"https://www.worldradiohistory.com/Archive-Electronic-Design/1977/Electronic-Design-V25-N18-1977-0901.pdf#page=121","locator":"Printed p. 107 / PDF p. 121, Optical Communications subsection"},{"title":"Jeff Hecht, City of Light","url":"https://paperzz.com/doc/8592557/city-of-light--the-story-of-fiber-optics","locator":"Printed pp. 181–182, Atlanta and Chicago account"}]},{"title":"Test the relationship against competing explanations","action":"Require explicit recipient attribution or a part-level match between maker and as-built installation, with chronology and distinct observations at both ends. Search contemporary trade archives, technical surveys and museum or company catalogues for both route names and the distinctive construction or part designation. Determine whether they document plans, reproduce the maker’s account or add an independent observation of the design that was installed. Classify the relationship using the dataset link vocabulary.","result":"Bell’s manufacturer and Chicago engineering reports describe the reduction from twelve ribbons to two. The crosstalk measurements record the installed configuration and share an author with the manufacturing report. A Canadian technical survey describes the planned Chicago ribbons as the same form as Atlanta’s. Radio-Electronics likewise describes a planned two-ribbon cable and names the earlier Atlanta test. These outside accounts leave the as-built design transfer unverified. Electronic Design corroborates service timing and the installed 24 fibers, with underlying reporting sources unknown. Similar optical loss, chronological succession and a shared DS3 rate alone would not identify the design origin.","sources":[{"title":"Buckler, Santana and Saunders, Atlanta cable manufacture","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=29","locator":"Printed pp. 1745–1747 / PDF pp. 29–31, §§II–III and Figs. 1–2"},{"title":"Buckler, Santana and Saunders, Atlanta cable manufacture","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=40","locator":"Printed p. 1756 / PDF p. 40, §VII"},{"title":"Buckler and Miller, optical crosstalk evaluation","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=49","locator":"Printed pp. 1765–1768 / PDF pp. 49–52, §IV"},{"title":"Schwartz et al., Chicago Lightwave Communications Project","url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf#page=168","locator":"Printed pp. 1882–1885 / PDF pp. 166–169, §III and Figs. 3–5"},{"title":"AT&T 1977 Annual Report","url":"https://www.telephonearchive.com/uploads/papers/pdfs/att1977.pdf#page=12","locator":"Printed p. 10 / PDF p. 12, High-capacity transmission systems evaluated"},{"title":"Electronic Design, Modern Media","url":"https://www.worldradiohistory.com/Archive-Electronic-Design/1977/Electronic-Design-V25-N18-1977-0901.pdf#page=121","locator":"Printed p. 107 / PDF p. 121, Optical Communications subsection"},{"title":"Bell-Northern Research, A Systems Study of Fiber Optics for Broadband Communications, Activity No. 1","url":"https://publications.gc.ca/collections/collection_2022/isde-ised/co24/Co24-566-1978-1-eng.pdf#page=134","locator":"Revised April 1977, PDF p. 134, item 10, AT&T Chicago plans"},{"title":"Radio-Electronics, Lightguide telephone system evaluated","url":"https://www.worldradiohistory.com/Archive-Radio-Electronics/70s/1977/Radio-Electronics-1977-05.pdf","locator":"May 1977, printed p. 32, opening paragraphs and lightguide photograph caption"}]}],"decision":"Keep a candidate adapts link from the tested Atlanta stacked-ribbon cable (13 January 1976) to the Chicago two-ribbon cable installation (February 1977), pending independent evidence of the as-built design transfer. Record Illinois Bell’s live trial use at full cutover on 11 May 1977. The character of the April traffic remains unresolved.","next":"Look for a contemporary inspection or a catalogued Chicago cable sample with a construction record tied to the installed route. Search Illinois Bell engineering or operations records for April 1977 traffic authorization, a trunk cutover sheet or circuit logs before refining the first-live-traffic date.","reject_if":"Reject a design transfer inferred only from shared materials, line rate, chronological proximity, a photograph or planned deployment. An announced test or installation without dated customer traffic does not establish live service. An annual report and a trade article repeating a project account are not automatically separate observations.","stop_when":"Record an established link only when the maker and installed-system evidence identify the design and change and independent informative evidence corroborates the as-built transfer. If those sources are unavailable, retain a specific candidate and name the missing evidence. Record live use separately when a named operator or reliable contemporary witness identifies the service and its date or bounded window.","next_anchor":"Apply this workflow to General Telephone of California’s Artesia–Long Beach link. Electronic Design, 1 September 1977, p. 107 names the GTE Laboratories developer, a T1 configuration and an April operating claim. Check the GTE engineering report and operating records independently, including whether publicity about another bit rate concerns that route and phase.","researcher":"gpt-6.2-sol","effort":"high","base":"1795a73dff022c15ee6e28d7dd6f5252a070c9a6","review":{"issues":[],"source_checks":[{"url":"https://www.worldradiohistory.com/Archive-Bell-System-Technical-Journal/70s/Bell-System-Technical-Journal-1978-6.pdf","locator":"Jacobs pp. 1717–1721, Buckler pp. 1745–1757, Buckler–Miller pp. 1765–1768, Schwartz pp. 1881–1888","representation":"Original journal PDF and extracted text; local full PDF SHA-256 c1c0105c15c756aa5374b6fc17ab9cb078016d9240215db02770ac8b42fe1108","lineage":"Different participants and measurements within one Bell System project. Buckler coauthored manufacture and crosstalk; the 1975 figure label does not specify manufacture date."},{"url":"https://www.telephonearchive.com/uploads/papers/pdfs/att1977.pdf","locator":"printed pp. 10,15 / PDF pp. 12,17","representation":"Full scanned annual report pages inspected via local OCR and page images; SHA-256 d654d96805ddfde8bb35fb4f9307ddaf262c972f42fc125b799be4eefebb33b7","lineage":"AT&T parent corporate report including Illinois Bell operator statement; same group as Bell research."},{"url":"https://www.worldradiohistory.com/Archive-Electronic-Design/1977/Electronic-Design-V25-N18-1977-0901.pdf","locator":"printed p. 107 / PDF p. 121","representation":"Original issue PDF text locally inspected; SHA-256 49af59423329239f12666f8f1c2cce9171230c089489fbd6a44e0c458b9897e3","lineage":"Independent trade publication; information sources and independent access to logs unknown."},{"url":"https://paperzz.com/doc/8592557/city-of-light--the-story-of-fiber-optics","locator":"pp. 181–182","representation":"Original book text online","lineage":"Later secondary historian; first test signals April 1 versus May regular traffic."},{"url":"https://publications.gc.ca/collections/collection_2022/isde-ised/co24/Co24-566-1978-1-eng.pdf","locator":"section 11.1 and p. 11.10 Chicago plans","representation":"Original Canadian study scanned text online","lineage":"Outside study reports same form for planned Chicago ribbons; not inspection of final installed cable, no direct proof of transmission or subsequent operation."},{"url":"https://www.worldradiohistory.com/Archive-Radio-Electronics/70s/1977/Radio-Electronics-1977-05.pdf","locator":"May 1977 printed p. 32 opening and caption","representation":"Original article web-indexed text inspected","lineage":"Outside contemporaneous trade account; describes cable being installed, planned test and a similar Atlanta system. It does not trace the as-built Chicago design to Atlanta."}],"limitations":["April 1977 traffic character remains unresolved and operator circuit logs were not inspected.","Independent confirmation of the as-built Atlanta-to-Chicago cable design transfer remains open; the relation is candidate only.","Direct Electronic Design access was blocked, but the original scan supplied in the shared cache was inspected."],"claim_reviews":[{"path":"data/discoveries/communication/atlanta-adhesive-ribbon-optical-cable.json#identity,summary,description,kind,grain,domain,fields,advance,setting,places,organizations,societies,known_from","decision":"accept","rationale":"Buckler pp. 1745–1747 describes the 12-by-12 Western Electric fiber ribbons and cable, group splicing and handling; this is a specific tested configuration, not global invention priority.","sources":["Buckler 1978 pp. 1745–1747"]},{"path":"data/discoveries/communication/atlanta-adhesive-ribbon-optical-cable.json#tier,tier_reason","decision":"accept","rationale":"The tier is explicitly editorial and scope-limited rather than an empirical first-priority claim.","sources":["Buckler 1978 pp. 1745–1747"]},{"path":"data/discoveries/communication/atlanta-adhesive-ribbon-optical-cable.json#events/atlanta-cable-built-by-1976-test,earliest_record","decision":"accept","rationale":"Buckler describes manufactured and installed cable; Jacobs dates complete system transmission to 13 January 1976, giving a valid latest bound. Schwartz Fig. 5 labels a series Atlanta Experiment – 1975 without identifying a fabrication date; the record preserves this limitation.","sources":["Schwartz 1978 p. 1885 Fig. 5","Jacobs 1978 pp. 1717–1718","Buckler 1978 pp. 1745–1747"]},{"path":"data/discoveries/communication/atlanta-adhesive-ribbon-optical-cable.json#events/atlanta-1976-wired-test","decision":"accept","rationale":"Jacobs states full-system test signal at 44.7 Mb/s on 13 January 1976 and identifies Bell Labs/Western Electric test facility with typical underground ducts; Buckler documents the 12-ribbon cable and breakage. Not customer operation.","sources":["Jacobs 1978 pp. 1717–1718","Buckler 1978 pp. 1745–1747"]},{"path":"data/discoveries/communication/atlanta-adhesive-ribbon-optical-cable.json#caveats,research","decision":"accept","rationale":"Prior work and limited nominal working fibers are distinguished; status sourced.","sources":["Buckler 1978 pp. 1745–1747"]},{"path":"data/discoveries/communication/optical-fiber-communication-links.json#events/chicago-1977-cable-installation","decision":"accept","rationale":"Schwartz dates February installation, describes new two-ribbon cables and attributes intra-office work to WE and IBT; Buckler and Miller report measurements on named endpoints.","sources":["Schwartz 1978 pp. 1881–1886","Buckler and Miller 1978 pp. 1765–1768"]},{"path":"data/discoveries/communication/optical-fiber-communication-links.json#events/chicago-1977-traffic-cutover","decision":"accept","rationale":"Project engineers report 11 May full cutover and specified services; corporate operator account says May service and independent trade publication gives 11 May. Trade publication’s underlying sources are unspecified; annual report and engineering source are same corporate family.","sources":["Schwartz 1978 pp. 1881–1883, 1887–1888","AT&T 1977 annual report pp. 10,15","Electronic Design 1977 p. 107"]},{"path":"data/discoveries/communication/optical-fiber-communication-links.json#research/status,basis,unresolved/chicago-april-1977-traffic","decision":"accept","rationale":"Hecht calls April 1 test signals while project report calls it first commercial traffic; full cutover distinct. Sourced status does not claim proposal reviewed.","sources":["Hecht 1999 pp. 181–182","Schwartz 1978 p. 1881"]},{"path":"data/discoveries/communication/optical-fiber-communication-links.json#links/0","decision":"accept","rationale":"Candidate status preserves the event-scoped question without establishing an edge. Both endpoints are specifically the Atlanta cable test and the Chicago cable installation event, even though the receiving parent is a broad capability. The type adapts means modifying the other design and fits the hypothesized reduction from twelve ribbons to two. Bell reports trace it but have common project lineage; outside pre-use accounts and separate installed measurements do not independently confirm as-built transfer.","sources":["Buckler 1978 pp. 1745–1747, 1756","Schwartz 1978 pp. 1882–1885","Buckler and Miller 1978 pp. 1765–1768","Canadian systems study 1978 p. 11.10"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/optics.json#inputs,steps/0,steps/2,steps/3,steps/4,reject_if,next,next_anchor","decision":"accept","rationale":"The pilot records named searches, receiving and originating technical descriptions, operator and external trade source roles, competing equivalence/transfer and April test/traffic ambiguity. Actions are generally reusable; external trade report is distinct publication with unknown reporting lineage. The GTE next target is a distinct route, not a transfer conclusion.","sources":["Schwartz 1978 pp. 1881–1888","AT&T 1977 annual report pp. 10,15","Electronic Design 1977 p. 107","Hecht 1999 pp. 181–182"]},{"path":"docs/reviews/2026-11-17-provenance/lanes/optics.json#summary,steps/1,decision,stop_when","decision":"accept","rationale":"The workflow now reports manufacture bounded by the 1976 test, accurately identifies 1975 and 1976 as graph labels, marks the design link candidate and requires independent informative corroboration before establishing a consequential relation. Radio-Electronics describes the planned two-ribbon installation and similar Atlanta system, not independent confirmation of the as-built transfer.","sources":["Schwartz 1978 p. 1885 Fig. 5","Jacobs 1978 pp. 1717–1718","project brief review gate"]},{"path":"data/sources/s/schwartz-1978-chicago-lightwave-project.json and evidence/s/schwartz-1978-chicago-lightwave-project.txt","decision":"accept","rationale":"The revised notes accurately describe figure labels without asserting fabrication dates, and preserve original project attribution.","sources":["Schwartz 1978 p. 1885 Fig. 5"]}],"reviewer":{"model":"gpt-6.1-terra","effort":"high","execution":"independent original-source admission review","independence":"Separate execution from gpt-6.2-sol high researcher; original scans, reports and endpoint records inspected."},"overall_decision":"accept","worker_commit":"253be9731a2c609f260c5215d2869898ccd9d956","verified_commit":"253be9731a2c609f260c5215d2869898ccd9d956","files_checked":15}},{"lane":"printing","kind":"workflow","title":"From printing matrix to edition and workshop exchange","question":"Which sources identify the work, an individual impression, and the roles of its makers, and which evidence supports an exchange of printmaking practice between workshops?","summary":"This pilot traces Kenojuak Ashevak’s 1962 stonecut The Arrival of the Sun through a cooperative catalogue, collection records, a film and the artist’s Inuktitut comments. It also tests one workshop-level claim about Japanese woodblock tools and Kinngait stonecut printing against evidence from before and after the exchange.","inputs":["Work title, translated titles, maker and workshop aliases, and a broad date window","Impression accession, edition or proof notation, or matrix identifier","Contemporary catalogue or colophon and an independent holding institution, maker interview, or archive finding aid","Proposed source and recipient workshops, contact window, and a specific tool, operation, material, or division of work"],"steps":[{"title":"Find the work in the edition record","action":"Search the producer’s catalogue index by workshop and year. Search title variants, maker names, and item numbers in the original scans. If the PDF has no text layer, render or OCR the pages and check the image against any transcription. Record the image, catalogue number, medium, named roles, and separately any issue, exhibition, and production dates. Search the dataset and leads by the same titles and aliases.","result":"Searches for Kinngait and Cape Dorset with Kenojuak and both English and French titles found the cooperative’s scanned catalogue. PDF page 33 shows no. 69-62, The Arrival of the Sun / Retour du soleil, with Kenojuak as the named artist, the stonecut designation, and a ring of birds around the central sun. The distributor indexes the scan as 1962, while its front matter on PDF page 3 refers to graphics approved for 1963. The work date 1962 is independently recorded by the National Gallery of Canada. Treat the annual catalogue label, the work date, and publication or exhibition as separate fields. Dataset searches for Kinngait, Cape Dorset, Japanese printmaking, and the work title located the existing community practice record and its museum source.","sources":[{"title":"Dorset Fine Arts historical print catalogue index","url":"https://www.dorsetfinearts.com/print-catalogues","locator":"1962 annual collection link"},{"title":"Original Cape Dorset and Povungnituk print catalogue","url":"https://static1.squarespace.com/static/5400c027e4b0cb1fd47c5bc9/t/592d99b015d5db9c9215c6c4/1496160739213/1962.pdf","locator":"PDF pp. 3 and 33 (1-based), front matter and no. 69-62"}]},{"title":"Distinguish edition, impression, proof and matrix","action":"Find the object at a holding institution by title, accession number and edition notation. Compare design and technique with the producer’s record, then search the exact title with block, plate, or stoneblock to identify a matrix. For a claim that two records concern the same sheet, require an accession or verifiable custody trail with a unique sheet mark, defect, or other identifying feature. Record measurements with their stated basis and flag unexplained differences.","result":"National Gallery accession 38038 records a black-and-yellow stonecut on japan paper gifted by the cooperative in 1995. The archived University of Lethbridge collection page for 1988.164 identifies a numbered impression 40/50. Matching title, artist, date, medium, and composition identify the catalogued work; neither the catalogue number 69-62 nor the denominator 50 identifies an individual sheet. The National Gallery’s 2000–01 annual report says the collection holds both the print and the stoneblock featured in the film, but gives no block accession there. No block accession or independent sheet-to-block comparison was found in the public title and accession searches. The published dimensions differ between the catalogue and the collection records, which do not consistently specify what was measured. The First Arts lot 20 sheet is an uninscribed, unnumbered proof reported to have belonged to Terry Ryan. The auction description itself calls its proposed identity with the filmed impression speculative. The film and lot 20 show the same work without establishing that the film shows that sheet.","sources":[{"title":"National Gallery of Canada object record, The Arrival of the Sun","url":"https://www.gallery.ca/collection/artwork/the-arrival-of-the-sun","locator":"Accession 38038, Date, Materials, Dimensions, and Credit line fields"},{"title":"University of Lethbridge collection record archived by Library and Archives Canada, Arrival of the Sun","url":"https://epe.lac-bac.gc.ca/100/205/301/ic/cdc/world_around_me/world/vr1/pop-ups/1988164.htm?nodisclaimer=1","locator":"Object 1988.164, stonecut 40/50"},{"title":"National Gallery of Canada Annual Report 2000–2001","url":"https://publications.gc.ca/collections/collection_2012/beaux-arts-gallery/NG1-2001-eng.pdf","locator":"Acquisitions of Note, Kenojuak Ashevak, paragraph beginning with the Gallery’s first purchase in 1961"},{"title":"First Arts, The Arrival of the Sun, unnumbered proof","url":"https://firstarts.ca/content/feature/934/artworks-21148-kenojuak-ashevak-c.c.-r.c.a.-1927-2013-kinngait-cape-dorset-the-arrival-of-the-sun-1962-69/","locator":"Lot 20, object description, final essay paragraph and Provenance"}]},{"title":"Trace what each participant did","action":"Transcribe credited names and roles from the original catalogue or the impression’s margins, retaining name and s
