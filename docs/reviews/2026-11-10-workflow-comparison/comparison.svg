<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Observed arm cost and provisional held-out quality</title>
<desc id="desc">Cost excludes reference, adjudication and proposal overhead. Quality uses model references and cannot establish a confident winner.</desc>
<rect width="960" height="480" fill="#ffffff"/>
<g font-family="Arial,sans-serif" fill="#172033">
<text x="40" y="40" font-size="24">Arm costs and provisional held-out quality</text>
<text x="40" y="68" font-size="14">Standard API-equivalent USD; not observed billing. Reference overhead excluded.</text>
<text x="40" y="115" font-size="20">Arm A</text>
<rect x="145" y="92" width="168.96" height="32" fill="#196c9c"/>
<text x="720" y="115" font-size="18">$0.7966</text>
<text x="145" y="155" font-size="15">Held-out reviewed: 80/80; resolved judgments: 72/80</text>
<text x="145" y="180" font-size="15">False admissions: 7; unsupported facets: 12; links: 0</text>
<text x="40" y="265" font-size="20">Arm B</text>
<rect x="145" y="242" width="550.00" height="32" fill="#a24726"/>
<text x="720" y="265" font-size="18">$2.5930</text>
<text x="145" y="305" font-size="15">Held-out reviewed: 80/80; resolved judgments: 72/80</text>
<text x="145" y="330" font-size="15">False admissions: 2; unsupported facets: 2; links: 0</text>
<line x1="145" x2="695" y1="355" y2="355" stroke="#74808e"/>
<text x="145.0" y="378" text-anchor="middle" font-size="14">$0.00</text>
<text x="328.3" y="378" text-anchor="middle" font-size="14">$0.86</text>
<text x="511.7" y="378" text-anchor="middle" font-size="14">$1.73</text>
<text x="695.0" y="378" text-anchor="middle" font-size="14">$2.59</text>
<text x="145" y="402" font-size="14">Extraction + review standard API equivalent (USD)</text>
<text x="40" y="430" font-size="15">Quality is provisional: same-family model references are not historical truth.</text>
<text x="40" y="455" font-size="15">No confident winner is inferred. Bars start at zero; both use the same scale.</text>
</g></svg>
