name: Check Python and Rust environment

on:
  workflow_dispatch:
  push:
    paths:
      - .codex/**
      - .github/workflows/check-environment.yml
  pull_request:
    paths:
      - .codex/**
      - .github/workflows/check-environment.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and exercise the cloud toolchain
        run: bash .codex/setup.sh
