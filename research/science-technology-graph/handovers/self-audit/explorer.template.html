<div id="graph-self-audit-explorer">
  <style>
    #graph-self-audit-explorer { display: grid; gap: calc(var(--font-size-base) * 1); }
    #graph-self-audit-explorer .audit-detail { display: grid; gap: calc(var(--font-size-base) * .5); overflow-wrap: anywhere; }
  </style>
  <h3>Graph audit · 30df3e79</h3>
  <div class="viz-row"><span>131 connections</span><span>221 entries</span><span>2 connections unverified</span><span>4 identities unverified</span></div>
  <div class="viz-controls">
    <label class="form-label" for="audit-view">View
      <select id="audit-view" class="form-select">
        <option value="connection">Connections</option>
        <option value="entry">Entries</option>
        <option value="label">Labels</option>
      </select>
    </label>
    <label class="form-label" for="audit-record">Record
      <select id="audit-record" class="form-select"></select>
    </label>
  </div>
  <div class="audit-detail" aria-live="polite">
    <h3 id="audit-name"></h3>
    <span id="audit-id" class="text-small text-muted"></span>
    <div id="audit-verdict" class="viz-row"></div>
    <div id="audit-issue"></div>
    <div id="audit-change"></div>
    <div id="audit-method" class="text-small text-muted"></div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('graph-self-audit-explorer');
      const rows = __AUDIT_DATA__;
      const view = root.querySelector('#audit-view');
      const record = root.querySelector('#audit-record');
      const fields = Object.fromEntries(['name', 'id', 'verdict', 'issue', 'change', 'method'].map(k => [k, root.querySelector('#audit-' + k)]));
      function show() {
        const row = rows.find(r => r.type === view.value && r.id === record.value);
        if (!row) return;
        fields.name.textContent = row.title;
        fields.id.textContent = row.id;
        fields.verdict.replaceChildren(...row.verdicts.map(t => {
          const span = document.createElement('span'); span.className = 'viz-badge'; span.textContent = t; return span;
        }));
        fields.issue.textContent = row.issue;
        fields.change.textContent = row.change ? 'Proposal: ' + row.change : '';
        fields.method.textContent = row.method + (row.sources.length ? ' · ' + row.sources.join(', ') : '') + ' · Pinned snapshot; later shared-checkout edits excluded.';
      }
      function populate(selected) {
        record.replaceChildren(...rows.filter(r => r.type === view.value).map(r => {
          const option = document.createElement('option'); option.value = r.id;
          option.textContent = r.title.length > 48 ? r.title.slice(0, 45) + '…' : r.title;
          return option;
        }));
        if (rows.some(r => r.type === view.value && r.id === selected)) record.value = selected;
        show();
      }
      function restore(state) {
        const s = state?.modelContent;
        if (s && ['connection', 'entry', 'label'].includes(s.view)) view.value = s.view;
        populate(s?.selected);
      }
      function save() {
        if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{view:view.value,selected:record.value},privateContent:null}).catch(() => {});
      }
      view.addEventListener('change', () => {populate(); save();});
      record.addEventListener('change', () => {show(); save();});
      window.addEventListener('openai:set_globals', event => {if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);});
      restore(window.openai?.widgetState);
    })();
  </script>
</div>
